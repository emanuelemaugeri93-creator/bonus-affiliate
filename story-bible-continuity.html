
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Season Story Bible Continuity Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c026d3; --accent-d:#86198f; --accentSoft:#f7dcfc;
  --secondary:#6d28d9; --secondarySoft:#e4d8fa;
  --bg:#14091d; --panel:#1e0f2a; --panel2:#281338;
  --ink:#f5eefb; --ink2:#cdb8e6; --muted:#9a83b8; --line:#3a2353;
  --r:12px; --sh:0 8px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 500px at 80% -10%,#33134d 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.6}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif}
.wrap{display:flex;min-height:100vh}
aside{width:360px;flex:0 0 360px;background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{text-align:center;margin-bottom:16px}
.brand .kicker{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:800}
.brand h1{font-size:20px;line-height:1.3;margin:6px 0;color:#fff}
.brand h1 span{color:var(--accent)}
.brand p{font-size:12px;color:var(--muted)}
details.sec{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
details.sec summary{cursor:pointer;padding:12px 14px;font-family:Cinzel,serif;font-size:13px;letter-spacing:1px;color:var(--ink2);list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary:before{content:'▸ ';color:var(--accent)}
details.sec[open] summary:before{content:'▾ ';color:var(--accent)}
details.sec summary b{color:var(--accent)}
.frm{padding:0 14px 14px}
label.f{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin:9px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;background:#170b24;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px}
textarea{resize:vertical;min-height:52px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:#170b24;border:1px solid var(--accent);color:#f0abfc;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:10px}
.btn:hover{background:var(--accent);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--accent);color:#fff;background:#33164a}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:10px}
.remind{background:#170b24;border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink2);margin-top:8px;display:none}
.remind b{color:#f0abfc}
.tag{display:inline-block;background:#170b24;border:1px solid var(--secondary);color:#d9c8f5;border-radius:14px;padding:1px 10px;font-size:12px;margin:2px 3px 2px 0;cursor:pointer}
.tag:hover{border-color:var(--accent);color:#fff}
.tag i{font-style:normal;margin-left:5px;color:var(--muted);cursor:pointer}
main{flex:1;padding:24px 26px;max-width:1020px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 18px;color:var(--ink2);cursor:pointer;font-family:Cinzel,serif;font-size:13px;letter-spacing:1px}
.tabbtn.on{border-color:var(--accent);color:#fff;background:#33164a;box-shadow:0 0 0 1px var(--accent) inset}
.audit{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.audit h3{font-size:13px;letter-spacing:2px;color:var(--ink2);margin-bottom:8px}
.audit .warn{background:#170b24;border-left:3px solid #ff5d5d;border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
.audit .ok{color:#7ee2a8;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card h4{font-size:16px;color:#fff}
.card .role{font-size:12px;color:var(--muted)}
.card .meta{font-size:12px;color:var(--ink2);margin:6px 0}
.card .traits{font-size:13px;color:var(--ink);margin:6px 0}
.badge{display:inline-block;border-radius:12px;padding:1px 10px;font-size:11px;font-weight:800;letter-spacing:.5px}
.st-Active{background:#123f2a;color:#7ee2a8}.st-Recurring{background:#3a2c10;color:#ffd98a}.st-Departed{background:#33334d;color:#bcc8e6}.st-Deceased{background:#3d1414;color:#ff9d9d}
.st-Open{background:#3d1414;color:#ff9d9d}.st-Partially{background:#3a2c10;color:#ffd98a}.st-Resolved{background:#123f2a;color:#7ee2a8}
.pri{font-size:11px;font-weight:800}
.pri-High{color:#ff8d8d}.pri-Medium{color:#ffd98a}.pri-Low{color:#9dc3ff}
.card .ops{display:flex;gap:8px;margin-top:10px}
.mini{background:#170b24;border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.mini:hover{border-color:var(--accent);color:#fff}
.mini.danger:hover{border-color:#ff5d5d;color:#ff8d8d}
.cathead{font-family:Cinzel,serif;font-size:14px;letter-spacing:1.5px;color:#f0abfc;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13.5px}
.rule small{color:var(--muted)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
.kcol h4{font-size:12px;letter-spacing:2px;color:var(--ink2);margin-bottom:10px;text-align:center}
.tl{position:relative;margin-left:10px;padding-left:24px;border-left:2px solid var(--secondary)}
.mile{position:relative;margin-bottom:16px}
.mile:before{content:'';position:absolute;left:-32px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--panel)}
.mile .card{margin:0}
.checks{max-height:130px;overflow-y:auto;background:#170b24;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:4px}
.checks label{display:block;font-size:13px;padding:2px 0;cursor:pointer}
.checks input{margin-right:7px;accent-color:var(--accent)}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.bigbtn{background:linear-gradient(135deg,var(--accent),var(--accent-d));border:none;color:#fff;font-family:inherit;font-weight:800;font-size:14px;border-radius:10px;padding:11px 22px;cursor:pointer}
.bigbtn:hover{filter:brightness(1.12)}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-weight:700;color:var(--ink2);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent-d);color:#fff;font-weight:800;border-radius:10px;padding:11px 24px;display:none;box-shadow:var(--sh);z-index:50}
@media(max-width:900px){.wrap{flex-direction:column}aside{width:100%;position:static;height:auto}.kanban{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<aside>
  <div class="brand">
    <div class="kicker">SERIAL FICTION GOLDMINE COMPANION</div>
    <h1>Story Bible <span>Continuity</span> Tracker</h1>
    <p>One universe. Many seasons. Zero contradictions.</p>
  </div>
  <details class="sec" open>
    <summary><b>01 ·</b> SERIES SETUP</summary>
    <div class="frm">
      <label class="f" for="sTitle">Series / World Title</label>
      <input type="text" id="sTitle" value="">
      <label class="f" for="sLane">Niche / Lane</label>
      <select id="sLane"><option value="spicy">Spicy App Romance</option><option value="sweet">Sweet / Clean Romance</option><option value="cozy">Cozy Mystery &amp; Crossover</option></select>
      <label class="f" for="sSeason">Current Season Number</label>
      <input type="number" id="sSeason" value="1" min="1" max="99">
      <label class="f" for="loadSel">📂 Load Series</label>
      <select id="loadSel"></select>
      <div class="btnrow">
        <button class="btn ghost" id="btnNewSeries">＋ New</button>
        <button class="btn ghost" id="btnDupSeries">💾 Save as New</button>
      </div>
      <button class="btn ghost" id="btnDelSeries" style="border-color:#5c2222">✕ Delete This Series</button>
    </div>
  </details>
  <details class="sec" open>
    <summary><b>02 ·</b> CAST</summary>
    <div class="frm">
      <label class="f" for="cName">Character Name</label>
      <input type="text" id="cName" placeholder="e.g. Kael Thorn">
      <div class="two">
        <div><label class="f" for="cRole">Role</label><select id="cRole"><option>Lead</option><option>Love Interest</option><option>Antagonist</option><option>Supporting</option><option>Minor</option></select></div>
        <div><label class="f" for="cStatus">Status</label><select id="cStatus"><option>Active</option><option>Recurring</option><option>Departed</option><option>Deceased</option></select></div>
      </div>
      <div class="two">
        <div><label class="f" for="cSeas">First Season</label><input type="number" id="cSeas" value="1" min="1" max="99"></div>
        <div><label class="f" for="cEp">First Episode</label><input type="number" id="cEp" value="1" min="1" max="999"></div>
      </div>
      <label class="f" for="cTraits">Key Traits / Voice Notes</label>
      <textarea id="cTraits" placeholder="e.g. Speaks in short sentences. Hides fear with sarcasm."></textarea>
      <label class="f" for="relInput">Relationships (must already exist in Cast)</label>
      <div class="two" style="grid-template-columns:1fr auto">
        <input type="text" id="relInput" list="castList" placeholder="Type a cast name...">
        <button class="mini" id="btnAddRel" style="margin-top:0;padding:8px 12px">＋ Add</button>
      </div>
      <datalist id="castList"></datalist>
      <div id="relTags" style="margin-top:6px"></div>
      <button class="btn" id="btnSaveCast">＋ Add Character</button>
      <button class="btn ghost" id="btnCancelCast" style="display:none">Cancel Edit</button>
    </div>
  </details>
  <details class="sec">
    <summary><b>03 ·</b> WORLD RULES</summary>
    <div class="frm">
      <label class="f" for="rCat">Rule Category</label>
      <select id="rCat"></select>
      <div class="remind" id="ruleRemind"></div>
      <label class="f" for="rText">Rule Statement</label>
      <textarea id="rText" placeholder="e.g. A claimed mate cannot cross running water during the full moon."></textarea>
      <div class="two">
        <div><label class="f" for="rSeas">Est. Season</label><input type="number" id="rSeas" value="1" min="1" max="99"></div>
        <div><label class="f" for="rEp">Est. Episode</label><input type="number" id="rEp" value="1" min="1" max="999"></div>
      </div>
      <label class="f" for="rExc">Exception Notes</label>
      <input type="text" id="rExc" placeholder="e.g. Except for the northern pack.">
      <button class="btn" id="btnSaveRule">＋ Add Rule</button>
      <button class="btn ghost" id="btnCancelRule" style="display:none">Cancel Edit</button>
    </div>
  </details>
  <details class="sec">
    <summary><b>04 ·</b> OPEN THREADS</summary>
    <div class="frm">
      <label class="f" for="tName">Thread Name</label>
      <input type="text" id="tName" placeholder="e.g. Who paid for the merger clause?">
      <div class="two">
        <div><label class="f" for="tStatus">Status</label><select id="tStatus"><option>Open</option><option>Partially Resolved</option><option>Resolved</option></select></div>
        <div><label class="f" for="tPri">Priority</label><select id="tPri"><option>High</option><option>Medium</option><option>Low</option></select></div>
      </div>
      <div class="two">
        <div><label class="f" for="tSeas">Introduced Season</label><input type="number" id="tSeas" value="1" min="1" max="99"></div>
        <div><label class="f" for="tEp">Introduced Episode</label><input type="number" id="tEp" value="1" min="1" max="999"></div>
      </div>
      <label class="f" for="tNotes">Notes / Next Steps</label>
      <textarea id="tNotes" placeholder="e.g. Pay off in S2 finale at the latest."></textarea>
      <button class="btn" id="btnSaveThread">＋ Add Thread</button>
      <button class="btn ghost" id="btnCancelThread" style="display:none">Cancel Edit</button>
    </div>
  </details>
  <details class="sec">
    <summary><b>05 ·</b> SEASON TIMELINE</summary>
    <div class="frm">
      <div class="two">
        <div><label class="f" for="tlSeas">Season #</label><input type="number" id="tlSeas" value="1" min="1" max="99"></div>
        <div><label class="f" for="tlTitle">Season Title</label><input type="text" id="tlTitle" placeholder="e.g. The Claiming"></div>
      </div>
      <label class="f" for="tlSum">One-Line Summary</label>
      <input type="text" id="tlSum" placeholder="e.g. The bond ignites; the merger collapses.">
      <label class="f" for="tlEvents">Key Events</label>
      <textarea id="tlEvents" placeholder="One per line or separated by commas."></textarea>
      <label class="f">Characters Introduced (from Cast list)</label>
      <div class="checks" id="tlCast"></div>
      <label class="f">Threads Opened (from Open Threads list)</label>
      <div class="checks" id="tlOpen"></div>
      <label class="f">Threads Closed (from Open Threads list)</label>
      <div class="checks" id="tlClose"></div>
      <button class="btn" id="btnSaveTl">＋ Add Season Entry</button>
      <button class="btn ghost" id="btnCancelTl" style="display:none">Cancel Edit</button>
    </div>
  </details>
</aside>
<main>
  <div class="audit" id="auditBox"></div>
  <div class="toolbar">
    <div class="tabs" style="margin-bottom:0">
      <button class="tabbtn on" data-tab="cast">👥 Cast</button>
      <button class="tabbtn" data-tab="rules">📜 World Rules</button>
      <button class="tabbtn" data-tab="threads">🧵 Open Threads</button>
      <button class="tabbtn" data-tab="timeline">🗓 Season Timeline</button>
    </div>
    <span class="pill" id="countPill"></span>
    <button class="bigbtn" id="btnExport">📋 Copy Full Story Bible</button>
  </div>
  <div id="canvas"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
var RULECATS={spicy:['Pack Structure','Supernatural Ability','Territory / Politics','Mating / Bond Law','Wealth / Power'],sweet:['Town Geography','Recurring Institution','Local Custom','Family History','Seasonal Event'],cozy:['Town Geography','Recurring Institution','Local Custom','Sleuth Method','Running Gag']};
var DBKEY='sbb_db_v1';
var DB={series:{},active:null};
var ui={tab:'cast',editCast:null,editRule:null,editThread:null,editTl:null,relTags:[]};
function $(id){return document.getElementById(id);}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2400);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function uid(){return 'id'+Date.now().toString(36)+Math.floor(Math.random()*9999);}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){}}
function load(){var raw=null;try{raw=localStorage.getItem(DBKEY);}catch(e){raw=null;}if(raw){try{var d=JSON.parse(raw);if(d&&d.series){DB=d;return;}}catch(e){}}var id=uid();DB={series:{},active:id};DB.series[id]={title:'Untitled Series',lane:'spicy',season:1,cast:[],rules:[],threads:[],timeline:[]};}
function S(){return DB.series[DB.active];}
function findById(arr,id){var i;for(i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function castName(id){var c=findById(S().cast,id);return c?c.name:'(removed)';}
function threadName(id){var t=findById(S().threads,id);return t?t.name:'(removed)';}
function num(v,def){v=parseInt(v,10);return (isNaN(v)||v<1)?def:v;}
function refreshLoadSel(){var sel=$('loadSel');sel.innerHTML='';var ks=Object.keys(DB.series);var i;for(i=0;i<ks.length;i++){var o=document.createElement('option');o.value=ks[i];o.textContent=DB.series[ks[i]].title||'(untitled)';if(ks[i]===DB.active)o.selected=true;sel.appendChild(o);}}
function syncSeriesForm(){var s=S();$('sTitle').value=s.title;$('sLane').value=s.lane;$('sSeason').value=s.season;refreshLoadSel();buildRuleCats();buildDatalist();buildTlChecks();updateRuleRemind();}
function buildRuleCats(){var sel=$('rCat');var cur=sel.value;sel.innerHTML='';var cats=RULECATS[S().lane]||RULECATS.spicy;var i;for(i=0;i<cats.length;i++){var o=document.createElement('option');o.value=cats[i];o.textContent=cats[i];sel.appendChild(o);}if(cats.indexOf(cur)>=0)sel.value=cur;}
function buildDatalist(){var dl=$('castList');dl.innerHTML='';var i;for(i=0;i<S().cast.length;i++){var o=document.createElement('option');o.value=S().cast[i].name;dl.appendChild(o);}}
function checkedIds(zone){var boxes=zone.querySelectorAll('input[type=checkbox]');var out=[];var i;for(i=0;i<boxes.length;i++){if(boxes[i].checked)out.push(boxes[i].value);}return out;}
function buildTlChecks(selCast,selOpen,selClose){selCast=selCast||[];selOpen=selOpen||[];selClose=selClose||[];var s=S();var zc=$('tlCast');zc.innerHTML='';var i;for(i=0;i<s.cast.length;i++){zc.appendChild(checkRow(s.cast[i].id,s.cast[i].name,selCast.indexOf(s.cast[i].id)>=0));}var zo=$('tlOpen');zo.innerHTML='';var zt=$('tlClose');zt.innerHTML='';for(i=0;i<s.threads.length;i++){zo.appendChild(checkRow(s.threads[i].id,s.threads[i].name+' ['+s.threads[i].status+']',selOpen.indexOf(s.threads[i].id)>=0));zt.appendChild(checkRow(s.threads[i].id,s.threads[i].name+' ['+s.threads[i].status+']',selClose.indexOf(s.threads[i].id)>=0));}if(!s.cast.length)zc.innerHTML='<span style="color:var(--muted);font-size:12px">Add cast first.</span>';if(!s.threads.length){zo.innerHTML='<span style="color:var(--muted);font-size:12px">Add threads first.</span>';zt.innerHTML='<span style="color:var(--muted);font-size:12px">Add threads first.</span>';}}
function checkRow(val,label,on){var lab=document.createElement('label');var cb=document.createElement('input');cb.type='checkbox';cb.value=val;cb.checked=!!on;lab.appendChild(cb);lab.appendChild(document.createTextNode(label));return lab;}
function updateRuleRemind(){var box=$('ruleRemind');var cat=$('rCat').value;var ex=[];var i;for(i=0;i<S().rules.length;i++){if(S().rules[i].cat===cat&&S().rules[i].id!==ui.editRule)ex.push(S().rules[i]);}if(!ex.length){box.style.display='none';return;}box.style.display='block';var h='<b>⚠ '+ex.length+' existing rule(s) in '+esc(cat)+':</b><br>';for(i=0;i<ex.length;i++){h+='• '+esc(ex[i].text)+'<br>';}box.innerHTML=h;}
function audit(){var s=S();var out=[];var i,j;for(i=0;i<s.threads.length;i++){var t=s.threads[i];if(t.status==='Open'&&t.season<=s.season-2){out.push({warn:true,html:'⚠️ <b>'+esc(t.name)+'</b> has been open since Season '+t.season+' with no update — resolve it, or confirm it is an intentional long-arc thread.'});}}for(i=0;i<s.cast.length;i++){var c=s.cast[i];if(c.status==='Recurring'){var seen=false;for(j=0;j<s.timeline.length;j++){var e=s.timeline[j];if((e.season===s.season||e.season===s.season-1)&&e.chars.indexOf(c.id)>=0){seen=true;break;}}if(!seen)out.push({warn:true,html:'📭 <b>'+esc(c.name)+'</b> is marked Recurring but has no Timeline entry in the current or previous season — confirm they are still active in the story.'});}}return out;}
function renderAudit(){var box=$('auditBox');var a=audit();var h='<h3>🔍 CONTINUITY AUDIT · SEASON '+S().season+'</h3>';if(!a.length)h+='<div class="ok">✓ Continuity clean — no stale threads, no missing recurring cast.</div>';else{for(var i=0;i<a.length;i++)h+='<div class="warn">'+a[i].html+'</div>';}box.innerHTML=h;}
function relTagHtml(ids){if(!ids||!ids.length)return '<span style="color:var(--muted);font-size:12px">—</span>';var h='';var i;for(i=0;i<ids.length;i++){h+='<span class="tag" data-jump="cast" data-id="'+ids[i]+'">'+esc(castName(ids[i]))+'</span>';}return h;}
function threadTagHtml(ids){if(!ids||!ids.length)return '<span style="color:var(--muted);font-size:12px">—</span>';var h='';var i;for(i=0;i<ids.length;i++){h+='<span class="tag" data-jump="threads" data-id="'+ids[i]+'">'+esc(threadName(ids[i]))+'</span>';}return h;}
function renderCanvas(){var c=$('canvas');var s=S();var tabs=document.querySelectorAll('.tabbtn');var i;for(i=0;i<tabs.length;i++){tabs[i].className='tabbtn'+(tabs[i].getAttribute('data-tab')===ui.tab?' on':'');}if(ui.tab==='cast'){var n=s.cast.length;$('countPill').textContent=n+' character(s)';if(!n){c.innerHTML='<div class="empty">No cast yet — add your first character in section 02.</div>';return;}var h='<div class="grid">';for(i=0;i<s.cast.length;i++){var ch=s.cast[i];h+='<div class="card" id="card-'+ch.id+'"><h4>'+esc(ch.name)+'</h4><div class="role">'+esc(ch.role)+'</div><div class="meta"><span class="badge st-'+esc(ch.status)+'">'+esc(ch.status)+'</span> · First: S'+ch.season+'/Ep'+ch.ep+'</div><div class="traits">'+esc(ch.traits||'—')+'</div><div>'+relTagHtml(ch.rels)+'</div><div class="ops"><button class="mini" data-edit="cast" data-id="'+ch.id+'">✎ Edit</button><button class="mini danger" data-del="cast" data-id="'+ch.id+'">✕</button></div></div>';}c.innerHTML=h+'</div>';}else if(ui.tab==='rules'){var cats=RULECATS[s.lane]||RULECATS.spicy;$('countPill').textContent=s.rules.length+' rule(s)';if(!s.rules.length){c.innerHTML='<div class="empty">No rules yet — add your first world rule in section 03.</div>';return;}var h2='';for(i=0;i<cats.length;i++){var inCat=[];var j;for(j=0;j<s.rules.length;j++){if(s.rules[j].cat===cats[i])inCat.push(s.rules[j]);}if(!inCat.length)continue;h2+='<div class="cathead">'+esc(cats[i])+' ('+inCat.length+')</div>';for(j=0;j<inCat.length;j++){var r=inCat[j];h2+='<div class="rule" id="card-'+r.id+'"><b>•</b> '+esc(r.text)+'<br><small>Est. S'+r.season+'/Ep'+r.ep+(r.exc?' · Exception: '+esc(r.exc):'')+'</small> <button class="mini" data-edit="rules" data-id="'+r.id+'">✎</button> <button class="mini danger" data-del="rules" data-id="'+r.id+'">✕</button></div>';}}c.innerHTML=h2||'<div class="empty">No rules yet.</div>';}else if(ui.tab==='threads'){var cols=['Open','Partially Resolved','Resolved'];$('countPill').textContent=s.threads.length+' thread(s)';var h3='<div class="kanban">';for(i=0;i<cols.length;i++){h3+='<div class="kcol"><h4>'+cols[i].toUpperCase()+'</h4>';var j;for(j=0;j<s.threads.length;j++){var t=s.threads[j];if(t.status!==cols[i])continue;h3+='<div class="card" id="card-'+t.id+'" style="margin-bottom:8px"><h4 style="font-size:14px">'+esc(t.name)+'</h4><div class="meta"><span class="pri pri-'+esc(t.pri)+'">● '+esc(t.pri)+'</span> · Since S'+t.season+'/Ep'+t.ep+'</div><div class="traits">'+esc(t.notes||'—')+'</div><div class="ops"><button class="mini" data-edit="threads" data-id="'+t.id+'">✎</button><button class="mini danger" data-del="threads" data-id="'+t.id+'">✕</button></div></div>';}h3+='</div>';}c.innerHTML=h3+'</div>';}else{var sorted=s.timeline.slice().sort(function(a,b){return a.season-b.season;});$('countPill').textContent=sorted.length+' season(s)';if(!sorted.length){c.innerHTML='<div class="empty">No timeline entries yet — add Season 1 in section 05.</div>';return;}var h4='<div class="tl">';for(i=0;i<sorted.length;i++){var e=sorted[i];h4+='<div class="mile"><div class="card" id="card-'+e.id+'"><h4>Season '+e.season+(e.title?': '+esc(e.title):'')+'</h4><div class="traits"><i>'+esc(e.summary||'—')+'</i></div>'+(e.events?'<div class="meta">Key events: '+esc(e.events)+'</div>':'')+'<div class="meta">Introduced: '+relTagHtml(e.chars)+'</div><div class="meta">Opened: '+threadTagHtml(e.opened)+'</div><div class="meta">Closed: '+threadTagHtml(e.closed)+'</div><div class="ops"><button class="mini" data-edit="timeline" data-id="'+e.id+'">✎ Edit</button><button class="mini danger" data-del="timeline" data-id="'+e.id+'">✕</button></div></div></div>';}c.innerHTML=h4+'</div>';}wireCards();}
function wireCards(){var c=$('canvas');var btns=c.querySelectorAll('button');var i;for(i=0;i<btns.length;i++){(function(b){if(b.getAttribute('data-edit'))b.addEventListener('click',function(){startEdit(b.getAttribute('data-edit'),b.getAttribute('data-id'));});else if(b.getAttribute('data-del'))b.addEventListener('click',function(){delEntry(b.getAttribute('data-del'),b.getAttribute('data-id'));});})(btns[i]);}var tags=c.querySelectorAll('.tag[data-jump]');for(i=0;i<tags.length;i++){(function(t){if(t.querySelector('i'))return;t.addEventListener('click',function(){jumpTo(t.getAttribute('data-jump'),t.getAttribute('data-id'));});})(tags[i]);}}
function jumpTo(tab,id){ui.tab=tab;renderAll();setTimeout(function(){var el=document.getElementById('card-'+id);if(el){el.scrollIntoView({block:'center'});el.className+=' flash';setTimeout(function(){el.className=el.className.replace(' flash','');},1600);}},60);}
function renderAll(){renderAudit();renderCanvas();}
function usedInTimeline(kind,id){var out=[];var tl=S().timeline;for(var i=0;i<tl.length;i++){if(kind==='cast'&&tl[i].chars.indexOf(id)>=0)out.push('Season '+tl[i].season);if(kind==='thread'&&(tl[i].opened.indexOf(id)>=0||tl[i].closed.indexOf(id)>=0))out.push('Season '+tl[i].season);}return out;}
function delEntry(kind,id){var s=S();if(kind==='cast'){var u1=usedInTimeline('cast',id);if(u1.length){toast('Blocked: referenced in Timeline ('+u1.join(', ')+'). Remove there first.');return;}s.cast=s.cast.filter(function(c){return c.id!==id;});var i;for(i=0;i<s.cast.length;i++){s.cast[i].rels=s.cast[i].rels.filter(function(r){return r!==id;});}ui.relTags=ui.relTags.filter(function(r){return r!==id;});renderRelTags();buildDatalist();buildTlChecks();}else if(kind==='threads'){var u2=usedInTimeline('thread',id);if(u2.length){toast('Blocked: referenced in Timeline ('+u2.join(', ')+'). Remove there first.');return;}s.threads=s.threads.filter(function(t){return t.id!==id;});buildTlChecks();}else if(kind==='rules'){s.rules=s.rules.filter(function(r){return r.id!==id;});}else{s.timeline=s.timeline.filter(function(e){return e.id!==id;});}save();renderAll();}
function startEdit(kind,id){var s=S();if(kind==='cast'){var c=findById(s.cast,id);if(!c)return;ui.editCast=id;$('cName').value=c.name;$('cRole').value=c.role;$('cStatus').value=c.status;$('cSeas').value=c.season;$('cEp').value=c.ep;$('cTraits').value=c.traits;ui.relTags=c.rels.slice();renderRelTags();$('btnSaveCast').textContent='✔ Save Changes';$('btnCancelCast').style.display='block';}else if(kind==='rules'){var r=findById(s.rules,id);if(!r)return;ui.editRule=id;buildRuleCats();var rsel=$('rCat');var has=false;var oi;for(oi=0;oi<rsel.options.length;oi++){if(rsel.options[oi].value===r.cat)has=true;}if(!has){var no=document.createElement('option');no.value=r.cat;no.textContent=r.cat+' (other lane)';rsel.appendChild(no);}$('rCat').value=r.cat;$('rText').value=r.text;$('rSeas').value=r.season;$('rEp').value=r.ep;$('rExc').value=r.exc;$('btnSaveRule').textContent='✔ Save Changes';$('btnCancelRule').style.display='block';updateRuleRemind();}else if(kind==='threads'){var t=findById(s.threads,id);if(!t)return;ui.editThread=id;$('tName').value=t.name;$('tStatus').value=t.status;$('tPri').value=t.pri;$('tSeas').value=t.season;$('tEp').value=t.ep;$('tNotes').value=t.notes;$('btnSaveThread').textContent='✔ Save Changes';$('btnCancelThread').style.display='block';}else{var e=findById(s.timeline,id);if(!e)return;ui.editTl=id;$('tlSeas').value=e.season;$('tlTitle').value=e.title;$('tlSum').value=e.summary;$('tlEvents').value=e.events;buildTlChecks(e.chars,e.opened,e.closed);$('btnSaveTl').textContent='✔ Save Changes';$('btnCancelTl').style.display='block';}window.scrollTo(0,0);}
function cancelEdits(){ui.editCast=ui.editRule=ui.editThread=ui.editTl=null;ui.relTags=[];renderRelTags();$('cName').value='';$('cTraits').value='';$('rText').value='';$('rExc').value='';$('tName').value='';$('tNotes').value='';$('tlTitle').value='';$('tlSum').value='';$('tlEvents').value='';buildTlChecks();$('btnSaveCast').textContent='＋ Add Character';$('btnSaveRule').textContent='＋ Add Rule';$('btnSaveThread').textContent='＋ Add Thread';$('btnSaveTl').textContent='＋ Add Season Entry';$('btnCancelCast').style.display='none';$('btnCancelRule').style.display='none';$('btnCancelThread').style.display='none';$('btnCancelTl').style.display='none';updateRuleRemind();}
function renderRelTags(){var z=$('relTags');z.innerHTML='';var i;for(i=0;i<ui.relTags.length;i++){(function(id){var sp=document.createElement('span');sp.className='tag';sp.textContent=castName(id);var x=document.createElement('i');x.textContent='✕';x.addEventListener('click',function(){ui.relTags=ui.relTags.filter(function(r){return r!==id;});renderRelTags();});sp.appendChild(x);z.appendChild(sp);})(ui.relTags[i]);}}
function plainExport(){var s=S();var out='STORY BIBLE: '+(s.title||'Untitled')+' ('+s.lane+', current season '+s.season+')\nUse as continuity context for new-season episodes.\n\n=== CAST ===\n';var i;for(i=0;i<s.cast.length;i++){var c=s.cast[i];var rels=c.rels.map(castName).join(', ');out+='- '+c.name+' ['+c.role+' | '+c.status+' | first S'+c.season+'/Ep'+c.ep+'] '+(c.traits||'')+(rels?' | Linked: '+rels:'')+'\n';}out+='\n=== WORLD RULES ===\n';for(i=0;i<s.rules.length;i++){var r=s.rules[i];out+='- ['+r.cat+'] '+r.text+' (est. S'+r.season+'/Ep'+r.ep+')'+(r.exc?' EXCEPTION: '+r.exc:'')+'\n';}out+='\n=== OPEN THREADS ===\n';for(i=0;i<s.threads.length;i++){var t=s.threads[i];out+='- ['+t.status+' | '+t.pri+'] '+t.name+' (since S'+t.season+'/Ep'+t.ep+') '+(t.notes||'')+'\n';}out+='\n=== SEASON TIMELINE ===\n';var sorted=s.timeline.slice().sort(function(a,b){return a.season-b.season;});for(i=0;i<sorted.length;i++){var e=sorted[i];out+='Season '+e.season+(e.title?': '+e.title:'')+' — '+(e.summary||'')+'\n  Events: '+(e.events||'—')+'\n  Introduced: '+(e.chars.map(castName).join(', ')||'—')+'\n  Opened: '+(e.opened.map(threadName).join(', ')||'—')+'\n  Closed: '+(e.closed.map(threadName).join(', ')||'—')+'\n';}return out;}
function copyText(t,msg){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}document.body.removeChild(ta);toast(ok?(msg||'Copied!'):'Copy failed — select and copy manually.');}
function init(){load();syncSeriesForm();renderAll();var tabs=document.querySelectorAll('.tabbtn');var i;for(i=0;i<tabs.length;i++){(function(b){b.addEventListener('click',function(){ui.tab=b.getAttribute('data-tab');renderAll();});})(tabs[i]);}
$('sTitle').addEventListener('change',function(){S().title=$('sTitle').value;save();refreshLoadSel();});
$('sLane').addEventListener('change',function(){S().lane=$('sLane').value;save();buildRuleCats();updateRuleRemind();renderAll();});
$('sSeason').addEventListener('change',function(){S().season=num($('sSeason').value,1);save();renderAll();});
$('loadSel').addEventListener('change',function(){if(DB.series[$('loadSel').value]){DB.active=$('loadSel').value;cancelEdits();syncSeriesForm();renderAll();}});
$('btnNewSeries').addEventListener('click',function(){var id=uid();DB.series[id]={title:'Untitled Series',lane:'spicy',season:1,cast:[],rules:[],threads:[],timeline:[]};DB.active=id;cancelEdits();save();syncSeriesForm();renderAll();});
$('btnDupSeries').addEventListener('click',function(){var src=S();var id=uid();var cp=JSON.parse(JSON.stringify(src));if(!cp.title)cp.title='Untitled Series';cp.title+=' (Copy)';DB.series[id]=cp;DB.active=id;cancelEdits();save();syncSeriesForm();renderAll();toast('💾 Saved as new series!');});
$('btnDelSeries').addEventListener('click',function(){var ks=Object.keys(DB.series);if(ks.length<=1){toast('Cannot delete the only series.');return;}if(!confirm('Delete "'+(S().title||'this series')+'" permanently?'))return;delete DB.series[DB.active];DB.active=Object.keys(DB.series)[0];cancelEdits();save();syncSeriesForm();renderAll();});
$('btnAddRel').addEventListener('click',function(){var v=$('relInput').value.trim();if(!v)return;var hit=null;var i;for(i=0;i<S().cast.length;i++){if(S().cast[i].name.toLowerCase()===v.toLowerCase()){hit=S().cast[i];break;}}if(!hit){toast('No cast member named "'+v+'" — add them first.');return;}if(ui.editCast&&hit.id===ui.editCast){toast('A character cannot link to themselves.');return;}if(ui.relTags.indexOf(hit.id)<0)ui.relTags.push(hit.id);$('relInput').value='';renderRelTags();});
$('btnSaveCast').addEventListener('click',function(){var nm=$('cName').value.trim();if(!nm){toast('Character needs a name.');return;}var s=S();if(ui.editCast){var c=findById(s.cast,ui.editCast);c.name=nm;c.role=$('cRole').value;c.status=$('cStatus').value;c.season=num($('cSeas').value,1);c.ep=num($('cEp').value,1);c.traits=$('cTraits').value.trim();c.rels=ui.relTags.slice();}else{s.cast.push({id:uid(),name:nm,role:$('cRole').value,status:$('cStatus').value,season:num($('cSeas').value,1),ep:num($('cEp').value,1),traits:$('cTraits').value.trim(),rels:ui.relTags.slice()});}save();cancelEdits();buildDatalist();buildTlChecks();renderAll();toast('Character saved!');});
$('btnCancelCast').addEventListener('click',cancelEdits);
$('rCat').addEventListener('change',updateRuleRemind);
$('btnSaveRule').addEventListener('click',function(){var tx=$('rText').value.trim();if(!tx){toast('Rule needs a statement.');return;}var s=S();if(ui.editRule){var r=findById(s.rules,ui.editRule);r.cat=$('rCat').value;r.text=tx;r.season=num($('rSeas').value,1);r.ep=num($('rEp').value,1);r.exc=$('rExc').value.trim();}else{s.rules.push({id:uid(),cat:$('rCat').value,text:tx,season:num($('rSeas').value,1),ep:num($('rEp').value,1),exc:$('rExc').value.trim()});}save();cancelEdits();renderAll();toast('Rule saved!');});
$('btnCancelRule').addEventListener('click',cancelEdits);
$('btnSaveThread').addEventListener('click',function(){var nm=$('tName').value.trim();if(!nm){toast('Thread needs a name.');return;}var s=S();if(ui.editThread){var t=findById(s.threads,ui.editThread);t.name=nm;t.status=$('tStatus').value;t.pri=$('tPri').value;t.season=num($('tSeas').value,1);t.ep=num($('tEp').value,1);t.notes=$('tNotes').value.trim();}else{s.threads.push({id:uid(),name:nm,status:$('tStatus').value,pri:$('tPri').value,season:num($('tSeas').value,1),ep:num($('tEp').value,1),notes:$('tNotes').value.trim()});}save();cancelEdits();buildTlChecks();renderAll();toast('Thread saved!');});
$('btnCancelThread').addEventListener('click',cancelEdits);
$('btnSaveTl').addEventListener('click',function(){var s=S();var data={season:num($('tlSeas').value,1),title:$('tlTitle').value.trim(),summary:$('tlSum').value.trim(),events:$('tlEvents').value.trim(),chars:checkedIds($('tlCast')),opened:checkedIds($('tlOpen')),closed:checkedIds($('tlClose'))};if(ui.editTl){var e=findById(s.timeline,ui.editTl);e.season=data.season;e.title=data.title;e.summary=data.summary;e.events=data.events;e.chars=data.chars;e.opened=data.opened;e.closed=data.closed;}else{data.id=uid();s.timeline.push(data);}save();cancelEdits();renderAll();toast('Timeline entry saved!');});
$('btnCancelTl').addEventListener('click',cancelEdits);
$('btnExport').addEventListener('click',function(){copyText(plainExport(),'📋 Story bible copied!');});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
