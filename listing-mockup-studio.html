<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }

.k-label small { font-weight: 600; color: var(--k-muted); }

.k-input, .k-select, .k-textarea {

.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);

}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;

.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {

  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;

.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }

  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }

.k-kbd {

  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {

.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }

<style>
/* Direction: Sidebar + Canvas, Minimal / Swiss photo-studio look (cool white, graphite, electric blue),
   because sellers judge listing images against a neutral backdrop, like in a product photo studio. */
:root {
  --k-bg: #f3f5f8;
  --k-panel: #ffffff;
  --k-panel-2: #f1f3f7;
  --k-ink: #14161a;
  --k-muted: #667085;
  --k-line: #e2e6ec;
  --k-accent: #2f5bff;
  --k-accent-ink: #ffffff;
  --k-accent-soft: #e8edff;
  --k-stage: #e6e9ef;
  --k-radius: 10px;
  --k-font: "DM Sans", system-ui, sans-serif;
  --k-display: "Outfit", "DM Sans", sans-serif;
}
.k-title { letter-spacing: -.01em; }
.k-group-title { letter-spacing: .12em; }

/* ---------- Side panel: page list, drop zone, sample sets, pickers ---------- */
.lm-list { display: grid; gap: 6px; margin-bottom: 12px; }
.lm-item {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 9px; align-items: center;
  padding: 6px; border: 1px solid var(--k-line); border-radius: 10px; background: var(--k-panel);
}
.lm-item img { width: 40px; height: 50px; object-fit: cover; object-position: top; border-radius: 4px; display: block; border: 1px solid var(--k-line); background: #fff; }
.lm-item b { font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-item small { color: var(--k-muted); font-size: 11px; }
.lm-item > div { min-width: 0; }
.lm-item-btns { display: flex; gap: 2px; }
.lm-item-btns .k-btn { padding: 5px; min-height: 0; }
.lm-drop {
  border: 2px dashed #c5ccd8; border-radius: 12px; padding: 16px 10px; text-align: center;
  font-size: 12.5px; color: var(--k-muted); cursor: pointer; background: var(--k-panel-2); margin-bottom: 14px;
}
.lm-drop b { display: block; color: var(--k-ink); font-size: 13.5px; margin-bottom: 2px; }
.lm-drop.is-over, .lm-drop:hover { border-color: var(--k-accent); background: var(--k-accent-soft); }
.lm-sets { display: grid; gap: 7px; }

  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; text-align: left;
  border: 1.5px solid var(--k-line); border-radius: 10px; padding: 7px 9px; background: var(--k-panel); cursor: pointer;
}

.lm-set span { display: flex; gap: 3px; }
.lm-set img { width: 26px; height: 34px; object-fit: cover; border-radius: 3px; border: 1px solid var(--k-line); display: block; }
.lm-set b { font-size: 12.5px; display: block; }
.lm-set small { font-size: 11px; color: var(--k-muted); }
.lm-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.lm-bg {
  border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 3px; justify-items: center;
  font-size: 10px; font-weight: 700; color: var(--k-muted); line-height: 1.15; text-align: center;
}
.lm-bg img { width: 100%; height: 40px; border-radius: 8px; display: block; border: 1px solid rgba(0, 0, 0, .14); }
.lm-bg.is-on img { outline: 2.5px solid var(--k-accent); outline-offset: 2px; }
.lm-bg.is-on { color: var(--k-ink); }
.lm-copy { display: grid; gap: 10px; }
.lm-copy textarea { min-height: 84px; font-size: 12.5px; }
.lm-plan { margin: 0; padding: 0; list-style: none; counter-reset: pl; display: grid; gap: 5px; }
.lm-plan li {
  counter-increment: pl; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.35;
  padding: 7px 9px; border: 1px solid var(--k-line); border-radius: 9px;
}
.lm-plan li::before { content: counter(pl); font-weight: 800; color: var(--k-accent); }
.lm-plan small { display: block; color: var(--k-muted); font-size: 11.5px; }

/* ---------- Sheets. 1em = 1% of the image width. The scene is a canvas picture, the words are live text. ---------- */
.lm { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: #e9ebef; color: #17181c; }
.lm-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.lm-wait { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 2.4em; color: #7b8494; font-family: "DM Sans", sans-serif; }
.lm-zone { position: absolute; left: 0; right: 0; }
.lm-zone.st-band { background: var(--ac); }
.lm-zcard { position: absolute; background: #fff; border-radius: 2.4em; box-shadow: 0 .8em 2.6em rgba(0, 0, 0, .18); }
.lm-row { position: absolute; left: 4%; right: 4%; text-align: center; }
.lm-h1, .lm-h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-h2 { font-family: "DM Sans", sans-serif; font-weight: 700; letter-spacing: .06em; }
.lm-bar { position: absolute; height: .5em; border-radius: .3em; background: var(--ac); }
.lm-up { text-transform: uppercase; }

/* badges */
.lm-badge { position: absolute; }
.lm-b-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--ac); }
.lm-b-ring { position: absolute; left: 6%; top: 6%; width: 88%; height: 88%; border-radius: 50%; border: .22em dashed rgba(255, 255, 255, .85); box-sizing: border-box; }
.lm-b-l { position: absolute; left: 6%; right: 6%; text-align: center; white-space: nowrap; overflow: hidden; font-family: "Outfit", sans-serif; }
.bs-circle .lm-b-bg, .bs-ring .lm-b-bg { border-radius: 50%; box-shadow: 0 .6em 1.8em rgba(0, 0, 0, .22); }
.bs-ring .lm-b-bg { background: #fff; border: .7em solid var(--ac); box-sizing: border-box; }
.bs-burst .lm-b-bg { border-radius: 14%; }
.bs-pill .lm-b-bg { border-radius: 9em; box-shadow: 0 .6em 1.8em rgba(0, 0, 0, .22); }
.bs-stamp .lm-b-bg { background: rgba(255, 255, 255, .92); border: .45em solid var(--ac); border-radius: 1.4em; box-sizing: border-box; }
.bs-stamp .lm-b-in { position: absolute; left: 5%; top: 8%; right: 5%; bottom: 8%; border: .14em solid var(--ac); border-radius: .9em; }

/* info cards */
.lm-ct { position: absolute; text-align: left; }
.lm-ct > div, .lm-cl > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-tick { position: absolute; border-radius: 50%; background: var(--ac); }
.lm-tick i { position: absolute; left: 36%; top: 18%; width: 22%; height: 46%; border: solid #fff; border-width: 0 .22em .22em 0; transform: rotate(45deg); box-sizing: content-box; }
.lm-cl { position: absolute; }
.lm-cc { position: absolute; text-align: center; }
.lm-cc > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-cc > div.lm-wrap, .lm-ct > div.lm-wrap { white-space: normal; }
.lm-num { position: absolute; border-radius: 50%; background: #17181c; color: #fff; text-align: center; font-family: "Outfit", sans-serif; font-weight: 800; }
</style>
</head>

  }

  /* ==========================================================================
     Kit.app(cfg) - builds the whole studio around a tool definition.
     ========================================================================== */
  function app(cfg) {
    var KEY = "csl." + cfg.slug;
    var prefs = window.CSL_PREFS || {};
    var S = null;                      // { params, seed, edits, name, pid }
    var hist = [], hi = -1;            // undo stack of JSON strings
    var ui = { tab: cfg.tabs[0].id, view: "all", zoom: "fit", grid: false, page: 0, pane: "design", work: !!(cfg.workspace && cfg.workspace.startOpen) };
    var pages = [], shown = [], dims = null, root, api;
    /* Assets: big items such as uploaded pictures. Kept outside the undo history, saved with projects. */
    var assets = store.get(KEY + ".assets", {});
    function usedAssets() {
      var ids = cfg.usedAssets ? cfg.usedAssets(S.params) : Object.keys(assets), out = {};
      ids.forEach(function (id) { if (assets[id]) out[id] = assets[id]; });

      if (p.pageSize !== undefined && prefs.pageSize === "a4" && SIZES.a4) p.pageSize = "a4";
      return { params: p, seed: newSeed(), edits: {}, name: cfg.projectName || "Untitled project", pid: null };
    }

    /* ----- state, history, autosave ----- */
    function snap() { return JSON.stringify(S); }
    function commit() {
      var s = snap();
      if (hist[hi] === s) return;
      hist = hist.slice(0, hi + 1); hist.push(s);
      if (hist.length > 80) hist.shift();
      hi = hist.length - 1;
      saveSoon(); paintTop();
    }
    function restore(s) { S = JSON.parse(s); buildSide(); render(); saveSoon(); paintTop(); }
    function undo() { if (hi > 0) { hi--; restore(hist[hi]); } }
    function redo() { if (hi < hist.length - 1) { hi++; restore(hist[hi]); } }
    var saveSoon = debounce(function () {
      var ok = store.set(KEY + ".auto", S);
      var s = $(".k-saved", root);
      if (s) s.textContent = ok ? "Saved" : "Storage is full";
    }, 350);

    /* ----- page building ----- */
    function getDims() {
      var sz = SIZES[S.params.pageSize] || SIZES[cfg.pageSize || "letter"];
      var bleed = S.params.bleed ? 0.125 : 0;
      return { key: S.params.pageSize, inW: sz.w + bleed, inH: sz.h + bleed * 2, W: Math.round((sz.w + bleed) * 96), H: Math.round((sz.h + bleed * 2) * 96), bleed: Math.round(bleed * 96), label: sz.label };
    }

      return {
        p: S.params, seed: S.seed, size: dims, esc: esc, icon: icon,
        rng: function (salt) { return rng(S.seed + "|" + (salt || "")); },
        /* Editable text: click it on the page to change it. */

          var v = Object.prototype.hasOwnProperty.call(S.edits, key) ? S.edits[key] : text;
          return "<" + (tag || "span") + ' data-edit="' + esc(key) + '" data-def="' + esc(text) + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + esc(v) + "</" + (tag || "span") + ">";
        }
      };
    }
    function sheetHTML(pg) {
      return '<div class="k-sheet ' + (cfg.sheetClass || "") + " " + (pg.cls || "") + '" style="width:' + dims.W + "px;height:" + dims.H + "px;font-size:" + (dims.W / 100) + 'px">' + pg.html + "</div>";
    }
    function currentView() { return (cfg.views || []).filter(function (v) { return v.id === ui.view; })[0]; }

    function render() {
      dims = getDims();
      try { pages = cfg.pages(makeCtx()) || []; } catch (e) { console.error(e); pages = []; toast("Something went wrong while building the pages.", "err"); }
      var v = currentView();
      shown = v && v.filter ? pages.filter(v.filter) : pages;
      ui.page = clamp(ui.page, 0, Math.max(0, shown.length - 1));
      paintStage();
    }
    var renderSoon = debounce(render, 220);

    function fitScale() {
      var cv = $(".k-canvas", root);

          { id: "props", type: "toggle", label: "Desk props (pencil, cup, leaves, tape)", def: true },
          { id: "device", type: "seg", label: "Tablet, phone, laptop, printer", def: "dark", options: [{ v: "dark", l: "Graphite" }, { v: "silver", l: "Silver" }, { v: "white", l: "White" }] },
          { id: "frameCol", type: "swatches", label: "Wall frame", def: "black", options: [{ v: "black", l: "Black", c: "#1c1c1e" }, { v: "white", l: "White", c: "#f7f6f2" }, { v: "oak", l: "Oak", c: "#c99c64" }, { v: "walnut", l: "Walnut", c: "#5e4131" }, { v: "gold", l: "Gold", c: "#c9a44c" }] }
        ] }
      ] },
      { id: "text", label: "Text", groups: [
        { title: "Headline", fields: [
          { id: "headline", type: "text", label: "Headline", def: SETS[0].head, max: 60, hint: "Click the headline on any image to change it for that image only." },
          { id: "sub", type: "text", label: "Small line", def: SETS[0].sub, max: 80, placeholder: "Leave empty to hide" },
          { id: "headPos", type: "seg", label: "Position", def: "top", options: [{ v: "top", l: "Top" }, { v: "bottom", l: "Bottom" }, { v: "off", l: "No text" }] },
          { id: "headStyle", type: "cards", label: "Style", def: "plain", options: [{ v: "plain", l: "Plain text" }, { v: "band", l: "Color band" }, { v: "card", l: "White card" }, { v: "line", l: "Text with line" }], show: function (p) { return p.headPos !== "off"; } },
          { id: "font", type: "select", label: "Headline font", def: "Poppins", options: FONTS.map(function (f) { return { v: f[0], l: f[0] }; }) },
          { id: "headSize", type: "range", label: "Headline size", def: 6, min: 4, max: 8.5, step: 0.5 },
          { id: "caps", type: "toggle", label: "All capitals", def: false },
          { id: "textColor", type: "seg", label: "Text color", def: "auto", options: [{ v: "auto", l: "Auto" }, { v: "dark", l: "Dark" }, { v: "light", l: "White" }, { v: "accent", l: "Accent" }] }
        ] },
        { title: "Badges", fields: [
          { id: "badges", type: "chips", def: ["instant", "count"], options: [{ v: "instant", l: "Instant download" }, { v: "count", l: "Page count" }, { v: "pdf", l: "Printable PDF" }, { v: "sizes", l: "Letter + A4" }, { v: "hires", l: "300 DPI" }, { v: "edit", l: "Easy to print" }, { v: "comm", l: "Personal use" }, { v: "best", l: "Best seller" }], hint: "The first three you pick are shown. Click a badge on the image to change its words." },
          { id: "badgeStyle", type: "cards", label: "Badge shape", def: "circle", options: [{ v: "circle", l: "Circle" }, { v: "ring", l: "Ring" }, { v: "burst", l: "Starburst" }, { v: "pill", l: "Pill" }, { v: "stamp", l: "Stamp" }] },
          { id: "badgeSize", type: "range", label: "Badge size", def: 16, min: 11, max: 22 },
          { type: "buttons", key: "reset", buttons: [{ label: "Reset text edits", icon: "reset", run: function (api) { api.resetEdits(); } }] }
        ] }
      ] },
      { id: "sell", label: "Listing", groups: [
        { title: "Best photo order for your listing", fields: [
          { type: "html", key: "sell", render: sellHTML, wire: sellWire, hint: "The first photo decides the click, the next ones answer the buyer's questions. The same text is saved inside every ZIP." }
        ] }
      ] }
    ],
    exports: [
      { label: "Listing images (ZIP)", hint: "Every scene at the exact pixel size", icon: "layers", run: function (api) {
        var o = OUT[api.p.pageSize];
        exportZip(api, [{ size: api.p.pageSize, ow: o.ow, oh: o.oh, folder: "" }], "-" + o.tag + ".zip", "ZIP saved: {n} images at " + o.ow + " x " + o.oh + " px");
      } },
      { label: "This image, exact size", hint: "The scene you are looking at", icon: "image", run: exportOne },
      { label: "Every size + thumbnails (ZIP)", hint: "4 sizes and 600 px square thumbnails", icon: "grid", run: function (api) {
        var jobs = Object.keys(OUT).map(function (k) { return { size: k, ow: OUT[k].ow, oh: OUT[k].oh, folder: OUT[k].tag }; });
        jobs.push({ size: "sq", ow: THUMB_PX, oh: THUMB_PX, folder: "thumbnails-" + THUMB_PX + "x" + THUMB_PX });
        exportZip(api, jobs, "-all-sizes.zip", "ZIP saved: {n} images in every size");
      } },
      { label: "Square thumbnails (ZIP)", hint: THUMB_PX + " x " + THUMB_PX + " px, every scene", icon: "grid", run: function (api) {
        exportZip(api, [{ size: "sq", ow: THUMB_PX, oh: THUMB_PX, folder: "" }], "-thumbnails.zip", "ZIP saved: {n} square thumbnails");
      } },
      { label: "Photo order and alt text (TXT)", hint: "For the listing form", icon: "file", run: function (api) {
        api.download(api.fileBase() + "-alt-text.txt", listingText(api.p)); api.toast("Text file saved");
      } }
    ],
    guide: {
      intro: "Listing Mockup Studio turns the pages of your printable into a complete set of listing images: 24 scenes drawn around your real pages, with headlines and badges, in the pixel sizes that marketplaces ask for.",
      steps: [
        "Open Pages and drop your product pages (PNG or JPG). The sample pages disappear as soon as you add your own.",
        "Open Scenes to pick the image size and switch scenes on or off. Press G to see them all at once.",
        "Open Style and Text to choose the background, accent color, headline and badges.",
        "Click any text on an image to reword it, then press Export and choose Listing images (ZIP)."
      ],
      controls: [
        ["Your product pages", "The first page is the hero. Scenes with several pages use them in order and repeat them when needed."],
        ["Pages in the product", "The number shown by the page count badge and the bundle scene. Empty means the number of pages you added."],
        ["Size of the images", "Square 2000 px, landscape 2700 x 2025 px, portrait 1000 x 1500 px or wide 2400 x 1350 px. Every scene adapts."],
        ["Scenes in this set", "24 scenes: stacks, desk, devices, frames and four info cards."],
        ["Background", "20 backgrounds drawn by code: gradients, solids, wood, marble, concrete, linen, terrazzo."],
        ["Headline style", "Plain text, a color band, a white card or text with a small line."],
        ["Badges", "Up to three per image. Their words can be edited on the image."],
        ["Shuffle layouts", "New angles, new textures and new prop positions."]
      ],
      exports: [
        ["Listing images (ZIP)", "Every scene in the selected size at the exact pixel dimensions, as JPG or PNG."],
        ["This image, exact size", "Only the scene on screen."],
        ["Every size + thumbnails (ZIP)", "All four sizes in folders plus 600 px square thumbnails. Takes about a minute."],
        ["Square thumbnails (ZIP)", "Small square versions for shop sections and social posts."],
        ["Photo order and alt text (TXT)", "The best order for your photos with an alt text for each one."]
      ],
      tips: [
        "Lead with the Hero page, then What's included: buyers decide in the first two photos.",
        "Dark backgrounds make white pages stand out. Light wood and marble feel warm and handmade.",
        "For wall art, switch off the info cards you do not need and use Framed wall art and Gallery wall.",
        "Use the same accent color on all your listings so your shop looks like one brand."
      ],
      trouble: [
        ["My pages look soft", "Upload pages that are at least 1000 px on the long side. The tool keeps the full picture while the tab is open."],
        ["A headline is cut", "Long headlines shrink to fit. If it gets too small, shorten it or raise the headline size."],
        ["Storage is full", "Each uploaded page is saved in your browser. Remove pages you do not need or export the project file."]
      ]
    }
  });

  /* finish edits before a background refresh; refit the text when a font arrives */
  document.addEventListener("focusout", function () { if (pendingRender) setTimeout(function () { if (pendingRender) softRender(); }, 60); });
  if (document.fonts && document.fonts.addEventListener) {
    var fontTimer = null;
    document.fonts.addEventListener("loadingdone", function () { clearTimeout(fontTimer); fontTimer = setTimeout(softRender, 150); });
  }
  /* paste pages from the clipboard anywhere in the tool */
  document.addEventListener("paste", function (e) {
    if (e.target.closest && e.target.closest("[data-edit],input,textarea")) return;
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
})();
</script>
