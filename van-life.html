      function getThemeData(theme) {

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, seed) {
        return getRandomElement(data.titles, seed);
      }

      function getRandomSubtitle(data, seed) {
        return getRandomElement(data.subtitles, seed + 1);

      function getRandomStages(data, seed) {
        if (data.stages && Array.isArray(data.stages[0])) {
          return getRandomElement(data.stages, seed + 2);
        }
        return data.stages[0];
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["reflect on this stage", "plan your next steps", "document your progress"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 7);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Final Review & Next Steps (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, title, activities, travelerData, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome to Your Van Life Journey - Purpose: set the tone. Image Prompt: \"warm adventure-themed header with van silhouette, title '" + title + "', footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: Your Van Life Vision - Purpose: clarify goals. Image Prompt: \"vision prompts: 'My ideal day on the road looks like...', 'My top 3 reasons for van life...', footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Exercise " + (p+1);
            var chaosNote = "";
            if (chaos >= 4) chaosNote = "Include a small surprise illustration (campfire, mountain, or compass). ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: practical exercise for " + stage.toLowerCase() + ". Image Prompt: \"" + chaosNote + "clear instructional text, appropriate table/checklist/sketch-box layout, road-trip accents, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        if (travelerData.extraPages && travelerData.extraPages.length > 0 && pageNum <= totalPages - 2) {
          for (var e = 0; e < travelerData.extraPages.length && pageNum <= totalPages - 2; e++) {
            plan += "Page " + pageNum + ": \"" + travelerData.extraPages[e] + "\" - Purpose: traveler-specific planning for " + getTravelerLabel(currentTraveler) + ". Image Prompt: \"tailored layout with relevant icons, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
          }
        }

        while (pageNum <= totalPages - 2) {
          plan += "Page " + pageNum + ": Bonus Reflection: Your Road Life Insights - Purpose: journaling space. Image Prompt: \"open journal page with adventure motifs, footer '[" + title + " - " + pageNum + "]'\"\n";

        plan += "Page " + pageNum + ": My Journey Summary & Key Takeaways - Purpose: consolidate learning. Image Prompt: \"structured reflection boxes, 'What I'm most excited about...', 'My next 3 steps...', footer '[" + title + " - " + pageNum + "]'\"\n";

        return plan;

                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('themeSelect').addEventListener('change', function(e) {
        currentTheme = e.target.value;
        updateUI();
      });

      var travelerBtns = document.querySelectorAll('.traveler-btn');
      travelerBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          travelerBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentTraveler = btn.getAttribute('data-traveler');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
</body>
</html>
