            ["Logic 101: {topic}", "Pattern Spotting", "Fact or Opinion?", "Solve It!", "Think Outside the Box", "Make a Choice", "The Ultimate Challenge"]

          activities: [

          stages: [["Introduction to {topic} in Music", "Meet the Composer", "Music Theory Basics", "Listening & Analysis", "Composition & Creation", "Performance & Reflection"]],
          iconography: "musical notes, treble clef, piano keys, instruments, composer portrait, sheet music",
          pageTypes: ["composer biography and timeline", "music theory worksheet", "listening log", "rhythm practice", "simple composition staff paper"],
          activities: ["Listen and describe a piece by {topic}", "Identify instruments used", "Clap a rhythm pattern", "Compose a 4-bar melody"]
        },
        "Beginner's Foreign Language Practice": {
          titles: ["{topic} Language Basics", "First Steps in {topic}", "The {topic} Phrasebook", "Learning {topic} Together"],
          subtitles: ["A {grade} Beginner's Language Workbook", "Build Vocabulary and Conversation Skills in {topic}", "Your First 100 Words and Phrases"],
          stages: [["Greetings & Introductions", "Numbers, Colors, Days", "Family & Home Vocabulary", "Food & Daily Life", "Simple Sentence Building", "Cultural Notes & Practice"]],
          iconography: "speech bubbles, flag, map, flashcards, dictionary, globe, landmarks",
          pageTypes: ["flashcard cut-outs", "matching words to pictures", "fill-in-the-blank sentences", "dialogue practice script", "cultural fact file"],
          activities: ["Practice greeting someone in {topic}", "Label household items with {topic} words", "Write a short dialogue", "Learn a song or rhyme in {topic}"]
        },
        "Health and Human Body Study": {
          titles: ["{topic} Body Science", "The {topic} System", "Health: {topic}", "Understanding {topic}"],
          subtitles: ["A {grade} Health and Anatomy Workbook", "Learn How Your Body Works Through {topic}", "Healthy Habits for Life"],
          stages: [["Introduction to {topic} & the Body", "Key Organs & Functions", "How {topic} Works", "Healthy Habits for {topic}", "Diseases & Prevention", "Review & Body Quiz"]],
          iconography: "heart, lungs, brain, skeleton, healthy food, stethoscope, human body diagram",
          pageTypes: ["labeled body system diagram", "organ function matching", "healthy meal planner", "exercise log", "symptom checker chart"],
          activities: ["Label the parts of the {topic} system", "Track your heart rate before and after exercise", "Plan a healthy menu", "Research a disease related to {topic}"]
        },
        "Space and Astronomy Unit Study": {
          titles: ["{topic} Space Mission", "The {topic} Cosmos", "Astronomy: {topic}", "Star Guide: {topic}"],
          subtitles: ["A {grade} Astronomy Workbook", "Explore the Universe Through {topic}", "Planets, Stars, and Beyond"],
          stages: [["Introduction to {topic} in Space", "Our Solar System & {topic}", "Stars, Galaxies & Beyond", "Space Exploration History", "Observing the Night Sky", "Space Science Review"]],
          iconography: "telescope, planets, stars, rocket, astronaut, moon phases, constellations",
          pageTypes: ["planet fact file", "moon phase tracker", "constellation dot-to-dot", "space mission timeline", "sky observation log"],
          activities: ["Draw and label the planets", "Track the moon for a week", "Research a space mission", "Create a constellation viewer"]
        }
      };

      function getSubjectData(subject) {
        return subjectBank[subject] || subjectBank["Reading Comprehension Practice"];
      }

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, topic, seed) {
        var template = getRandomElement(data.titles, seed);
        return template.replace(/{topic}/g, topic);
      }

      function getRandomSubtitle(data, grade, seed) {
        var template = getRandomElement(data.subtitles, seed + 1);
        return template.replace(/{grade}/g, grade).replace(/{topic}/g, currentTopic);
      }

      function getRandomStages(data, topic, seed) {
        var stageSets = data.stages;
        var chosen = getRandomElement(stageSets, seed + 2);
        var result = [];
        for (var i = 0; i < chosen.length; i++) {
          result.push(chosen[i].replace(/{topic}/g, topic));
        }
        return result;
      }

      function getRandomActivities(data, count, topic, seed) {
        var acts = data.activities || ["explore {topic} in a fun way", "practice a key skill about {topic}", "reflect on what you learned about {topic}"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) {
          shuffled.push(acts[i].replace(/{topic}/g, topic));
        }
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getPageTypes(data, topic, seed) {
        var types = data.pageTypes || ["activity page about {topic}", "comprehension check on {topic}", "creative response to {topic}"];
        var result = [];
        for (var i = 0; i < types.length; i++) {
          result.push(types[i].replace(/{topic}/g, topic));
        }
        return result;
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "20-24") return 22;
        if (rangeStr === "25-30") return 27;
        if (rangeStr === "30-40") return 35;
        return 47;
      }

      function getGradeLabel(grade) {
        if (grade === "K-2") return "Early Elementary (K-2)";
        if (grade === "3-5") return "Upper Elementary (3-5)";
        if (grade === "6-8") return "Middle School (6-8)";
        return "High School (9-12)";
      }

      function getGradeComplexity(grade) {
        if (grade === "K-2") return "simple vocabulary, large print (16-18pt), picture-supported text, short sentences, drawing activities";
        if (grade === "3-5") return "age-appropriate vocabulary, 14-16pt font, paragraph-length passages, mix of writing and drawing";
        if (grade === "6-8") return "grade-level academic vocabulary, 12-14pt font, multi-paragraph texts, analytical writing prompts";
        return "advanced academic vocabulary, 11-13pt font, complex texts, critical analysis and essay-style responses";
      }

      function generateKeywords(subject, topic, grade) {
        var gradeText = "";
        if (grade === "K-2") gradeText = "early elementary K-2";
        else if (grade === "3-5") gradeText = "upper elementary 3rd-5th grade";
        else if (grade === "6-8") gradeText = "middle school 6th-8th grade";
        else gradeText = "high school 9th-12th grade";

        var subjectSlug = subject.toLowerCase().replace(/[^a-z0-9]+/g, " ");
        var topicSlug = topic.toLowerCase();

        return topicSlug + " homeschool workbook, " +
               topicSlug + " " + subjectSlug + " printable, " +
               gradeText + " " + subjectSlug + " worksheets, " +
               topicSlug + " unit study pdf, " +
               "printable " + topicSlug + " activities for kids, " +
               "homeschool " + subjectSlug + " companion " + gradeText + ", " +
               topicSlug + " educational workbook";
      }

      // ---------- ULTRA VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 23;
        var seed = lastSeed;

        var subject = currentSubject;
        var topic = currentTopic || "Learning Skills";
        var grade = currentGrade;
        var pageRange = currentPageRange;
        var chaos = chaosLevel;

        var data = getSubjectData(subject);
        var title = getRandomTitle(data, topic, seed);
        var subtitle = getRandomSubtitle(data, grade, seed + 7);
        var stages = getRandomStages(data, topic, seed + 14);
        var activities = getRandomActivities(data, 20, topic, seed + 21);
        var pageTypes = getPageTypes(data, topic, seed + 28);
        var iconography = data.iconography || "educational illustrations, diagrams, charts";
        var gradeLabel = getGradeLabel(grade);
        var complexity = getGradeComplexity(grade);
        var exactPages = getExactPageCount(pageRange);
        var keywords = generateKeywords(subject, topic, grade);

        var extraTwists = "";
        if (chaos >= 3) {
          var twists = [
            "Include a 'design a board game' page based on " + topic + ".",
            "Add a 'write a song or rap' page about " + topic + ".",
            "Incorporate a 'create a comic strip' page set in " + topic + ".",
            "Add a 'build a 3D model' planning page for " + topic + ".",
            "Include a 'debate prep' page with two sides of a " + topic + " issue.",
            "Add a 'field trip reflection' page after visiting a place related to " + topic + ".",
            "Incorporate a 'teach someone else' page where the student explains " + topic + ".",
            "Add a 'current events connection' page linking " + topic + " to today's news.",
            "Include a 'design a poster' page to advertise learning about " + topic + ".",
            "Add a 'write a quiz for a classmate' page about " + topic + "."
          ];
          for (var t = 0; t < chaos - 1; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 500 + t) + "\n";
          }
        }

        var pagePlan = buildDynamicPagePlan(stages, exactPages, activities, pageTypes, title, topic, grade, seed, chaos);

        var prompt = "CREATE A COMPLETE 9-SECTION HOMESCHOOL CURRICULUM WORKBOOK BLUEPRINT following the exact structure below. This workbook is an ACADEMIC COMPANION resource, not a self-improvement journal. Chaos level: " + chaos + "/5 for creative variety.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for homeschool parents/educators, co-op teachers, tutors, and classroom supplement use. Designed as a companion resource alongside a primary curriculum, not a standalone complete curriculum. Suitable for " + gradeLabel + " students. Intentionally undated for flexible scheduling.\n\n" +
        "3. SHORT PRODUCT DESCRIPTION\n" +
        "This educational printable workbook guides " + gradeLabel + " students through an engaging study of \"" + topic + "\" within the subject area of " + subject + ". Each page is designed to build understanding through a mix of " + complexity + ". Activities progress logically from introduction to mastery, with creative chaos elements sprinkled throughout.\n" +
        "With " + exactPages + " carefully sequenced pages, students explore key concepts, practice skills, and demonstrate learning. The companion format works alongside any core curriculum, providing structured practice and enrichment for homeschool families.\n\n" +
        "4. 7 SEO KEYWORDS\n" + keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Learning Path)\n" +
        buildStageList(stages) + "\n" +
        extraTwists + "\n" +
        "6. CONTENT AND LAYOUT STYLE GUIDE\n" +
        "Tone: Educational, encouraging, and academically sound. Age-appropriate for " + gradeLabel + ". Instructions are clear and direct.\n" +
        "Visual direction: Clean, academic design with subtle " + iconography + " motifs. White space for student responses. Charts, diagrams, and labeled illustrations where appropriate.\n" +
        "Page structure: " + complexity + ". Consistent footer with title and page number. No dense text blocks.\n" +
        "Consistency rules: Every page includes footer \"[" + title + "] - [page number]\". All educational content must be FACTUALLY ACCURATE and age-appropriate. Vocabulary definitions, comprehension questions, and diagrams must contain correct information.\n\n" +
        "7. WORKBOOK STRUCTURE OVERVIEW\n" +
        "Front Matter (pages 1-2): Title page, welcome letter, how to use this workbook, a 'What I Already Know' pre-assessment.\n" +
        buildModuleStructure(stages, exactPages) + "\n\n" +
        "8. COVER PROMPT\n" +
        "A vertical 8.5x11 full-color front cover. Visual style: educational and inviting with " + iconography + " motifs. Main illustration: subject-appropriate artwork representing \"" + topic + "\". Exact title text: \"" + title + "\" and subtitle \"" + subtitle + "\". Include grade band: \"" + gradeLabel + "\". Do NOT include barcodes, real photographs, or small dense text. Keep 0.25 inch safe print margin.\n\n" +
        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +
        pagePlan + "\n\n" +
        "10. PRODUCT VERSION SUGGESTIONS\n" +
        "Starter Version (16-20 pages): Core vocabulary and comprehension pages only, simplified layout.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (adds 10-15 pages): Includes a complete teacher/parent answer key section, extension activities for advanced learners, and a curated related-topics reading list with book suggestions.\n";

        return prompt;
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 6);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Final Review & Assessment (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, activities, pageTypes, title, topic, grade, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome & How to Use This Workbook - Purpose: orient the student. Image Prompt: \"friendly educational header with " + (getSubjectData(currentSubject).iconography || "book") + " motif, title '" + title + "', footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: What I Already Know About " + topic + " - Purpose: pre-assessment. Image Prompt: \"K-W-L chart with columns for Know, Want to Know, Learned, footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;
        var typeIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Activity " + (p+1);
            var pageType = (pageTypes && typeIdx < pageTypes.length) ? pageTypes[typeIdx] : "educational activity page about " + topic;
            var gradeNote = "";
            if (grade === "K-2") gradeNote = "Use large print, picture support, and simple instructions. ";
            else if (grade === "9-12") gradeNote = "Use academic language appropriate for high school, include analytical prompts. ";
            var chaosNote = "";
            if (chaos >= 4) chaosNote = "Add a surprising twist element (hidden fact, joke, or fun challenge). ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: " + pageType + " for " + stage.toLowerCase() + ". Image Prompt: \"" + gradeNote + chaosNote + "clear layout as a " + pageType + ", instructional text: '" + activityTitle + "', all content must be FACTUALLY ACCURATE about " + topic + ", educational accents, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
            typeIdx++;
            if (typeIdx >= pageTypes.length) typeIdx = 0;
          }
        }

        plan += "Page " + pageNum + ": Final Review: What I Learned About " + topic + " - Purpose: summative assessment. Image Prompt: \"review quiz page with varied question types (multiple choice, short answer, labeling), all content factually accurate about " + topic + ", footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": My Learning Reflection - Purpose: student self-assessment. Image Prompt: \"reflection prompts: 'My favorite part was...', 'I still wonder about...', 'I am proud of...', footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

      function updateUI() {
        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;
        var wordCount = promptText.split(/\s+/).filter(function(w){return w.length>0;}).length;
        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var gradeLabel = getGradeLabel(currentGrade);
        var tagsHtml = '<span class="tag">📖 ' + currentSubject + '</span>' +
                       '<span class="tag">🎯 ' + currentTopic + '</span>' +
                       '<span class="tag">🎒 ' + gradeLabel + '</span>' +
                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('subjectSelect').addEventListener('change', function(e) {
        currentSubject = e.target.value;
        updateUI();
      });

      document.getElementById('topicInput').addEventListener('input', function(e) {
        currentTopic = e.target.value || "Learning Skills";
        updateUI();
      });

      var gradeBtns = document.querySelectorAll('.grade-btn');
      gradeBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          gradeBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentGrade = btn.getAttribute('data-grade');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
</body>
