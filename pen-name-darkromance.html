            "writes dark romance for readers who aren't afraid of love's shadow side.",
            "crafts stories where love and danger are inseparable.",
            "creates worlds where the darkest hearts find redemption."
          ];
          return penName + " " + pick(openers) + " When she's not " + hobby + ", " + detail + ". *" + series + "* is her debut.";
        },
        // Mysterious/Minimal (Template B)
        function() {
          var series = pick(SERIES_TITLE_FRAGMENTS);
          var phrases = [
            "She writes about the spaces between right and wrong.",
            "Her worlds are built on secrets and slow burns.",
            "Every story is a descent into obsession.",
            "She crafts heroes who are as broken as they are irresistible.",
            "Her prose is as sharp as a blade."
          ];
          var closers = [
            series + " is only the beginning.",
            "Dive into " + series + " — if you dare.",
            series + " will leave you breathless."
          ];
          return penName + " crafts dark romance with a razor's edge. " + pick(phrases) + " " + pick(closers);
        },
        // BookTok/Casual (Template C)
        function() {
          var emojis = ["🖤", "🔥", "🥀", "⚜️", "💀", "🌙", "⛓️", "🗡️", "🌹"];
          var series = pick(SERIES_TITLE_FRAGMENTS);
          var casual = pick([
            "obsessed with morally grey", 
            "living for the angst", 
            "plotting happily ever afters with bite", 
            "writing villains you'll root for",
            "dark romance addict",
            "queen of slow burn"
          ]);
          var tag = pick(["writer", "author", "storyteller", "wordsmith"]);
          return penName + " · dark romance " + tag + " ✦\n" + casual + " " + pick(emojis) + "\n" + series + " out now.";
        }
      ];
      var chosen = pick(templates);
      return chosen();
    }

    function generateMood(vibe) {
      var palette = generatePalette(vibe);
      var keywords = shuffle(KEYWORD_BANK).slice(0, 3);
      var fontPair = FONT_PAIRS[vibe] || FONT_PAIRS.gothic;
      var tagline = pick(TAGLINES);
      return { palette: palette, keywords: keywords, fontPair: fontPair, tagline: tagline };
    }

    function generateFullKit(vibe) {
      var penName = generatePenName(vibe);
      var bio = generateBio(penName, vibe);
      var mood = generateMood(vibe);
      return { 
        penName: penName, 
        bio: bio, 
        palette: mood.palette, 
        keywords: mood.keywords, 
        fontPair: mood.fontPair, 
        tagline: mood.tagline, 
        vibe: vibe 
      };
    }

    // ---------- UI STATE ----------
    var currentKit = null;
    var currentVibe = 'gothic';
    var previewPanel = document.getElementById('previewPanel');
    var vibeSelect = document.getElementById('vibeSelect');

    function renderKit(kit) {
      if (!kit) {
        previewPanel.className = 'preview empty';
        previewPanel.innerHTML = '<h3>✦ forge your identity</h3><p>seleziona un\'atmosfera e genera — il tuo pen name, bio e mood board</p>';
        return;
      }
      previewPanel.className = 'preview';
      var html = '<div class="brand-kit">';
      var vibeLabel = { gothic: 'Gothic', mafia: 'Mafia', darkfantasy: 'Dark Fantasy', contemporary: 'Contemporary' }[kit.vibe] || kit.vibe;
      html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;"><span class="badge-vibe">'+vibeLabel+'</span></div>';
      html += '<div class="kit-section"><div class="kit-header"><h4>pen name</h4></div><div class="pen-name">' + kit.penName + '</div></div>';
      html += '<div class="kit-section"><div class="kit-header"><h4>author bio</h4></div><div class="bio-text">' + kit.bio.replace(/\n/g, '<br>') + '</div></div>';
      html += '<div class="kit-section"><div class="kit-header"><h4>brand mood board</h4></div>';
      html += '<div class="mood-row">';
      html += '<div class="swatches">' + kit.palette.map(c => '<div class="swatch" style="background:'+c+';"></div>').join('') + '</div>';
      html += '<div class="keywords">' + kit.keywords.map(k => '<span class="keyword">'+k+'</span>').join('') + '</div>';
      html += '</div>';
      html += '<div class="flex gap-1 mt-1"><span class="font-pair">'+kit.fontPair+'</span></div>';
      html += '<div class="tagline">‘'+kit.tagline+'’</div>';
      html += '</div></div>';
      previewPanel.innerHTML = html;
    }

    function updatePreview(kit) {
      currentKit = kit;
      renderKit(kit);
    }

    function generateAndUpdate() {
      var vibe = vibeSelect.value;
      currentVibe = vibe;
      var kit = generateFullKit(vibe);
      updatePreview(kit);
    }

    // ---------- EVENT LISTENERS ----------
    document.getElementById('generateBtn').addEventListener('click', generateAndUpdate);

    document.getElementById('regenerateNameBtn').addEventListener('click', function() {
      if (!currentKit) { generateAndUpdate(); return; }
      var newName = generatePenName(currentVibe);
      currentKit.penName = newName;
      currentKit.bio = generateBio(newName, currentVibe);
      updatePreview(currentKit);
    });

    document.getElementById('regenerateBioBtn').addEventListener('click', function() {
      if (!currentKit) { generateAndUpdate(); return; }
      currentKit.bio = generateBio(currentKit.penName, currentVibe);
      updatePreview(currentKit);
    });

    document.getElementById('regenerateMoodBtn').addEventListener('click', function() {
      if (!currentKit) { generateAndUpdate(); return; }
      var mood = generateMood(currentVibe);
      currentKit.palette = mood.palette;
      currentKit.keywords = mood.keywords;
      currentKit.fontPair = mood.fontPair;
      currentKit.tagline = mood.tagline;
      updatePreview(currentKit);
    });

    document.getElementById('copyKitBtn').addEventListener('click', function() {
      if (!currentKit) return;
      var txt = 'PEN NAME: ' + currentKit.penName + '\n\nAUTHOR BIO:\n' + currentKit.bio + '\n\nBRAND MOOD BOARD\n';
      txt += 'Palette: ' + currentKit.palette.join(' · ') + '\n';
      txt += 'Keywords: ' + currentKit.keywords.join(' · ') + '\n';
      txt += 'Font pair: ' + currentKit.fontPair + '\n';
      txt += 'Tagline: ' + currentKit.tagline;
      navigator.clipboard.writeText(txt).then(function() {
        var btn = document.getElementById('copyKitBtn');
        var orig = btn.innerText;
        btn.innerText = '✅ Copied!';
        setTimeout(function(){ btn.innerText = orig; }, 1800);
      }).catch(function() { alert('Copy failed, but you can select the text manually.'); });
    });

    renderKit(null);
  })();
</script>
</body>
</html>
