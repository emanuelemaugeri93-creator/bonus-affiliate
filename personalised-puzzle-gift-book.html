<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;

.k-tab {

}

.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }

}
.k-field { margin-bottom: 12px; }

.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;

.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}

.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;

}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;

.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;

.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }

.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {

}

.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }

.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }

<style>
/* Direction: Sidebar + Canvas in an editorial gift-shop language (cream paper, deep plum ink, antique gold),
   Playfair Display + DM Sans, because the buyers are making a heartfelt present, not a worksheet. */
:root {
  --k-bg: #f7f1e8;
  --k-panel: #fffdf9;
  --k-panel-2: #f3ece1;
  --k-ink: #2b1830;
  --k-muted: #76667a;
  --k-line: #e6dccd;
  --k-accent: #6b2d5c;
  --k-accent-ink: #ffffff;
  --k-accent-soft: #f3e3ee;
  --k-stage: #ece3d6;
  --k-font: "DM Sans", system-ui, sans-serif;
  --k-display: "Playfair Display", Georgia, serif;
}
.k-title { font-weight: 800; letter-spacing: .01em; }
.k-group-title { color: #a07a2c; }

/* ---------- Side panel ---------- */
.pg-copy { display: grid; gap: 10px; }
.pg-copy textarea { min-height: 70px; font-size: 12.5px; }
.pg-copy .k-label { margin-bottom: 4px; align-items: center; }
.pg-note { font-size: 11.5px; padding: 7px 9px; border-radius: 9px; background: #edf6ee; color: #1f6a3a; line-height: 1.45; }
.pg-note.is-warn { background: #fbf0dc; color: #84520c; }
.pg-people { display: grid; gap: 6px; }

/* ---------- Sheets. 1em = 1% of the page width. ---------- */
.pg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; color: #1f1a20; font-family: "DM Sans", sans-serif; }
.pg-abs { position: absolute; display: block; }
.pg-orn { position: absolute; }
.pg-frame { position: absolute; left: 4.5em; top: 4.5em; right: 4.5em; bottom: 4.5em; border: .22em solid var(--a); }
.pg-frame2 { position: absolute; left: 5.6em; top: 5.6em; right: 5.6em; bottom: 5.6em; border: .1em solid var(--a); }
.pg-hd { position: absolute; left: 13em; right: 13em; text-align: center; }
.pg-kicker { font-size: 1.45em; letter-spacing: .3em; text-transform: uppercase; color: var(--a); font-weight: 700; }
.pg-title { font-family: var(--tf); font-size: 4.4em; line-height: 1.05; margin-top: .12em; color: #1f1a20; }
.pg-sub { font-size: 1.75em; line-height: 1.35; margin-top: .5em; color: #4a4250; }
.pg-ft { position: absolute; left: 9em; right: 9em; bottom: 3em; display: flex; justify-content: space-between; align-items: center; }
.pg-ft span { font-size: 1.3em; color: #8a8090; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg-ft b { font-family: var(--tf); font-size: 1.7em; color: var(--a); font-weight: 400; }

/* word search word list */
.pg-words { position: absolute; left: 9em; right: 9em; display: flex; flex-wrap: wrap; justify-content: center; gap: .6em 2.2em; }
.pg-words span { font-size: 1.75em; white-space: nowrap; }
.pg-words span i { display: inline-block; width: .7em; height: .7em; border: .1em solid #555; border-radius: .2em; margin-right: .35em; vertical-align: -.05em; }

/* crossword clues */
.pg-clues { position: absolute; left: 9em; right: 9em; display: flex; gap: 3em; }
.pg-clues > div { flex: 1; min-width: 0; }
.pg-clues h4 { margin: 0 0 .4em; font-family: var(--tf); color: var(--a); font-weight: 700; }
.pg-clues p { margin: 0 0 .35em; line-height: 1.3; display: flex; gap: .45em; }
.pg-clues p b { flex: none; min-width: 1.4em; text-align: right; }

/* cryptogram */
.pg-crypt { position: absolute; left: 9em; right: 9em; display: flex; flex-wrap: wrap; justify-content: center; row-gap: 1.4em; }
.pg-cw { display: flex; margin: 0 1.1em; }
.pg-cl { display: flex; flex-direction: column; align-items: center; }
.pg-cl i { display: block; border-bottom: .12em solid #333; font-style: normal; text-align: center; }
.pg-cl i.is-h { color: var(--a); font-weight: 700; }
.pg-cl u { display: block; text-decoration: none; color: #555; text-align: center; }
.pg-cl.is-p i { border-bottom-color: transparent; }
.pg-hint { position: absolute; left: 9em; right: 9em; text-align: center; }
.pg-hint span { font-size: 1.6em; color: #4a4250; }

/* scrambles, trivia, who said it */
.pg-list { position: absolute; left: 10em; right: 10em; }
.pg-row { display: flex; align-items: center; gap: 1.2em; }
.pg-num { flex: none; width: 3.2em; height: 3.2em; border-radius: 50%; background: var(--a); color: #fff; display: flex; align-items: center; justify-content: center; }
.pg-num span { font-size: 1.4em; font-weight: 700; }
.pg-scr { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 1em; }
.pg-scr b { font-family: "Lexend", sans-serif; letter-spacing: .22em; white-space: nowrap; }
.pg-scr small { color: #8a8090; white-space: nowrap; }
.pg-scr i { flex: 1; border-bottom: .12em solid #444; min-width: 6em; font-style: normal; text-align: center; }
.pg-q { flex: 1; min-width: 0; }
.pg-q p { margin: 0 0 .35em; line-height: 1.3; font-weight: 600; }
.pg-opts { display: flex; flex-wrap: wrap; gap: .3em 2em; }
.pg-opts span { white-space: nowrap; }
.pg-opts span b { display: inline-block; width: 1.5em; height: 1.5em; border-radius: 50%; border: .08em solid #555; text-align: center; line-height: 1.4; font-size: .8em; margin-right: .3em; }
.pg-bank { position: absolute; left: 9em; right: 9em; border: .18em dashed var(--a); border-radius: 1.6em; display: flex; flex-wrap: wrap; justify-content: center; gap: .4em 2.4em; padding: 1.4em 2em; }
.pg-bank span { font-size: 1.8em; font-weight: 600; white-space: nowrap; }
.pg-ans { color: var(--a); font-weight: 700; }

/* cover, dedication, memory page */
.pg-cover { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--bg); }
.pg-cv-in { position: absolute; left: 6em; top: 6em; right: 6em; bottom: 6em; border: .3em solid var(--a2); }
.pg-cv-t { position: absolute; left: 10%; right: 10%; text-align: center; }
.pg-cv-t div { font-family: var(--tf); line-height: 1.02; color: var(--ink); }
.pg-cv-k { position: absolute; left: 10%; right: 10%; text-align: center; font-size: 1.9em; letter-spacing: .32em; text-transform: uppercase; color: var(--a2); font-weight: 700; }
.pg-cv-s { position: absolute; left: 10%; right: 10%; text-align: center; font-size: 2.3em; color: var(--ink); line-height: 1.3; }
.pg-cv-by { position: absolute; left: 10%; right: 10%; text-align: center; font-size: 1.8em; color: var(--ink); opacity: .85; }
.pg-ded { position: absolute; left: 14%; right: 14%; text-align: center; }
.pg-ded-for { font-family: var(--tf); color: var(--a); line-height: 1.1; }
.pg-ded-msg { font-size: 2.35em; line-height: 1.55; margin-top: 1.2em; color: #3a3240; font-family: "Lora", serif; }
.pg-ded-by { font-size: 2.1em; margin-top: 1.6em; font-family: "Lora", serif; font-style: italic; color: #3a3240; }
.pg-mem { position: absolute; left: 10em; right: 10em; }
.pg-mem h5 { margin: 0 0 .5em; font-family: var(--tf); color: var(--a); font-weight: 700; font-size: 2.2em; }
.pg-mem i { display: block; border-bottom: .1em solid #bbb; height: 3.2em; }

      h += '<div class="pg-mem" style="top:' + y.toFixed(2) + 'em"><h5 style="font-size:' + (fs * 1.2).toFixed(2) + 'em">' + b[0] + '</h5><div style="display:flex;flex-wrap:wrap">' +
        b[1].map(function (line) { return '<span style="width:' + (cols === 1 ? 100 : 50) + "%;font-size:" + fs + 'em;line-height:1.45">' + esc(line) + "</span>"; }).join("") + "</div></div>";
      y += fs * 1.2 * 1.5 + rows * fs * 1.45 + 2.4;
    });
    return page(T, "More answers", "answer", h + foot(T, S.n));
  }

  var LAST = null;
  function pages(ctx) {
    var p = ctx.p, parts = p.parts || [];
    var B = buildBook(p, ctx.seed, ctx.size.W / ctx.size.H), T = makeT(ctx, B), out = [];
    LAST = B;
    function add(pg) { if (pg) out.push(pg); }
    if (parts.indexOf("cover") >= 0) add(coverPage(T));
    if (parts.indexOf("ded") >= 0) add(dedPage(T));
    if (parts.indexOf("how") >= 0) add(howPage(T, parts));
    var puzzles = [];
    if (parts.indexOf("ws") >= 0) B.ws.forEach(function (W, i) { puzzles.push(function () { return wsPage(T, W, i); }); });
    if (parts.indexOf("cross") >= 0) puzzles.push(function () { return crossPage(T); });
    if (parts.indexOf("crypt") >= 0) puzzles.push(function () { return cryptPage(T); });
    if (parts.indexOf("scr") >= 0) puzzles.push(function () { return scrPage(T); });
    if (parts.indexOf("trivia") >= 0) puzzles.push(function () { return triviaPages(T); });
    if (parts.indexOf("who") >= 0) puzzles.push(function () { return whoPage(T); });
    if (parts.indexOf("maze") >= 0) puzzles.push(function () { return mazePage(T, false); });
    /* word searches first, then the rest mixed with a little variety */
    puzzles.forEach(function (f) { var r = f(); if (Array.isArray(r)) r.forEach(add); else add(r); });
    if (parts.indexOf("mem") >= 0) add(memPage(T));
    if (parts.indexOf("ans") >= 0) {
      if (parts.indexOf("ws") >= 0) wsAnswerPages(T).forEach(add);
      if (parts.indexOf("cross") >= 0) add(crossAnswerPage(T));
      add(textAnswerPage(T, parts));
      if (parts.indexOf("maze") >= 0) add(mazePage(T, true));
    }
    return out;
  }

  function checkHTML(p, api) {
    var sz = Kit.sizes[p.pageSize] || Kit.sizes.letter, bl = p.bleed ? 0.125 : 0;
    var B = buildBook(p, api.S.seed, (sz.w + bl) / (sz.h + bl * 2));
    var parts = ["Word searches: every word was found exactly once by a separate solver.", "Crossword: every row and column was read back and matches the clues.", "Secret message: decoded again letter by letter.", "Maze: walked from start to end, one route only."];
    return '<div class="pg-note' + (B.ok ? "" : " is-warn") + '">' + esc(B.ok ? "All puzzles passed their checks. " + parts.join(" ") : "Some puzzles did not pass their check and are hidden.") + "</div>" +
      (B.notes.length ? '<div class="pg-note is-warn" style="margin-top:6px">' + esc(B.notes.join(" ")) + "</div>" : "");
  }
  function listing(p, seed) {
    var R = Kit.rng(seed + "sell" + p.sellN), th = theme(p), parts = p.parts || [];
    var title = R.pick(["Personalized Puzzle Book", "Custom Puzzle Book Gift", "Personalised Activity Book"]) + " | " + th.l + " Gift | " + R.pick(["Word Search, Crossword and Trivia About Them", "Made From Your Own Stories", "Printable PDF With Answers"]);
    var desc = R.pick(["The most personal gift you can print: a whole puzzle book about the person you love.", "A one-of-a-kind book where every puzzle is about them.", "Turn family stories, nicknames and inside jokes into a book of puzzles."]) + "\n\n" +
      "WHAT IS INSIDE\n" + PARTS.filter(function (x) { return parts.indexOf(x[0]) >= 0; }).map(function (x) { return "- " + x[1]; }).join("\n") + "\n\n" +
      "HOW IT WORKS\n1. Order and fill in the short questionnaire (names, places, hobbies, favourite things, a message).\n2. I build the book and send you a print-ready PDF.\n3. Print at home or at a print shop and wrap it up.\n\n" +
      R.pick(["Perfect for birthdays, retirements, anniversaries and Mother's Day.", "Loved by grandparents, parents, partners and colleagues.", "Large print available for older solvers."]) + "\n\nThis is a digital file. No physical item is shipped.";
    var tags = ["personalized gift", "custom puzzle book", "word search gift", "crossword gift", th.l.toLowerCase() + " gift", "gift for grandma", "gift for dad", "retirement gift", "anniversary gift", "printable gift", "family trivia", "unique gift idea", "large print puzzles"];
    var form = "Please answer as many as you like:\n1. Name of the person and nicknames:\n2. The occasion and their age or the years:\n3. Who is the book from:\n4. Family, friends and pets (name and relation):\n5. Places that matter to them:\n6. Hobbies:\n7. Favourite foods, songs, flowers, things:\n8. Inside jokes or sayings (and who says them):\n9. A few questions about them with the answers:\n10. A secret message for the code puzzle:";
    return { title: title.slice(0, 140), desc: desc, tags: tags.join(", "), form: form };
  }
  function sellHTML(p, api) {
    var L = listing(p, api.S.seed);
    function block(key, label, val, tall) {
      return '<div><div class="k-label"><span>' + label + '</span><button type="button" class="k-btn k-sm" data-cp="' + key + '">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="' + key + '"' + (tall ? ' style="min-height:200px"' : "") + ">" + esc(val) + "</textarea></div>";

    });
  }
  function proofText() {
    var B = LAST;
    if (!B) return "";
    var out = ["PUZZLE BOOK FOR " + B.M.name.toUpperCase(), ""];
    B.ws.forEach(function (W) { out.push(W.k + ": " + W.t, W.g.placed.map(function (p) { return p.show; }).join(", "), ""); });
    if (B.cw) {
      out.push("Crossword clues");
      B.cw.placed.slice().sort(function (a, b) { return a.n - b.n || (a.dir < b.dir ? -1 : 1); }).forEach(function (p) { out.push(p.n + (p.dir === "a" ? " across: " : " down: ") + p.e.clue + " " + p.e.en + " = " + p.e.show); });
      out.push("");
    }
    out.push("Secret message: " + B.crypt.text, "");
    out.push("Scrambles: " + B.scr.map(function (o) { return o.s + " = " + o.show; }).join(", "), "");
    B.trivia.forEach(function (t, i) { out.push("Trivia " + (i + 1) + ": " + t.q + " = " + t.opts[t.right]); });
    return out.join("\n");
  }
