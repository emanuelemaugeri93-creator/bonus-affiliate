var DEFAULTS={A:'Aria',B:'Kael',C:'Dorian'};
var state={lines:[],pay:null,seen:{},curEp:12};
function $(id){return document.getElementById(id);}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2200);}
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function pickR(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function names(){return {A:$('inA').value.trim()||DEFAULTS.A,B:$('inB').value.trim()||DEFAULTS.B,C:$('inC').value.trim()||DEFAULTS.C};}
function beatShort(){var b=$('inBeat').value.trim();if(b.length>70)b=b.slice(0,67)+'...';return b||'what just happened';}
function fillC(s){var n=names();return String(s).split('{A}').join(n.A).split('{B}').join(n.B).split('{C}').join(n.C).split('{BEAT}').join(beatShort());}
function tropeLabel(k){for(var i=0;i<TROPES.length;i++)if(TROPES[i][0]===k)return TROPES[i][1];return k;}
function totalEps(){var v=parseInt($('inTotal').value,10);if(isNaN(v)||v<10)v=10;if(v>60)v=60;return v;}
function epNum(){var v=parseInt($('inEp').value,10);if(isNaN(v)||v<1)v=1;if(v>totalEps())v=totalEps();return v;}
function genLines(){var trope=$('inTrope').value;var bank=CLIFF[trope];if(!bank||!bank.length){toast('No lines in this trope bank yet.');return;}state.curEp=epNum();var key='lines|'+trope;if(!state.seen[key])state.seen[key]={};var pool=[];var i;for(i=0;i<bank.length;i++)pool.push({t:bank[i].t,ty:bank[i].ty,sk:'c'+i});for(i=0;i<WILD.length;i++)pool.push({t:WILD[i].t,ty:WILD[i].ty,sk:'w'+i});var byTy={};for(i=0;i<pool.length;i++){var tt=pool[i].ty;if(!byTy[tt])byTy[tt]=[];if(!state.seen[key][pool[i].sk])byTy[tt].push(pool[i]);}var tys=shuffle(Object.keys(byTy));var take=[];var guard=0;while(take.length<4&&guard<60){guard++;for(var j=0;j<tys.length&&take.length<4;j++){var pp=byTy[tys[j]];if(pp&&pp.length){take.push(pp.pop());}}}if(take.length<4){state.seen[key]={};take=shuffle(pool.slice()).slice(0,4);}for(i=0;i<take.length;i++)state.seen[key][take[i].sk]=true;if(Math.random()<0.5){take[3]={t:pickR(SYNTH),ty:pickR(['reveal','threat']),sk:'s'+Math.floor(Math.random()*9999)};}state.lines=take.map(function(it){var txt=fillC(it.t);if(Math.random()<0.4)txt=pickR(PREPENDS)+' '+txt;if(Math.random()<0.5)txt+=' '+pickR(STINGERS);return {ty:it.ty,t:txt};});renderLines();}
function renderLines(){var z=$('lineZone');if(!state.lines.length){z.innerHTML='';return;}var h='<div class="outttl bb">🎬 Cliffhanger Lines — Episode '+state.curEp+'</div>';for(var i=0;i<state.lines.length;i++){var L=state.lines[i];h+='<div class="linecard"><span class="ty ty-'+L.ty+'">'+TYNAMES[L.ty]+'</span><div class="tx">“'+esc(fillC(L.t))+'”</div><button class="btn" data-cp="'+i+'">📋 Copy</button></div>';}h+='<div class="btnrow"><button class="btn ghost" id="btnMoreLines">🔄 Fresh Lines</button><button class="btn ghost" id="btnCopyLines">📋 Copy All 4 Lines</button><button class="btn ghost" id="btnSaveEp">💾 Save Episode '+state.curEp+'</button></div>';z.innerHTML=h;var btns=z.querySelectorAll('button');for(var j=0;j<btns.length;j++){(function(b){if(b.getAttribute('data-cp')!==null&&b.getAttribute('data-cp')!=='')b.addEventListener('click',function(){copyText(fillC(state.lines[parseInt(b.getAttribute('data-cp'),10)].t),'📋 Line copied!');});else if(b.id==='btnMoreLines')b.addEventListener('click',genLines);else if(b.id==='btnCopyLines')b.addEventListener('click',function(){copyText(state.lines.map(function(x){return ' ['+TYNAMES[x.ty]+'] '+x.t;}).join('\n'),'📋 All lines copied!');});else if(b.id==='btnSaveEp')b.addEventListener('click',saveEp);})(btns[j]);}}
function prefOf(){var sel=document.querySelector('#prefCards .cardbtn.on');return sel?sel.getAttribute('data-k'):'std';}
function prefRatio(k){for(var i=0;i<PREFS.length;i++)if(PREFS[i].k===k)return PREFS[i].r;return 0.37;}
function calcMath(N,ratio){var free=Math.round(N*ratio);if(free<3)free=3;if(free>N-3)free=N-3;var pay=free+1;var rem=N-free;var r1=free+Math.round(rem*0.5);var r2=free+Math.round(rem*0.8);if(r1<=free)r1=free+1;if(r2<=r1)r2=r1+1;if(r2>=N)r2=N-1;if(r2<=r1)r2=-1;return {N:N,free:free,pay:pay,r1:r1,r2:r2};}
function calcPaywall(){var N=totalEps();var pk=prefOf();var m=calcMath(N,prefRatio(pk));m.pref=pk;state.pay=m;renderMap();}
function paySummary(p){var pname=(p.pref==='cons'?'Conservative':(p.pref==='aggr'?'Aggressive Hook':'Standard'));var s='With '+p.N+' episodes and a '+pname+' preference, episodes 1–'+p.free+' are free. Episode '+p.pay+' is your paywall point — make its cliffhanger a Reveal or Threat type for maximum conversion.';if(p.r2>0)s+=' Consider secondary hooks around episode '+p.r1+' and episode '+p.r2+' to reduce mid-season drop-off.';else s+=' Consider a secondary hook around episode '+p.r1+' to reduce mid-season drop-off.';return s;}
function renderMap(){var z=$('mapZone');var p=state.pay;if(!p){z.innerHTML='';return;}var savedEps=savedEpNums();var h='<div class="outttl bb gold">🔒 Paywall Placement Map</div><div class="legend"><span>🟦 Free (hook phase)</span><span>🔒 Paywall episode</span><span>🚩 Soft re-hook</span><span>⬜ Paid zone</span><span>✓ Has cliffhanger saved</span></div><div class="tl">';for(var e=1;e<=p.N;e++){var cls='paid',mark=e;if(e<=p.free)cls='free';if(e===p.pay){cls='pay';mark='🔒';}else if(e===p.r1||e===p.r2){cls='rehook';mark='🚩'+e;}if(savedEps.indexOf(e)>=0)cls+=' done';h+='<div class="epblk '+cls+'" data-ep="'+e+'" title="Episode '+e+'">'+mark+'</div>';}h+='</div><div class="summary">'+esc(paySummary(p))+'</div>';var abrows=[['Conservative','cons'],['Standard','std'],['Aggressive','aggr']];var ab='<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px"><b style="color:var(--gold)">COMPARE ALL 3 STRATEGIES (N='+p.N+')</b><br>';for(var ab_i=0;ab_i<abrows.length;ab_i++){var mm=calcMath(p.N,prefRatio(abrows[ab_i][1]));ab+='• '+abrows[ab_i][0]+': free 1–'+mm.free+' → pay @'+mm.pay+' → re-hooks '+mm.r1+(mm.r2>0?' & '+mm.r2:'')+(abrows[ab_i][1]===p.pref?' <b>← selected</b>':'')+'<br>';}ab+='</div>';h+=ab;h+='<div class="btnrow"><button class="btn goldb" id="btnSaveMap">💾 Save Paywall Map</button></div>';z.innerHTML=h;var blocks=z.querySelectorAll('.epblk');for(var j=0;j<blocks.length;j++){(function(b){b.addEventListener('click',function(){$('inEp').value=b.getAttribute('data-ep');toast('Episode '+b.getAttribute('data-ep')+' loaded below — add a beat!');});})(blocks[j]);}$('btnSaveMap').addEventListener('click',savePay);}
function copyText(t,msg){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}document.body.removeChild(ta);toast(ok?(msg||'Copied!'):'Copy failed — select and copy manually.');}
function lib(){var raw=null;try{raw=localStorage.getItem('mdc_seasons');}catch(e){raw=null;}if(!raw)return {};try{return JSON.parse(raw)||{};}catch(e){return {};};}
function libSave(o){try{localStorage.setItem('mdc_seasons',JSON.stringify(o));}catch(e){toast('Storage unavailable.');}}
function seasonKey(){return $('inTitle').value.trim()||'Untitled Season';}
function savedEpNums(){var o=lib()[seasonKey()];if(!o)return [];return Object.keys(o.eps||{}).map(function(x){return parseInt(x,10);});}
function saveEp(){if(!state.lines.length)return;var o=lib();var k=seasonKey();if(!o[k])o[k]={trope:$('inTrope').value,total:totalEps(),pref:prefOf(),pay:null,eps:{}};o[k].eps[String(state.curEp)]={beat:$('inBeat').value.trim(),lines:state.lines.map(function(L){return {ty:L.ty,t:fillC(L.t)};})};libSave(o);renderLib();if(state.pay)renderMap();toast('💾 Episode '+state.curEp+' saved!');}
function savePay(){if(!state.pay)return;var o=lib();var k=seasonKey();if(!o[k])o[k]={trope:$('inTrope').value,total:totalEps(),pref:prefOf(),pay:null,eps:{}};o[k].pay=state.pay;o[k].pref=prefOf();o[k].total=totalEps();libSave(o);renderLib();toast('🔒 Paywall map saved!');}
function planText(it){var out='SEASON PLAN: '+it.title+' ('+tropeLabel(it.trope)+', '+it.total+' episodes)\n';if(it.pay){out+='PAYWALL: free 1-'+it.pay.free+', paywall episode '+it.pay.pay+', re-hooks '+(it.r2>0?it.pay.r1+' & '+it.pay.r2:it.pay.r1)+'\n';}var eps=Object.keys(it.eps||{}).sort(function(a,b){return parseInt(a,10)-parseInt(b,10);});out+='EPISODES WITH CLIFFHANGERS: '+eps.length+'/'+it.total+'\n\n';for(var i=0;i<eps.length;i++){var e=it.eps[eps[i]];out+='EP '+eps[i]+' — '+e.beat+'\n';for(var j=0;j<e.lines.length;j++){out+='  ['+TYNAMES[e.lines[j].ty]+'] '+e.lines[j].t+'\n';}out+='\n';}return out;}
function renderLib(){var z=$('libZone');var o=lib();var keys=Object.keys(o);var k=seasonKey();var cur=o[k];var n=cur?Object.keys(cur.eps||{}).length:0;var tot=cur?cur.total:totalEps();$('progSub').textContent=n+' of '+tot+' episodes have cliffhangers generated';$('progBar').style.width=(tot?Math.round(n/tot*100):0)+'%';$('libBtns').style.display=keys.length?'flex':'none';if(!keys.length){z.innerHTML='<div class="empty">No seasons saved yet. Generate lines, save episodes, and watch the progress bar fill.</div>';return;}z.innerHTML='';for(var i=0;i<keys.length;i++){(function(title,it){var d=document.createElement('div');d.className='libitem';var b=document.createElement('b');b.textContent=title;var tg=document.createElement('div');tg.className='tags';tg.textContent=tropeLabel(it.trope)+' · '+it.total+' eps · '+Object.keys(it.eps||{}).length+' cliffhangered'+(it.pay?' · 🔒 pay @'+it.pay.pay:'');var row=document.createElement('div');row.className='row';var cp=document.createElement('button');cp.className='mini';cp.textContent='📋 Copy Full Plan';cp.addEventListener('click',function(){var full=it;full.title=title;copyText(planText(full),'📋 Plan copied!');});var del=document.createElement('button');del.className='mini danger';del.textContent='✕ Remove';del.addEventListener('click',function(){var x=lib();delete x[title];libSave(x);renderLib();if(state.pay)renderMap();});row.appendChild(cp);row.appendChild(del);d.appendChild(b);d.appendChild(tg);d.appendChild(row);z.appendChild(d);})(keys[i],o[keys[i]]);}}
function copyLibrary(){var o=lib();var keys=Object.keys(o);if(!keys.length)return;var out='CLIFFHANGER + PAYWALL LIBRARY ('+keys.length+' seasons)\n\n';for(var i=0;i<keys.length;i++){var it=o[keys[i]];it.title=keys[i];out+=planText(it)+'\n===\n\n';}copyText(out,'📋 Full library copied!');}
function init(){var tr=$('inTrope');for(var i=0;i<TROPES.length;i++){var o=document.createElement('option');o.value=TROPES[i][0];o.textContent=TROPES[i][1];tr.appendChild(o);}var pc=$('prefCards');for(i=0;i<PREFS.length;i++){(function(it){var b=document.createElement('button');b.className='cardbtn gold'+(it.k==='std'?' on':'');b.setAttribute('data-k',it.k);var bh=document.createElement('b');bh.textContent=it.t;var sm=document.createElement('small');sm.textContent=it.d;b.appendChild(bh);b.appendChild(sm);b.addEventListener('click',function(){var all=pc.querySelectorAll('.cardbtn');for(var j=0;j<all.length;j++)all[j].className='cardbtn gold';b.className='cardbtn gold on';});pc.appendChild(b);})(PREFS[i]);}renderLines();renderMap();renderLib();$('btnGen').addEventListener('click',genLines);$('btnCalc').addEventListener('click',calcPaywall);$('btnCopyLib').addEventListener('click',copyLibrary);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
