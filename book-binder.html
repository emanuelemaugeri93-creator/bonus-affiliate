<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }
}
@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }
  .k-body[data-pane="preview"] .k-side { display: none; }
  .k-side { border-right: 0; }
  .k-top { padding: 8px 10px; gap: 6px; }
  .k-pname, .k-hide-m { display: none; }
  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }
  .k-mnav { display: grid; grid-template-columns: 1fr 1fr; background: var(--k-panel); border-top: 1px solid var(--k-line); }
  .k-mnav button {
    border: 0; background: none; padding: 11px 0 calc(11px + env(safe-area-inset-bottom)); font-weight: 800; font-size: 13px;
    color: var(--k-muted); display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px;
  }
  .k-mnav button.is-on { color: var(--k-ink); box-shadow: inset 0 3px 0 var(--k-accent); }
  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }
  .k-dl dd { margin-bottom: 8px; }

/* ---------- Exact print: one sheet per page, nothing else ---------- */
@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }
  .k-offscreen { position: static; left: 0; }
  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }
}

<style>
/* Direction: Sidebar + Canvas, Editorial bindery look (parchment, oxblood leather, DM Serif Display + Work Sans),
   because the buyers assemble finished books and want the calm feel of a print shop, not a toy. */
:root {
  --k-bg: #f4eee3;
  --k-panel: #fffcf6;
  --k-panel-2: #f2eadc;
  --k-ink: #2b1d17;
  --k-muted: #7c6a5d;
  --k-line: #e5d9c6;
  --k-accent: #7d1f2c;
  --k-accent-ink: #fff8ef;
  --k-accent-soft: #f6e1df;
  --k-stage: #e8dfcf;
  --k-font: "Work Sans", system-ui, sans-serif;
  --k-display: "DM Serif Display", Georgia, serif;
}
.k-title { font-weight: 400; letter-spacing: .01em; font-size: 18px; }
.k-group-title { color: var(--k-accent); }

/* ---------- Side panel: import and page list ---------- */
.bb-drop {
  border: 2px dashed #cdb9a0; border-radius: 12px; padding: 16px 10px; text-align: center; cursor: pointer;
  font-size: 12.5px; color: var(--k-muted); background: var(--k-panel-2); margin-bottom: 10px; line-height: 1.45;
}
.bb-drop b { display: block; color: var(--k-ink); font-family: var(--k-display); font-weight: 400; font-size: 17px; margin-bottom: 3px; }
.bb-drop.is-over { border-color: var(--k-accent); background: var(--k-accent-soft); }
.bb-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.bb-list { display: grid; gap: 5px; }
.bb-item {
  display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 7px; align-items: center;
  padding: 5px 6px; border: 1px solid var(--k-line); border-radius: 9px; background: var(--k-panel);
}
.bb-item.is-sec { background: var(--k-panel-2); }
.bb-n { font-size: 10.5px; font-weight: 700; color: var(--k-muted); text-align: center; }
.bb-th { width: 34px; height: 42px; border-radius: 4px; background: #fff center / contain no-repeat; border: 1px solid var(--k-line); display: grid; place-items: center; color: var(--k-muted); }
.bb-th .k-ico { width: 16px; height: 16px; }
.bb-name { min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.bb-name b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb-name small { display: block; font-size: 10.5px; color: var(--k-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb-name small.is-low { color: #b25b00; font-weight: 700; }
.bb-btns { display: flex; }
.bb-btns .k-btn { padding: 4px; min-height: 0; border-color: transparent; background: none; }
.bb-btns .k-btn:hover { background: var(--k-panel-2); }
.bb-btns .k-ico { width: 15px; height: 15px; }
.bb-up svg, .bb-down svg { transform: rotate(90deg); }
.bb-sum { font-size: 12px; color: var(--k-muted); margin-top: 9px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bb-sum b { color: var(--k-ink); }

/* print check */
.pc-list { display: grid; gap: 8px; }
.pc-row { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; font-size: 12.5px; line-height: 1.4; }
.pc-row > i { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }
.pc-row > i .k-ico { width: 12px; height: 12px; stroke-width: 3; }
.pc-ok > i { background: #2f8a4f; }
.pc-warn > i { background: #d48600; }
.pc-info > i { background: #9a8878; }
.pc-row small { display: block; color: var(--k-muted); font-size: 11.5px; }
.pc-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; font-weight: 700; font-size: 13px; }
.pc-head.is-ok { background: #e3f3e8; color: #1f6b3a; }
.pc-head.is-warn { background: #fdf0d8; color: #8a5600; }
.sell { display: grid; gap: 10px; }
.sell textarea { min-height: 64px; font-size: 12.5px; }

/* arrange workspace */
.ar { padding: 4px 4px 40px; }
.ar-bar { position: sticky; top: -26px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; margin: -6px 0 14px; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px; box-shadow: var(--k-shadow); }
.ar-bar span { font-size: 12.5px; font-weight: 700; margin-right: auto; }
.ar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.ar-card { position: relative; background: var(--k-panel); border: 2px solid transparent; border-radius: 10px; padding: 6px; cursor: grab; user-select: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.ar-card.is-sel { border-color: var(--k-accent); background: var(--k-accent-soft); }
.ar-card.is-drag { opacity: .35; }
.ar-card.is-target { box-shadow: -5px 0 0 var(--k-accent); }
.ar-pic { aspect-ratio: 4 / 5; border-radius: 5px; background: #fff center / contain no-repeat; border: 1px solid var(--k-line); display: grid; place-items: center; text-align: center; padding: 8px; font-family: var(--k-display); font-size: 14px; color: var(--k-accent); }
.ar-card b { display: block; font-size: 11.5px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-card small { display: block; font-size: 10.5px; color: var(--k-muted); }
.ar-badge { position: absolute; top: 10px; left: 10px; background: var(--k-ink); color: #fff; font-size: 10px; font-weight: 700; border-radius: 5px; padding: 2px 6px; }
.ar-badge.is-ans { background: var(--k-accent); }

/* margin guides, preview only (never exported) */
.bb-guide { position: absolute; top: 0; bottom: 0; background: rgba(125, 31, 44, .08); pointer-events: none; }
.bb-guide span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font: 700 9px/1 "Work Sans", sans-serif; color: #7d1f2c; letter-spacing: .06em; text-transform: uppercase; }
.bb-safe { position: absolute; border: 1px dashed rgba(125, 31, 44, .45); pointer-events: none; }
.bb-dpi { position: absolute; right: 6px; top: 6px; font: 700 10px/1 "Work Sans", sans-serif; padding: 4px 7px; border-radius: 6px; background: #2f8a4f; color: #fff; pointer-events: none; }
.bb-dpi.is-low { background: #d48600; }

/* ---------- Sheets. Positions are CSS px: 96 px is one inch on paper. ---------- */
.bb { position: absolute; left: 0; top: 0; right: 0; bottom: 0; color: #161616; font-family: var(--bf); }
.bb .im { position: absolute; background-repeat: no-repeat; background-position: center; }
.bb .miss { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; background: #f3f0ea; color: #8a7a6a; font: 600 13px/1.5 "Work Sans", sans-serif; padding: 20px; box-sizing: border-box; border: 1px dashed #c9b9a6; }
.bb .pn { position: absolute; font: 12px/14px Helvetica, Arial, sans-serif; color: #3c3c3c; }
.bb .ab { position: absolute; box-sizing: border-box; }
.bb .tx { position: absolute; white-space: normal; overflow-wrap: break-word; }
.bb .hf { font-family: var(--hf); font-weight: var(--hw); }
.bb .cap { position: absolute; text-align: center; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb .rule { position: absolute; height: 0; border-top: 3px solid var(--ac); }
.bb .rule2 { position: absolute; height: 5px; border-top: 1px solid var(--ac); border-bottom: 1px solid var(--ac); }
.bb .frm { position: absolute; border: 2px solid var(--ac); }
.bb .frm2 { position: absolute; border: 1px solid var(--ac); }
.bb .dots { position: absolute; height: 0; border-top: 3px dotted var(--ac); }
.bb .band { position: absolute; background: var(--ac); }
.bb .toc { position: absolute; }
.bb .toc div { display: flex; align-items: flex-end; gap: 6px; height: 27px; font-size: 13px; }
.bb .toc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
.bb .toc em { flex: 1; min-width: 12px; border-bottom: 2px dotted #999; margin-bottom: 4px; }
.bb .toc b { font-weight: 700; min-width: 22px; text-align: right; }
.bb .toc .is-sub { padding-left: 18px; font-size: 12px; color: #444; }
.bb .ln { position: absolute; height: 0; border-top: 1px solid #222; }
</style>

    }

      Promise.all([api.loadLib("jspdf"), api.loadLib("html2canvas")]).then(function () { return document.fonts && document.fonts.ready; }).then(step).then(function (ok) {
        box.remove();
        if (ok) pdf.save(api.fileBase() + ".pdf");
        done(api, ok, "PDF saved: " + list.length + " pages, " + (Kit.sizes[api.p.pageSize] || {}).label);
      }).catch(function (e) { box.remove(); failed(api, e); });
    };
    if (miss) api.confirm("Some pictures are missing", miss + " pages have no picture in this browser. They will print as empty grey boxes. Export anyway?", "Export").then(function (y) { if (y) go(); });
    else go();
  }
  function exportZIP(api) {
    var list = api.shown().slice();
    if (!list.length) return api.toast("There are no pages to export in this view.", "err");
    if (busy) return;
    busy = true; window.toolBusy = true;
    var d = api.dims(), zip = null, stop = false, i = 0, box = document.body.appendChild(document.createElement("div"));
    box.className = "k-offscreen";
    function step() {
      if (stop || i >= list.length) return !stop;
      api.progress("Rendering page " + (i + 1) + " of " + list.length, i / list.length);
      addCancel(function () { stop = true; });
      var pg = list[i];
      return renderHTML(box, pg.html, d, 2.5).then(function (c) {
        return new Promise(function (ok) {
          c.toBlob(function (b) {
            zip.file(String(i + 1).padStart(3, "0") + "-" + pg.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".png", b);
            c.width = c.height = 0; ok();
          }, "image/png");
        });
      }).then(function () { i++; return new Promise(function (r) { setTimeout(r, 0); }).then(step); });
    }
    Promise.all([api.loadLib("jszip"), api.loadLib("html2canvas")]).then(function () { zip = new window.JSZip(); return document.fonts && document.fonts.ready; }).then(step).then(function (ok) {
      box.remove();
      if (!ok) return done(api, false);
      return zip.generateAsync({ type: "blob", compression: "STORE" }).then(function (b) { api.download(api.fileBase() + "-png.zip", b); done(api, true, "ZIP saved with every page as PNG"); });
    }).catch(function (e) { box.remove(); failed(api, e); });
  }
  function done(api, ok, msg) { busy = false; window.toolBusy = false; api.progress(null); if (ok) { api.confetti(); api.toast(msg); } else api.toast("Export cancelled"); }
  function failed(api, e) { console.error(e); busy = false; window.toolBusy = false; api.progress(null); api.toast("Export failed. Check your connection and try again.", "err"); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest('.k-menu [data-item="pdf"], .k-menu [data-item="zip"]');
    if (!b || !API) return;
    e.stopPropagation(); e.preventDefault();
    b.closest(".k-menu").classList.remove("is-open");
    if (b.dataset.item === "pdf") exportPDF(API); else exportZIP(API);
  }, true);
  window.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "e" && API && !document.querySelector(".k-veil")) { e.preventDefault(); e.stopPropagation(); exportPDF(API); }
  }, true);

  /* ==========================================================================
     Listing text and storage panel
     ========================================================================== */
  function listing(p, seed) {
    var R = Kit.rng(seed + "sell" + (p.sellN || 0)), seq = p.seq || [], n = LAST ? LAST.total : 0, sz = Kit.sizes[p.pageSize] || Kit.sizes.letter;
    var nImg = seq.filter(function (it) { return it.k === "img" && !it.ans; }).length, nAns = seq.filter(function (it) { return it.ans; }).length;
    var secs = seq.filter(function (it) { return it.k === "sec"; }).map(secTitle), t = p.bookTitle || "My Book", size = sz.w + " x " + sz.h + " in";
    var title = t + ": " + R.pick(["A Big Activity Book", "Activity Book for All Ages", "Fun Puzzle and Activity Pages", "The Complete Collection"]) + (nAns ? " with Answers" : "");
    var desc = R.pick(["Hours of screen-free fun in one book.", "A carefully put together collection, ready to enjoy.", "Grab a pencil and dive in."]) + "\n\n" +
      "INSIDE THIS BOOK\n- " + nImg + " pages" + (secs.length ? " in " + secs.length + " sections: " + secs.join(", ") : "") + "\n" + (nAns ? "- " + nAns + " solutions at the back\n" : "") +
      (p.parts.indexOf("toc") >= 0 ? "- A table of contents to find every page fast\n" : "") + (p.blankBacks ? "- Single-sided pages, so markers never bleed through\n" : "") +
      "- " + n + " pages in total, " + size + "\n\n" + R.pick(["Makes a great gift for birthdays and holidays.", "Perfect for travel, waiting rooms and quiet afternoons.", "Buy one for yourself and one to share."]);
    var kw = [secs[0] ? secs[0].toLowerCase() + " book" : "activity book", "activity book for adults", "activity book for kids", (nAns ? "puzzle book with answers" : "puzzle book"), "large print activity book", "gift activity book", "brain games book"];
    return { title: title.slice(0, 200), desc: desc, kw: kw.join("\n") };
  }
  function sellHTML(p, api) {
    var L = listing(p, api.S.seed);
    function box(key, label, val, h) { return '<div><div class="k-label"><span>' + label + '</span><button type="button" class="k-btn k-sm" data-cp="' + key + '">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="' + key + '"' + (h ? ' style="min-height:' + h + 'px"' : "") + ">" + E(val) + "</textarea></div>"; }
    return '<div class="sell">' + box("title", "Book title", L.title) + box("desc", "Description", L.desc, 220) + box("kw", "7 keyword phrases", L.kw, 130) + '<button type="button" class="k-btn" data-reword>' + Kit.icon("shuffle") + "New wording</button></div>";
  }
  function sellWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cp],[data-reword]");
      if (!b) return;
      if (b.dataset.cp) { api.copy(box.querySelector('[data-t="' + b.dataset.cp + '"]').value); api.toast("Copied"); }
      else api.set("sellN", (api.p.sellN || 0) + 1);
    });
  }
  function storageHTML() {
    var ids = Object.keys(REC), bytes = 0;
    ids.forEach(function (id) { bytes += REC[id].blob.size; });
    return '<div class="k-hint" style="margin:0 0 10px">' + (NO_DB ? "This browser blocks page storage (private window?). Imported pages stay only until you close the tab." : ids.length + " pictures kept in this browser, " + (bytes / 1048576).toFixed(1) + " MB.") + "</div>" +
      '<div class="bb-row2"><button type="button" class="k-btn" data-clean>' + Kit.icon("trash") + 'Free space</button><button type="button" class="k-btn" data-samples>' + Kit.icon("sparkles") + "Sample mazes</button></div>";
  }
  function storageWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.samples != null) {
        api.confirm("Load the sample book?", "This replaces the current page list with 8 sample mazes and their solutions. Your imported pictures stay in storage and Undo brings your list back.", "Load samples").then(function (y) {
          if (!y) return;
          var ready = SAMPLE.every(function (s) { return REC[s.id] && REC[s.id + "a"]; }) ? Promise.resolve() : makeSamples();
          ready.then(function () { api.set("seq", sampleSeq()); });
        });
      }
      if (b.dataset.clean != null) {
        /* keep every picture used by this book or by a saved project */
        var keep = {};
        (api.p.seq || []).forEach(function (it) { keep[it.id] = 1; });
        (api.store.get(api.key + ".projects", []) || []).forEach(function (pr) { ((pr.data && pr.data.params && pr.data.params.seq) || []).forEach(function (it) { keep[it.id] = 1; }); });
        var drop = Object.keys(REC).filter(function (id) { return !keep[id]; });
        if (!drop.length) return api.toast("Nothing to free: every stored picture is in use.");
        api.confirm("Free storage space?", drop.length + " stored pictures are not used by this book or any saved project. They will be deleted from this browser. Undo cannot bring them back.", "Delete them", true).then(function (y) {
          if (!y) return;
          idbDel(drop).then(function () {
            drop.forEach(function (id) { URL.revokeObjectURL(REC[id].url); delete REC[id]; });
            api.rebuild();
            api.toast(drop.length + " pictures deleted");
          });
        });
      }
    });
  }

  /* ==========================================================================
     The app
     ========================================================================== */
  var HOWTO = "Work through the pages in any order you like.\nUse a pencil, so you can erase and try again.\nStuck? The answers are at the back of the book.\nHave fun, and take your time.";
  Kit.app({
    slug: "book-binder",
    title: "Book Binder",
    tagline: "Join pages from any tool into one print-ready book",
    projectName: "My Activity Book",
    logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5zM4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3M8 7h7M8 11h5"/><path d="M4 8h2M4 12h2M4 16h2"/></svg>',
    mainAction: { label: "Try another look", icon: "sparkles" },
    init: function (api) { API = api; },
    onShuffle: function (p, api) { p.style = Kit.rng(api.S.seed).pick(Object.keys(STYLES).filter(function (k) { return k !== p.style; })); },
    usedAssets: function () { return []; },
    mockColors: function (p) { return ["#f6efe3", p.accent === "#111111" ? "#7d1f2c" : p.accent]; },
    views: [
      { id: "page", label: "Pages", filter: function (pg) { return pg.kind === "page"; } },
      { id: "answer", label: "Answers", filter: function (pg) { return pg.kind === "answer"; } },
      { id: "front", label: "Book parts", filter: function (pg) { return pg.kind === "front"; } }
    ],
    workspace: { label: "Arrange", icon: "grid", render: arrange },
    stats: function (ctx, pgs) {
      if (!LOADED) return "Opening saved pages...";
      var C = checks(ctx.p);
      return pgs.length + " pages  ·  " + (C.warn ? C.warn + (C.warn === 1 ? " print check" : " print checks") + " to fix" : "print check passed");
    },
    empty: "<h3>No pages yet</h3><p>Open the Pages tab and drop your PNG, JPG, ZIP or PDF files, or load the sample mazes.</p>",
    pages: pages,
    onRender: function (wrap, api) {
      if (!api.p.guides || !LAST) return;
      var slot = wrap.querySelector(".k-slot"), sheet = wrap.querySelector(".k-sheet"), pg = slot && api.shown()[+slot.dataset.n];
      if (!sheet || !pg || !pg.box) return;
      var B = pg.box, G = LAST.G;
      if (G.bound) {
        var g = document.createElement("div");
        g.className = "bb-guide";
        g.style.cssText = (B.right ? "left:0" : "right:0") + ";width:" + G.gut + "px";
        g.innerHTML = "<span>Inside margin " + fmtIn(G.gutIn) + "</span>";
        sheet.appendChild(g);
      }
      var s = document.createElement("div");
      s.className = "bb-safe";
      s.style.cssText = pos(B.x, B.y, B.w, B.h);
      sheet.appendChild(s);
      if (pg.img) {
        var b = document.createElement("div"), dpi = pg.img.rect.dpi;
        b.className = "bb-dpi" + (dpi < 200 ? " is-low" : "");
        b.textContent = dpi + " DPI";
        b.style.fontSize = Math.max(10, 10 / (sheet.getBoundingClientRect().width / sheet.offsetWidth)) + "px";
        sheet.appendChild(b);
      }
    },
    tabs: [
      { id: "pages", label: "Pages", groups: [
        { title: "Pages in this book", fields: [
          { id: "seq", type: "html", def: sampleSeq(), render: itemsHTML, wire: itemsWire }
        ] },
        { title: "Stored pictures", fields: [
          { key: "store", type: "html", render: storageHTML, wire: storageWire, hint: "Pictures are kept in this browser between visits. They are not inside project files: keep your originals." }
        ] }
      ] },
      { id: "book", label: "Book", groups: [
        { title: "Title page", fields: [
          { id: "bookTitle", type: "text", label: "Book title", def: "The Big Maze Book", max: 70 },
          { id: "subtitle", type: "text", label: "Subtitle", def: "Easy and hard mazes with every solution", max: 110 },
          { id: "author", type: "text", label: "Author or brand", def: "", placeholder: "Your name", max: 50 }
        ] },
        { title: "Book parts", fields: [
          { id: "parts", type: "chips", def: ["title", "copyright", "belongs", "toc"], options: [{ v: "title", l: "Title page" }, { v: "copyright", l: "Copyright" }, { v: "belongs", l: "This book belongs to" }, { v: "toc", l: "Contents" }, { v: "howto", l: "How to use" }] },
          { id: "howto", type: "textarea", label: "How to use text", def: HOWTO, rows: 4, show: function (p) { return p.parts.indexOf("howto") >= 0; } },
          { id: "tocMode", type: "seg", label: "Contents lists", def: "sections", options: [{ v: "sections", l: "Sections" }, { v: "pages", l: "Every page" }], show: function (p) { return p.parts.indexOf("toc") >= 0; } },
          { id: "partWord", type: "text", label: "Word above section titles", def: "Part", max: 20, placeholder: "Part, Chapter, Level..." }
        ] },
        { title: "Answers", fields: [
          { id: "ansPer", type: "seg", label: "Answers per page", def: "4", options: [{ v: "1", l: "1" }, { v: "2", l: "2" }, { v: "4", l: "4" }, { v: "6", l: "6" }] },
          { id: "ansDivider", type: "toggle", label: "Divider page before the answers", def: true },
          { key: "ansHint", type: "html", render: function () { return '<div class="k-hint">Files named with "answer", "solution" or "key" go to the Answers section on import. Use the tick button on a page to move it.</div>'; } }
        ] },
        { title: "Page flow", fields: [
          { id: "blankBacks", type: "toggle", label: "Blank back after every page", def: true, hint: "Single-sided pages: markers never bleed through and pages can be cut out." },
          { id: "rightStart", type: "toggle", label: "Start sections on a right-hand page", def: true },
          { id: "padEven", type: "toggle", label: "Make the page count even", def: true }
        ] }
      ] },
      { id: "design", label: "Design", groups: [
        { title: "Look of the pages the binder adds", fields: [
          { id: "style", type: "cards", def: "classic", options: Object.keys(STYLES).map(function (k) { return { v: k, l: STYLES[k].l, d: STYLES[k].d }; }) },
          { id: "accent", type: "swatches", label: "Accent colour", def: "#111111", options: ACCENTS.map(function (a) { return { v: a[0], l: a[1], c: a[0] }; }) }
        ] },
        { title: "Your pages", fields: [
          { id: "fit", type: "cards", label: "How pictures fit the page", def: "contain", options: [
            { v: "contain", l: "Scale to fit", d: "Whole picture inside the margins" },
            { v: "cover", l: "Fill the margins", d: "Crops edges to fill the area" },
            { v: "bleed", l: "Edge to edge", d: "Covers the whole page, needs bleed" }] },
          { id: "numbers", type: "seg", label: "Page numbers", def: "outer", options: [{ v: "off", l: "Off" }, { v: "center", l: "Center" }, { v: "outer", l: "Outside" }], hint: "Numbers sit under the picture. Book parts and dividers are counted but not numbered." },
          { type: "buttons", key: "reset", buttons: [{ label: "Reset text edits", icon: "reset", run: function (api) { api.resetEdits(); } }] }
        ] }
      ] },
      { id: "print", label: "Print check", groups: [
        { title: "Paper", fields: [
          { id: "pageSize", type: "select", label: "Trim size", def: "letter", options: Kit.sizeOptions() },
          { id: "bleed", type: "toggle", label: "Add bleed (0.125 in)", def: false }
        ] },
        { title: "Margins", fields: [
          { id: "binding", type: "seg", def: "bound", options: [{ v: "bound", l: "Bound book" }, { v: "loose", l: "Loose pages" }] },
          { id: "margin", type: "select", label: "Outside, top and bottom", def: "0.375", options: [{ v: "0.25", l: "0.25 in" }, { v: "0.375", l: "0.375 in" }, { v: "0.5", l: "0.5 in" }, { v: "0.75", l: "0.75 in" }] },
          { id: "gutter", type: "select", label: "Inside margin (gutter)", def: "auto", show: function (p) { return p.binding !== "loose"; },
            options: [{ v: "auto", l: "Auto: minimum for the page count" }, { v: "0.375", l: "0.375 in" }, { v: "0.5", l: "0.5 in" }, { v: "0.625", l: "0.625 in" }, { v: "0.75", l: "0.75 in" }, { v: "0.875", l: "0.875 in" }, { v: "1", l: "1 in" }] },
          { id: "guides", type: "toggle", label: "Show margins and DPI in the preview", def: true }
        ] },
        { title: "Print check", fields: [
          { key: "check", type: "html", render: checkHTML }
        ] }
      ] },
      { id: "sell", label: "Sell it", groups: [
        { title: "Listing text", fields: [
          { id: "sellN", type: "html", def: 0, render: sellHTML, wire: sellWire, hint: "Written from your sections and page counts. Edit it to fit your book." }
        ] }
      ] }
    ],
    exports: [
      { label: "Contents and page map (CSV)", hint: "Every page with its number and source", icon: "file", run: function (api) {
        var rows = ["page,kind,name,width px,height px,dpi"];
        api.pages.forEach(function (pg, i) {
          var rec = pg.img && REC[pg.img.id];
          rows.push([i + 1, pg.sp.t, '"' + String(pg.title).replace(/"/g, '""') + '"', rec ? rec.w : "", rec ? rec.h : "", pg.img ? pg.img.rect.dpi : ""].join(","));
        });
        api.download(api.fileBase() + "-page-map.csv", rows.join("\n"), "text/csv");
        api.toast("Page map saved");
      } },
      { label: "Print check report (TXT)", hint: "The checklist and cover size, to keep", icon: "file", run: function (api) {
        var C = checks(api.p);
        api.download(api.fileBase() + "-print-check.txt", [api.S.name, ""].concat(C.rows.map(function (r) { return (r.k === "ok" ? "[ok]   " : r.k === "warn" ? "[fix]  " : "[info] ") + r.t + (r.s ? "\n       " + r.s : ""); })).join("\n"), "text/plain");
        api.toast("Print check saved");
      } }
    ],
    guide: {
      intro: "Book Binder joins the pages you made in other tools into one book: it adds a title page, contents, section dividers, page numbers and an answers section, checks everything for print and saves one merged PDF.",
      steps: [
        "Open Pages and drop your files: PNG or JPG pictures, a ZIP of pictures, or PDF files. The sample maze book shows how it works.",
        "Put the pages in order with the arrows, or press Arrange above the page to drag them. Add sections and move solutions to Answers.",
        "Open Book for the title, book parts and answer layout, and Design for the look of the added pages.",
        "Open Print check, fix anything amber, then Export the PDF."
      ],
      controls: [
        ["Import", "Pictures keep their full resolution. ZIP files are read in name order. Each PDF page is drawn at 300 DPI."],
        ["Answers", "Pages named with answer, solution or key go to the back automatically. Choose 1, 2, 4 or 6 answers per page."],
        ["Arrange", "Drag cards to reorder. Select several cards to move, send to Answers or remove them together."],
        ["Scale to fit", "The whole picture fits inside the margins. Fill crops the edges; Edge to edge covers the page and needs bleed."],
        ["Blank backs", "Adds an empty page after each of your pages, common for colouring books."],
        ["Inside margin", "Auto follows the page count: 0.375 in up to 150 pages, then 0.5, 0.625, 0.75 and 0.875 in."],
        ["DPI badge", "Shows the print resolution of the picture at its placed size. Under 200 DPI turns amber."]
      ],
      exports: [
        ["PDF", "Your pictures go into the PDF at full resolution, not re-drawn. Title, contents and dividers are drawn at 300 DPI."],
        ["Page map (CSV)", "Every page with its number, name, pixel size and DPI."],
        ["Print check report", "The checklist as a text file, with spine width and full cover size."]
      ],
      tips: [
        "What is saved between visits: the page order, titles and settings autosave, and the imported pictures are kept in this browser's own storage (IndexedDB). They stay on this computer and this browser only.",
        "What is not saved: project files and My projects hold the page list but not the pictures. On another device, import the pictures again. Clearing site data or a private window removes them.",
        "Use Free space in the Pages tab to delete stored pictures that no book uses any more.",
        "Click the title, a section title or Contents on the page to change the wording."
      ],
      trouble: [
        ["A page says the picture is missing", "The browser storage was cleared or the project came from another device. Import that file again, or remove the page."],
        ["Import is slow", "Big PDFs are drawn page by page at 300 DPI. A 100-page PDF takes a minute or two."],
        ["A page is amber for DPI", "The picture is too small for the trim size. Export it again bigger from the tool that made it, or choose a smaller trim size."]
      ]
    }
  });

  /* load stored pictures, then make the samples if this browser has never had them */
  window.toolBusy = true;
  idbAll().catch(function () { NO_DB = true; return []; }).then(function (all) {
    (all || []).forEach(function (r) { remember(r); });
    var need = (API.p.seq || []).some(function (it) { return /^sample-/.test(it.id) && !REC[it.id]; });
    return need ? makeSamples() : null;
  }).then(function () {
    LOADED = true;
    window.toolBusy = false;
    API.rebuild();
  }).catch(function (e) {
    console.error(e);
    LOADED = true;
    window.toolBusy = false;
    API.rebuild();
  });
  document.addEventListener("paste", function (e) {
    if (e.target.closest && e.target.closest("[data-edit],input,textarea")) return;
    var f = e.clipboardData && e.clipboardData.files;
    if (f && f.length) { e.preventDefault(); importFiles(f); }
  });
})();
