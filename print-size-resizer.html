<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Size Resizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }
}
@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }
  .k-body[data-pane="preview"] .k-side { display: none; }
  .k-side { border-right: 0; }
  .k-top { padding: 8px 10px; gap: 6px; }
  .k-pname, .k-hide-m { display: none; }
  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }
  .k-mnav { display: grid; grid-template-columns: 1fr 1fr; background: var(--k-panel); border-top: 1px solid var(--k-line); }
  .k-mnav button {
    border: 0; background: none; padding: 11px 0 calc(11px + env(safe-area-inset-bottom)); font-weight: 800; font-size: 13px;
    color: var(--k-muted); display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px;
  }
  .k-mnav button.is-on { color: var(--k-ink); box-shadow: inset 0 3px 0 var(--k-accent); }
  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }
  .k-dl dd { margin-bottom: 8px; }
  .k-pager span { min-width: 0; flex: 1; }
}

/* ---------- Exact print: one sheet per page, nothing else ---------- */
@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }
  .k-offscreen { position: static; left: 0; }
  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }
}
</style>
<style>
/* Direction: Sidebar + Canvas, Dark Luxury gallery look (charcoal walls, warm gold, serif titles),
   because wall-art sellers think like a framing gallery and need their artwork to pop on a dark wall. */
:root {
  --k-bg: #131417;
  --k-panel: #1b1c20;
  --k-panel-2: #24252b;
  --k-ink: #f1ebdf;
  --k-muted: #a39b8c;
  --k-line: #33343b;
  --k-accent: #c9a24c;
  --k-accent-ink: #17130a;
  --k-accent-soft: #3a3122;
  --k-danger: #ef6b5e;
  --k-stage: #0e0f12;
  --k-font: "Lato", system-ui, sans-serif;
  --k-display: "Cormorant Garamond", Georgia, serif;
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
}
.k-title { font-size: 19px; letter-spacing: .01em; }
.k-title, .pz-ch b, .pz-t, .pz-lab b, .pz-k, .pz-gt, .pz-steps li b { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
.k-select option { background: #1b1c20; color: #f1ebdf; }
.k-chip.is-on { background: var(--k-accent); color: var(--k-accent-ink); border-color: var(--k-accent); }

/* ---------- Side panel ---------- */
.pz-drop {
  border: 1.5px dashed #57534a; border-radius: 12px; padding: 16px 10px; text-align: center;
  font-size: 12.5px; color: var(--k-muted); cursor: pointer; background: var(--k-panel-2); margin-bottom: 12px;
}
.pz-drop b { display: block; color: var(--k-ink); font-size: 13.5px; margin-bottom: 2px; }
.pz-drop.is-over, .pz-drop:hover { border-color: var(--k-accent); background: var(--k-accent-soft); }
.pz-list { display: grid; gap: 6px; margin-bottom: 14px; }
.pz-item {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 9px; align-items: center;
  padding: 6px; border: 1px solid var(--k-line); border-radius: 10px; background: var(--k-panel-2);
}
.pz-item.is-cur { border-color: var(--k-accent); }
.pz-item img { width: 44px; height: 44px; object-fit: contain; display: block; background: #0e0f12; border-radius: 6px; }
.pz-item > div { min-width: 0; cursor: pointer; }
.pz-item b { font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-item small { color: var(--k-muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pz-item small.is-warn { color: #e0a43c; }
.pz-item-btns { display: flex; gap: 2px; }
.pz-item-btns .k-btn { padding: 5px; min-height: 0; }
.pz-gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.pz-th { border: 1.5px solid transparent; border-radius: 9px; padding: 3px; background: var(--k-panel-2); cursor: pointer; position: relative; display: grid; place-items: center; height: 62px; }
.pz-th img { max-width: 100%; max-height: 54px; display: block; border-radius: 3px; }
.pz-th:hover { border-color: var(--k-accent); }

      var d = srcDims(id), a = API.assets.get(id) || {}, info, warn = false;
      if (isSample(id)) info = "Built-in, vector";
      else if (!d) info = MISSING[id] ? "Could not load" : "Loading...";
      else { info = d.w + " x " + d.h + " px"; if (!d.orig) { info = "Preview copy, add the file again"; warn = true; } else if (Math.max(d.w, d.h) < 3600) { info += ", small for big prints"; warn = true; } }
      return '<div class="pz-item ' + (i === CUR ? "is-cur" : "") + '"><img src="' + thumb(id) + '" alt=""><div data-pick="' + i + '"><b>' + Kit.esc(artName(id)) + '</b><small class="' + (warn ? "is-warn" : "") + '">' + Kit.esc(info) + "</small></div>" +
        '<div class="pz-item-btns"><button class="k-btn k-ghost" data-up="' + i + '" title="Move up"' + (i ? "" : " disabled") + ">" + Kit.icon("left").replace("<svg", '<svg style="transform:rotate(90deg)"') + '</button><button class="k-btn k-ghost k-danger" data-rm="' + i + '" title="Remove">' + Kit.icon("trash") + "</button></div></div>";
      void a;
    }).join("");
    return '<div class="pz-drop" id="pzDrop"><b>Add your artwork</b>Click, drop or paste PNG or JPG files. Several at once makes a batch.</div>' +
      '<input type="file" id="mainInput" accept="image/png,image/jpeg,image/webp" multiple hidden>' +
      '<div class="pz-list">' + (list || '<div class="k-hint">No artwork yet. Add your own above or click a built-in one below.</div>') + "</div>" +
      '<div class="k-label"><span>Built-in artworks</span><small>click to add</small></div><div class="pz-gal">' +
      SKEYS.map(function (k) { return '<button type="button" class="pz-th ' + ((p.arts || []).indexOf("s:" + k) >= 0 ? "is-in" : "") + '" data-add="s:' + k + '" title="' + SAMPLES[k].name + '"><img src="' + thumb("s:" + k) + '" alt="' + SAMPLES[k].name + '"></button>'; }).join("") + "</div>";
  }
  function artsWire(box, api) {
    var inp = box.querySelector("#mainInput"), drop = box.querySelector("#pzDrop");
    drop.addEventListener("click", function () { inp.click(); });
    inp.addEventListener("change", function () { addFiles(inp.files); inp.value = ""; });
    ["dragover", "dragenter"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("is-over"); }); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("is-over"); });
    drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("is-over"); addFiles(e.dataTransfer.files); });
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-add],[data-rm],[data-up],[data-pick]");
      if (!b) return;
      var arts = api.p.arts.slice();
      if (b.dataset.pick) { CUR = +b.dataset.pick; api.rebuild(); api.openWork(true); return; }
      if (b.dataset.add) {
        var at = arts.indexOf(b.dataset.add);
        if (at >= 0) { CUR = at; api.rebuild(); api.openWork(true); return; }
        if (arts.length >= 24) return api.toast("A batch can hold up to 24 artworks.", "err");
        arts.push(b.dataset.add); CUR = arts.length - 1;
      } else if (b.dataset.rm) {
        var gone = arts.splice(+b.dataset.rm, 1)[0];
        if (!isSample(gone) && arts.indexOf(gone) < 0) IDB.del(gone);
        CUR = Math.min(CUR, arts.length - 1);
      } else { var i = +b.dataset.up, t = arts[i - 1]; arts[i - 1] = arts[i]; arts[i] = t; }
      api.set("arts", arts);
    });
  }
  function sizesHTML(p) {
    var ids = p.arts || [], id = ids[clamp(CUR, 0, Math.max(0, ids.length - 1))], ready = id && ensure(id), o = id ? orientOf(p, id) : "p";
    var jobs = jobsFor(p, id ? [id] : []), maxPx = 0;
    jobs.forEach(function (j) { var wh = dimsIn(j.s, j.o); maxPx = Math.max(maxPx, wh[0] * wh[1] * p.dpi * p.dpi); });
    var h = '<div class="pz-sum"><b>' + jobs.length + " files per artwork</b>" + (ids.length > 1 ? ", " + jobsFor(p, ids).length + " in the whole batch" : "") + (maxPx ? ". Largest file " + Math.round(maxPx / 1e6) + " megapixels." : ".") +
      (id ? "<br>Dots show sharpness for " + Kit.esc(artName(id)) + ": green 300 DPI or more, amber under 300, red under 150." : "") + "</div>";
    selRatios(p).forEach(function (r) {
      if (r.custom) return;
      h += '<div class="pz-rg"><div class="pz-rg-h">' + Kit.esc(r.l) + "<small>" + r.sizes.filter(function (s) { return p.sizes.indexOf(s.id) >= 0; }).length + " of " + r.sizes.length + '</small></div><div class="k-chips">' +
        r.sizes.map(function (s) {
          var on = p.sizes.indexOf(s.id) >= 0, dpi = ready ? effDpi(p, id, r, s) : null, gcl = grade(dpi);
          return '<button type="button" class="k-chip pz-sz ' + (on ? "is-on " : "") + "is-" + gcl + '" data-sz="' + s.id + '" title="' + Kit.esc(dpiText(dpi)) + '">' + Kit.esc(sizeLabel(s, o).replace(/ in$/, "")) + "<i></i></button>";
        }).join("") + "</div></div>";
    });
    return h;
  }
  function sizesWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-sz]");
      if (!b) return;
      var arr = api.p.sizes.slice(), at = arr.indexOf(b.dataset.sz);
      if (at >= 0) arr.splice(at, 1); else arr.push(b.dataset.sz);
      arr.sort(function (a, c) { return ALL_SIZE_IDS.indexOf(a) - ALL_SIZE_IDS.indexOf(c); });
      api.set("sizes", arr);
    });
  }

  /* ----- Sell it: listing text for printable wall art ----- */
  function listing(p, seed) {
    var R = Kit.rng(seed + "sell" + p.sellN), ids = p.arts || [], first = ids[0] ? artName(ids[0]) : "Wall Art", n = ids.length;
    var rs = selRatios(p), ratios = rs.map(function (r) { return r.tag.replace("ISO", "A-series"); }).join(" ");
    var word = R.pick(["Printable Wall Art", "Digital Print", "Printable Poster", "Wall Art Download"]);
    var title = (n > 1 ? "Set of " + n + " " : "") + first + " " + word + " | " + R.pick(["Instant Download", "Digital Download", "Printable Art"]) + " | " + rs.length + " Ratios " + ratios + " | Up to " + biggest(p);
    var sizesTxt = rs.map(function (r) { var list = p.fileMode === "ratio" && !r.custom ? r.sizes : selSizes(p, r); return "- " + r.l + " ratio: " + list.map(function (s) { return s.iso ? s.iso : sizeLabel(s, "p").replace(/ in$/, ""); }).join(", ") + (list[0] && !list[0].iso ? " in" : ""); }).join("\n");
    var desc = R.pick(["Bring warmth to any wall in minutes: download, print and frame.", "A ready-to-print piece that makes any room feel finished.", "Instant wall art you can print at home or at any print shop."]) + "\n\n" +
      "WHAT YOU GET\n- " + (n > 1 ? n + " artworks" : "1 artwork") + " in " + rs.length + " print ratios" + (p.fileMode === "ratio" ? " (one high-resolution file per ratio)" : " (one file for every size)") + "\n- " + p.dpi + " DPI " + (p.format === "png" ? "PNG" : "JPG") + " files for sharp prints\n" +
      (p.guideZip ? "- A print size guide (PDF) that shows which file fits your frame\n" : "") + "\nSIZES INCLUDED\n" + sizesTxt + "\n\n" +
      "HOW IT WORKS\n1. Download the files after purchase.\n2. Print at home or send them to a print shop.\n3. Frame and enjoy.\n\nThis is a digital product. No physical item is shipped. Colors may vary slightly between screens and printers.";
    var tags = ["printable wall art", "digital download", "printable art", "wall art print", "instant download", "home decor print", "art print", "poster print", "gallery wall art", "printable poster", "wall decor", "large wall art", "modern wall art"];
    return { title: title.slice(0, 140), desc: desc, tags: tags.join(", ") };
  }
  function biggest(p) {
    var best = null;
    selRatios(p).forEach(function (r) { (p.fileMode === "ratio" && !r.custom ? r.sizes : selSizes(p, r)).forEach(function (s) { if (!best || s.w * s.h > best.w * best.h) best = s; }); });
    return best ? (best.iso ? best.iso : sizeLabel(best, "p")) : "24 x 36 in";
  }
  function sellHTML(p, api) {
    var L = listing(p, api.S.seed);
    return '<div class="pz-copy"><div><div class="k-label"><span>Listing title</span><button class="k-btn k-sm" data-cp="title">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="title">' + Kit.esc(L.title) + "</textarea></div>" +
      '<div><div class="k-label"><span>Description</span><button class="k-btn k-sm" data-cp="desc">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="desc" style="min-height:200px">' + Kit.esc(L.desc) + "</textarea></div>" +
      '<div><div class="k-label"><span>13 tags</span><button class="k-btn k-sm" data-cp="tags">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="tags">' + Kit.esc(L.tags) + "</textarea></div>" +
      '<button class="k-btn" data-reword>' + Kit.icon("shuffle") + "New wording</button></div>";
  }
  function sellWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cp],[data-reword]");
      if (!b) return;
      if (b.dataset.cp) { api.copy(box.querySelector('[data-t="' + b.dataset.cp + '"]').value); api.toast("Copied"); }
      else api.set("sellN", (api.p.sellN || 0) + 1);
    });
  }

  /* ==========================================================================
     The app
     ========================================================================== */

    slug: "print-size-resizer",

    mainAction: { label: "Auto focus", icon: "sparkles" },
    onShuffle: function (p, api) { autoFocusAll(api, p.arts || []); },

      return ids.length + (ids.length === 1 ? " artwork" : " artworks") + "  ·  " + jobsFor(p, ids).length + " print files" + (low ? "  ·  " + low + " under 300 DPI" : "  ·  all 300 DPI");
    },
    empty: "<h3>Add your artwork</h3><p>Open the Artwork tab and drop a picture, or click a built-in artwork.</p>",
    pages: pages,
    tabs: [

        { title: "Artworks in this batch", fields: [

          { id: "orient", type: "seg", label: "Print orientation", def: "auto", options: [{ v: "auto", l: "Match artwork" }, { v: "p", l: "Portrait" }, { v: "l", l: "Landscape" }] }

      { id: "sizes", label: "Sizes", groups: [

          { id: "custom", type: "text", label: "Custom sizes", def: "", max: 80, placeholder: "e.g. 13x19, 30x40 cm", hint: "Separate with commas. Inches by default, add cm or mm. Each one gets its own crop." }
        ] },
        { title: "Print sizes", fields: [{ id: "sizes", type: "html", def: ALL_SIZE_IDS.slice(), render: sizesHTML, wire: sizesWire }] },
        { title: "Files", fields: [
          { id: "fileMode", type: "cards", def: "size", options: [{ v: "size", l: "Every print size", d: "One file per size" }, { v: "ratio", l: "One per ratio", d: "Largest size, prints all" }] },
          { id: "dpi", type: "seg", label: "Resolution", def: 300, options: [{ v: 300, l: "300 DPI" }, { v: 200, l: "200 DPI" }, { v: 150, l: "150 DPI" }], hint: "300 DPI is the print standard. Lower makes smaller files." },
          { id: "format", type: "seg", label: "File type", def: "jpg", options: [{ v: "jpg", l: "JPG" }, { v: "png", l: "PNG" }] },
          { id: "quality", type: "range", label: "JPG quality", def: 92, min: 75, max: 100, unit: "%", show: function (p) { return p.format === "jpg"; } },
          { id: "naming", type: "select", label: "File names", def: "full", options: [{ v: "full", l: "artwork_2x3_24x36in.jpg" }, { v: "ratio", l: "2x3_24x36in.jpg" }, { v: "size", l: "24x36in.jpg" }] },
          { id: "ratioFolders", type: "toggle", label: "A folder for each ratio", def: false },
          { id: "guideZip", type: "toggle", label: "Put the print size guide in the ZIP", def: true }
        ] }
      ] },
      { id: "fit", label: "Fit", groups: [
        { title: "How the artwork fills each ratio", fields: [
          { id: "mode", type: "cards", def: "fill", options: [{ v: "fill", l: "Fill", d: "Crops the edges" }, { v: "fit", l: "Fit", d: "Whole art on a border" }, { v: "mirror", l: "Mirror edges", d: "Reflects the sides" }, { v: "blur", l: "Blurred edges", d: "Soft color extension" }], hint: "This is the default. Each ratio can use its own mode on the crop board." },
          { id: "fitBg", type: "swatches", label: "Border color (Fit)", def: "#ffffff", options: [{ v: "#ffffff", l: "White", c: "#ffffff" }, { v: "#f4ede0", l: "Cream", c: "#f4ede0" }, { v: "#e9e6e1", l: "Gray", c: "#e9e6e1" }, { v: "#1a1a1d", l: "Black", c: "#1a1a1d" }, { v: "edge", l: "From art", c: "linear-gradient(135deg,#e2683c,#4f6d8a)" }], show: function (p) { return p.mode === "fit"; } },
          { id: "margin", type: "range", label: "Border width (Fit)", def: 6, min: 0, max: 20, unit: "%", show: function (p) { return p.mode === "fit"; } },
          { id: "blurTone", type: "seg", label: "Blurred edges tone", def: "natural", options: [{ v: "natural", l: "Natural" }, { v: "light", l: "Lighter" }, { v: "dark", l: "Darker" }], show: function (p) { return p.mode === "blur"; } }
        ] },
        { title: "Crops", fields: [
          { id: "crops", type: "html", def: {}, render: function (p) {
            var n = 0; Object.keys(p.crops || {}).forEach(function (k) { n += Object.keys(p.crops[k]).length; });
            return '<div class="k-hint" style="margin:0 0 8px">' + (n ? n + " crops adjusted by hand." : "All crops are centered. Drag on the crop board to change them.") + '</div><div class="k-chips"><button class="k-btn k-sm" data-af>' + Kit.icon("sparkles") + 'Auto focus all</button><button class="k-btn k-sm" data-rc>' + Kit.icon("reset") + "Reset all crops</button></div>";
          }, wire: function (box, api) {
            box.querySelector("[data-af]").addEventListener("click", function () { var n = autoFocusAll(api, api.p.arts || []); api.rebuild(); api.toast("Auto focus set for " + n + (n === 1 ? " artwork" : " artworks")); });
            box.querySelector("[data-rc]").addEventListener("click", function () { api.set("crops", {}); api.toast("Every crop is centered again"); });
          } }
        ] }
      ] },
      { id: "guide", label: "Guide", groups: [
        { title: "Print size guide for your buyer", fields: [
          { id: "guideTitle", type: "text", label: "Guide title", def: "Print Size Guide", max: 40 },
          { id: "shop", type: "text", label: "Shop name", def: "", max: 40, placeholder: "Shown on the cover and footer" },
          { id: "guideParts", type: "chips", label: "Pages", def: ["cover", "files", "chart", "howto"], options: [{ v: "cover", l: "Cover" }, { v: "files", l: "Which file" }, { v: "chart", l: "Size chart" }, { v: "howto", l: "How to print" }] },
          { id: "license", type: "seg", label: "License for the buyer", def: "personal", options: [{ v: "personal", l: "Personal use" }, { v: "commercial", l: "Small commercial" }] },
          { id: "pageSize", type: "select", label: "Paper of the guide and proof sheets", def: "letter", options: Kit.sizeOptions(["letter", "a4"]) },

        ] }

      { id: "sell", label: "Sell it", groups: [
        { title: "Listing text for your shop", fields: [
          { id: "sellN", type: "html", def: 0, render: sellHTML, wire: sellWire, hint: "Written from your sizes and settings." }

    exports: [
      { label: "Print files, whole batch (ZIP)", hint: "Every artwork, every size, README", icon: "layers", run: function (api) { exportZip(api, (api.p.arts || []).slice(), "-print-files"); } },

      { label: "Print size guide (PDF)", hint: "For your buyer", icon: "file", run: function (api) {

      { label: "README for the buyer (TXT)", hint: "Files, sizes and how to print", icon: "file", run: function (api) {
        var p = api.p, ids = p.arts || [], rows = jobsFor(p, ids).map(function (j) { var wh = dimsIn(j.s, j.o); return { path: fileName(p, j.id, j.r, j.s, j.o), label: sizeLabel(j.s, j.o), sub: sizeSub(j.s, j.o), W: Math.round(wh[0] * p.dpi), H: Math.round(wh[1] * p.dpi), dpi: p.dpi }; });

      steps: [
        "Open Artwork and add your artwork (the largest file you have), or click a built-in one. Several files make a batch.",
        "On the crop board, drag each picture to choose what stays in view. Scroll on it to zoom. Auto focus does it for you.",
        "Open Sizes to pick ratios and sizes. Dots show if a size is sharp enough: green 300 DPI or more, amber under 300.",
        "Press Export and choose Print files (ZIP). The ZIP has every size, a README and the print size guide."
      ],
      controls: [
        ["Fill", "The artwork covers the whole print and the edges are cropped. Drag to choose what stays."],
        ["Fit", "The whole artwork stays visible on a border. Pick the border color and width."],
        ["Mirror edges", "The artwork fills one side; the empty space is filled by a mirror image of its edges."],

        ["Custom sizes", "Any extra size, in inches, cm or mm. Each one gets its own crop."],
