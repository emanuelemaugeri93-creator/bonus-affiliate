      };

      function getThemeData(theme) {
        return themeBank[theme] || themeBank["Own Your Workweek [companion to reference]"];
      }

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, seed) {
        return getRandomElement(data.titles, seed);
      }

      function getRandomSubtitle(data, seed) {
        return getRandomElement(data.subtitles, seed + 1);
      }

      function getRandomStages(data, seed) {
        if (data.stages && Array.isArray(data.stages[0])) {
          return getRandomElement(data.stages, seed + 2);
        }
        return data.stages[0];
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["reflect on your current state", "identify a key insight", "draft an action plan"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "30-40") return 35;
        if (rangeStr === "40-50") return 45;
        if (rangeStr === "50-65") return 57;
        return 72;
      }

      // ---------- ULTRA VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 17;
        var seed = lastSeed;

        var subtitle = getRandomSubtitle(data, seed + 15);
        var stages = getRandomStages(data, seed + 25);

        var exactPages = getExactPageCount(currentPageRange);
        var activities = getRandomActivities(data, 24, seed + 35);

        if (chaosLevel >= 3) {
          var twists = [
            "Include a 'business book recommendation' page with space for notes.",

            "Add a 'favorite podcasts and resources' curation page.",
            "Include a '100 day goal' tracker page."
          ];
          for (var t = 0; t < chaosLevel - 1; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 400 + t) + "\n";
          }
        }

        var pagePlan = buildDynamicPagePlan(stages, exactPages, activities, title, seed);

        var prompt = "CREATE A COMPLETE 9-SECTION SMALL BUSINESS & SOLOPRENEUR WORKBOOK BLUEPRINT following the exact structure below. This is a UNIQUE, HIGH-CREATIVITY variation.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for freelancers, consultants, coaches, solopreneurs, and small business owners at the \"" + stageLabel + "\" stage. Can be used as: self-paced workbook, coaching companion, workshop material, or a commercially packaged product for platforms like Etsy, KDP, Gumroad, or TPT. This workbook is intentionally undated for flexible, repeat use. It makes no claims of guaranteed performance, income, career advancement, or business results.\n\n" +

        "4. 7 SEO KEYWORDS\n" + data.keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Learning Path)\n" +
        buildStageList(stages) + "\n" +

        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +

        "Starter Version (20-24 pages): Core stages 1-4 only, simplified layouts, essential exercises.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (60-70 pages): Adds team/client-facing versions of key templates, workshop facilitator notes, quarterly repeat-use tracking sheets, and a bonus 'swipe file' section for real-world examples.\n";

        return prompt;

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 6);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Closing Reflection & Next Steps Action Plan (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, activities, title, seed) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome Letter - Purpose: set the tone and journey. Image Prompt: \"professional abstract header, warm greeting text, footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: Your Starting Point Self-Assessment - Purpose: baseline audit. Image Prompt: \"scorecard table with 1-5 rating rows, clean layout, footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Exercise " + (p+1);
            var chaosAddition = "";
            if (chaosLevel >= 4) chaosAddition = "Include a subtle motivational quote integrated into the design. ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: practical exercise for " + stage.toLowerCase() + ". Image Prompt: \"" + chaosAddition + "clear instructional text: '" + activityTitle + "', appropriate table/checklist/script box layout, professional accents matching " + currentVisual + ", footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        plan += "Page " + pageNum + ": My Key Takeaways Reflection - Purpose: consolidate learning. Image Prompt: \"structured reflection boxes, 'What I'll start doing' prompts, footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": Next Steps Action Plan - Purpose: commit to action. Image Prompt: \"action plan table with columns for task, deadline, priority, status, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;

        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var stageLabel = (currentStage === "idea") ? "Idea / Pre-Launch" : (currentStage === "early" ? "Early Stage (0-1 yr)" : "Established (Growing)");
        var tagsHtml = '<span class="tag">💼 ' + currentTheme + '</span>' +

                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
</body>
</html>
