      var visualStyleBank = {
        "Warm Minimalist Romantic": "blush pink, cream, soft gold accents, delicate line art, airy spacious layouts",
        "Modern Editorial Elegant": "charcoal, ivory, muted sage, sophisticated sans-serif fonts, clean lines, magazine-like whitespace",

        "Boho Chic Earthy": "terracotta, ochre, olive, macramé textures, pampas grass motifs, free-spirited hand-drawn elements",
        "Midnight Romance Dark": "deep navy, burgundy, gold foil accents, celestial motifs, moody romantic photography style, dramatic contrasts"
      };

      function getThemeData(theme) {
        return themeBank[theme] || themeBank["Engaged Couple's Wedding Planning Companion"];
      }

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, seed) {
        return getRandomElement(data.titles, seed);
      }

      function getRandomSubtitle(data, seed) {
        return getRandomElement(data.subtitles, seed + 1);
      }

      function getRandomStages(data, seed) {
        if (data.stages && Array.isArray(data.stages[0])) {
          return getRandomElement(data.stages, seed + 2);
        }
        return data.stages[0];
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["reflect together", "discuss your perspectives", "practice a new skill"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "24-30") return 27;
        if (rangeStr === "30-40") return 35;
        if (rangeStr === "40-50") return 45;
        return 57;
      }

      // ---------- UNLIMITED VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 11;
        var seed = lastSeed;

        var data = getThemeData(currentTheme);
        var title = getRandomTitle(data, seed);
        var subtitle = getRandomSubtitle(data, seed + 10);
        var stages = getRandomStages(data, seed + 20);
        var visualDesc = visualStyleBank[currentVisual] || "warm minimalist style";
        var exactPages = getExactPageCount(currentPageRange);
        var formatLabel = (currentFormat === "guided") ? "Guided Journal for Two" : "Joint Worksheet";
        var activities = getRandomActivities(data, 15, seed + 30);

        var extraTwists = "";
        if (chaosLevel >= 3) {
          var twists = [
            "Include a 'relationship haiku' writing page for both partners.",
            "Add a 'design your own relationship crest' activity page.",
            "Incorporate a 'secret message' decoder puzzle about love.",
            "Add a 'relationship time capsule' page with prompts for future opening.",
            "Include a 'couple's soundtrack' playlist design page.",
            "Add a 'map of our relationship' illustrated timeline.",
            "Include a cut-out 'date night coupon' sheet.",
            "Add a 'relationship weather forecast' weekly check-in tool."
          ];
          for (var t = 0; t < chaosLevel - 2; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 200 + t) + "\n";
          }
        }

        var pagePlan = buildDynamicPagePlan(stages, exactPages, activities, title, seed);

        var prompt = "CREATE A COMPLETE 9-SECTION COUPLES & RELATIONSHIP WORKBOOK BLUEPRINT following the exact structure below. This is a UNIQUE, HIGH-CREATIVITY variation.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for couples at various relationship stages seeking \"" + currentTheme + "\". Perfect for marriage and couples coaches, premarital counselors (as a printable companion tool, explicitly non-clinical), engagement and anniversary gift buyers. This workbook is a reflection and communication tool, not a substitute for professional counseling. It makes no clinical or diagnostic claims and is intentionally undated for flexible use. Uses inclusive 'Partner A / Partner B' language throughout.\n\n" +
        "3. SHORT PRODUCT DESCRIPTION\n" +
        "This beautifully designed printable workbook guides couples through a meaningful journey of \"" + currentTheme + "\". Using the \"" + formatLabel + "\" format, partners engage with thought-provoking prompts side by side. Each page invites honest reflection and deepens understanding in a warm, supportive way.\n" +
        "With " + exactPages + " carefully crafted pages, couples move from exploration to celebration. The undated design allows pairs to work at their own pace, making it a lasting resource for any stage of a relationship. Chaos level: " + chaosLevel + "/5 ensures a fresh, unexpected experience.\n\n" +
        "4. 7 SEO KEYWORDS\n" + data.keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Learning Path)\n" +
        buildStageList(stages) + "\n" +
        extraTwists + "\n" +
        "6. CONTENT AND LAYOUT STYLE GUIDE\n" +
        "Tone: warm, inclusive, encouraging, never clinical or presumptuous. Gender-neutral 'Partner A / Partner B' labels for all dual-writing spaces.\n" +
        "Visual direction: " + visualDesc + ".\n" +
        "Page structure: " + (currentFormat === "guided" ? "Each relevant page features a two-column or alternating-section layout with distinct labeled writing zones (Partner A / Partner B). Prompts alternate so both partners have equal space to reflect." : "Pages are designed for joint completion, with shared writing spaces, collaborative lists, and discussion boxes where both partners contribute to the same area.") + " Generous margins for binding, clear footer with title and page number.\n" +
        "Consistency rules: every page includes footer \"[" + title + "] - [page number]\", no dense text blocks, ample white space for handwritten responses.\n\n" +
        "7. WORKBOOK STRUCTURE OVERVIEW\n" +
        "Front Matter (pages 1-2): Welcome letter to the couple, how to use this book together, a 'Our Pact for This Workbook' agreement.\n" +
        buildModuleStructure(stages, exactPages) + "\n\n" +
        "8. COVER PROMPT\n" +
        "A vertical 8.5x11 full-color front cover. Visual style: " + visualDesc + ". Main illustration: abstract intertwined shapes or soft motifs symbolizing partnership. Exact title text: \"" + title + "\" and subtitle \"" + subtitle + "\". Do NOT include barcodes, real photographs, or small dense text. Keep 0.25 inch safe print margin.\n\n" +
        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +
        pagePlan + "\n\n" +
        "10. PRODUCT VERSION SUGGESTIONS\n" +
        "Starter Version (16-20 pages): Core stages 1-4 only, simplified layouts.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (adds 12-18 pages): Includes a 'date night activity cards' cut-out insert, a 'love languages' self-assessment and discussion section, and a milestone/anniversary tracking and reflection add-on.\n";

        return prompt;
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 6);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Closing Reflection & Couple's Certificate (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, activities, title, seed) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome Letter - Purpose: introduce the workbook journey. Image Prompt: \"warm abstract illustration, soft " + currentVisual + " palette, title '" + title + "' subtly integrated, footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: Our Pact for This Workbook - Purpose: set intentions. Image Prompt: \"simple agreement box with lines for both partners' signatures, decorative border, footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Practice " + (p+1);
            var formatInstruction = (currentFormat === "guided") ?
              "Two-column layout with 'Partner A' and 'Partner B' labeled writing spaces. " :
              "Shared writing space with 'Together' discussion box. ";
            var chaosAddition = "";
            if (chaosLevel >= 4) chaosAddition = "Include a hidden heart icon to find on the page. ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: explore " + stage.toLowerCase() + ". Image Prompt: \"" + formatInstruction + chaosAddition + "prompt text: '" + activityTitle + "', decorative accents matching " + currentVisual + ", footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        plan += "Page " + pageNum + ": Our Journey Reflection - Purpose: reflect on the workbook experience. Image Prompt: \"two columns for individual reflections, shared center for joint takeaway, footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": Couple's Certificate of Completion - Purpose: celebrate finishing. Image Prompt: \"elegant certificate design, space for names and date, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

      function updateUI() {
        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;
        var wordCount = promptText.split(/\s+/).filter(function(w){return w.length>0;}).length;
        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var tagsHtml = '<span class="tag">❤️ ' + currentTheme + '</span>' +
                       '<span class="tag">📝 ' + (currentFormat === "guided" ? "Guided Journal" : "Joint Worksheet") + '</span>' +
                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('themeSelect').addEventListener('change', function(e) {
        currentTheme = e.target.value;
        updateUI();
      });

      var formatBtns = document.querySelectorAll('.format-btn');
      formatBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          formatBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentFormat = btn.getAttribute('data-format');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
