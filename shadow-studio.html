<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shadow Match Activity Maker Pro | KDP Puzzle Book Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4f3;
      --panel: #1a2f35;
      --accent: #2A9D8F;
      --accent2: #E9C46A;
      --accent3: #F4A261;
      --accent4: #E76F51;
      --text: #f0f4f3;
      --worksheet: #fffef9;
      --shadow: 0 20px 40px rgba(0,0,0,0.3);
      --radius: 2rem;
      --trans: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e8f0ed 0%, #dce8e3 25%, #e2ece6 50%, #d5e5de 75%, #e8f0ed 100%);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:2rem 1.5rem;
    }
    @keyframes bgShift {
      0%,100% { background-position:0% 50%; }
      50% { background-position:100% 50%; }
    }
    .app-container {
      display:flex; flex-wrap:wrap; max-width:1560px; width:100%; gap:2rem; align-items:flex-start;
    }
    .control-panel {
      flex:1 1 420px;
      background:linear-gradient(180deg, #1e3a3f 0%, #162a2f 100%);
      color:var(--text); border-radius:var(--radius); padding:2rem 1.8rem;
      box-shadow:var(--shadow); display:flex; flex-direction:column; gap:1.3rem;
      border:1px solid rgba(255,255,255,0.06); position:sticky; top:2rem; max-height:94vh; overflow-y:auto;
      backdrop-filter:blur(10px);
    }
    .control-panel::-webkit-scrollbar { width:5px; }
    .control-panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:10px; }
    .panel-header {
      display:flex; align-items:center; gap:0.7rem; border-bottom:1px solid rgba(255,255,255,0.08);
      padding-bottom:1.2rem;
    }
    .logo { font-size:2.4rem; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
    .panel-title {
      font-family:'Fredoka', sans-serif; font-weight:700; font-size:1.7rem;
      background:linear-gradient(135deg, #fff, #c5e8e2);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .badge {
      font-size:0.6rem; background:var(--accent); color:#fff; padding:0.2rem 0.7rem;
      border-radius:1rem; font-weight:800; letter-spacing:0.5px;
    }
    .section { background:rgba(0,0,0,0.2); border-radius:1.2rem; padding:1rem 1.2rem; }
    .section-title {
      font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px;
      color:#8ab8b0; margin-bottom:0.8rem; display:flex; align-items:center; gap:0.4rem;
    }
    .control-row { display:flex; gap:0.5rem; flex-wrap:wrap; }
    select, input[type="text"], input[type="number"] {
      background:#142428; border:2px solid #2a4a50; border-radius:2.5rem;
      padding:0.8rem 1.2rem; color:#fff; font-weight:600; font-size:0.9rem;
      outline:none; font-family:'Nunito', sans-serif; transition:var(--trans); width:100%;
      appearance:none;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%232A9D8F" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>');
      background-repeat:no-repeat; background-position:right 1rem center; cursor:pointer;
    }
    select:hover, input:hover { border-color:var(--accent); background:#1a2e33; }
    .btn {
      background:linear-gradient(135deg, var(--accent), #1a6b5e); border:2px solid rgba(255,255,255,0.1);
      color:#fff; font-weight:800; padding:0.9rem 1.4rem; border-radius:3rem; font-size:0.9rem;
      cursor:pointer; transition:var(--trans); box-shadow:0 7px 0 #134f45;
      font-family:'Nunito', sans-serif; display:flex; align-items:center; justify-content:center;
      gap:0.5rem; text-transform:uppercase; letter-spacing:0.5px; width:100%;
    }
    .btn:hover { background:linear-gradient(135deg, #3db8a8, #2A9D8F); transform:translateY(-2px); box-shadow:0 10px 0 #134f45; }
    .btn.secondary {
      background:linear-gradient(135deg, #2d4a50, #1e3439); box-shadow:0 5px 0 #122428;
      text-transform:none; font-size:0.85rem;
    }
    .btn.accent2 { background:linear-gradient(135deg, var(--accent3), #d4823f); box-shadow:0 5px 0 #a85d2a; }
    .btn.accent3 { background:linear-gradient(135deg, var(--accent4), #c4533d); box-shadow:0 5px 0 #8a3527; }
    .btn-row { display:flex; gap:0.5rem; }
    .btn-row .btn { flex:1; }
    .radio-pill {
      display:flex; gap:0.3rem; background:#0e1f23; border-radius:2rem; padding:0.3rem;
    }
    .radio-pill label {
      flex:1; text-align:center; padding:0.6rem 0.4rem; border-radius:2rem; cursor:pointer;
      font-weight:700; font-size:0.8rem; color:#a0c8c0; transition:var(--trans); border:2px solid transparent;
    }
    .radio-pill label:hover { color:#fff; }
    .radio-pill input[type="radio"] { display:none; }
    .radio-pill input:checked + span { color:#fff; }
    .radio-pill label:has(input:checked) { background:var(--accent); color:#fff; border-color:var(--accent2); }
    .toggle-switch {
      display:flex; align-items:center; gap:0.8rem; cursor:pointer;
    }
    .toggle-track {
      width:48px; height:26px; background:#2a4a50; border-radius:13px; position:relative; transition:var(--trans);
    }
    .toggle-track::after {
      content:''; position:absolute; top:3px; left:3px; width:20px; height:20px;
      background:#fff; border-radius:50%; transition:var(--trans);
    }
    .toggle-switch input:checked + .toggle-track { background:var(--accent); }
    .toggle-switch input:checked + .toggle-track::after { left:25px; }
    .toggle-switch input { display:none; }
    .preview-panel {
      flex:2.3 1 800px;
      background:var(--worksheet); border-radius:var(--radius);
      padding:2.5rem 2.5rem; box-shadow:0 20px 50px rgba(0,0,0,0.1);
      min-height:900px; border:1px solid #e6ded0; position:relative;
    }
    .preview-toolbar {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;
      flex-wrap:wrap; gap:0.8rem;
    }
    .page-counter {
      background:#eef4f0; padding:0.4rem 1.4rem; border-radius:2rem;
      font-weight:700; font-size:0.85rem; border:1px solid #dde5df;
    }
    .zoom-controls { display:flex; gap:0.4rem; align-items:center; }
    .zoom-btn {
      width:32px; height:32px; border-radius:50%; border:2px solid #dde5df;
      background:#fff; cursor:pointer; font-weight:700; font-size:1.1rem;
      display:flex; align-items:center; justify-content:center; transition:var(--trans);
    }
    .zoom-btn:hover { background:#f0f4f0; border-color:var(--accent); }
    .worksheet-title {
      font-family:'Fredoka', sans-serif; font-weight:700; font-size:2.6rem;
      color:#1e3a3f; text-align:center; margin-bottom:1.5rem;
    }
    .worksheet-subtitle {
      text-align:center; font-weight:600; color:#5a7a6e; margin-bottom:1.5rem;
      font-size:0.95rem; font-family:'Quicksand', sans-serif;
    }
    .match-area {
      display:flex; justify-content:space-between; align-items:stretch;
      gap:1.5rem; margin:1.5rem 0; position:relative;
    }
    .match-area::after {
      content:'✏️'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:2rem; opacity:0.15; pointer-events:none; z-index:0;
    }
    .object-column, .shadow-column { flex:1; display:flex; flex-direction:column; gap:1rem; z-index:1; }
    .object-item, .shadow-item {
      display:flex; align-items:center; gap:1rem; padding:0.7rem 1rem;
      border-radius:1.2rem; transition:all var(--trans); cursor:pointer;
      position:relative;
    }
    .object-item {
      background:#fafdf9; border:2.5px solid #e8efe5;
      box-shadow:2px 2px 10px rgba(0,0,0,0.05);
    }
    .object-item:hover { border-color:var(--accent); transform:translateX(3px); box-shadow:4px 4px 16px rgba(42,157,143,0.12); }
    .shadow-item {
      background:#fff; border:2.5px dashed #d0d8cf;
    }
    .shadow-item:hover { border-color:var(--accent3); border-style:solid; transform:translateX(-3px); }
    .item-number {
      font-family:'Fredoka', sans-serif; font-weight:700; font-size:1.4rem;
      color:var(--accent); min-width:28px; text-align:center;
    }
    .item-letter {
      font-family:'Fredoka', sans-serif; font-weight:700; font-size:1.4rem;
      color:var(--accent3); min-width:28px; text-align:center;
    }
    .item-svg { width:75px; height:75px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .item-svg svg { width:70px; height:70px; }
    .shadow-container {
      display:inline-block;
      filter:drop-shadow(5px 5px 8px rgba(0,0,0,0.4));
      transition:var(--trans);
    }
    .shadow-item:hover .shadow-container { filter:drop-shadow(7px 7px 12px rgba(0,0,0,0.5)); }
    .answer-section {
      margin-top:2rem; border-top:3px solid var(--accent3); padding-top:1.2rem;
      background:linear-gradient(135deg, #fffaf5, #fff5eb); padding:1.5rem; border-radius:1.5rem;
    }
    .answer-title {
      font-family:'Fredoka', sans-serif; font-weight:700; color:#1e3a3f; margin-bottom:0.8rem;
      display:flex; align-items:center; gap:0.4rem;
    }
    .answer-grid {
      display:flex; flex-wrap:wrap; gap:0.6rem 1.5rem; font-weight:700; color:#3a5a5e;
    }
    .answer-pair {
      background:#fff; padding:0.4rem 1rem; border-radius:1.5rem;
      border:1.5px solid #f0e6d8; font-size:0.9rem;
    }
    .scattered-layout .objects-top {
      display:flex; flex-wrap:wrap; justify-content:center; gap:1.5rem;
      padding:1.5rem; background:#fafdf9; border-radius:1.5rem; border:2px solid #eef3ec;
    }
    .scattered-layout .shadows-bottom {
      display:flex; flex-wrap:wrap; justify-content:center; gap:1.5rem;
      padding:1.5rem; background:#fff; border-radius:1.5rem; border:2px dashed #dde5df;
    }
    .scattered-item {
      text-align:center; padding:0.8rem; border-radius:1.2rem;
      background:#fff; border:2.5px solid #eef3ec;
      box-shadow:2px 2px 8px rgba(0,0,0,0.03); transition:var(--trans); cursor:pointer;
    }
    .scattered-item:hover { border-color:var(--accent); transform:translateY(-3px); }
    .scattered-item.shadow-box { background:#fefefe; border:2.5px dashed #d0d8cf; }
    .scattered-label {
      font-weight:700; margin-top:0.4rem; font-family:'Fredoka', sans-serif; font-size:1rem;
    }
    @keyframes popIn {
      0% { transform:scale(0); opacity:0; }
      60% { transform:scale(1.1); }
      100% { transform:scale(1); opacity:1; }
    }
    @keyframes slideInRight {
      0% { transform:translateX(50px); opacity:0; }
      100% { transform:translateX(0); opacity:1; }
    }
    @keyframes slideInLeft {
      0% { transform:translateX(-50px); opacity:0; }
      100% { transform:translateX(0); opacity:1; }
    }
    .pop-in { animation:popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
    .slide-in-left { animation:slideInLeft 0.5s ease forwards; }
    .slide-in-right { animation:slideInRight 0.5s ease forwards; }
    .empty-state {
      text-align:center; padding-top:120px; color:#c0c8c2; font-weight:600; font-size:1.1rem;
    }
    .page-break {
      text-align:center; margin:2rem 0; color:#a0b0a8; font-weight:700;
      border-top:2px dashed #d0d8cf; padding-top:1.5rem; font-size:0.85rem;
    }
    @media print {
      body { background:#fff; padding:0; }
      .control-panel, .btn, .preview-toolbar, .page-break { display:none!important; }
      .preview-panel { box-shadow:none; border:none; padding:0.75in; background:#fff; border-radius:0; width:100%; }
      .object-item, .shadow-item, .scattered-item { box-shadow:none; break-inside:avoid; }
      .shadow-container { filter:none!important; }
      .match-area::after { display:none; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="control-panel">
    <div class="panel-header">
      <span class="logo">🔍🖤</span>
      <span class="panel-title">Shadow Match Maker</span>
      <span class="badge">PRO v5</span>
    </div>

    <div class="section">
      <div class="section-title">📂 Category & Theme</div>
      <select id="categorySelect">
        <option value="farm">🐄 Farm Animals</option>
        <option value="ocean">🐠 Ocean Animals</option>
        <option value="wild">🦁 Wild Animals</option>
        <option value="fruits">🍎 Fruits & Vegetables</option>
        <option value="vehicles">🚗 Vehicles</option>
        <option value="household">🏠 Household Objects</option>
        <option value="toys">🧸 Toys & Games</option>
        <option value="space">🚀 Space Objects</option>
        <option value="music">🎵 Musical Instruments</option>
        <option value="insects">🐞 Insects & Bugs</option>
      </select>
      <div id="categoryPreview" style="display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap;"></div>
    </div>

    <div class="section">
      <div class="section-title">🔢 Pairs per Page</div>
      <div class="radio-pill" id="pairsGroup">
        <label><input type="radio" name="numPairs" value="4"><span>4</span></label>
        <label><input type="radio" name="numPairs" value="6" checked><span>6</span></label>
        <label><input type="radio" name="numPairs" value="8"><span>8</span></label>
        <label><input type="radio" name="numPairs" value="10"><span>10</span></label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🧩 Difficulty Level</div>
      <div class="radio-pill" id="difficultyGroup">
        <label><input type="radio" name="difficulty" value="easy" checked><span>🌱 Easy</span></label>
        <label><input type="radio" name="difficulty" value="medium"><span>🌿 Medium</span></label>
        <label><input type="radio" name="difficulty" value="hard"><span>🌳 Hard</span></label>
      </div>
      <div id="difficultyHint" style="font-size:0.7rem;color:#8ab8b0;margin-top:0.5rem;">💡 Exact silhouettes — perfect for ages 2-4</div>
    </div>

    <div class="section">
      <div class="section-title">📐 Layout & Style</div>
      <div class="radio-pill" id="layoutGroup" style="margin-bottom:0.5rem;">
        <label><input type="radio" name="layoutStyle" value="classic" checked><span>📋 Classic</span></label>
        <label><input type="radio" name="layoutStyle" value="scattered"><span>🎯 Scattered</span></label>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span style="font-size:0.75rem;color:#a0c8c0;">🎨 Colors:</span>
        <select id="colorScheme" style="flex:1;">
          <option value="color" selected>🌈 Full Color</option>
          <option value="outline">✏️ Print-Friendly</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 Page Settings</div>
      <input type="text" id="pageTitleInput" value="Match the Shadows!" placeholder="Page title">
      <div style="margin-top:0.5rem;">
        <label class="toggle-switch">
          <input type="checkbox" id="showAnswerKey" checked>
          <span class="toggle-track"></span>
          <span style="font-size:0.8rem;color:#c0dcd4;">🔑 Show Answer Key</span>
        </label>
      </div>
      <div style="margin-top:0.3rem;">
        <label class="toggle-switch">
          <input type="checkbox" id="showInstructions" checked>
          <span class="toggle-track"></span>
          <span style="font-size:0.8rem;color:#c0dcd4;">📝 Show Instructions</span>
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="generateBtn">✨ Generate</button>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="shuffleBtn">🔀 Shuffle</button>
      <button class="btn secondary" id="addPageBtn">📄 Add Page</button>
    </div>
    <div class="btn-row">
      <button class="btn accent2" id="exportAllBtn">📦 Export All</button>
      <button class="btn accent3" id="printBtn">🖨️ Print PDF</button>
    </div>
  </div>

  <div class="preview-panel" id="previewContainer">
    <div class="preview-toolbar">
      <span style="font-weight:700;color:#4a6b6e;">📋 Live Preview</span>
      <div style="display:flex;gap:1rem;align-items:center;">
        <span class="page-counter" id="pageCounter">Page 0 of 0</span>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut">−</button>
          <span style="font-size:0.8rem;font-weight:700;" id="zoomLevel">100%</span>
          <button class="zoom-btn" id="zoomIn">+</button>
        </div>
      </div>
    </div>
    <div id="worksheetContent" style="transform-origin:top center; transition:transform 0.3s;">
      <div class="empty-state">🔍🖤<br>Choose settings and click <strong>Generate</strong></div>
    </div>
  </div>
</div>

<script>
(function() {
  const svgTag = (c, s) => '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="'+(s||70)+'" height="'+(s||70)+'">'+c+'</svg>';

  function getShdSVG(n, diff) {
    let s = shadowSVGs[n] || '';
    if(diff==='medium') s = s.replace('<svg', '<svg transform="rotate(90, 50, 50)"');
    if(diff==='hard') s = s.replace('<svg', '<svg transform="rotate(90, 50, 50) scale(0.85)"');
    return s;
  }

  function render() {
    const c = document.getElementById('worksheetContent');
    const pc = document.getElementById('pageCounter');
    if(!state.pages.length) { c.innerHTML='<div class="empty-state">🔍🖤<br>Click <strong>Generate</strong> to start</div>'; pc.textContent='Page 0 of 0'; return; }
    pc.textContent = `Page ${state.pages.length} of ${state.pages.length}`;
    let h = '';
    state.pages.forEach((pg, idx) => {
      const {objects, shadowOrder} = pg;
      h += `<div class="worksheet-title">${state.pageTitle}</div>`;
      if(state.showInstructions) h += `<div class="worksheet-subtitle">✨ Draw a line from each object to its matching shadow!</div>`;
      if(state.layout === 'classic') {
        h += `<div class="match-area"><div class="object-column">`;
        objects.forEach((o, j) => h += `<div class="object-item slide-in-left" style="animation-delay:${j*60}ms"><span class="item-number">${j+1}</span><div class="item-svg">${getObjSVG(o)}</div></div>`);
        h += `</div><div class="shadow-column">`;
        shadowOrder.forEach((oi, j) => { const o = objects[oi]; h += `<div class="shadow-item slide-in-right" style="animation-delay:${j*60+80}ms"><div class="item-svg"><span class="shadow-container">${getShdSVG(o, state.difficulty)}</span></div><span class="item-letter">${String.fromCharCode(65+j)}</span></div>`; });
        h += `</div></div>`;
      } else {
        h += `<div class="scattered-layout"><div class="objects-top">`;
        objects.forEach((o, j) => h += `<div class="scattered-item pop-in" style="animation-delay:${j*50}ms"><div class="item-svg">${getObjSVG(o)}</div><div class="scattered-label" style="color:#2A9D8F;">${j+1}</div></div>`);
        h += `</div><div style="text-align:center;margin:1.2rem 0;font-weight:600;">⬇️ Match to shadows below ⬇️</div><div class="shadows-bottom">`;
        shadowOrder.forEach((oi, j) => { const o = objects[oi]; h += `<div class="scattered-item shadow-box pop-in" style="animation-delay:${j*50+80}ms"><div class="item-svg"><span class="shadow-container">${getShdSVG(o, state.difficulty)}</span></div><div class="scattered-label" style="color:#F4A261;">${String.fromCharCode(65+j)}</div></div>`; });
        h += `</div></div>`;
      }
      if(state.showAnswer) {
        h += `<div class="answer-section"><div class="answer-title">🔑 Answer Key</div><div class="answer-grid">`;
        objects.forEach((o, j) => { const sp = shadowOrder.indexOf(j); h += `<span class="answer-pair">${j+1} → ${String.fromCharCode(65+sp)}</span>`; });
        h += `</div></div>`;
      }
      if(idx < state.pages.length-1) h += `<div class="page-break">📄 • Page Break • Next Worksheet • 📄</div>`;
    });
    c.innerHTML = h;
  }

  function updatePreview() {
    document.getElementById('categoryPreview').innerHTML = (categoryData[state.category]||categoryData.farm).slice(0,4).map(i => `<div style="width:38px;height:38px;background:rgba(255,255,255,0.05);border-radius:0.5rem;padding:2px;">${getObjSVG(i)}</div>`).join('');
    document.getElementById('difficultyHint').textContent = {
      easy:'💡 Exact silhouettes — perfect for ages 2-4',
      medium:'💡 Shadows rotated 90° — spatial reasoning challenge',
      hard:'💡 Shadows rotated & scaled — advanced puzzle'
    }[state.difficulty] || '';
  }

  // Event bindings
  document.getElementById('categorySelect').addEventListener('change', function(){ state.category=this.value; updatePreview(); });
  document.querySelectorAll('#pairsGroup input').forEach(r => r.addEventListener('change', function(){ if(this.checked) state.numPairs=parseInt(this.value); }));
  document.querySelectorAll('#difficultyGroup input').forEach(r => r.addEventListener('change', function(){ if(this.checked) { state.difficulty=this.value; updatePreview(); } }));
  document.querySelectorAll('#layoutGroup input').forEach(r => r.addEventListener('change', function(){ if(this.checked) state.layout=this.value; }));
  document.getElementById('colorScheme').addEventListener('change', function(){ state.colorScheme=this.value; });
  document.getElementById('pageTitleInput').addEventListener('input', function(){ state.pageTitle=this.value||'Match the Shadows!'; });
  document.getElementById('showAnswerKey').addEventListener('change', function(){ state.showAnswer=this.checked; });
  document.getElementById('showInstructions').addEventListener('change', function(){ state.showInstructions=this.checked; });

  document.getElementById('generateBtn').addEventListener('click', ()=>{ state.pages=[genPage()]; render(); });
  document.getElementById('shuffleBtn').addEventListener('click', ()=>{ if(state.pages.length){ state.pages=state.pages.map(p=>({objects:p.objects, shadowOrder:shuffle([...Array(p.objects.length).keys()])})); render(); } });
  document.getElementById('addPageBtn').addEventListener('click', ()=>{ state.pages.push(genPage()); render(); });
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('exportAllBtn').addEventListener('click', ()=>{ alert('📦 Ready to print all '+state.pages.length+' pages! Click Print PDF to save.'); window.print(); });

  document.getElementById('zoomIn').addEventListener('click', ()=>{ state.zoom=Math.min(1.5, state.zoom+0.1); document.getElementById('worksheetContent').style.transform=`scale(${state.zoom})`; document.getElementById('zoomLevel').textContent=Math.round(state.zoom*100)+'%'; });
  document.getElementById('zoomOut').addEventListener('click', ()=>{ state.zoom=Math.max(0.5, state.zoom-0.1); document.getElementById('worksheetContent').style.transform=`scale(${state.zoom})`; document.getElementById('zoomLevel').textContent=Math.round(state.zoom*100)+'%'; });

  updatePreview();
  state.pages = [genPage()];
  render();
})();
</script>
</body>
</html>
