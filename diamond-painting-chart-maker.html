<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);

.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;

.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {

}

.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }

.k-group { margin-bottom: 18px; }

}
.k-field { margin-bottom: 12px; }

.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);

.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {

}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;

.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;

.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }

@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }

  .k-top { padding: 8px 10px; gap: 6px; }

  body { overflow: visible; background: #fff; }

<style>
/* Direction: Sidebar + Canvas in a jewel-box glass language (deep aubergine night, frosted panels,
   iridescent aqua-lilac-pink accent, Syne + Manrope), because diamond painting buyers love sparkle
   and the tool should feel like opening a box of gems. */
:root {
  color-scheme: dark;
  --k-bg: #120c1d;
  --k-panel: #1a1229;
  --k-panel-2: #241935;
  --k-ink: #f4effc;
  --k-muted: #ab9fc4;
  --k-line: #352a4d;
  --k-accent: #7fe3d8;
  --k-accent-ink: #0f1218;
  --k-accent-soft: #1e3a3f;
  --k-stage: #0c0814;
  --k-radius: 14px;
  --k-font: "Manrope", system-ui, sans-serif;
  --k-display: "Syne", "Manrope", sans-serif;
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --dp-iri: linear-gradient(115deg, #7fe3d8 0%, #b9a2ff 52%, #ff9fd2 100%);
}
body {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(127, 227, 216, .10), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(185, 162, 255, .12), transparent 60%),
    var(--k-bg);
}
.k-top { border-bottom: 1px solid transparent; border-image: var(--dp-iri) 1; background: #150e22; }
.k-side { background: linear-gradient(180deg, #1a1229, #160f23); }
.k-btn.k-primary { background: var(--dp-iri); color: #120c1d; border-color: transparent; }
.k-logo { background: var(--dp-iri); color: #120c1d; }

/* ---------- Side panel ---------- */
.dp-cur { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--k-line); border-radius: 12px; background: var(--k-panel-2); margin-bottom: 12px; }
.dp-cur img { width: 64px; height: 64px; object-fit: cover; border-radius: 9px; display: block; }
.dp-cur b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-cur small { color: var(--k-muted); font-size: 11.5px; line-height: 1.35; display: block; }
.dp-drop { border: 2px dashed var(--k-line); border-radius: 12px; padding: 14px 10px; text-align: center; font-size: 12.5px; color: var(--k-muted); cursor: pointer; background: rgba(255, 255, 255, .02); margin-bottom: 12px; }
.dp-drop b { display: block; color: var(--k-ink); font-size: 13.5px; margin-bottom: 2px; }
.dp-drop.is-over { border-color: var(--k-accent); background: var(--k-accent-soft); }
.dp-gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.dp-th { border: 2px solid transparent; border-radius: 10px; padding: 0; background: none; cursor: pointer; overflow: hidden; position: relative; }
.dp-th img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 8px; }
.dp-th:hover { border-color: var(--k-line); }
.dp-th.is-on { border-color: var(--k-accent); box-shadow: 0 0 0 2px rgba(127, 227, 216, .25); }

.dp-th .dp-x svg { width: 11px; height: 11px; }
.dp-sum { border-radius: 12px; padding: 12px; background: linear-gradient(135deg, rgba(127, 227, 216, .12), rgba(185, 162, 255, .12)); border: 1px solid var(--k-line); font-size: 12.5px; line-height: 1.5; }

.dp-sum span { color: var(--k-muted); }
.dp-copy { display: grid; gap: 10px; }
.dp-copy textarea { min-height: 70px; font-size: 12.5px; }
.dp-copy .k-label { margin-bottom: 4px; }

/* ---------- Sparkle view (workspace) ---------- */
.dp-work { display: grid; gap: 12px; max-width: 1180px; margin: 0 auto; }
.dp-wbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; }
.dp-wbar p { margin: 0; color: var(--k-muted); flex: 1 1 220px; }
.dp-wbar .k-seg { min-width: 200px; }
.dp-stagebox { position: relative; overflow: auto; max-height: calc(100dvh - 360px); min-height: 260px; border-radius: 14px; background: radial-gradient(circle at 50% 30%, #2a1f3f, #0b0712 70%); border: 1px solid var(--k-line); padding: 18px; }
.dp-glass { position: relative; margin: 0 auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 6px #f5f0e6, 0 0 0 7px #cbbfa8; }
.dp-glass canvas { display: block; width: 100%; height: 100%; image-rendering: auto; touch-action: none; }
.dp-glass.is-edit canvas { cursor: crosshair; image-rendering: pixelated; }
.dp-sweep { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; mix-blend-mode: soft-light; background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .85) 48%, rgba(255, 255, 255, .0) 60%); background-size: 260% 100%; animation: dpSweep 4.2s ease-in-out infinite; }

.dp-tw::after { transform: rotate(90deg); }

.dp-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.dp-lb { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 9px; border: 1px solid var(--k-line); background: var(--k-panel-2); cursor: pointer; font-size: 11.5px; color: var(--k-ink); }
.dp-lb i { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: 11px; border: 1px solid rgba(255, 255, 255, .2); }
.dp-lb.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }

.dp { position: absolute; left: 0; top: 0; right: 0; bottom: 0; font-family: "Manrope", sans-serif; color: #1d1826; background: #fff; }
.dp-head { position: absolute; left: 6em; right: 21em; top: 3.6em; }
.dp-h1 { font-size: 3em; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.dp-sub { font-size: calc(1.4em * var(--fz, 1)); color: #5e5670; margin-top: .4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-rule { position: absolute; left: 6em; right: 6em; top: 10.6em; height: .3em; background: var(--ac); }
.dp-foot { position: absolute; left: 6%; right: 6%; bottom: 2.4%; display: flex; justify-content: space-between; font-size: 1.3em; color: #8a8298; }
.dp-mini { position: absolute; right: 6em; top: 3.4em; border: .15em solid #1d1826; background: #f3f0f7; }
.dp-mini > i { position: absolute; border: .08em solid #8a8298; box-sizing: border-box; }
.dp-mini > i.on { background: var(--ac); border-color: var(--ac); }
.dp-chart { position: absolute; }
.dp-chart img { width: 100%; height: 100%; display: block; }
.dp-wait { position: absolute; left: 10%; right: 10%; top: 40%; text-align: center; font-size: 2.4em; color: #8a8298; }

/* legend table */
.dp-tbl { position: absolute; left: 6em; right: 6em; top: 13.2em; }
.dp-tr { display: flex; align-items: center; border-bottom: .1em solid #e4dfec; height: 3.2em; }
.dp-tr > span { font-size: calc(1.3em * var(--fz, 1)); padding-right: .6em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }

.dp-tr.th > span { font-weight: 800; font-size: calc(1.05em * var(--fz, 1)); text-transform: uppercase; letter-spacing: .06em; color: #5e5670; }

.dp-box { display: flex; align-items: center; }

/* cover */

.dp-cv-top { position: absolute; left: 8%; right: 8%; top: 6%; text-align: center; }

          { id: "minDrills", type: "range", label: "Drop colours used fewer than", def: 20, min: 0, max: 200, step: 5, unit: " drills" }
        ] },
        { title: "Clean-up", fields: [
          { id: "clean", type: "seg", def: "lone", options: [{ v: "off", l: "Off" }, { v: "lone", l: "Lone drills" }, { v: "pairs", l: "+ pairs" }, { v: "small", l: "+ trios" }], hint: "Removes single drills (and tiny groups) of a colour that sit alone: faster to make, cleaner to look at." }
        ] },
        { title: "Chart pages", fields: [
          { id: "charts", type: "chips", def: ["color"], minSel: 1, options: [{ v: "color", l: "Colour + symbols" }, { v: "full", l: "Full colour" }, { v: "bw", l: "Black and white" }] },
          { id: "density", type: "seg", label: "Squares per page", def: "standard", options: [{ v: "large", l: "Large" }, { v: "standard", l: "Standard" }, { v: "compact", l: "Compact" }, { v: "fine", l: "Fine" }] },
          { id: "overlap", type: "seg", label: "Repeat from the page before", def: 2, options: [{ v: 0, l: "None" }, { v: 1, l: "1 row" }, { v: 2, l: "2 rows" }, { v: 3, l: "3 rows" }] }
        ] },
        { title: "Drill counts", fields: [
          { id: "spare", type: "seg", label: "Spare drills", def: 10, options: [{ v: 5, l: "5%" }, { v: 10, l: "10%" }, { v: 15, l: "15%" }, { v: 20, l: "20%" }] },
          { id: "bagSize", type: "select", label: "Drills per bag", def: 200, options: [{ v: 100, l: "100 drills" }, { v: 200, l: "200 drills" }, { v: 500, l: "500 drills" }, { v: 1000, l: "1,000 drills" }] }
        ] }
      ] },
      { id: "page", label: "Pages", groups: [
        { title: "Paper", fields: [
          { id: "pageSize", type: "select", label: "Page size", def: "letter", options: Kit.sizeOptions() },
          { id: "bleed", type: "toggle", label: "Add bleed (0.125 in) for KDP", def: false }
        ] },
        { title: "Kit parts", fields: [
          { id: "parts", type: "chips", def: ["cover", "guide", "legend", "charts", "finished"], minSel: 1, options: [{ v: "cover", l: "Cover" }, { v: "guide", l: "How to use" }, { v: "legend", l: "Legend" }, { v: "charts", l: "Chart pages" }, { v: "finished", l: "Finished look" }] },
          { id: "title", type: "text", label: "Chart title", def: "", placeholder: "Uses the picture name", max: 60 },
          { id: "footer", type: "text", label: "Footer text", def: "", placeholder: "Your shop or site name" }
        ] },
        { title: "Look", fields: [
          { id: "cover", type: "cards", label: "Cover style", def: "gallery", options: COVERS.map(function (c) { return { v: c[0], l: c[1], d: c[2] }; }) },
          { id: "accent", type: "swatches", label: "Accent colour", def: "#5b3e96", options: ACCENTS.map(function (a) { return { v: a[0], l: a[1], c: a[0] }; }) },
          { id: "titleFont", type: "select", label: "Title font", def: "Syne", options: FONTS.map(function (f) { return { v: f[0], l: f[0] + " (" + f[1] + ")" }; }) },
          { type: "buttons", key: "reset", buttons: [{ label: "Reset text edits", icon: "reset", run: function (api) { api.resetEdits(); } }] }
        ] }
      ] },
      { id: "sell", label: "Sell it", groups: [
        { title: "Listing text for Etsy or your shop", fields: [
          { id: "sellN", type: "html", def: 0, render: sellHTML, wire: sellWire, hint: "Written from your settings. Use Export > Listing mockup image for the pictures." }
        ] }
      ] }
    ],
    onRender: function () {
      var box = document.querySelector('[data-field="sum"] [data-html]');
      if (box) box.innerHTML = summaryHTML(API.p);
    },
    exports: [
      { label: "Whole kit PDF", hint: "Cover, guide, legend, every chart page", icon: "layers", run: function (api) { kitPDF(api); } },
      { label: "Canvas print file (PNG, 300 DPI)", hint: "Real size with border, for print shops", icon: "printer", run: function (api) { printFile(api); } },
      { label: "Legend (CSV)", hint: "Codes, names, drills, spare, bags", icon: "file", run: function (api) { legendCSV(api); } },
      { label: "Finished look (PNG)", hint: "The sparkling preview for listings", icon: "image", run: function (api) { finishedPNG(api); } }
    ],
    guide: {
      intro: "Diamond Painting Chart Maker turns any photo, clipart or built-in picture into a complete diamond painting chart: a symbol on every drill, a legend with codes and drill counts, a real-size canvas file for print shops and a sparkling preview of the finished piece.",
      steps: [
        "Open Picture and pick a built-in picture, or click the drop box to use your own photo.",
        "Open Canvas: choose the canvas size in cm or inches and square or round drills. The grid follows the real size.",
        "Open Chart: set the number of colours (10 to 60), dithering and the clean-up of lone drills.",
        "Press Sparkle view to see the finished look, then Export the whole kit PDF and the canvas print file."
      ],
      controls: [
        ["Canvas size", "The real canvas in cm or inches. A blank border is kept around the drills for framing."],
        ["Drill shape and size", "Square drills 2.5 mm or round drills 2.8 mm. The number of drills follows from the size."],
        ["Number of colours", "Picked from a palette of 512 drill colours with this tool's own neutral codes."],
        ["Dithering", "Mixes two colours in a fine pattern for smooth shading. Leave it off for clipart."],
        ["Drop rare colours", "Folds colours with only a handful of drills into the nearest colour, so you buy fewer bags."],
        ["Clean-up", "Removes lone drills (and tiny groups) that sit alone in another colour."],
        ["Sparkle view", "The finished look with moving light. Click a colour to see where it goes. Drill fixer repaints drills by hand."],
        ["New colour mix", "Builds the palette again with a different seed for a fresh variation."]
      ],
      exports: [
        ["Whole kit PDF", "Every page in one PDF, rendered one page at a time so even big kits work."],
        ["Canvas print file", "A PNG at 300 DPI with the real canvas size, symbols on colour and a printed legend in the border."],
        ["Legend (CSV)", "Symbol, code, colour name, hex, drills, spare and bags for each colour."],
        ["Finished look (PNG)", "The sparkling preview, ready for a listing photo."]
      ],
      tips: [
        "Faces and pets look best with 40 to 60 colours and dithering on at 60 to 70%.",
        "Clipart and cartoons look best with 15 to 25 colours, dithering off and clean-up on pairs.",
        "Round drills leave small gaps: pick them for extra sparkle, square drills for full coverage.",
        "Use the Sell it tab for a ready listing title, description and tags."
      ],
      trouble: [["The print file says a lower DPI", "Very large canvases are saved at a slightly lower DPI so the browser does not run out of memory."], ["My photo looks blotchy", "Raise the number of colours, switch dithering on, or lower Drop rare colours."]]
    }
  });

  /* paste a picture anywhere in the tool */
  document.addEventListener("paste", function (e) {
    if (e.target.closest && e.target.closest("[data-edit],input,textarea")) return;
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addUpload(files[0]); }
  });

  /* read-only hook for automated checks */
  window.dpTest = {
    lib: function () { return { size: LIB.length, codes: new Set(LIB.map(function (e) { return e.code; })).size, names: new Set(LIB.map(function (e) { return e.name; })).size }; },
    scenes: function () { return Object.keys(SCENES); },
    symbols: function () { return { n: SYMS.length, unique: new Set(SYMS).size }; },
    info: function () {
      var i = pages.info;
      if (!i) return null;
      return { cols: i.d.cols, rows: i.d.rows, colours: i.pal.length, removed: i.M.removed, left: i.M.left, lone: countIslands(i.M.cells, i.M.w, i.M.h, 1), total: i.M.total, sum: i.pal.reduce(function (a, e) { return a + e.count; }, 0), syms: new Set(i.pal.map(function (e) { return e.sym; })).size };
    }
  };
})();
</script>
</body>
</html>
