<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Backwards Sentence Studio ✦ KDP Puzzle Tool</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Sora:wght@400;600;700&family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #2c2c3a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      transition: background 0.3s ease;
    }

    .app {
      display: flex;
      flex-wrap: wrap;
      max-width: 1400px;
      width: 100%;
      background: #FFFBF0;
      border-radius: 2.8rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s;
    }

    /* Left Control Panel */
    .control-panel {
      background: #FF6B6B;
      color: #FFFBF0;
      padding: 2rem 1.8rem;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      transition: background 0.3s ease, color 0.3s;
      font-weight: 600;
    }

    .control-panel h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: #FFFBF0;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .audience-toggle {
      display: flex;
      background: rgba(255,255,255,0.25);
      border-radius: 3rem;
      padding: 0.3rem;
      gap: 0.2rem;
    }
    .audience-btn {
      flex: 1;
      text-align: center;
      padding: 0.65rem 0.3rem;
      border-radius: 2rem;
      font-weight: 800;
      cursor: pointer;
      background: transparent;
      color: #FFFBF0;
      border: none;
      font-size: 0.9rem;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }
    .audience-btn.active {
      background: #FFFBF0;
      color: #FF6B6B;
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 0.25rem;
      color: #FFFBF0;
      letter-spacing: 0.3px;
    }

    select, input[type="text"], input[type="range"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 1.5rem;
      border: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      background: #FFFBF0;
      color: #1f1f2b;
      font-size: 0.9rem;
      outline: 2px solid transparent;
      transition: 0.2s;
    }
    select:focus, input:focus {
      outline: 2px solid #FFD93D;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 600;
      color: #FFFBF0;
      margin-bottom: 0;
    }

    button {
      background: #4ECDC4;
      border: none;
      color: #1f1f2b;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 0 #2b9c94;
      border: 2px solid white;
      letter-spacing: 0.4px;
      font-family: 'Nunito', sans-serif;
    }
    button:hover {
      background: #FFD93D;
      color: #1f1f2b;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #ccaa2a;
    }

    .secondary-btn {
      background: #f7e8cf;
      box-shadow: 0 6px 0 #c4b393;
      color: #2c2c3a;
    }
    .secondary-btn:hover {
      background: #FFD93D;
    }

    .reveal-btn {
      background: #FFD93D;
      box-shadow: 0 6px 0 #ccaa2a;
      color: #1f1f2b;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Right Preview Panel */
    .preview-panel {
      flex: 1;
      padding: 2rem 2.2rem 2rem 1.8rem;
      background: #FFFBF0;
      overflow-y: auto;
      max-height: 92vh;
      transition: background 0.3s;
    }

    .worksheet-container {
      background: white;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      border-radius: 2rem;
      padding: 2.5rem 2.2rem;
      font-family: 'Nunito', sans-serif;
      transition: all 0.3s;
    }

    .page-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: #FF6B6B;
      text-align: center;
      margin-bottom: 0.4rem;
      word-break: break-word;
    }
    .subtitle {
      text-align: center;
      font-weight: 700;
      margin-bottom: 2.2rem;
      color: #2c2c3a;
      font-size: 1.1rem;
    }

    .puzzle-row {
      margin-bottom: 2rem;
      transition: 0.2s;
    }
    .puzzle-number {
      font-weight: 800;
      color: #4ECDC4;
      margin-right: 0.6rem;
      font-size: 1.2rem;
    }
    .reversed-box {
      background: #F5F5F5;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 0.8rem 1.2rem;
      font-family: 'Courier Prime', monospace;
      font-size: 1.05rem;
      letter-spacing: 0.6px;
      margin: 0.3rem 0 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafaf5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .type-badge {
      font-style: italic;
      color: #888;
      font-size: 0.8rem;
      margin-left: 0.6rem;
      background: #eee;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
    }
    .answer-line {
      margin-left: 2rem;
      font-family: 'Courier Prime', monospace;
      color: #2c2c3a;
      margin-top: 0.2rem;
      font-size: 1rem;
    }
    .hint-circle {
      display: inline-block;
      background: #FFD93D;
      color: #1f1f2b;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      text-align: center;
      font-weight: 800;
      margin-right: 0.3rem;
      font-size: 0.9rem;
      line-height: 26px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .answer-key-section {
      margin-top: 2.5rem;
      border-top: 3px dashed #4ECDC4;
      padding-top: 1.8rem;
      color: #1f1f2b;
    }

    @media print {
      body { background: white; }
      .control-panel { display: none; }
      .preview-panel { max-height: none; overflow: visible; padding: 0; }
      .worksheet-container { box-shadow: none; border-radius: 0; padding: 0.75in; }
      button { display: none; }
    }
  </style>
</head>
<body>
<div class="app" id="appContainer">
  <!-- LEFT PANEL -->
  <div class="control-panel" id="controlPanel">
    <h2>🔤 Backwards Studio</h2>
    
    <div class="audience-toggle" id="audienceToggle">
      <div class="audience-btn active" data-audience="kids">🧒 KIDS</div>
      <div class="audience-btn" data-audience="tweens">🧑 TWEENS</div>
      <div class="audience-btn" data-audience="adults">🧔 ADULTS</div>
    </div>

    <div>
      <label>🔄 Reversal Type</label>
      <div class="radio-group" id="reversalGroup">
        <label><input type="radio" name="reversalType" value="word" checked> Word</label>
        <label><input type="radio" name="reversalType" value="sentence"> Sentence</label>
        <label><input type="radio" name="reversalType" value="full"> Full</label>
        <label><input type="radio" name="reversalType" value="mixed"> Mixed</label>
      </div>
    </div>

    <div>
      <label>📂 Category</label>
      <select id="categorySelect"></select>
    </div>

    <div class="slider-row">
      <label>🔢 Puzzles: <span id="puzzleCountDisplay">8</span></label>
      <input type="range" id="puzzleCountSlider" min="6" max="12" step="2" value="8">
    </div>

    <div>
      <label>✏️ Answer Line Style</label>
      <select id="lineStyleSelect">
        <option value="single">Single line ________</option>
        <option value="dotted">Dotted . . . . .</option>
        <option value="grid">Grid boxes □□□□</option>
      </select>
    </div>

    <div>
      <label>🔢 Numbering Style</label>
      <select id="numberingStyle">
        <option value="numbers">Numbers (1,2,3)</option>
        <option value="letters">Letters (A,B,C)</option>
        <option value="bullets">Bullets (•)</option>
      </select>
    </div>

    <div class="toggle-row">
      <label>💡 Show First Letter Hint</label>
      <input type="checkbox" id="hintToggle">
    </div>
    <div class="toggle-row">
      <label>🔑 Show Answer Key</label>
      <input type="checkbox" id="answerKeyToggle" checked>
    </div>

    <input type="text" id="pageTitleInput" value="Backwards Brain Buster!">
    <input type="text" id="subtitleInput" value="Can you decode these backwards sentences? Write the correct sentence on the line!">

    <button id="generateBtn">✨ Generate Worksheet</button>
    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button id="shuffleBtn" class="secondary-btn">🎲 Reshuffle</button>
      <button id="revealOneBtn" class="reveal-btn">👁️ Reveal One</button>
      <button id="addPageBtn" class="secondary-btn">➕ Add Page</button>
      <button id="printBtn" class="secondary-btn">🖨️ Print</button>
    </div>
  </div>

  <!-- RIGHT PREVIEW PANEL -->
  <div class="preview-panel" id="previewPanel">
    <div class="worksheet-container" id="worksheetContent"></div>
  </div>
</div>

  function ensureCategory(audience, cat) {
    if (!sentenceBank[audience]) sentenceBank[audience] = {};
    if (!sentenceBank[audience][cat]) {
      sentenceBank[audience][cat] = sentenceBank[audience]["Animal Facts"] || sentenceBank[audience]["Famous Proverbs"] || ["Default example sentence."];
    }
  }

  var audienceBtns = document.querySelectorAll('.audience-btn');
  var catSelect = document.getElementById('categorySelect');
  var puzzleCountSlider = document.getElementById('puzzleCountSlider');
  var puzzleCountDisplay = document.getElementById('puzzleCountDisplay');
  var generateBtn = document.getElementById('generateBtn');
  var worksheetContent = document.getElementById('worksheetContent');
  var pageTitleInput = document.getElementById('pageTitleInput');
  var subtitleInput = document.getElementById('subtitleInput');
  var hintToggle = document.getElementById('hintToggle');
  var answerKeyToggle = document.getElementById('answerKeyToggle');
  var lineStyleSelect = document.getElementById('lineStyleSelect');
  var numberingStyleSelect = document.getElementById('numberingStyle');
  var controlPanel = document.getElementById('controlPanel');
  var previewPanel = document.getElementById('previewPanel');

  var currentAudience = 'kids';
  var currentSentencesData = [];

  function reverseWord(str) {
    return str.split('').reverse().join('');
  }

  function wordReversal(sentence) {
    var words = sentence.split(' ');
    return words.map(function(w) {
      var punct = '';
      if (/[.,!?;:]$/.test(w)) { punct = w.slice(-1); w = w.slice(0,-1); }
      return reverseWord(w) + punct;
    }).join(' ');
  }

  function sentenceReversal(sentence) {
    return sentence.split(' ').reverse().join(' ');
  }

  function fullReversal(sentence) {
    return sentence.split('').reverse().join('');
  }

  function applyReversal(sentence, type) {
    if (type === 'word') return wordReversal(sentence);
    if (type === 'sentence') return sentenceReversal(sentence);
    if (type === 'full') return fullReversal(sentence);
    return sentence;
  }

  function getRandomReversalType() {
    var types = ['word','sentence','full'];
    return types[Math.floor(Math.random() * types.length)];
  }

  function getTypeLabel(type) {
    if (type === 'word') return 'W';
    if (type === 'sentence') return 'S';
    return 'F';
  }

  function generatePuzzleData() {
    var audience = currentAudience;
    var cat = catSelect.value;
    var puzzleCount = parseInt(puzzleCountSlider.value);
    var reversalMode = document.querySelector('input[name="reversalType"]:checked').value;
    
    ensureCategory(audience, cat);
    var sentences = sentenceBank[audience][cat] || ["Default example sentence."];
    var selected = [];
    for (var i = 0; i < puzzleCount; i++) {
      var idx = Math.floor(Math.random() * sentences.length);
      var original = sentences[idx];
      var type = reversalMode === 'mixed' ? getRandomReversalType() : reversalMode;
      var reversed = applyReversal(original, type);
      selected.push({ original: original, reversed: reversed, type: type });
    }
    currentSentencesData = selected;
    renderWorksheet(selected);
  }

  function renderWorksheet(data) {
    var numbering = numberingStyleSelect.value;
    var hintEnabled = hintToggle.checked;
    var answerKeyEnabled = answerKeyToggle.checked;
    var lineStyle = lineStyleSelect.value;
    var title = pageTitleInput.value || "Backwards Brain Buster!";
    var subtitle = subtitleInput.value || "";

    var html = '<div class="page-title">' + title + '</div>';
    if (subtitle) html += '<div class="subtitle">' + subtitle + '</div>';

    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      var numLabel = '';
      if (numbering === 'numbers') numLabel = (i+1) + '.';
      else if (numbering === 'letters') numLabel = String.fromCharCode(65 + i) + '.';
      else numLabel = '•';

      var hintChar = '';
      if (hintEnabled && item.original.length > 0) {
        var firstWord = item.original.trim().split(' ')[0];
        hintChar = firstWord.charAt(0).toUpperCase();
      }

      var typeBadge = '';
      if (currentAudience === 'adults' || document.querySelector('input[name="reversalType"]:checked').value === 'mixed') {
        typeBadge = '<span class="type-badge">(' + getTypeLabel(item.type) + ')</span>';
      }

      var answerLineHtml = '';
      if (lineStyle === 'single') answerLineHtml = '________________________';
      else if (lineStyle === 'dotted') answerLineHtml = '. . . . . . . . . . . . . . .';
      else answerLineHtml = '□□□□□□□□□□□□□□□□□□';

      html += '<div class="puzzle-row" id="puzzle-' + i + '">';
      html += '<span class="puzzle-number">' + numLabel + '</span>';
      if (hintChar) html += '<span class="hint-circle">' + hintChar + '</span>';
      html += '<div class="reversed-box"><span>' + item.reversed + '</span>' + typeBadge + '</div>';
      html += '<div class="answer-line">' + answerLineHtml + '</div>';
      html += '</div>';
    }

    if (answerKeyEnabled) {
      html += '<div class="answer-key-section"><strong>🔑 Answer Key</strong><br>';
      for (var j = 0; j < data.length; j++) {
        html += (j+1) + '. ' + data[j].original + '<br>';
      }
      html += '</div>';
    }
    worksheetContent.innerHTML = html;
  }

  function revealOneAnswer() {
    if (currentSentencesData.length === 0) return;
    var randomIndex = Math.floor(Math.random() * currentSentencesData.length);
    var item = currentSentencesData[randomIndex];
    var puzzleDiv = document.getElementById('puzzle-' + randomIndex);
    if (puzzleDiv) {
      var answerLine = puzzleDiv.querySelector('.answer-line');
      if (answerLine) {
        answerLine.innerHTML = '<strong style="color:#4ECDC4;">✨ ' + item.original + '</strong>';
        answerLine.style.background = '#f0fff0';
        setTimeout(function() {
          if (answerLine) {
            var lineStyle = lineStyleSelect.value;
            if (lineStyle === 'single') answerLine.innerHTML = '________________________';
            else if (lineStyle === 'dotted') answerLine.innerHTML = '. . . . . . . . . . . . . . .';
            else answerLine.innerHTML = '□□□□□□□□□□□□□□□□□□';
            answerLine.style.background = 'transparent';
          }
        }, 2500);
      }
    }
  }

  function updateUIForAudience(audience) {
    currentAudience = audience;
    var categories = [];
    if (audience === 'kids') categories = ["Animal Facts","Food & Eating","School & Learning","Family & Home","Nature & Weather","Bedtime & Dreams"];
    else if (audience === 'tweens') categories = ["Fun Science Facts","World Records","Sports & Games","History Snippets","Geography Facts","Technology & Inventions"];
    else categories = ["Famous Proverbs","Idioms & Expressions","Fun Trivia","Motivational Quotes","Tongue Twisters","Did You Know Facts"];
    
    catSelect.innerHTML = '';
    categories.forEach(function(c){ var opt = document.createElement('option'); opt.value = c; opt.textContent = c; catSelect.appendChild(opt); });
    
    if (audience === 'kids') {
      controlPanel.style.background = '#FF6B6B';
      previewPanel.style.background = '#FFFBF0';
    } else if (audience === 'tweens') {
      controlPanel.style.background = '#3B4CC0';
      previewPanel.style.background = '#F0F4FF';
    } else {
      controlPanel.style.background = '#1a1a1a';
      previewPanel.style.background = '#FAFAFA';
    }
  }

  audienceBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      audienceBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      updateUIForAudience(this.dataset.audience);
      generatePuzzleData();
    });
  });

  puzzleCountSlider.addEventListener('input', function(){
    puzzleCountDisplay.textContent = this.value;
  });
  generateBtn.addEventListener('click', generatePuzzleData);
  document.getElementById('shuffleBtn').addEventListener('click', generatePuzzleData);
  document.getElementById('revealOneBtn').addEventListener('click', revealOneAnswer);
  document.getElementById('addPageBtn').addEventListener('click', function(){
    alert('New page added! (simulated)');
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  document.querySelectorAll('input[name="reversalType"]').forEach(function(r){
    r.addEventListener('change', generatePuzzleData);
  });
  catSelect.addEventListener('change', generatePuzzleData);
  lineStyleSelect.addEventListener('change', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });
  numberingStyleSelect.addEventListener('change', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });
  hintToggle.addEventListener('change', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });
  answerKeyToggle.addEventListener('change', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });
  pageTitleInput.addEventListener('input', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });
  subtitleInput.addEventListener('input', function(){ if(currentSentencesData.length) renderWorksheet(currentSentencesData); });

  updateUIForAudience('kids');
  generatePuzzleData();
})();
</script>
</body>
</html>
