<html lang="en">
<head>

<title>Story Bible Studio</title>

<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }
}
@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }
  .k-body[data-pane="preview"] .k-side { display: none; }
  .k-side { border-right: 0; }
  .k-top { padding: 8px 10px; gap: 6px; }
  .k-pname, .k-hide-m { display: none; }
  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }
  .k-mnav { display: grid; grid-template-columns: 1fr 1fr; background: var(--k-panel); border-top: 1px solid var(--k-line); }
  .k-mnav button {
    border: 0; background: none; padding: 11px 0 calc(11px + env(safe-area-inset-bottom)); font-weight: 800; font-size: 13px;
    color: var(--k-muted); display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px;
  }
  .k-mnav button.is-on { color: var(--k-ink); box-shadow: inset 0 3px 0 var(--k-accent); }
  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }
  .k-dl dd { margin-bottom: 8px; }
  .k-pager span { min-width: 0; flex: 1; }
}

/* ---------- Exact print: one sheet per page, nothing else ---------- */
@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }
  .k-offscreen { position: static; left: 0; }
  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }
}
</style>
<style>
/* Direction: Sidebar + Canvas in a dark-academia archive language (bottle-green stacks, aged ivory
   index cards, vermilion rubric marks, Fraunces + Inter Tight), because series authors keep a
   private archive of their world and want it to feel like a quiet reading room, not a database. */
:root {
  --k-bg: #ebe4d6;
  --k-panel: #fbf8f1;
  --k-panel-2: #f1ebde;
  --k-ink: #1b2421;
  --k-muted: #66706a;
  --k-line: #ddd3c1;
  --k-accent: #1f4d43;
  --k-accent-ink: #f7f0e1;
  --k-accent-soft: #dce8e1;
  --k-stage: #24302c;
  --k-radius: 10px;
  --k-font: "Inter Tight", system-ui, sans-serif;
  --k-display: "Fraunces", Georgia, serif;
  --sb-red: #b5432c;
}
.k-title { font-weight: 600; font-size: 18px; letter-spacing: .01em; }
.k-stage {
  background-color: #24302c;
  background-image: linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
  background-size: 28px 28px;
}
.k-stage .k-bar { background: #1c2623; border-bottom-color: #34413c; color: #e8e1d2; }
.k-stage .k-bar .k-saved { color: #b9c2bb; }
.k-stage .k-bar .k-btn { background: #2b3833; border-color: #3d4c46; color: #efe8d8; }
.k-stage .k-bar .k-btn.k-primary { background: var(--k-accent-ink); color: var(--k-accent); border-color: var(--k-accent-ink); }
.k-stage .k-bar .k-chip { background: #2b3833; border-color: #3d4c46; color: #e8e1d2; }
.k-stage .k-bar .k-chip.is-on { background: #efe8d8; color: #1b2421; }
.k-pager { background: #1c2623; color: #e8e1d2; }
.k-pager .k-btn { background: #2b3833; border-color: #3d4c46; color: #efe8d8; }
.k-pages.is-work { margin: -26px; }

/* ---------- Archive workspace ---------- */
.sb-ws { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; padding: 14px; height: calc(100dvh - 160px); min-height: 460px; }
.sb-left, .sb-right { background: var(--k-panel); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.sb-tools { padding: 12px 12px 10px; border-bottom: 1px solid var(--k-line); display: grid; gap: 8px; background: var(--k-panel-2); }
.sb-search { position: relative; }
.sb-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--k-muted); }
.sb-search .k-input { padding-left: 32px; }
.sb-types { display: flex; flex-wrap: wrap; gap: 4px; }
.sb-types button { border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 99px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--k-ink); }
.sb-types button.is-on { background: var(--k-accent); border-color: var(--k-accent); color: var(--k-accent-ink); }
.sb-types button small { font-weight: 600; opacity: .7; margin-left: 3px; }
.sb-row2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.sb-row2 select { min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--k-line); background: var(--k-panel); font-size: 12px; }
.sb-list { flex: 1; overflow-y: auto; padding: 6px; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.sb-item:hover { background: var(--k-panel-2); }
.sb-item.is-on { background: var(--k-accent-soft); border-color: #b9cfc3; }
.sb-item b { display: block; font-size: 13.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item small { display: block; font-size: 11.5px; color: var(--k-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item > div { min-width: 0; flex: 1; }
.sb-flag { width: 9px; height: 9px; border-radius: 50%; background: var(--sb-red); flex: none; box-shadow: 0 0 0 3px rgba(181, 67, 44, .18); }
.sb-mono { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--k-display); font-weight: 600; font-size: 14px; color: #fff; background-size: cover; background-position: center; }
.sb-mono.sq { border-radius: 9px; }
.sb-mono svg { width: 18px; height: 18px; }
.sb-group-h { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--k-muted); padding: 10px 9px 4px; }
.sb-none { padding: 26px 14px; text-align: center; color: var(--k-muted); font-size: 13px; }
.sb-mark { background: #f6d8a8; border-radius: 2px; }

.sb-dhead { display: flex; align-items: center; gap: 14px; padding: 16px 18px 14px; border-bottom: 1px solid var(--k-line); background: var(--k-panel-2); }
.sb-dhead .sb-mono { width: 64px; height: 64px; font-size: 24px; }
.sb-dhead h2 { margin: 0; font-family: var(--k-display); font-weight: 600; font-size: 25px; line-height: 1.1; overflow-wrap: anywhere; }
.sb-dhead > div { flex: 1; min-width: 0; }
.sb-sub { font-size: 12.5px; color: var(--k-muted); margin-top: 3px; }
.sb-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.sb-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #fff; border: 1px solid var(--k-line); }
.sb-badge.bk { background: var(--k-accent); color: var(--k-accent-ink); border-color: var(--k-accent); }
.sb-badge.dead { background: #3a2a26; color: #f3d9cf; border-color: #3a2a26; }
.sb-dact { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.sb-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
.sb-sec { margin-bottom: 16px; }
.sb-sec h3 { margin: 0 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--k-accent); }
.sb-sec p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.sb-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.sb-kv div { background: var(--k-panel-2); border: 1px solid var(--k-line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.sb-kv small { display: block; font-size: 10.5px; font-weight: 700; color: var(--k-muted); text-transform: uppercase; letter-spacing: .06em; }
.sb-kv span { font-size: 13.5px; overflow-wrap: anywhere; }
.sb-link { color: var(--sb-red); font-weight: 700; text-decoration: none; border-bottom: 1px dotted var(--sb-red); cursor: pointer; }
.sb-link:hover { background: #fbe6dd; }
.sb-bad { color: #8a6d00; background: #fff3c4; border-radius: 3px; padding: 0 2px; }
.sb-rels { display: grid; gap: 5px; }
.sb-rel { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; flex-wrap: wrap; }
.sb-rel i { font-style: normal; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); }
.sb-rel em { color: var(--k-muted); font-size: 12.5px; }
.sb-chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-chiprow .sb-link { border: 1px solid #e7c4b7; border-radius: 99px; padding: 2px 9px; font-size: 12.5px; background: #fff7f3; }
.sb-ages { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-ages div { text-align: center; border: 1px solid var(--k-line); border-radius: 8px; padding: 5px 10px; background: var(--k-panel-2); }
.sb-ages b { display: block; font-family: var(--k-display); font-size: 19px; font-weight: 600; }
.sb-ages small { font-size: 10.5px; color: var(--k-muted); font-weight: 700; }
.sb-ages .warn { border-color: var(--sb-red); background: #fbe6dd; }
.sb-issue { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; background: #fbe6dd; border: 1px solid #efc3b4; margin-bottom: 6px; }
.sb-issue.warn { background: #fff4d6; border-color: #ecd9a0; }
.sb-issue svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--sb-red); }
.sb-issue.warn svg { color: #a07800; }

/* edit form */
.sb-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.sb-form .full { grid-column: 1 / -1; }
.sb-form .k-label { margin-bottom: 4px; }
.sb-form textarea { resize: vertical; }
.sb-ftitle { grid-column: 1 / -1; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--k-accent); border-top: 1px solid var(--k-line); padding-top: 12px; margin-top: 4px; }
.sb-bookpick { display: flex; flex-wrap: wrap; gap: 5px; }
.sb-bookpick button { border: 1px solid var(--k-line); background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
.sb-bookpick button.is-on { background: var(--k-accent); color: var(--k-accent-ink); border-color: var(--k-accent); }
.sb-lrow { display: grid; grid-template-columns: 1.1fr 1.2fr 1.4fr auto; gap: 6px; margin-bottom: 6px; align-items: center; }
.sb-lrow.facts { grid-template-columns: .9fr 1fr 1.2fr auto auto; }
.sb-lrow select, .sb-lrow input[type=text] { min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--k-line); background: #fff; font-size: 12.5px; }
.sb-lrow label { font-size: 11px; font-weight: 700; color: var(--k-muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.sb-agegrid { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-agegrid label { display: grid; gap: 2px; font-size: 11px; font-weight: 700; color: var(--k-muted); }
.sb-agegrid input { width: 78px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--k-line); }
.sb-photo { display: flex; align-items: center; gap: 10px; }
.sb-ac { position: absolute; z-index: 50; background: #fff; border: 1px solid var(--k-line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); padding: 4px; max-height: 220px; overflow-y: auto; min-width: 220px; }
.sb-ac button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.sb-ac button.is-on, .sb-ac button:hover { background: var(--k-accent-soft); }
.sb-ac small { color: var(--k-muted); margin-left: auto; font-size: 11px; }
.sb-hintline { font-size: 11.5px; color: var(--k-muted); margin-top: 3px; }
.sb-back { display: none; }
.sb-back svg { width: 16px; height: 16px; }

/* side panel pieces */
.sb-tpls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sb-tpls .k-card { text-align: left; }
.sb-shelf { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.sb-shelf-row { display: flex; align-items: center; gap: 6px; padding: 8px; border: 1px solid var(--k-line); border-radius: 9px; background: var(--k-panel); }
.sb-shelf-row > div { flex: 1; min-width: 0; }
.sb-shelf-row b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-shelf-row small { font-size: 11px; color: var(--k-muted); }
.sb-shelf-row.is-on { border-color: var(--k-accent); box-shadow: inset 3px 0 0 var(--k-accent); }
.sb-books .sb-brow { display: grid; grid-template-columns: 26px 1fr 70px auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.sb-books .sb-brow b { font-family: var(--k-display); font-size: 15px; text-align: center; }
.sb-books input { min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--k-line); background: #fff; font-size: 12.5px; }
.sb-score { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--k-panel-2); border: 1px solid var(--k-line); margin-bottom: 10px; }
.sb-score b { font-family: var(--k-display); font-size: 30px; font-weight: 600; line-height: 1; }
.sb-score small { font-size: 12px; color: var(--k-muted); }
.sb-score.ok b { color: var(--k-ok); }
.sb-score.bad b { color: var(--sb-red); }
.sb-ilist .sb-issue { cursor: default; flex-wrap: wrap; }
.sb-ilist .sb-issue > div { flex: 1; min-width: 0; }
.sb-ilist .sb-issue .k-btn { margin-top: 4px; }
@media (max-width: 760px) {
  .k-pages.is-work { margin: -22px -12px -16px; }
  .sb-ws { grid-template-columns: 1fr; height: calc(100dvh - 186px); padding: 8px; gap: 8px; }
  .sb-ws[data-mob="list"] .sb-right, .sb-ws[data-mob="detail"] .sb-left { display: none; }
  .sb-back { display: inline-flex; }
  .sb-form { grid-template-columns: 1fr; }
  .sb-lrow, .sb-lrow.facts { grid-template-columns: 1fr 1fr; }
  .sb-dhead { flex-wrap: wrap; padding: 12px; }
  .sb-dhead .sb-mono { width: 48px; height: 48px; font-size: 18px; }
  .sb-dhead h2 { font-size: 20px; }
  .sb-back { order: -2; flex: 0 0 auto; }
  .sb-dact { order: -1; flex: 1 1 auto; justify-content: flex-end; }
  .sb-dhead > div:not(.sb-dact) { flex: 1 1 calc(100% - 70px); }
  .sb-body { padding: 12px; }
}

/* ---------- Printable bible pages. 1em = 1% of the page width (scaled by --k on small trims). ---------- */
.sbp { position: absolute; left: 0; top: 0; right: 0; bottom: 0; font-family: var(--bf), Georgia, serif; color: #1f2321; }
.sbp-run { position: absolute; display: flex; justify-content: space-between; gap: 2em; border-bottom: .12em solid var(--ac); padding-bottom: .5em; }
.sbp-run span { font-family: "Inter Tight", sans-serif; font-size: 1.05em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #5c625f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbp-run span:last-child { color: var(--ac); }
.sbp-foot { position: absolute; text-align: center; }
.sbp-foot span { font-family: "Inter Tight", sans-serif; font-size: 1.1em; font-weight: 700; color: #777; letter-spacing: .1em; }
.sbp-flow { position: absolute; }
.sbp-flow > div { position: absolute; left: 0; right: 0; }
.sbb { display: flow-root; }
.sbb-sec { padding-bottom: 1.6em; }
.sbb-sec small { display: block; font-family: "Inter Tight", sans-serif; font-size: 1.1em; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: var(--ac); }
.sbb-sec h1 { margin: .2em 0 0; font-family: var(--tf), Georgia, serif; font-weight: 600; font-size: 4.6em; line-height: 1.05; }
.sbb-sec p { margin: .5em 0 0; font-size: 1.4em; font-style: italic; color: #555; line-height: 1.45; }
.sbb-sec i { display: block; width: 9em; height: .35em; background: var(--ac); margin-top: 1em; }
.sbb-ch { display: flex; gap: 2.2em; align-items: center; padding-bottom: 1.4em; border-bottom: .12em solid #d7d2c8; margin-bottom: 1.2em; }
.sbb-pic { width: 13em; height: 13em; flex: none; border-radius: 50%; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; border: .3em solid #fff; box-shadow: 0 0 0 .14em var(--ac); }
.sbb-pic span { font-family: var(--tf), Georgia, serif; font-size: 4.6em; font-weight: 600; color: #fff; }
.sbb-pic.sq { border-radius: 1em; }
.sbb-ch > div:last-child { flex: 1; min-width: 0; }
.sbb-ch small { display: block; font-family: "Inter Tight", sans-serif; font-size: 1.1em; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--ac); }
.sbb-ch h2 { margin: .15em 0 .1em; font-family: var(--tf), Georgia, serif; font-weight: 600; font-size: 3.6em; line-height: 1.05; overflow-wrap: anywhere; }
.sbb-ch p { margin: .25em 0 0; font-size: 1.35em; color: #555; line-height: 1.4; }
.sbb-tags { margin-top: .5em; }
.sbb-tags span { display: inline-block; font-family: "Inter Tight", sans-serif; font-size: 1.02em; font-weight: 700; border: .1em solid #bbb; border-radius: 1em; padding: .1em .7em; margin: 0 .4em .4em 0; color: #444; }
.sbb-tags span.bk { background: var(--ac); border-color: var(--ac); color: #fff; }
.sbb-lab { font-family: "Inter Tight", sans-serif; font-size: 1.05em; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ac); margin: 0 0 .4em; padding-top: .9em; }
.sbb-p { margin: 0; font-size: 1.55em; line-height: 1.5; padding-bottom: .5em; overflow-wrap: anywhere; }
.sbb-p b.mn { color: var(--ac); }
.sbb-kv { display: flex; flex-wrap: wrap; border-top: .1em solid #e2ddd3; }
.sbb-kv div { width: 50%; box-sizing: border-box; padding: .5em 1em .5em 0; border-bottom: .1em solid #e2ddd3; }
.sbb-kv small { display: block; font-family: "Inter Tight", sans-serif; font-size: .95em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #888; }
.sbb-kv span { font-size: 1.45em; line-height: 1.35; overflow-wrap: anywhere; }
.sbb-ages { display: flex; flex-wrap: wrap; }
.sbb-ages div { text-align: center; border: .12em solid #d7d2c8; border-radius: .6em; padding: .4em 1.2em; margin: 0 .8em .8em 0; }
.sbb-ages b { display: block; font-family: var(--tf), Georgia, serif; font-size: 2.4em; font-weight: 600; line-height: 1.1; }
.sbb-ages small { font-family: "Inter Tight", sans-serif; font-size: 1em; font-weight: 700; color: #777; }
.sbb-li { font-size: 1.5em; line-height: 1.45; padding: .15em 0 .35em 1.2em; position: relative; overflow-wrap: anywhere; }
.sbb-li::before { content: ""; position: absolute; left: 0; top: .62em; width: .45em; height: .45em; border-radius: 50%; background: var(--ac); }
.sbb-li i { font-style: normal; font-family: "Inter Tight", sans-serif; font-size: .78em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #777; }
.sbb-li em { color: #666; }
.sbb-ent { border-top: .25em solid var(--ac); padding-top: .8em; margin-top: .6em; }
.sbb-ent h3 { margin: 0; font-family: var(--tf), Georgia, serif; font-weight: 600; font-size: 2.5em; line-height: 1.12; overflow-wrap: anywhere; }
.sbb-ent small { display: block; font-family: "Inter Tight", sans-serif; font-size: 1.05em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #777; margin-top: .3em; }
.sbb-ent p { margin: .5em 0 0; font-size: 1.55em; line-height: 1.5; font-style: italic; color: #333; }
.sbb-rule { display: flex; gap: 1.2em; padding: .8em 0; border-bottom: .1em solid #e2ddd3; }
.sbb-rule > b { flex: none; width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--ac); color: #fff; display: flex; align-items: center; justify-content: center; font-family: "Inter Tight", sans-serif; font-size: 1.3em; }
.sbb-rule > div { flex: 1; min-width: 0; }
.sbb-rule h3 { margin: 0 0 .2em; font-family: var(--tf), Georgia, serif; font-weight: 600; font-size: 2em; line-height: 1.15; }
.sbb-gl { padding: .55em 0; border-bottom: .1em solid #e2ddd3; }
.sbb-gl b { font-family: var(--tf), Georgia, serif; font-size: 1.9em; font-weight: 600; }
.sbb-gl i { font-size: 1.3em; color: #777; margin-left: .5em; }
.sbb-gl p { margin: .2em 0 0; font-size: 1.5em; line-height: 1.45; }
.sbb-tr { display: flex; border-bottom: .1em solid #e2ddd3; }
.sbb-tr > div { padding: .6em .5em; overflow: hidden; overflow-wrap: anywhere; box-sizing: border-box; flex: none; }
.sbb-tr > div > span { font-size: 1.25em; line-height: 1.3; }
.sbb-tr.th > div > span { font-family: "Inter Tight", sans-serif; font-weight: 800; font-size: 1em; letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.sbb-tr.th { background: var(--ac); border-bottom: 0; }
.sbb-tr .c { text-align: center; }
.sbb-iss { display: flex; gap: 1em; padding: .7em 0; border-bottom: .1em solid #e2ddd3; }
.sbb-iss > b { flex: none; font-family: "Inter Tight", sans-serif; font-size: 1em; font-weight: 800; letter-spacing: .1em; padding: .25em .7em; border-radius: .4em; color: #fff; background: #b5432c; height: 1.3em; line-height: 1.3em; }
.sbb-iss > b.w { background: #a07800; }
.sbb-iss p { margin: 0; font-size: 1.45em; line-height: 1.45; flex: 1; min-width: 0; }
.sbb-lines { position: relative; }
.sbb-lines i { display: block; border-bottom: .1em solid #d9d3c7; height: 2.6em; }
.sbb-stats { display: flex; flex-wrap: wrap; gap: 1em; }
.sbb-stats div { flex: 1 1 12em; border: .12em solid #d7d2c8; border-radius: .7em; padding: .8em 1em; }
.sbb-stats b { display: block; font-family: var(--tf), Georgia, serif; font-size: 3em; font-weight: 600; line-height: 1; color: var(--ac); }
.sbb-stats small { font-family: "Inter Tight", sans-serif; font-size: 1.05em; font-weight: 700; color: #666; letter-spacing: .06em; text-transform: uppercase; }
/* cover */
.sbp-cover { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--ac); }
.sbp-frame { position: absolute; border: .25em solid rgba(255, 255, 255, .7); }
.sbp-frame2 { position: absolute; border: .1em solid rgba(255, 255, 255, .45); }
.sbp-cv { position: absolute; text-align: center; color: #fff; }
.sbp-cv small { display: block; font-family: "Inter Tight", sans-serif; font-size: 1.4em; font-weight: 800; letter-spacing: .45em; text-transform: uppercase; opacity: .85; }
.sbp-cv h1 { margin: 0; font-family: var(--tf), Georgia, serif; font-weight: 600; line-height: 1.02; }
.sbp-cv p { margin: 0; font-size: 2.05em; font-style: italic; line-height: 1.45; opacity: .92; }
.sbp-cv .by { font-family: "Inter Tight", sans-serif; font-size: 1.6em; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
.sbp-books { position: absolute; display: flex; justify-content: center; flex-wrap: wrap; }
.sbp-books div { color: #fff; text-align: center; padding: 0 1.4em; border-left: .1em solid rgba(255, 255, 255, .4); }
.sbp-books div:first-child { border-left: 0; }
.sbp-books b { display: block; font-family: var(--tf), Georgia, serif; font-size: 3.2em; font-weight: 600; }
.sbp-books span { font-size: 1.45em; font-style: italic; opacity: .9; }
.sbp-orn { position: absolute; height: .2em; background: rgba(255, 255, 255, .7); }
/* contents */
.sbp-toc { position: absolute; }
.sbp-toc-row { display: flex; align-items: baseline; gap: .8em; padding: .55em 0; }
.sbp-toc-row span { font-family: var(--tf), Georgia, serif; font-size: 2.2em; }
.sbp-toc-row small { font-family: "Inter Tight", sans-serif; font-size: 1.1em; color: #888; font-weight: 600; }
.sbp-toc-row i { flex: 1; border-bottom: .16em dotted #aaa; }
.sbp-toc-row b { font-family: "Inter Tight", sans-serif; font-size: 1.6em; color: var(--ac); }
/* timeline */
.sbp-tl { position: absolute; }
.sbp-tl-axis { position: absolute; left: 0; right: 0; height: .35em; background: var(--ac); border-radius: 1em; }
.sbp-tl-pt { position: absolute; width: 2.2em; height: 2.2em; margin-left: -1.1em; border-radius: 50%; background: #fff; border: .4em solid var(--ac); box-sizing: border-box; }
.sbp-tl-lab { position: absolute; width: 18em; margin-left: -9em; text-align: center; }
.sbp-tl-lab b { display: block; font-family: var(--tf), Georgia, serif; font-size: 1.7em; font-weight: 600; line-height: 1.15; }
.sbp-tl-lab span { font-family: "Inter Tight", sans-serif; font-size: 1.1em; font-weight: 700; color: var(--ac); letter-spacing: .08em; }
.sbp-tl-ev { position: absolute; width: 16em; margin-left: -8em; text-align: center; }

<body>
<script id="kit-js">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0
   Shared engine for every tool: controls, pages, click-to-edit, undo/redo,
   autosave, saved projects, PDF / PNG / ZIP / print / listing mockups,
   guide, shortcuts, toasts and dialogs. A tool only describes its controls

   ========================================================================== */
(function () {
  "use strict";

  var LIBS = {
    html2canvas: "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    jszip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
  };

  /* Page sizes in inches (KDP trim sizes plus A4 / A5). */

    letter: { label: "US Letter 8.5 x 11 in", w: 8.5, h: 11 },
    a4: { label: "A4 210 x 297 mm", w: 8.27, h: 11.69 },
    "8x10": { label: "8 x 10 in", w: 8, h: 10 },
    "7x10": { label: "7 x 10 in", w: 7, h: 10 },
    "6x9": { label: "6 x 9 in", w: 6, h: 9 },
    "8.25x8.25": { label: "Square 8.25 x 8.25 in", w: 8.25, h: 8.25 },
    a5: { label: "A5 148 x 210 mm", w: 5.83, h: 8.27 },
    "letter-land": { label: "Letter landscape 11 x 8.5 in", w: 11, h: 8.5 }
  };

  /* ---------- Icons (inline SVG, no emoji) ---------- */
  var ICONS = {
    undo: "M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3",
    redo: "m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3",
    download: "M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3",
    printer: "M7 8V3h10v5M7 17H4v-7h16v7h-3M7 14h10v7H7z",
    help: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm-2.5-11.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01",
    folder: "M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z",
    save: "M5 3h11l4 4v14H4V3Zm3 0v6h8V3M8 21v-7h8v7",
    plus: "M12 5v14M5 12h14",
    trash: "M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13",
    copy: "M9 9h11v11H9zM5 15H4V4h11v1",
    shuffle: "M3 7h4l8 10h6m0 0-3-3m3 3-3 3M3 17h4l2.5-3M14 8.5 15 7h6m0 0-3-3m3 3-3 3",
    zoomIn: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.3-4.3M11 8v6M8 11h6",
    zoomOut: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.3-4.3M8 11h6",
    grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
    page: "M6 3h9l4 4v14H6zM15 3v4h4",
    left: "m15 5-7 7 7 7",
    right: "m9 5 7 7-7 7",
    close: "M6 6l12 12M18 6 6 18",
    check: "m5 12 5 5 9-10",
    image: "M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01",
    upload: "M12 16V4m0 0-4 4m4-4 4 4M4 17v3h16v-3",
    edit: "M4 20h4L19 9l-4-4L4 16zM13 7l4 4",
    eye: "M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z",
    sparkles: "M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z",
    sliders: "M4 6h10m4 0h2M4 12h4m4 0h8M4 18h12m4 0h0M16 4v4M10 10v4M18 16v4",
    star: "m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",
    file: "M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3",
    reset: "M4 5v5h5M4.5 10a8 8 0 1 1-.5 4",
    layers: "m12 3 9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5"
  };

  function icon(name) {
    return '<svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (ICONS[name] || "") + '"/></svg>';
  }

  /* ---------- Small helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }
  function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project"; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* Seeded random numbers: the same seed always draws the same pages. */
  function hashSeed(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    var a = hashSeed(String(seed));
    function next() {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next: next,
      int: function (lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      chance: function (p) { return next() < p; },
      shuffle: function (arr) {
        var out = arr.slice();
        for (var i = out.length - 1; i > 0; i--) { var j = Math.floor(next() * (i + 1)); var t = out[i]; out[i] = out[j]; out[j] = t; }
        return out;
      }
    };
  }
  function newSeed() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }

  /* localStorage, always guarded. */
  var store = {
    get: function (k, fallback) { try { var v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };

  var loaded = {};
  function loadScript(url) {
    if (!loaded[url]) {
      loaded[url] = new Promise(function (ok, fail) {
        var s = document.createElement("script");
        s.src = url; s.onload = ok;
        s.onerror = function () { delete loaded[url]; fail(new Error("Could not load " + url)); };
        document.head.appendChild(s);
      });
    }
    return loaded[url];
  }

  function download(name, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    var t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    t.remove();
  }

  /* ---------- Toasts, dialogs, progress, confetti ---------- */
  function toast(msg, kind) {
    var box = $(".k-toasts") || document.body.appendChild(el('<div class="k-toasts" role="status" aria-live="polite"></div>'));
    var t = el('<div class="k-toast ' + (kind === "err" ? "is-err" : "is-ok") + '">' + icon(kind === "err" ? "close" : "check") + "<span>" + esc(msg) + "</span></div>");
    box.appendChild(t);
    setTimeout(function () { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(function () { t.remove(); }, 320); }, kind === "err" ? 4200 : 2200);
  }

  function modal(opts) {
    var veil = el('<div class="k-veil" role="dialog" aria-modal="true"><div class="k-modal ' + (opts.narrow ? "is-narrow" : "") + '">' +
      '<div class="k-modal-head"><h2>' + esc(opts.title) + '</h2><button class="k-btn k-icon k-ghost" data-x aria-label="Close">' + icon("close") + "</button></div>" +
      '<div class="k-modal-body"></div><div class="k-modal-foot"></div></div></div>');
    var body = $(".k-modal-body", veil), foot = $(".k-modal-foot", veil);
    if (typeof opts.body === "string") body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
    function close(v) { document.removeEventListener("keydown", onKey, true); veil.remove(); if (opts.onClose) opts.onClose(v); }
    function onKey(e) { if (e.key === "Escape") { e.stopPropagation(); close(); } }
    (opts.buttons || []).forEach(function (b) {
      var btn = el('<button class="k-btn ' + (b.primary ? "k-primary" : "") + (b.danger ? " k-danger" : "") + '">' + (b.icon ? icon(b.icon) : "") + esc(b.label) + "</button>");
      btn.addEventListener("click", function () { var r = b.run ? b.run(veil) : undefined; if (r !== false) close(b.value); });
      foot.appendChild(btn);
    });
    if (!foot.children.length) foot.remove();
    $("[data-x]", veil).addEventListener("click", function () { close(); });
    veil.addEventListener("mousedown", function (e) { if (e.target === veil) close(); });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(veil);
    var first = $("input,textarea,select", body) || $(".k-primary", veil);
    if (first) setTimeout(function () { first.focus(); if (first.select) first.select(); }, 30);
    return { el: veil, body: body, close: close };
  }
  function confirmDlg(title, text, okLabel, danger) {
    return new Promise(function (res) {
      var done = false;
      modal({
        title: title, narrow: true, body: "<p>" + esc(text) + "</p>",
        onClose: function (v) { if (!done) { done = true; res(v === true); } },
        buttons: [{ label: "Cancel", value: false }, { label: okLabel || "OK", primary: !danger, danger: !!danger, value: true }]
      });
    });
  }
  function promptDlg(title, value, label) {
    return new Promise(function (res) {
      var done = false;
      var m = modal({
        title: title, narrow: true,
        body: '<label class="k-label">' + esc(label || "Name") + '</label><input class="k-input" maxlength="80" value="' + esc(value || "") + '">',
        onClose: function (v) { if (!done) { done = true; res(v === true ? $("input", m.body).value.trim() || null : null); } },
        buttons: [{ label: "Cancel", value: false }, { label: "Save", primary: true, value: true }]
      });
      $("input", m.body).addEventListener("keydown", function (e) { if (e.key === "Enter") { done = true; var v = e.target.value.trim(); m.close(); res(v || null); } });
    });
  }
  var prog = null;
  function progress(text, frac) {
    if (text == null) { if (prog) { prog.remove(); prog = null; } return; }
    if (!prog) prog = document.body.appendChild(el('<div class="k-progress"><div class="k-progress-box"><div data-t></div><div class="k-progress-bar"><i></i></div></div></div>'));
    $("[data-t]", prog).textContent = text;
    $("i", prog).style.width = Math.round((frac || 0) * 100) + "%";
  }
  function confetti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.body.appendChild(el('<canvas class="k-confetti"></canvas>'));
    var x = c.getContext("2d"), W = (c.width = innerWidth), H = (c.height = innerHeight);
    var cols = ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff", "#2ec4b6"], parts = [];
    for (var i = 0; i < 110; i++) parts.push({ x: W / 2, y: H * 0.35, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 13 - 3, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6 });
    var t0 = performance.now();
    (function tick(t) {
      var k = (t - t0) / 1500;
      x.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += 0.38; p.x += p.vx; p.y += p.vy; p.a += 0.2;
        x.save(); x.globalAlpha = Math.max(0, 1 - k); x.translate(p.x, p.y); x.rotate(p.a);
        x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6); x.restore();
      });
      if (k < 1) requestAnimationFrame(tick); else c.remove();
    })(t0);
  }

  /* ==========================================================================
     Kit.app(cfg) - builds the whole studio around a tool definition.
     ========================================================================== */
  function app(cfg) {
    var KEY = "csl." + cfg.slug;
    var prefs = window.CSL_PREFS || {};
    var S = null;                      // { params, seed, edits, name, pid }
    var hist = [], hi = -1;            // undo stack of JSON strings
    var ui = { tab: cfg.tabs[0].id, view: "all", zoom: "fit", grid: false, page: 0, pane: "design", work: !!(cfg.workspace && cfg.workspace.startOpen) };
    var pages = [], shown = [], dims = null, root, api;
    /* Assets: big items such as uploaded pictures. Kept outside the undo history, saved with projects. */
    var assets = store.get(KEY + ".assets", {});
    function usedAssets() {
      var ids = cfg.usedAssets ? cfg.usedAssets(S.params) : Object.keys(assets), out = {};
      ids.forEach(function (id) { if (assets[id]) out[id] = assets[id]; });
      return out;
    }
    function mergeAssets(extra) {
      if (!extra) return;
      Object.keys(extra).forEach(function (id) { assets[id] = extra[id]; });
      store.set(KEY + ".assets", assets);
    }

    function defaults() {
      var p = {};
      cfg.tabs.forEach(function (t) { t.groups.forEach(function (g) { g.fields.forEach(function (f) { if (f.id && f.def !== undefined) p[f.id] = JSON.parse(JSON.stringify(f.def)); }); }); });
      if (p.pageSize !== undefined && prefs.pageSize === "a4" && SIZES.a4) p.pageSize = "a4";
      return { params: p, seed: newSeed(), edits: {}, name: cfg.projectName || "Untitled project", pid: null };
    }

    /* ----- state, history, autosave ----- */
    function snap() { return JSON.stringify(S); }
    function commit() {
      var s = snap();
      if (hist[hi] === s) return;
      hist = hist.slice(0, hi + 1); hist.push(s);
      if (hist.length > 80) hist.shift();
      hi = hist.length - 1;
      saveSoon(); paintTop();
    }
    function restore(s) { S = JSON.parse(s); buildSide(); render(); saveSoon(); paintTop(); }
    function undo() { if (hi > 0) { hi--; restore(hist[hi]); } }
    function redo() { if (hi < hist.length - 1) { hi++; restore(hist[hi]); } }
    var saveSoon = debounce(function () {
      var ok = store.set(KEY + ".auto", S);
      var s = $(".k-saved", root);
      if (s) s.textContent = ok ? "Saved" : "Storage is full";
    }, 350);

    /* ----- page building ----- */
    function getDims() {
      var sz = SIZES[S.params.pageSize] || SIZES[cfg.pageSize || "letter"];
      var bleed = S.params.bleed ? 0.125 : 0;
      return { key: S.params.pageSize, inW: sz.w + bleed, inH: sz.h + bleed * 2, W: Math.round((sz.w + bleed) * 96), H: Math.round((sz.h + bleed * 2) * 96), bleed: Math.round(bleed * 96), label: sz.label };
    }
    function makeCtx() {
      return {
        p: S.params, seed: S.seed, size: dims, esc: esc, icon: icon,
        rng: function (salt) { return rng(S.seed + "|" + (salt || "")); },
        /* Editable text: click it on the page to change it. */
        ed: function (key, text, cls, tag) {
          var v = Object.prototype.hasOwnProperty.call(S.edits, key) ? S.edits[key] : text;
          return "<" + (tag || "span") + ' data-edit="' + esc(key) + '" data-def="' + esc(text) + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + esc(v) + "</" + (tag || "span") + ">";
        }
      };
    }
    function sheetHTML(pg) {
      return '<div class="k-sheet ' + (cfg.sheetClass || "") + " " + (pg.cls || "") + '" style="width:' + dims.W + "px;height:" + dims.H + "px;font-size:" + (dims.W / 100) + 'px">' + pg.html + "</div>";
    }
    function currentView() { return (cfg.views || []).filter(function (v) { return v.id === ui.view; })[0]; }

    function render() {
      dims = getDims();
      try { pages = cfg.pages(makeCtx()) || []; } catch (e) { console.error(e); pages = []; toast("Something went wrong while building the pages.", "err"); }
      var v = currentView();
      shown = v && v.filter ? pages.filter(v.filter) : pages;
      ui.page = clamp(ui.page, 0, Math.max(0, shown.length - 1));
      paintStage();
    }
    var renderSoon = debounce(render, 220);

    function fitScale() {
      var cv = $(".k-canvas", root);
      var availW = cv.clientWidth - (innerWidth <= 760 ? 24 : 52), availH = cv.clientHeight - 60;
      if (ui.grid) return clamp((innerWidth <= 760 ? (availW - 18) / 2 : 230) / dims.W, 0.1, 1);
      if (ui.zoom === "fit") return clamp(Math.min(availW / dims.W, innerWidth <= 760 ? 9 : Math.max(availH / dims.H, 0.62)), 0.15, 1.4);
      return ui.zoom;
    }
    function paintStage() {
      var wrap = $(".k-pages", root), sc = fitScale();
      var wb = $("[data-act=work]", root);
      if (wb) wb.classList.toggle("k-primary", ui.work);
      wrap.classList.toggle("is-work", ui.work);
      if (ui.work) {
        /* interactive workspace drawn by the tool (boards, editors); printable pages stay one click away */
        wrap.classList.remove("is-grid");
        wrap.innerHTML = '<div class="k-work"></div>';
        cfg.workspace.render(wrap.firstChild, api);
        $(".k-pager span", root).textContent = cfg.workspace.label;
        $("[data-act=prev]", root).disabled = $("[data-act=next]", root).disabled = true;
        var st0 = $(".k-stats", root);
        if (st0) st0.textContent = cfg.stats ? cfg.stats(makeCtx(), pages) : "";
        return;
      }
      wrap.classList.toggle("is-grid", ui.grid);
      if (!shown.length) {
        wrap.innerHTML = '<div class="k-empty">' + (cfg.empty || "<h3>Nothing to show yet</h3><p>Change the settings on the left to build your pages.</p>") + "</div>";
      } else {
        var list = ui.grid ? shown : [shown[ui.page]];
        wrap.innerHTML = list.map(function (pg, i) {
          var n = ui.grid ? i : ui.page;
          return '<div class="k-slot" data-n="' + n + '" style="width:' + dims.W * sc + "px;height:" + dims.H * sc + 'px">' +
            (ui.grid ? '<div class="k-slot-label">' + (n + 1) + ". " + esc(pg.title || "Page") + "</div>" : "") +
            sheetHTML(pg).replace('style="', 'style="transform:scale(' + sc + ");") + "</div>";
        }).join("");
        if (!ui.grid) {
          $$("[data-edit]", wrap).forEach(function (n) {
            n.setAttribute("contenteditable", "plaintext-only");
            if (n.contentEditable !== "plaintext-only") n.setAttribute("contenteditable", "true");
            n.setAttribute("spellcheck", "false");
          });
          if (cfg.onRender) cfg.onRender(wrap, api);
        }
      }
      var pg = shown[ui.page];
      $(".k-pager span", root).textContent = shown.length ? (ui.grid ? shown.length + " pages" : "Page " + (ui.page + 1) + " of " + shown.length + (pg && pg.title ? "  ·  " + pg.title : "")) : "No pages";
      $("[data-act=prev]", root).disabled = ui.grid || ui.page <= 0;
      $("[data-act=next]", root).disabled = ui.grid || ui.page >= shown.length - 1;
      var st = $(".k-stats", root);
      if (st) st.textContent = cfg.stats ? cfg.stats(makeCtx(), pages) : pages.length + " pages  ·  " + dims.label;
      $$(".k-bar [data-view]", root).forEach(function (b) { b.classList.toggle("is-on", b.dataset.view === ui.view); });
      $("[data-act=grid]", root).classList.toggle("k-primary", ui.grid);
    }
    function paintTop() {
      $("[data-act=undo]", root).disabled = hi <= 0;
      $("[data-act=redo]", root).disabled = hi >= hist.length - 1;
      var n = $(".k-pname", root);
      if (document.activeElement !== n) n.value = S.name;
    }

    /* ----- side panel: controls built from the tool schema ----- */
    function opts(f) { return typeof f.options === "function" ? f.options(S.params, api) : f.options || []; }
    function fieldHTML(f) {
      var v = S.params[f.id], h = "";
      var label = f.label ? '<div class="k-label"><span>' + esc(f.label) + "</span>" + (f.type === "range" ? "<small data-val>" + esc(v) + (f.unit || "") + "</small>" : f.side ? "<small>" + esc(typeof f.side === "function" ? f.side(S.params) : f.side) + "</small>" : "") + "</div>" : "";
