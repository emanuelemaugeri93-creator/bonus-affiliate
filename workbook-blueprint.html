      var visualStyleBank = {
        "Bright Friendly Cartoon": "bold outlines, vibrant colors, playful cartoon characters, lots of white space for drawing",
        "Soft Pastel Storybook": "gentle pastel watercolors, storybook illustration feel, soft textures, rounded fonts",
        "Bold Primary-Color Playful": "red/blue/yellow primary palette, thick marker-style lines, energetic dynamic layouts",
        "Calm Nature-Inspired": "earth tones, leaf/stone motifs, botanical line art, peaceful outdoor scenes",
        "Space/Adventure Themed": "cosmic backgrounds, stars, planets, exploration icons, deep blues and bright neons",
        "Whimsical Fairytale": "enchanted forest vibes, sparkles, magical creatures, soft glows, fairy-tale fonts",
        "Doodle Sketch Style": "hand-drawn look, pencil sketch aesthetic, black outlines with pops of color, notebook feel"
      };

      function getThemeData(theme) {
        return themeBank[theme] || themeBank["Understanding My Body's Feelings (Self-Regulation)"];
      }

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, seed) {
        return getRandomElement(data.titles || [data.title], seed);
      }

      function getRandomSubtitle(data, seed) {
        return getRandomElement(data.subtitles || [data.subtitle], seed + 1);
      }

      function getRandomStages(data, seed) {
        if (data.stages && Array.isArray(data.stages[0])) {
          return getRandomElement(data.stages, seed + 2);
        }
        return data.stages;
      }

      function getRandomMascot(data, seed) {
        return getRandomElement(data.mascots || ["a friendly guide"], seed + 3);
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["reflect on the topic", "draw your feelings", "practice the skill"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "20-24") return 22;
        if (rangeStr === "24-30") return 27;
        if (rangeStr === "30-42") return 36;
        return 48; // 42-54
      }

      // ---------- UNLIMITED VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 7;
        var seed = lastSeed;

        var theme = currentTheme;
        var ageBand = currentAge;
        var pageRange = currentPageRange;
        var visualStyle = currentVisual;
        var chaos = chaosLevel;

        var data = getThemeData(theme);
        var title = getRandomTitle(data, seed);
        var subtitle = getRandomSubtitle(data, seed + 10);
        var mascot = getRandomMascot(data, seed + 20);
        var stages = getRandomStages(data, seed + 30);
        var visualDesc = visualStyleBank[visualStyle] || "soft pastel storybook style";
        var exactPages = getExactPageCount(pageRange);
        var keywords = (data.keywords || []).join(', ');
        var activitiesPool = getRandomActivities(data, 12, seed + 40);

        // Chaos level injects more randomness
        var extraTwists = "";
        if (chaos >= 3) {
          var twists = [
            "Include a 'secret code' decoder page for fun messages.",
            "Add a 'design your own mascot' page.",
            "Incorporate a foldable fortune-teller craft.",
            "Add a 'letters to my future self' section.",
            "Include a parent-child interview page.",
            "Add a 'create a song or rap' about the topic.",
            "Include a cut-out bookmark reward.",
            "Add a 'random act of kindness' challenge page."
          ];
          for (var t = 0; t < chaos - 2; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 100 + t) + "\n";
          }
        }

        var vocabLevel = (ageBand === "6-8") ? "simple, short sentences, 14-16pt equivalent font, emoji helpers, lots of drawing space" : "clear, slightly more detailed language, 13-15pt equivalent, short writing prompts";
        var activityType = (ageBand === "6-8") ? "drawing, circling, matching, emoji scales, coloring elements" : "short writing, self-reflection, checklists, goal ladders, simple journaling";

        var pagePlan = buildDynamicPagePlan(stages, exactPages, ageBand, visualStyle, title, mascot, activitiesPool, seed, chaos);

        var prompt = "CREATE A COMPLETE 9-SECTION KIDS & TWEENS WORKBOOK BLUEPRINT following the exact structure below. This is a UNIQUE, HIGH-CREATIVITY variation.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for parents, elementary/middle school teachers, school counselors, after-school program leaders, child therapists (as a printable companion, not clinical material), and homeschool educators. This workbook makes no clinical or diagnostic claims and is intentionally undated for repeat use. Suitable for ages " + ageBand + ".\n\n" +
        "3. SHORT PRODUCT DESCRIPTION\n" +
        "This printable workbook guides children through a friendly, step-by-step journey to master \"" + theme + "\". Using " + mascot + " as their guide, kids explore engaging activities that build real-life skills. Each page combines playful illustrations with " + activityType + " to keep young learners motivated.\n" +
        "With " + exactPages + " beautifully designed pages, children move from understanding basics to celebrating progress. The undated format allows flexible use at home or in classrooms, making it a lasting resource for emotional and social growth.\n\n" +
        "4. 7 SEO KEYWORDS\n" + keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Learning Path)\n" +
        buildStageList(stages) + "\n" +
        extraTwists + "\n" +
        "6. CONTENT AND LAYOUT STYLE GUIDE\n" +
        "Tone: warm, encouraging, kid-friendly, never clinical. Chaos level: " + chaos + "/5.\n" +
        "Visual direction: " + visualDesc + ", featuring " + mascot + " as a recurring guide.\n" +
        "Page structure: generous illustration space, large fonts (" + vocabLevel + "), emoji-based self-assessment scales, sticker/reward elements.\n" +
        "Consistency rules: every page includes footer \"[" + title + "] - [page number]\", no dense text blocks, clear writing lines for child handwriting.\n\n" +
        "7. WORKBOOK STRUCTURE OVERVIEW\n" +
        "Front Matter (pages 1-2): Welcome letter from " + mascot + ", how to use this book, a 'meet your guide' illustration.\n" +
        buildModuleStructure(stages, exactPages) + "\n\n" +
        "8. COVER PROMPT\n" +
        "A vertical 8.5x11 full-color front cover. Visual style: " + visualDesc + ". Main illustration: " + mascot + " in a playful, inviting scene. Exact title text: \"" + title + "\" and subtitle \"" + subtitle + "\". Do NOT include barcodes, real photographs, or small dense text. Keep 0.25 inch safe margin. Include the age band subtly: 'Ages " + ageBand + "'.\n\n" +
        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +
        pagePlan + "\n\n" +
        "10. PRODUCT VERSION SUGGESTIONS\n" +
        "Starter Version (16-20 pages): Core activities from first 3-4 stages only, simplified layout.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (adds 10-15 pages): Includes duplicate trackers, a parent/teacher companion guide section, printable reward certificates, additional practice pages, and bonus craft activities.\n";

        return prompt;
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 5);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2; // back pages
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Closing Celebration & Certificate (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, age, visual, title, mascot, activities, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome Letter - Purpose: introduce " + mascot + ". Image Prompt: \"" + mascot + " waving hello, large speech bubble with encouraging words, soft " + visual + " background, footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: How To Use This Book - Purpose: simple kid-friendly instructions. Image Prompt: \"child-friendly icons showing draw/write/color/think, " + mascot + " pointing at a sample page, footer '[" + title + " - 2]'\"\n";
        pageNum = 3;
        
        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIndex = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIndex < activities.length) ? activities[actIndex] : stage + " Practice " + (p+1);
            var purposeText = "practice " + stage.toLowerCase() + " in a fun way";
            var imgDetails = "child-friendly illustration of " + stage.toLowerCase() + ", large emoji scale or drawing box, " + mascot + " cheering, generous white space";
            if (age === "9-12") imgDetails += ", short writing lines included";
            if (chaos >= 4) imgDetails += ", hidden surprise element (a tiny hidden object to find)";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: " + purposeText + ". Image Prompt: \"" + imgDetails + ", footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIndex++;
          }
        }

        plan += "Page " + pageNum + ": Celebration Certificate - Purpose: reward completion. Image Prompt: \"certificate with " + mascot + " holding a gold star, space for child's name and date, decorative border, footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": My Learning Journey Reflection - Purpose: reflect on growth. Image Prompt: \"child drawing or writing about their favorite part, " + mascot + " giving a thumbs up, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

      // ---------- RENDER & UPDATE UI ----------
      function updateUI() {
        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;
        var wordCount = promptText.split(/\s+/).filter(function(w){return w.length>0;}).length;
        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var tagsHtml = '<span class="tag">🎯 ' + currentTheme + '</span>' +
                       '<span class="tag">👶 ' + currentAge + ' yrs</span>' +
                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      // ---------- EVENT LISTENERS ----------
      document.getElementById('themeSelect').addEventListener('change', function(e) {
        currentTheme = e.target.value;
        updateUI();
      });

      var ageButtons = document.querySelectorAll('.age-btn');
      ageButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          ageButtons.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentAge = btn.getAttribute('data-age');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      // Initial load
      updateUI();
    })();
  </script>
