<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }

.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;

.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }

}
.k-field { margin-bottom: 12px; }

.k-input, .k-select, .k-textarea {

.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }

}

}

  border-radius: 50%; background: var(--k-accent);

.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;

}

.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {

.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;

}

.k-slot { position: relative; flex: none; }

.k-sheet {

.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }

  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;

.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }

.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;

}

.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }

.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }

.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }

<style>
/* Direction: Sidebar + Canvas in an investigation-wall language (dark slate board, cream evidence cards,
   red string accent, condensed Big Shoulders Display + IBM Plex Sans and Mono), because authors map who
   loves, betrays and protects whom the way a detective pins suspects to a wall. */
:root {
  --k-bg: #e9e6df;
  --k-panel: #f6f4ef;
  --k-panel-2: #ecE9e1;
  --k-ink: #16191d;

  --k-accent-soft: #fbe3df;

  --k-radius: 6px;
  --k-font: "IBM Plex Sans", system-ui, sans-serif;
  --k-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
}
.k-title { font-weight: 800; font-size: 21px; letter-spacing: .03em; text-transform: uppercase; }
.k-btn { border-radius: 6px; }
.k-stage .k-bar { background: #14181d; border-bottom-color: #2c333b; color: #d9dde2; }
.k-stage .k-bar .k-saved { color: #9aa3ad; }
.k-stage .k-bar .k-btn, .k-stage .k-bar .k-chip { background: #252c34; border-color: #39424c; color: #e8ebee; }
.k-stage .k-bar .k-btn.k-primary, .k-stage .k-bar .k-chip.is-on { background: var(--k-accent); border-color: var(--k-accent); color: #fff; }
.k-pager { background: #14181d; color: #d9dde2; }
.k-pager .k-btn { background: #252c34; border-color: #39424c; color: #e8ebee; }
.k-pages.is-work { margin: -26px; }

/* ---------- board workspace ---------- */
.rm-wrap { display: flex; flex-direction: column; height: calc(100dvh - 160px); min-height: 460px; }
.rm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; background: #20262d; border-bottom: 1px solid #2f363e; color: #e6e9ec; }
.rm-tools .k-btn { background: #2b333c; border-color: #3c4650; color: #eef0f2; padding: 6px 10px; font-size: 12.5px; }
.rm-tools .k-btn.is-on { background: var(--k-accent); border-color: var(--k-accent); color: #fff; }
.rm-tools .k-input { width: 170px; padding: 6px 9px; font-size: 12.5px; background: #12161a; border-color: #3c4650; color: #eef0f2; }
.rm-tools .sep { width: 1px; height: 22px; background: #3c4650; margin: 0 2px; }
.rm-tools .lab { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #9aa3ad; }
.rm-main { flex: 1; display: flex; min-height: 0; position: relative; }

.rm-insp .k-field { margin-bottom: 10px; }
.rm-kick { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-muted); margin-bottom: 8px; }
.rm-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rm-cols { display: flex; flex-wrap: wrap; gap: 5px; }

.rm-types { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

.rm-types button i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.rm-types button.is-on { border-color: var(--k-ink); box-shadow: inset 0 0 0 1px var(--k-ink); }
.rm-rlist { display: grid; gap: 4px; }
.rm-rlist button { display: flex; align-items: center; gap: 7px; text-align: left; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--k-line); background: #fff; cursor: pointer; font-size: 12.5px; }
.rm-rlist button i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.rm-rlist button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-rlist button small { color: var(--k-muted); font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
.rm-pic { display: flex; align-items: center; gap: 10px; }
.rm-pic .mono { width: 52px; height: 52px; border-radius: 50%; background-size: cover; background-position: center; display: grid; place-items: center; color: #fff; font-family: var(--k-display); font-weight: 800; font-size: 20px; flex: none; }
.rm-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--k-line); }
.rm-tips { font-size: 13px; line-height: 1.5; color: #3b4148; }
.rm-tips b { color: var(--k-ink); }
.rm-tips p { margin: 0 0 9px; }

.rm-stat div { border: 1px solid var(--k-line); border-radius: 6px; padding: 8px; background: #fff; }

.rm-time .k-btn { background: #2b333c; border-color: #3c4650; color: #eef0f2; padding: 5px 9px; font-size: 12px; }

    if (rows.length < 2) return API.toast("That CSV file has no rows.", "err");
    var res = fromCSV(rows);
    if (!res) return API.toast("The CSV needs a name column, or from and to columns.", "err");
    API.p.map = res.M; API.p.layoutKey = "csv" + Date.now(); V.fitKey = "";
    API.rebuild(); API.openWork(true); API.toast(res.msg + " from " + (name || "CSV"));
  }

  function statsText(p) { var M = mapOf(p), S = scene(M, p); return M.chars.length + " characters  ·  " + M.rels.length + " relationships  ·  " + stageName(M, +p.stage) + ": " + S.edges.length + " shown"; }
  function presetHTML() { return '<div class="rm-presets">' + PRESETS.map(function (x) { return '<button type="button" class="k-card" data-pre="' + x.key + '">' + esc(x.l) + "<small>" + esc(x.d) + "</small></button>"; }).join("") + "</div>"; }
  function presetWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-pre]"); if (!b) return;
      var P = PRESETS.filter(function (x) { return x.key === b.dataset.pre; })[0];
      api.confirm("Load " + P.l + "?", "The board is replaced by this map. You can undo this.", "Load map").then(function (y) {
        if (!y) return;
        api.p.map = fromPreset(P.key); api.p.stage = 0; api.p.halos = P.layout === "groups"; api.p.layoutKey = P.key + Date.now(); V.sel = null; V.kind = null;
        api.rebuild(); api.openWork(true);
      });
    });
  }
  function titleHTML(p) {
    var M = mapOf(p);
    return '<div class="k-field"><div class="k-label">Chart title</div><input class="k-input" data-m="title" maxlength="60" value="' + esc(M.title || "") + '"></div><div class="k-field"><div class="k-label">Subtitle</div><input class="k-input" data-m="sub" maxlength="90" value="' + esc(M.sub || "") + '"></div>';
  }
  function titleWire(box, api) { box.addEventListener("change", function (e) { var k = e.target.dataset.m; if (!k) return; api.p.map[k] = e.target.value.trim(); api.render(); api.commit(); }); }
  function stagesHTML(p) {
    var M = mapOf(p);
    return '<div class="rm-stages">' + M.stages.map(function (s, i) { return '<div class="rm-srow"><b>' + (i + 1) + '</b><input data-st="' + i + '" maxlength="40" value="' + esc(s) + '"><button type="button" class="k-btn k-sm k-icon k-danger" data-sdel="' + i + '"' + (M.stages.length < 2 ? " disabled" : "") + ' title="Remove">' + Kit.icon("close") + "</button></div>"; }).join("") + '<button type="button" class="k-btn k-sm" data-sadd>' + Kit.icon("plus") + "Add stage</button></div>";
  }
  function stagesWire(box, api) {
    box.addEventListener("change", function (e) { var i = e.target.dataset.st; if (i == null) return; api.p.map.stages[+i] = e.target.value.trim() || "Stage " + (+i + 1); api.render(); api.commit(); });
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var M = api.p.map;
      if (b.hasAttribute("data-sadd")) { M.stages.push(/^Book \d+$/.test(M.stages[M.stages.length - 1] || "") ? "Book " + (M.stages.length + 1) : "Stage " + (M.stages.length + 1)); api.rebuild(); }
      else if (b.dataset.sdel != null) {
        var n = +b.dataset.sdel;
        M.stages.splice(n, 1);
        function fix(o) { if (+o.from > n) o.from = +o.from - 1; else if (+o.from === n) o.from = Math.max(0, n - 1); if (+o.until >= 0) { if (+o.until >= n) o.until = Math.max(+o.from, +o.until - 1); } }
        M.chars.forEach(fix); M.rels.forEach(fix);
        if (+api.p.stage >= M.stages.length) api.p.stage = M.stages.length - 1;
        api.rebuild();
      }
    });
  }
