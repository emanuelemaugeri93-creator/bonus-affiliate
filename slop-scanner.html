<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>Slop Scanner Pro · AI-Tell & Cliché Detector for Dark Romance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #fafaf9;
      --bg-panel: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-muted: #888888;
      --border: #e0e0e0;
      --border-light: #f0f0f0;
      --accent-red: #D62828;
      --accent-red-light: #fde8e8;
      --accent-amber: #e6a817;
      --accent-amber-light: #fef9e7;
      --accent-green: #2e7d32;
      --accent-green-light: #e8f5e9;
      --accent-blue: #2563eb;
      --accent-blue-light: #eff6ff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.1);
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }

    body {
      background-color: var(--bg);
      font-family: 'DM Sans', 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 1500px;
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-title {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.4px;
      color: #1a1a1a;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .header-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .version-badge {
      font-size: 0.7rem;
      background: #f3f3f3;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Main layout */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      min-height: 500px;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
      body {
        padding: 0.8rem;
      }
    }

    /* Panels */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition);
    }

    .panel:hover {
      box-shadow: var(--shadow-md);
    }

    .panel-header {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }

    .panel-header .dot.active {
      background: var(--accent-green);
    }

    /* Textarea */
    .text-area {
      width: 100%;
      flex: 1;
      min-height: 400px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.1rem;
      font-family: 'JetBrains Mono', 'DM Sans', monospace;
      font-size: 0.88rem;
      line-height: 1.8;
      resize: vertical;
      background: #fdfdfc;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .text-area:focus {
      border-color: #aaa;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
    }

    .text-area::placeholder {
      color: #c0c0c0;
      font-style: italic;
    }

    /* Button row */
    .button-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.6rem 1.3rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: all var(--transition);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1a1a1a;
      color: #ffffff;
      border-color: #1a1a1a;
    }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-primary:active { transform: translateY(1px); }

    .btn-secondary {
      background: #fff;
      color: #1a1a1a;
      border-color: var(--border);
    }
    .btn-secondary:hover { background: #f5f5f5; border-color: #ccc; }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-outline:hover { background: #fafafa; }

    .btn-danger {
      background: #fff;
      color: var(--accent-red);
      border-color: #fecaca;
    }
    .btn-danger:hover { background: #fef2f2; border-color: #fca5a5; }

    /* Results area */
    .results-area {
      flex: 1;
      overflow-y: auto;
      max-height: 650px;
      padding-right: 0.3rem;
    }

    .results-area::-webkit-scrollbar { width: 5px; }
    .results-area::-webkit-scrollbar-track { background: transparent; }
    .results-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      height: 100%;
      min-height: 300px;
      gap: 0.8rem;
    }
    .empty-state-icon { font-size: 3rem; opacity: 0.5; }
    .empty-state-text { font-size: 1rem; font-weight: 500; }
    .empty-state-sub { font-size: 0.8rem; color: #b0b0b0; max-width: 280px; }

    /* Score display */
    .score-section {
      margin-bottom: 1.5rem;
      text-align: center;
      padding: 1rem 0;
    }

    .score-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 2.6rem;
      border: 4px solid #e0e0e0;
      margin-bottom: 0.5rem;
      transition: all 0.6s ease;
      background: #fff;
      position: relative;
    }

    .score-ring.green { border-color: var(--accent-green); color: var(--accent-green); background: var(--accent-green-light); }
    .score-ring.amber { border-color: var(--accent-amber); color: var(--accent-amber); background: var(--accent-amber-light); }
    .score-ring.red { border-color: var(--accent-red); color: var(--accent-red); background: var(--accent-red-light); }

    .verdict-text {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.2px;
    }
    .verdict-text.green { color: var(--accent-green); }
    .verdict-text.amber { color: var(--accent-amber); }
    .verdict-text.red { color: var(--accent-red); }

    /* Tab navigation */
    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--border-light);
    }
    .tab-btn {
      padding: 0.5rem 1rem;
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }
    .tab-btn:hover { color: #1a1a1a; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: #fafaf9;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.8rem;
      text-align: center;
    }
    .stat-value {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1;
    }
    .stat-value.red { color: var(--accent-red); }
    .stat-value.amber { color: var(--accent-amber); }
    .stat-value.green { color: var(--accent-green); }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Warning cards */
    .warning-card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-red);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
      margin-bottom: 0.7rem;
      animation: slideIn 0.4s ease forwards;
      opacity: 0;
      transform: translateX(-10px);
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }
    .warning-card.amber-border { border-left-color: var(--accent-amber); }
    .warning-card.blue-border { border-left-color: var(--accent-blue); }

    .warning-card .warning-title {
      font-weight: 600;
      font-size: 0.84rem;
      margin-bottom: 0.3rem;
    }
    .warning-card .warning-title.red { color: var(--accent-red); }
    .warning-card .warning-title.amber { color: var(--accent-amber); }
    .warning-card .warning-title.blue { color: var(--accent-blue); }

    .warning-card .warning-body {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .warning-card .suggestion {
      background: #f9f9f9;
      padding: 0.5rem 0.7rem;
      border-radius: 4px;
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: #444;
      font-style: italic;
    }

    /* Highlighted phrase */
    .highlight-phrase {
      background: #fef2f2;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      font-weight: 600;
      color: var(--accent-red);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    /* Word frequency table */
    .freq-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    .freq-table th {
      text-align: left;
      padding: 0.4rem 0.5rem;
      border-bottom: 2px solid var(--border);
      font-family: 'Sora', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }
    .freq-table td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border-light);
    }
    .freq-bar {
      display: inline-block;
      height: 8px;
      border-radius: 4px;
      background: var(--accent-amber);
      vertical-align: middle;
      margin-right: 0.4rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 999;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(15px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(15px); } }

    .hidden { display: none !important; }

    /* Comparison mode */
    .comparison-text {
      background: #f9fafb;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.8rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text-secondary);
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="32" height="32" rx="7" stroke="#1a1a1a" stroke-width="2.2" fill="none"/>
          <circle cx="18" cy="18" r="6" fill="#D62828" opacity="0.85"/>
          <line x1="18" y1="2" x2="18" y2="9" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="2" y1="18" x2="9" y2="18" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="27" y1="18" x2="34" y2="18" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="18" y1="27" x2="18" y2="34" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="app-title">Slop Scanner Pro</div>
        <div class="app-subtitle">AI-tell & cliché detector · dark romance diagnostic</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="version-badge">v2.0 · offline</span>
    </div>
  </header>

  <!-- Main layout -->
  <div class="main-layout">
    <!-- Left: Input -->
    <div class="panel" id="inputPanel">
      <div class="panel-header">
        <span class="dot" id="inputDot"></span> Manuscript Excerpt
      </div>
      <textarea class="text-area" id="manuscriptInput" placeholder="Paste your dark romance paragraph or chapter excerpt here...&#10;&#10;The scanner will detect:&#10;• Overused clichés (24 dark-romance specific)&#10;• AI writing patterns (em-dashes, sentence rhythm)&#10;• Word repetition and readability issues&#10;• Passive voice and adverb overuse&#10;&#10;Press Ctrl+Enter or click Scan Text to analyze." aria-label="Manuscript text input"></textarea>
      <div class="button-row">
        <button class="btn btn-primary" id="scanBtn" aria-label="Scan text for clichés and AI patterns">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="2" fill="currentColor"/></svg>
          Scan Text
        </button>
        <button class="btn btn-outline" id="clearBtn" aria-label="Clear input and results">Clear</button>
        <button class="btn btn-outline" id="sampleBtn" aria-label="Load sample text">📝 Load Sample</button>
      </div>
    </div>

    <!-- Right: Results -->
    <div class="panel" id="resultsPanel">
      <div class="panel-header">
        <span class="dot active" id="resultsDot"></span> Diagnostic Report
      </div>
      <div class="results-area" id="resultsArea">
        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <span class="empty-state-icon">🔬</span>
          <span class="empty-state-text">Ready to analyze your prose</span>
          <span class="empty-state-sub">Paste text and click Scan to see a full diagnostic report with cliché detection, readability metrics, and AI-pattern analysis.</span>
        </div>
        <!-- Results content -->
        <div id="resultsContent" class="hidden">
          <!-- Score -->
          <div class="score-section">
            <div class="score-ring" id="scoreRing">0</div>
            <div class="verdict-text" id="verdictText"></div>
          </div>
          <!-- Tabs -->
          <div class="tab-nav">
            <button class="tab-btn active" data-tab="tab-cliches">Clichés</button>
            <button class="tab-btn" data-tab="tab-metrics">Metrics</button>
            <button class="tab-btn" data-tab="tab-patterns">AI Patterns</button>
            <button class="tab-btn" data-tab="tab-words">Word Use</button>
          </div>
          <!-- Tab: Cliches -->
          <div class="tab-content active" id="tab-cliches">
            <div id="clichesContent"></div>
          </div>
          <!-- Tab: Metrics -->
          <div class="tab-content" id="tab-metrics">
            <div id="metricsContent"></div>
          </div>
          <!-- Tab: AI Patterns -->
          <div class="tab-content" id="tab-patterns">
            <div id="patternsContent"></div>
          </div>
          <!-- Tab: Word Use -->
          <div class="tab-content" id="tab-words">
            <div id="wordsContent"></div>
          </div>
          <!-- Actions -->
          <div class="button-row" style="margin-top: 1rem; border-top: 1px solid var(--border-light); padding-top: 0.8rem;">
            <button class="btn btn-secondary" id="copyReportBtn" aria-label="Copy full report">
              📋 Copy Report
            </button>
            <button class="btn btn-outline" id="exportBtn" aria-label="Export report as text file">
              📥 Export .txt
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ==================== DOM REFS ====================
    var manuscriptInput = document.getElementById('manuscriptInput');
    var scanBtn = document.getElementById('scanBtn');
    var clearBtn = document.getElementById('clearBtn');
    var sampleBtn = document.getElementById('sampleBtn');
    var resultsArea = document.getElementById('resultsArea');
    var emptyState = document.getElementById('emptyState');
    var resultsContent = document.getElementById('resultsContent');
    var scoreRing = document.getElementById('scoreRing');
    var verdictText = document.getElementById('verdictText');
    var inputDot = document.getElementById('inputDot');
    var resultsDot = document.getElementById('resultsDot');
    var copyReportBtn = document.getElementById('copyReportBtn');
    var exportBtn = document.getElementById('exportBtn');

    // Tab refs
    var tabCliches = document.getElementById('tab-cliches');
    var tabMetrics = document.getElementById('tab-metrics');
    var tabPatterns = document.getElementById('tab-patterns');
    var tabWords = document.getElementById('tab-words');
    var clichesContent = document.getElementById('clichesContent');
    var metricsContent = document.getElementById('metricsContent');
    var patternsContent = document.getElementById('patternsContent');
    var wordsContent = document.getElementById('wordsContent');

    // Store latest analysis data
    var lastAnalysis = null;

    // ==================== CLICHÉ BANK (24 items) ====================
    var clicheBank = [
      { phrase: "eyes like black holes", suggestion: "Describe the eyes with specific, sensory detail: 'his pupils swallowed the light, leaving only a thin rim of amber.'" },
      { phrase: "eyes like bottomless pits", suggestion: "Show the effect of the gaze: 'she felt exposed, as if his stare could peel back every layer she'd constructed.'" },
      { phrase: "claimed her mouth", suggestion: "Use more active, physical language: 'he kissed her with a desperation that left no room for argument.'" },
      { phrase: "her breath hitched", suggestion: "Ground in physical cause: 'the air snagged in her throat, sharp and unexpected.'" },
      { phrase: "a shiver ran down her spine", suggestion: "Anchor to a trigger: 'his whisper grazed her ear, and her shoulders drew tight.'" },
      { phrase: "heart racing", suggestion: "Show through action: 'she pressed a hand to her sternum, as if she could quiet the frantic rhythm.'" },
      { phrase: "couldn't breathe", suggestion: "Make it visceral: 'his presence pressed against her lungs like a physical weight.'" },
      { phrase: "the world stopped", suggestion: "Use concrete detail: 'the street noise faded. Even the rain seemed to hesitate.'" },
      { phrase: "lips inches apart", suggestion: "Create spatial tension: 'the air between their mouths felt charged, dense as ozone.'" },
      { phrase: "whispered against her skin", suggestion: "Make it tactile: 'his breath warmed the hollow of her throat, each syllable a brush of heat.'" },
      { phrase: "electricity between them", suggestion: "Replace with fresher metaphor: 'the space between them hummed, tight as a plucked wire.'" },
      { phrase: "butterflies in her stomach", suggestion: "Use a less generic sensation: 'a restless twist coiled low in her belly — half dread, half wanting.'" },
      { phrase: "time stood still", suggestion: "Show elongation: 'seconds stretched like warm taffy, each heartbeat a distinct thunderclap.'" },
      { phrase: "sent shivers down", suggestion: "Describe specifically: 'a chill cascaded from her nape to her fingertips, leaving goosebumps.'" },
      { phrase: "dark and dangerous", suggestion: "Demonstrate through behavior: 'he moved with the economy of someone who'd survived too much.'" },
      { phrase: "intoxicating scent", suggestion: "Name the scent: 'sandalwood and something metallic — gun oil, maybe — made her head swim.'" },
      { phrase: "smoldering gaze", suggestion: "Be precise: 'his stare lingered, heavy-lidded, cataloging every detail of her face.'" },
      { phrase: "velvet voice", suggestion: "Use unexpected texture: 'his voice was crushed gravel and smoke, rough enough to catch.'" },
      { phrase: "dangerous aura", suggestion: "Show through others: 'conversations dimmed when he entered. Waitstaff found reasons to retreat.'" },
      { phrase: "forbidden desire", suggestion: "Reveal internal conflict: 'she wanted him with a ferocity that felt like freefall.'" },
      { phrase: "heart skipped a beat", suggestion: "Original cardiac metaphor: 'her pulse stumbled, then found a faster, more urgent rhythm.'" },
      { phrase: "lost in his eyes", suggestion: "Show disorientation: 'his gaze held her so completely she forgot which direction the exit was.'" },
      { phrase: "breathless anticipation", suggestion: "Describe physical state: 'her lungs felt too full, every inhale shallow and insufficient.'" },
      { phrase: "electric touch", suggestion: "Specify sensation: 'his fingertips left a trail of warmth that persisted long after contact broke.'" }
    ];

    // ==================== AI PATTERN DETECTION ====================
    var aiPatterns = [
      { name: "Em-dash overuse", detect: function(text) { var wc = wordCount(text); if(wc===0)return 0; return ((text.match(/—/g)||[]).length / wc) * 100; }, threshold: 1.0, unit: "per 100 words", suggestion: "AI models love em-dashes. Try replacing some with periods, semicolons, or restructuring sentences." },
      { name: "Sentence length uniformity", detect: function(text) { var sentences = getSentences(text); if(sentences.length<2)return 0; var lengths = sentences.map(function(s){return s.split(/\s+/).filter(function(w){return w.length>0;}).length;}).filter(function(l){return l>0;}); if(lengths.length<2)return 0; var avg=lengths.reduce(function(a,b){return a+b;},0)/lengths.length; var variance=0; for(var i=0;i<lengths.length;i++){variance+=Math.pow(lengths[i]-avg,2);} variance/=lengths.length; return Math.sqrt(variance); }, threshold: 8.0, unit: "std dev (words)", suggestion: "Very uniform sentence length sounds robotic. Vary short and long sentences for natural rhythm." },
      { name: "Overly perfect grammar", detect: function(text) { var sentences = getSentences(text); var fragCount=0; for(var i=0;i<sentences.length;i++){var s=sentences[i].trim();if(s.length>0&&s.split(/\s+/).length<5&&!/[.!?]$/.test(s))fragCount++;} return fragCount; }, threshold: 0, unit: "fragments (too few)", suggestion: "Human writing includes sentence fragments. Zero fragments can indicate AI polishing." },
      { name: "Predictable structure", detect: function(text) { var pattern = /(\b(?:he|she|it|they|I)\s+\w+(?:ed|s)\b.*?\.)\s*(\b(?:he|she|it|they|I)\s+\w+(?:ed|s)\b)/gi; var matches = text.match(pattern) || []; return matches.length; }, threshold: 2, unit: "subject-verb repetitions", suggestion: "Repeated 'He did X. She did Y.' structures feel mechanical. Combine actions or vary sentence openings." }
    ];

    // ==================== UTILITY FUNCTIONS ====================
    function wordCount(text) {
      return text.split(/\s+/).filter(function(w) { return w.length > 0; }).length;
    }

    function getSentences(text) {
      return text.split(/[.!?]+(?:\s+|$)/).filter(function(s) { return s.trim().length > 0; });
    }

    function getWords(text) {
      return text.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(function(w) { return w.length > 2; });
    }

    // ==================== DETECTION FUNCTIONS ====================
    function detectCliches(text) {
      var lowerText = text.toLowerCase();
      var detected = [];
      for (var i = 0; i < clicheBank.length; i++) {
        var phrase = clicheBank[i].phrase.toLowerCase();
        if (lowerText.indexOf(phrase) !== -1) {
          detected.push({
            phrase: clicheBank[i].phrase,
            suggestion: clicheBank[i].suggestion,
            index: lowerText.indexOf(phrase)
          });
        }
      }
      return detected;
    }

    function countLongSentences(text) {
      var sentences = getSentences(text);
      var count = 0;
      var details = [];
      for (var i = 0; i < sentences.length; i++) {
        var s = sentences[i].trim();
        if (s.length === 0) continue;
        var words = s.split(/\s+/).filter(function(w) { return w.length > 0; });
        if (words.length > 35) {
          var hasBreak = /[;,:—–-]/.test(s);
          if (!hasBreak) {
            count++;
            details.push({ text: s.substring(0, 80) + (s.length > 80 ? '...' : ''), wordCount: words.length });
          }
        }
      }
      return { count: count, details: details };
    }

    function countEmDashFrequency(text) {
      var wc = wordCount(text);
      if (wc === 0) return 0;
      return ((text.match(/—/g) || []).length / wc) * 100;
    }

    function detectRepeatedWords(text) {
      var words = getWords(text);
      var windowSize = 40;
      var flagged = {};
      var totalFlags = 0;
      for (var i = 0; i < words.length; i++) {
        var word = words[i];
        if (flagged[word]) continue;
        var start = Math.max(0, i - windowSize);
        var end = Math.min(words.length, i + windowSize);
        var count = 0;
        for (var j = start; j < end; j++) {
          if (j !== i && words[j] === word) count++;
        }
        if (count >= 3) {
          flagged[word] = count + 1;
          totalFlags++;
        }
      }
      return { count: totalFlags, words: flagged };
    }

    function detectDialogueTags(text) {
      var tags = ['said', 'asked', 'whispered', 'muttered', 'replied', 'growled', 'breathed', 'hissed', 'murmured', 'snapped', 'rasped', 'croaked'];
      var found = [];
      var lowerText = text.toLowerCase();
      for (var i = 0; i < tags.length; i++) {
        if (lowerText.indexOf(tags[i]) !== -1) found.push(tags[i]);
      }
      return found;
    }

    function detectPassiveVoice(text) {
      var passivePattern = /\b(?:is|are|was|were|been|being)\s+(\w+(?:ed|en|t)|known|seen|taken|given|made|found|left|held|brought)\b/gi;
      var matches = text.match(passivePattern) || [];
      return matches.length;
    }

    function detectAdverbDensity(text) {
      var wc = wordCount(text);
      if (wc === 0) return 0;
      var adverbs = text.match(/\b\w+ly\b/gi) || [];
      return (adverbs.length / wc) * 100;
    }

    function getWordFrequency(text) {
      var words = getWords(text);
      var freq = {};
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        freq[w] = (freq[w] || 0) + 1;
      }
      var sorted = [];
      for (var key in freq) {
        if (freq.hasOwnProperty(key)) {
          sorted.push({ word: key, count: freq[key] });
        }
      }
      sorted.sort(function(a, b) { return b.count - a.count; });
      return sorted.slice(0, 15);
    }

    function detectReadability(text) {
      var wc = wordCount(text);
      var sentences = getSentences(text);
      var sc = sentences.length;
      if (wc === 0 || sc === 0) return { fleschKincaid: 0, avgSentenceLen: 0, avgWordLen: 0 };
      var avgSentenceLen = wc / sc;
      var allWords = text.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(function(w) { return w.length > 0; });
      var totalChars = 0;
      for (var i = 0; i < allWords.length; i++) totalChars += allWords[i].length;
      var avgWordLen = totalChars / allWords.length;
      var flesch = 206.835 - (1.015 * avgSentenceLen) - (84.6 * avgWordLen);
      return {
        fleschKincaid: Math.max(0, Math.min(120, Math.round(flesch))),
        avgSentenceLen: avgSentenceLen.toFixed(1),
        avgWordLen: avgWordLen.toFixed(1)
      };
    }

    // ==================== SCORING ====================
    function calculateScore(text, detectedCliches) {
      var score = 100;
      var clicheCount = Math.min(detectedCliches.length, 5);
      score -= clicheCount * 8;
      var longSentData = countLongSentences(text);
      score -= longSentData.count * 5;
      var repeats = detectRepeatedWords(text);
      score -= repeats.count * 3;
      var emDashFreq = countEmDashFrequency(text);
      if (emDashFreq > 1) score -= 10;
      var dialogueTags = detectDialogueTags(text);
      if (dialogueTags.length > 1) score += 10;
      var passiveCount = detectPassiveVoice(text);
      if (passiveCount > 3) score -= 5;
      var adverbDensity = detectAdverbDensity(text);
      if (adverbDensity > 3) score -= 5;
      if (score < 0) score = 0;
      if (score > 100) score = 100;
      return {
        score: score,
        clicheCount: clicheCount,
        longSentences: longSentData,
        repeats: repeats,
        emDashFreq: emDashFreq,
        dialogueTags: dialogueTags,
        passiveCount: passiveCount,
        adverbDensity: adverbDensity
      };
    }

    // ==================== RENDER ====================
    function showEmptyState() {
      emptyState.classList.remove('hidden');
      resultsContent.classList.add('hidden');
      resultsDot.classList.remove('active');
      inputDot.classList.remove('active');
      lastAnalysis = null;
    }

    function showResults() {
      emptyState.classList.add('hidden');
      resultsContent.classList.remove('hidden');
      resultsDot.classList.add('active');
      inputDot.classList.add('active');
    }

    function renderResults(text, detectedCliches, scoreData) {
      showResults();
      var finalScore = scoreData.score;
      var colorClass = 'red';
      var verdictMsg = '';
      if (finalScore >= 80) { colorClass = 'green'; verdictMsg = 'Authentic voice — ready for publishing'; }
      else if (finalScore >= 50) { colorClass = 'amber'; verdictMsg = 'Good bones, but clean up the flagged lines'; }
      else { colorClass = 'red'; verdictMsg = 'Still reads like raw AI output — needs a human editing pass'; }

      scoreRing.className = 'score-ring ' + colorClass;
      verdictText.className = 'verdict-text ' + colorClass;
      verdictText.textContent = verdictMsg;
      animateScore(finalScore, colorClass);

      // Store analysis
      lastAnalysis = { text: text, detectedCliches: detectedCliches, scoreData: scoreData };

      // Render clichés tab
      renderClichesTab(detectedCliches, colorClass);
      // Render metrics tab
      renderMetricsTab(text, scoreData);
      // Render AI patterns tab
      renderPatternsTab(text);
      // Render words tab
      renderWordsTab(text);

      // Reset to first tab
      switchTab('tab-cliches');
    }

    function renderClichesTab(detectedCliches, colorClass) {
      var html = '';
      if (detectedCliches.length === 0) {
        html += '<div style="text-align:center;padding:1.5rem;color:#2e7d32;">✨ No clichés detected! Your prose uses fresh, original language.</div>';
      } else {
        html += '<div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.8rem;">Found <strong>' + detectedCliches.length + '</strong> cliché(s) in your text:</div>';
        for (var i = 0; i < detectedCliches.length; i++) {
          var c = detectedCliches[i];
          var cardClass = 'warning-card';
          if (colorClass === 'amber') cardClass += ' amber-border';
          html += '<div class="' + cardClass + '" style="animation-delay:' + (i * 0.06) + 's">';
          html += '<div class="warning-title red">⚠️ Detected: <span class="highlight-phrase">"' + c.phrase + '"</span></div>';
          html += '<div class="suggestion">💡 ' + c.suggestion + '</div>';
          html += '</div>';
        }
      }
      clichesContent.innerHTML = html;
    }

    function renderMetricsTab(text, scoreData) {
      var readability = detectReadability(text);
      var html = '<div class="stats-grid">';
      html += '<div class="stat-card"><div class="stat-value">' + wordCount(text) + '</div><div class="stat-label">Total Words</div></div>';
      html += '<div class="stat-card"><div class="stat-value">' + getSentences(text).length + '</div><div class="stat-label">Sentences</div></div>';
      html += '<div class="stat-card"><div class="stat-value">' + readability.avgSentenceLen + '</div><div class="stat-label">Avg Words/Sentence</div></div>';
      html += '<div class="stat-card"><div class="stat-value">' + readability.fleschKincaid + '</div><div class="stat-label">Flesch Readability</div></div>';
      html += '</div>';

      html += '<div style="margin-top:0.8rem;">';
      html += '<div class="insight-row"><span>Passive voice instances</span><span style="color:' + (scoreData.passiveCount > 3 ? 'var(--accent-red)' : 'var(--accent-green)') + ';font-weight:600;">' + scoreData.passiveCount + '</span></div>';
      html += '<div class="insight-row"><span>Adverb density (-ly words)</span><span style="color:' + (scoreData.adverbDensity > 3 ? 'var(--accent-red)' : 'var(--accent-green)') + ';font-weight:600;">' + scoreData.adverbDensity.toFixed(1) + '%</span></div>';
      html += '<div class="insight-row"><span>Dialogue tag variety</span><span style="color:' + (scoreData.dialogueTags.length > 1 ? 'var(--accent-green)' : 'var(--accent-amber)') + ';font-weight:600;">' + scoreData.dialogueTags.length + ' types</span></div>';
      html += '<div class="insight-row"><span>Long sentences (>35 words, no breaks)</span><span style="color:' + (scoreData.longSentences.count > 0 ? 'var(--accent-red)' : 'var(--accent-green)') + ';font-weight:600;">' + scoreData.longSentences.count + '</span></div>';
      html += '</div>';

      if (scoreData.longSentences.details.length > 0) {
        html += '<div style="margin-top:0.8rem;font-size:0.8rem;color:var(--text-secondary);"><strong>Long sentence examples:</strong>';
        for (var i = 0; i < Math.min(scoreData.longSentences.details.length, 3); i++) {
          html += '<div style="background:#fef9e7;padding:0.4rem 0.6rem;margin-top:0.3rem;border-radius:4px;border-left:3px solid var(--accent-amber);">' + scoreData.longSentences.details[i].text + ' <span style="color:var(--accent-amber);font-weight:600;">(' + scoreData.longSentences.details[i].wordCount + ' words)</span></div>';
        }
        html += '</div>';
      }

      metricsContent.innerHTML = html;
    }

    function renderPatternsTab(text) {
      var html = '';
      for (var i = 0; i < aiPatterns.length; i++) {
        var pattern = aiPatterns[i];
        var value = pattern.detect(text);
        var isFlagged = value > pattern.threshold;
        var cardClass = 'warning-card';
        var titleClass = 'blue';
        if (isFlagged) { cardClass += ' amber-border'; titleClass = 'amber'; }

        html += '<div class="' + cardClass + '" style="animation-delay:' + (i * 0.08) + 's">';
        html += '<div class="warning-title ' + titleClass + '">' + (isFlagged ? '⚠️' : '✅') + ' ' + pattern.name + ': <strong>' + (typeof value === 'number' ? value.toFixed(1) : value) + '</strong> ' + pattern.unit + '</div>';
        if (isFlagged) {
          html += '<div class="warning-body">Threshold: ' + pattern.threshold + ' ' + pattern.unit + '. ' + pattern.suggestion + '</div>';
        }
        html += '</div>';
      }
      patternsContent.innerHTML = html;
    }

    function renderWordsTab(text) {
      var freq = getWordFrequency(text);
      var maxCount = freq.length > 0 ? freq[0].count : 1;
      var html = '<table class="freq-table"><thead><tr><th>Word</th><th>Frequency</th><th>Distribution</th></tr></thead><tbody>';
      for (var i = 0; i < freq.length; i++) {
        var barWidth = Math.round((freq[i].count / maxCount) * 100);
        html += '<tr><td>' + freq[i].word + '</td><td>' + freq[i].count + '</td><td><span class="freq-bar" style="width:' + barWidth + 'px;"></span></td></tr>';
      }
      html += '</tbody></table>';
      if (freq.length === 0) html = '<div style="text-align:center;padding:1rem;color:var(--text-muted);">Not enough words to analyze frequency.</div>';
      wordsContent.innerHTML = html;
    }

    function animateScore(targetScore, colorClass) {
      var current = 0;
      var duration = 1000;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        current = Math.round(eased * targetScore);
        scoreRing.textContent = current;
        scoreRing.className = 'score-ring ' + colorClass;
        if (progress < 1) { requestAnimationFrame(step); }
        else { scoreRing.textContent = targetScore; }
      }
      requestAnimationFrame(step);
    }

    function showToast(msg) {
      var existing = document.querySelector('.toast');
      if (existing) existing.parentNode.removeChild(existing);
      var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
    }

    // ==================== TAB SWITCHING ====================
    function switchTab(tabId) {
      var tabs = [tabCliches, tabMetrics, tabPatterns, tabWords];
      var buttons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
      for (var j = 0; j < buttons.length; j++) { buttons[j].classList.remove('active'); }
      var targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.add('active');
      var targetBtn = document.querySelector('[data-tab="' + tabId + '"]');
      if (targetBtn) targetBtn.classList.add('active');
    }

    // ==================== REPORT GENERATION ====================
    function buildReportText(text, detectedCliches, scoreData) {
      var readability = detectReadability(text);
      var report = '═══════════════════════════════════\n';
      report += '  SLOP SCANNER PRO · FULL REPORT\n';
      report += '═══════════════════════════════════\n\n';
      report += 'FINAL SCORE: ' + scoreData.score + '/100\n';
      if (scoreData.score >= 80) report += 'VERDICT: Authentic voice — ready for publishing\n';
      else if (scoreData.score >= 50) report += 'VERDICT: Good bones, but clean up flagged lines\n';
      else report += 'VERDICT: Reads like raw AI output — needs human editing\n';
      report += '\n─── METRICS ───\n';
      report += 'Words: ' + wordCount(text) + '\n';
      report += 'Sentences: ' + getSentences(text).length + '\n';
      report += 'Avg sentence length: ' + readability.avgSentenceLen + ' words\n';
      report += 'Flesch readability: ' + readability.fleschKincaid + '\n';
      report += 'Passive voice: ' + scoreData.passiveCount + '\n';
      report += 'Adverb density: ' + scoreData.adverbDensity.toFixed(1) + '%\n';
      report += 'Dialogue tags: ' + scoreData.dialogueTags.join(', ') + '\n';
      report += '\n─── CLICHÉS (' + detectedCliches.length + ') ───\n';
      for (var i = 0; i < detectedCliches.length; i++) {
        report += '⚠️ "' + detectedCliches[i].phrase + '"\n';
        report += '   → ' + detectedCliches[i].suggestion + '\n';
      }
      if (detectedCliches.length === 0) report += '✅ No clichés detected.\n';
      report += '\n─── AI PATTERNS ───\n';
      for (var j = 0; j < aiPatterns.length; j++) {
        var val = aiPatterns[j].detect(text);
        report += (val > aiPatterns[j].threshold ? '⚠️' : '✅') + ' ' + aiPatterns[j].name + ': ' + (typeof val === 'number' ? val.toFixed(1) : val) + ' ' + aiPatterns[j].unit + '\n';
      }
      report += '\n─── WORD FREQUENCY (top 10) ───\n';
      var freq = getWordFrequency(text).slice(0, 10);
      for (var k = 0; k < freq.length; k++) { report += freq[k].word + ': ' + freq[k].count + '\n'; }
      report += '\n───────────────────────────────────\n';
      report += 'Generated by Slop Scanner Pro v2.0\n';
      return report;
    }

    // ==================== EVENT HANDLERS ====================
    function handleScan() {
      var text = manuscriptInput.value.trim();
      if (text.length === 0) { showToast('Please paste some text to scan.'); return; }
      if (wordCount(text) < 5) { showToast('Please enter at least 5 words.'); return; }
      var detectedCliches = detectCliches(text);
      var scoreData = calculateScore(text, detectedCliches);
      renderResults(text, detectedCliches, scoreData);
    }

    function handleClear() {
      manuscriptInput.value = '';
      showEmptyState();
    }

    function handleLoadSample() {
      manuscriptInput.value = "His eyes were like black holes, pulling her into an abyss. Her breath hitched as he moved closer, his dangerous aura filling the small space between them. A shiver ran down her spine when his velvet voice whispered against her skin, sending shivers down her entire body. He claimed her mouth with a ferocity that made her heart racing. The world stopped. Time stood still. There was electricity between them, an electric touch that sparked every nerve. She felt butterflies in her stomach as his smoldering gaze held her captive. His intoxicating scent overwhelmed her senses. She couldn't breathe. She was lost in his eyes — those dark and dangerous eyes that promised forbidden desire and breathless anticipation. \"Don't,\" she whispered. \"I've waited too long,\" he said, his lips inches apart from hers.";
      showToast('📝 Sample text loaded — click Scan Text to analyze');
    }

    function handleCopyReport() {
      if (!lastAnalysis) { showToast('Run a scan first.'); return; }
      var report = buildReportText(lastAnalysis.text, lastAnalysis.detectedCliches, lastAnalysis.scoreData);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(report).then(function() { showToast('📋 Report copied!'); }).catch(function() { fallbackCopy(report); });
      } else { fallbackCopy(report); }
    }

    function handleExport() {
      if (!lastAnalysis) { showToast('Run a scan first.'); return; }
      var report = buildReportText(lastAnalysis.text, lastAnalysis.detectedCliches, lastAnalysis.scoreData);
      var blob = new Blob([report], { type: 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'slop-scanner-report-' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();
      showToast('📥 Report exported as .txt');
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea'); ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('📋 Report copied!'); }
      catch(e) { showToast('Copy failed.'); }
      document.body.removeChild(ta);
    }

    // ==================== INIT ====================
    function init() {
      showEmptyState();
      if (scanBtn) scanBtn.addEventListener('click', handleScan);
      if (clearBtn) clearBtn.addEventListener('click', handleClear);
      if (sampleBtn) sampleBtn.addEventListener('click', handleLoadSample);
      if (copyReportBtn) copyReportBtn.addEventListener('click', handleCopyReport);
      if (exportBtn) exportBtn.addEventListener('click', handleExport);
      if (manuscriptInput) {
        manuscriptInput.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); handleScan(); }
        });
      }
      var tabButtons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < tabButtons.length; i++) {
        tabButtons[i].addEventListener('click', function() {
          var tabId = this.getAttribute('data-tab');
          if (tabId) switchTab(tabId);
        });
      }
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
  })();
</script>
</body>
</html>
