<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Agent Prompt Stress Tester | AI agents guide for digital marketers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0d0d;
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .split-container {
      display: flex;
      width: 100%;
      max-width: 1500px;
      gap: 1.5rem;
      flex-wrap: wrap;
      background: transparent;
    }
    .left-panel {
      background: #1a1a1a;
      border-radius: 1.5rem;
      padding: 2rem 1.8rem;
      flex: 1 1 400px;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      box-shadow: 0 20px 35px rgba(0,0,0,0.7);
      border: 1px solid #2a2a2a;
      height: fit-content;
    }
    .left-panel h2 {
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .left-panel h2 span {
      background: #39FF14;
      color: #0d0d0d;
      font-size: 0.9rem;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-weight: 700;
    }
    .config-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .config-group label {
      font-weight: 500;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #b0b0b0;
    }
    select {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 0.8rem;
      padding: 0.9rem 1rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      color: #f0f0f0;
      outline: none;
      transition: 0.2s;
      cursor: pointer;
    }
    select:focus {
      border-color: #39FF14;
      box-shadow: 0 0 10px rgba(57,255,20,0.2);
    }
    .experience-toggle {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .exp-option {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 2rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: #aaa;
      transition: all 0.2s;
      font-weight: 500;
    }
    .exp-option.active {
      background: #39FF14;
      border-color: #39FF14;
      color: #0d0d0d;
      font-weight: 700;
      box-shadow: 0 0 12px #39FF1480;
    }
    textarea {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 1rem;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: #d4d4d4;
      resize: vertical;
      min-height: 220px;
      line-height: 1.5;
      outline: none;
      transition: 0.2s;
    }
    textarea:focus {
      border-color: #39FF14;
      box-shadow: 0 0 12px rgba(57,255,20,0.15);
    }
    .run-btn {
      background: #39FF14;
      border: none;
      color: #0d0d0d;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.3px;
      transition: 0.25s;
      text-transform: uppercase;
      box-shadow: 0 8px 18px rgba(57,255,20,0.25);
      margin-top: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .run-btn:hover {
      background: #6dff4a;
      box-shadow: 0 10px 25px rgba(57,255,20,0.45);
      transform: translateY(-1px);
    }
    .right-panel {
      background: #111111;
      border-radius: 1.5rem;
      padding: 1.8rem;
      flex: 2 1 750px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 20px 35px rgba(0,0,0,0.8);
      border: 1px solid #2a2a2a;
      min-height: 600px;
    }
    .progress-header {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .progress-text {
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      color: #ccc;
    }
    .progress-bar-bg {
      background: #2a2a2a;
      height: 10px;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #39FF14;
      border-radius: 20px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px #39FF14;
    }
    .scenarios-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      max-height: 650px;
      padding-right: 6px;
    }
    .scenarios-container::-webkit-scrollbar {
      width: 6px;
    }
    .scenarios-container::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 10px;
    }
    .scenarios-container::-webkit-scrollbar-thumb {
      background: #39FF14;
      border-radius: 10px;
    }
    .scenario-card {
      background: #1a1a1a;
      border-radius: 1rem;
      padding: 1.2rem 1.4rem;
      border-left: 6px solid #333;
      opacity: 0;
      transform: translateX(30px);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    .scenario-card.show {
      opacity: 1;
      transform: translateX(0);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .scenario-title {
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
    }
    .status-badge {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: transform 0.2s;
    }
    .status-badge.pop {
      transform: scale(1.1);
    }
    .desc {
      font-size: 0.9rem;
      color: #b0b0b0;
      line-height: 1.4;
    }
    .analysis-box {
      font-size: 0.9rem;
      color: #d0d0d0;
      background: #0f0f0f;
      padding: 0.7rem 1rem;
      border-radius: 0.7rem;
      border: 1px solid #252525;
      line-height: 1.5;
    }
    .fix-suggestion {
      background: #1f1a0a;
      border-left: 4px solid #FFD60A;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      color: #f5e56c;
      margin-top: 0.2rem;
      line-height: 1.4;
    }
    .summary-bar {
      margin-top: 0.8rem;
      background: #1a1a1a;
      border-radius: 1rem;
      padding: 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid #2e2e2e;
    }
    .score-blocks {
      display: flex;
      gap: 1.4rem;
      font-weight: 700;
      font-size: 1rem;
    }
    .pass-block { color: #39FF14; }
    .warn-block { color: #FFD60A; }
    .fail-block { color: #FF3B3B; }
    .health-score {
      font-size: 1.4rem;
      background: #0d0d0d;
      padding: 0.5rem 1.3rem;
      border-radius: 2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .verdict {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.95rem;
    }
    .action-btns {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .secondary-btn {
      background: transparent;
      border: 1px solid #444;
      color: #ddd;
      padding: 0.7rem 1.3rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
    }
    .secondary-btn:hover {
      border-color: #39FF14;
      color: #39FF14;
      background: #1a2a1a;
    }
  </style>
</head>
<body>
  <div class="split-container">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <h2>⚡ Agent Prompt <span>STRESS TEST</span></h2>
      <div class="config-group">
        <label>🤖 Agent Type</label>
        <select id="agentTypeSelect">
          <option value="blog">Blog Content Agent</option>
          <option value="email">Email Marketing Agent</option>
          <option value="digital">Digital Product Agent</option>
          <option value="affiliate">Affiliate Research Agent</option>
        </select>
      </div>
      <div class="config-group">
        <label>📝 Paste your agent's system prompt</label>
        <textarea id="promptInput" placeholder="Paste your agent's system prompt here..."></textarea>
      </div>
      <div class="config-group">
        <label>🧪 Experience level</label>
        <div class="experience-toggle" id="experienceToggle">
          <span class="exp-option active" data-level="setup">Setup Prompt</span>
          <span class="exp-option" data-level="full">Full System Prompt</span>
          <span class="exp-option" data-level="memory">Memory Update Prompt</span>
        </div>
      </div>
      <button class="run-btn" id="runStressBtn">▶ Run Stress Test →</button>
      <div style="font-size:0.8rem; color:#666; margin-top:0.4rem; text-align:center;">Advanced parametric detection engine</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel">
      <div class="progress-header">
        <div class="progress-text"><span>⚙️ Running 10 Scenarios...</span> <span id="progressCounter">0/10</span></div>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="scenarios-container" id="scenariosContainer">
        <div style="color:#555; padding:2.5rem; text-align:center; font-size:1rem;">👈<br><br>Configure your agent prompt on the left<br>and click <strong style="color:#39FF14;">Run Stress Test</strong><br><br><small style="color:#444;">Each scenario runs advanced parametric detection</small></div>
      </div>
      <div id="summarySection" style="display: none;"></div>
      <div class="action-btns" style="margin-top:0.5rem;">
        <button class="secondary-btn" id="copyReportBtn" style="display:none;">📋 Copy Full Report</button>
        <button class="secondary-btn" id="resetBtn">🔄 Test Another Prompt</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      console.log('🚀 Agent Prompt Stress Tester initialized');

      // =============================================
      // UTILITY FUNCTIONS
      // =============================================
      function extractNumbers(text) {
        var matches = text.match(/\d+(\.\d+)?/g);
        return matches ? matches.map(Number) : [];
      }

      function numberNearKeyword(text, keyword, maxDist) {
        maxDist = maxDist || 80;
        var lower = text.toLowerCase();
        var idx = lower.indexOf(keyword.toLowerCase());
        if (idx === -1) return null;
        var start = Math.max(0, idx - maxDist);
        var end = Math.min(lower.length, idx + keyword.length + maxDist);
        var slice = lower.substring(start, end);
        var nums = slice.match(/\d+(\.\d+)?/g);
        return nums ? nums.map(Number) : null;
      }

      function hasFileReference(text) {
        return /\.(md|json|csv|txt|log|yml|yaml)\b/i.test(text);
      }

      function hasConditionalFallback(text) {
        var lower = text.toLowerCase();
        var hasCondition = /\bif\b/.test(lower) || /\bwhen\b/.test(lower);
        var hasFallback = /\b(fallback|retry|save\s*(locally|draft)|backup|alternative|otherwise|else|handle\s*error)\b/i.test(lower);
        return hasCondition && hasFallback;
      }

      function countMatches(text, pattern) {
        var regex = new RegExp(pattern, 'gi');
        var matches = text.match(regex);
        return matches ? matches.length : 0;
      }

      // =============================================
      // DETECTION ENGINE - One function per scenario
      // =============================================
      function detectScenario(prompt, agentType, scenarioNum) {
        var lower = prompt.toLowerCase();
        
        // BLOG CONTENT AGENT
        if (agentType === 'blog' && scenarioNum === 1) {
          var hasMemoryAction = /\b(check|consult|read|review|scan)\b.*\b(memory|log|history|previously|already|published)\b/i.test(lower) ||
            /\b(memory|log|history)\b.*\b(check|consult|read|review|scan)\b/i.test(lower);
          var hasFileRef = hasFileReference(prompt);
          if (hasMemoryAction && hasFileRef) return { status: 'PASS', analysis: 'Strong: prompt references memory file with check action before generating.', fix: null };
          if (hasMemoryAction) return { status: 'WARNING', analysis: 'Partial: mentions memory but lacks file reference.', fix: 'Add: "Check published-topics.md before generating. Skip if covered in last 30 days."' };
          return { status: 'FAIL', analysis: 'No duplicate detection. Agent will repeat topics.', fix: 'Add: "Consult memory file before generating to avoid duplicates."' };
        }

        if (agentType === 'blog' && scenarioNum === 2) {
          var hasDecision = /\b(prioritize|select|choose|rank|order\s*by|criteria|decide|prefer)\b/i.test(lower);
          var hasFactors = countMatches(lower, /\b(relevance|volume|recency|engagement|trend|authority|niche)\b/gi) >= 2;
          if (hasDecision && hasFactors) return { status: 'PASS', analysis: 'Decision criteria with multiple ranking factors defined.', fix: null };
          if (hasDecision) return { status: 'WARNING', analysis: 'Selection mechanism exists but lacks explicit criteria.', fix: 'Add: "Prioritize by: 1) niche relevance, 2) search volume, 3) recency."' };
          return { status: 'FAIL', analysis: 'No decision criteria. Agent picks randomly.', fix: 'Add: "Rank topics by relevance, then volume, then recency."' };
        }

        if (agentType === 'blog' && scenarioNum === 3) {
          var hasCond = hasConditionalFallback(prompt);
          var hasSave = /\b(save\s*(locally|draft|to\s*file)|local\s*save|backup\s*draft)\b/i.test(lower);
          var hasRetry = /\bretry\b/i.test(lower);
          if (hasCond && hasSave && hasRetry) return { status: 'PASS', analysis: 'Complete fallback with retry and local save.', fix: null };
          if (hasCond || hasSave) return { status: 'WARNING', analysis: 'Partial error handling. Missing retry logic.', fix: 'Add: "If WordPress fails, retry 3 times, then save locally."' };
          return { status: 'FAIL', analysis: 'No fallback. Agent crashes on connection failure.', fix: 'Add: "On connection failure, retry then save draft locally."' };
        }

        if (agentType === 'blog' && scenarioNum === 4) {
          var hasGuard = /\b(stay|remain|keep|stick\s*to)\b.*\b(niche|topic|category|focus|pillar|cluster)\b/i.test(lower) ||
            /\b(niche|topic)\b.*\b(guardrail|boundary|limit|scope|alignment)\b/i.test(lower);
          var hasCount = numberNearKeyword(prompt, 'article', 30) || numberNearKeyword(prompt, 'post', 30);
          if (hasGuard && hasCount) return { status: 'PASS', analysis: 'Niche guardrails with article-count awareness.', fix: null };
          if (hasGuard) return { status: 'WARNING', analysis: 'Niche focus mentioned but no long-term drift prevention.', fix: 'Add: "Audit topic alignment every 10 posts to prevent drift."' };
          return { status: 'FAIL', analysis: 'No niche guardrails. Content will drift.', fix: 'Add: "All content must stay within defined niche pillars."' };
        }

        if (agentType === 'blog' && scenarioNum === 5) {
          var hasQuality = /\b(minimum|at\s*least|quality|threshold|standard|comprehensive|detailed)\b/i.test(lower);
          var wordNums = numberNearKeyword(prompt, 'word', 30) || numberNearKeyword(prompt, 'words', 30);
          var minWords = wordNums ? Math.min.apply(null, wordNums) : null;
          if (hasQuality && minWords && minWords >= 800) return { status: 'PASS', analysis: 'Quality standard: min ' + minWords + ' words.', fix: null };
          if (hasQuality) return { status: 'WARNING', analysis: 'Quality mentioned but no specific word count.', fix: 'Add: "Minimum 1,000 words per article."' };
          return { status: 'FAIL', analysis: 'No quality standards. Risk of thin content.', fix: 'Add: "Enforce minimum 1,000 words per article."' };
        }

        if (agentType === 'blog' && scenarioNum === 6) {
          var hasDate = /\b(current\s*date|today|now|timestamp|datetime|season|month|calendar)\b/i.test(lower);
          var hasSeasonal = /\b(seasonal|holiday|christmas|easter|halloween|timing|appropriate)\b/i.test(lower);
          if (hasDate && hasSeasonal) return { status: 'PASS', analysis: 'Date-aware with seasonal intelligence.', fix: null };
          if (hasDate || hasSeasonal) return { status: 'WARNING', analysis: 'Partial date awareness.', fix: 'Add: "Check current date. Only publish seasonal content in appropriate windows."' };
          return { status: 'FAIL', analysis: 'No date awareness. Christmas in July risk.', fix: 'Add: "Always check current date before publishing."' };
        }

        if (agentType === 'blog' && scenarioNum === 7) {
          var hasCannibal = /\bcannibal/i.test(lower) || /\b(keyword\s*overlap|competing|already\s*rank)\b/i.test(lower);
          var hasCheck = /\b(check|verify|compare|audit)\b.*\b(existing|published|ranking)\b/i.test(lower);
          if (hasCannibal && hasCheck) return { status: 'PASS', analysis: 'Cannibalization detection active.', fix: null };
          if (hasCannibal) return { status: 'WARNING', analysis: 'Awareness present but no systematic check.', fix: 'Add: "Verify keyword doesn\'t compete with existing top-10 posts."' };
          return { status: 'FAIL', analysis: 'No cannibalization guard.', fix: 'Add: "Cross-reference keywords against existing posts."' };
        }

        if (agentType === 'blog' && scenarioNum === 8) {
          var toneCount = countMatches(lower, /\b(tone|voice|style|personality|brand\s*voice|writing\s*style|conversational|formal|casual|authoritative|friendly|professional)\b/gi);
          var hasGuide = /\b(style\s*guide|brand\s*guide|voice\s*guide|tone\s*guide)\b/i.test(lower);
          if (toneCount >= 3 || hasGuide) return { status: 'PASS', analysis: 'Strong voice definition with ' + toneCount + ' tone indicators.', fix: null };
          if (toneCount >= 1) return { status: 'WARNING', analysis: 'Tone mentioned but not deeply defined.', fix: 'Add: "Reference /style-guide.md for consistent brand voice."' };
          return { status: 'FAIL', analysis: 'No tone definition. Inconsistent voice.', fix: 'Add: "Define brand voice: conversational, authoritative."' };
        }

        if (agentType === 'blog' && scenarioNum === 9) {
          var hasImgFallback = /\b(image|picture|visual|thumbnail)\b.*\b(fallback|placeholder|default|alternative|not\s*found|missing)\b/i.test(lower) ||
            /\b(fallback|placeholder|default)\b.*\b(image|picture|visual)\b/i.test(lower);
          if (hasImgFallback) return { status: 'PASS', analysis: 'Image fallback defined.', fix: null };
          if (/\bimage\b/i.test(lower)) return { status: 'WARNING', analysis: 'Images mentioned but no fallback.', fix: 'Add: "Use /defaults/placeholder.jpg if no image found."' };
          return { status: 'FAIL', analysis: 'No image fallback. May publish broken images.', fix: 'Add: "If no image, use placeholder and flag for review."' };
        }

        if (agentType === 'blog' && scenarioNum === 10) {
          var hasCorrupt = /\b(corrupt|malformed|empty|broken|invalid)\b/i.test(lower);
          var hasRebuild = /\b(rebuild|recreate|regenerate|repair|recover|fallback)\b/i.test(lower);
          if (hasCorrupt && hasRebuild) return { status: 'PASS', analysis: 'Corruption handling with rebuild action.', fix: null };
          if (hasCorrupt) return { status: 'WARNING', analysis: 'Corruption awareness but no recovery.', fix: 'Add: "If memory file corrupted, rebuild from post history."' };
          return { status: 'FAIL', analysis: 'No corruption handling. Agent crashes.', fix: 'Add: "Handle corrupted memory files by rebuilding from available data."' };
        }

        // EMAIL MARKETING AGENT
        if (agentType === 'email' && scenarioNum === 1) {
          var hasEmpty = /\b(empty|zero|no\s*subscriber|no\s*recipient)\b/i.test(lower);
          var hasSkip = /\b(skip|abort|cancel|stop|suppress)\b/i.test(lower);
          if (hasEmpty && hasSkip) return { status: 'PASS', analysis: 'Empty segment handled with skip action.', fix: null };
          if (hasEmpty) return { status: 'WARNING', analysis: 'Empty detection but no skip action.', fix: 'Add: "If segment has 0 subscribers, skip send and log."' };
          return { status: 'FAIL', analysis: 'No empty segment check.', fix: 'Add: "Verify segment size > 0 before sending."' };
        }

        if (agentType === 'email' && scenarioNum === 2) {
          var hasRepeat = /\b(repeat|duplicate|already\s*promoted|same\s*offer)\b/i.test(lower);
          var daysNum = numberNearKeyword(prompt, 'day', 30) || numberNearKeyword(prompt, 'week', 30);
          var daysVal = daysNum ? daysNum[0] : null;
          if (hasRepeat && daysVal && daysVal >= 7) return { status: 'PASS', analysis: 'Repeat detection with ' + daysVal + '-day cooldown.', fix: null };
          if (hasRepeat) return { status: 'WARNING', analysis: 'Repeat detection but no time window.', fix: 'Add: "Do not promote same offer within 14 days."' };
          return { status: 'FAIL', analysis: 'No repeat detection.', fix: 'Add: "Track promoted offers. Enforce 14-day cooldown."' };
        }

        if (agentType === 'email' && scenarioNum === 3) {
          var spamCount = countMatches(lower, /\b(spam|trigger|filter|deliverability|avoid|flag|blacklist|junk)\b/gi);
          var hasSubjCheck = /\bsubject\b.*\b(spam|check|filter|trigger|clean)\b/i.test(lower);
          if (spamCount >= 2 && hasSubjCheck) return { status: 'PASS', analysis: 'Spam-aware with subject filtering.', fix: null };
          if (spamCount >= 1) return { status: 'WARNING', analysis: 'Spam mentioned but no subject check.', fix: 'Add: "Scan subject lines for spam trigger words."' };
          return { status: 'FAIL', analysis: 'No spam awareness.', fix: 'Add: "Avoid spam words in subjects. Run pre-send check."' };
        }

        if (agentType === 'email' && scenarioNum === 4) {
          var hasWelcome = /\bwelcome\s*sequence\b/i.test(lower);
          var hasSuppress = /\b(suppress|skip|delay|hold|pause)\b/i.test(lower);
          if (hasWelcome && hasSuppress) return { status: 'PASS', analysis: 'Welcome collision handled.', fix: null };
          if (hasWelcome) return { status: 'WARNING', analysis: 'Welcome sequence mentioned but no suppression.', fix: 'Add: "Suppress broadcasts during active welcome sequence."' };
          return { status: 'FAIL', analysis: 'No welcome sequence awareness.', fix: 'Add: "Check if subscriber is in welcome flow before broadcasting."' };
        }

        if (agentType === 'email' && scenarioNum === 5) {
          var hasApiFail = /\b(api|autoresponder|connection)\b.*\b(fail|error|down|unavailable)\b/i.test(lower);
          var hasSaveLocal = /\b(save\s*(locally|draft|to\s*file)|local\s*save|backup)\b/i.test(lower);
          if (hasApiFail && hasSaveLocal) return { status: 'PASS', analysis: 'API failure with local save.', fix: null };
          if (hasApiFail || hasSaveLocal) return { status: 'WARNING', analysis: 'Partial failure handling.', fix: 'Add: "On API failure, save draft locally and retry."' };
          return { status: 'FAIL', analysis: 'No API failure handling.', fix: 'Add: "If API fails, save draft locally."' };
        }

        if (agentType === 'email' && scenarioNum === 6) {

      function runStressTest() {
        resetUI();
        var prompt = promptTextarea.value.trim();
        if (!prompt) {
          alert('⚠️ Please paste your agent prompt first.');
          return;
        }

        var metaList = scenarioMeta[currentAgent] || scenarioMeta.blog;
        resultsData = [];
        var completed = 0;
        var total = metaList.length;

        console.log('🚀 Starting stress test for ' + currentAgent + ' agent with ' + total + ' scenarios');

        testInterval = setInterval(function() {
          if (completed >= total) {
            clearInterval(testInterval);
            testInterval = null;
            showSummary();
            console.log('✅ Stress test complete');
            return;
          }

          var meta = metaList[completed];
          var result = detectScenario(prompt, currentAgent, meta.num);
          resultsData.push({ meta: meta, result: result });

          var cardHTML = buildCardHTML(meta, result, completed);
          var tempDiv = document.createElement('div');
          tempDiv.innerHTML = cardHTML;
          var cardElement = tempDiv.firstChild;
          scenariosContainer.appendChild(cardElement);

          setTimeout(function() {
            cardElement.classList.add('show');

            if (badge) {
              badge.classList.add('pop');
              setTimeout(function() { badge.classList.remove('pop'); }, 250);
            }
          }, 20);

          completed++;
          var percent = (completed / total) * 100;
          progressFill.style.width = percent + '%';
          progressCounter.innerText = completed + '/' + total;

          console.log('  Scenario ' + completed + '/' + total + ': ' + meta.name + ' → ' + result.status);
        }, 400);

        var failCount = resultsData.filter(function(r) { return r.result.status === 'FAIL'; }).length;

            '<span class="pass-block">✅ PASS ' + passCount + '</span>' +
            '<span class="warn-block">⚠️ WARNING ' + warnCount + '</span>' +

          reportText += '  Analysis: ' + r.result.analysis + '\n';
          if (r.result.fix) {
            reportText += '  Fix: ' + r.result.fix + '\n';
          }
          reportText += '\n';
        });

        var passC = resultsData.filter(function(r) { return r.result.status === 'PASS'; }).length;
        var warnC = resultsData.filter(function(r) { return r.result.status === 'WARNING'; }).length;
        var failC = resultsData.filter(function(r) { return r.result.status === 'FAIL'; }).length;
        var health = Math.round((passC * 10 + warnC * 5) / 100 * 100);
        reportText += 'SUMMARY: PASS=' + passC + ' | WARNING=' + warnC + ' | FAIL=' + failC + ' | HEALTH=' + health + '%\n';

        navigator.clipboard.writeText(reportText).then(function() {
          alert('📋 Full report copied to clipboard!');
        }).catch(function() {
          alert('❌ Could not copy. Please check clipboard permissions.');
        });
      }

      // Event listeners
      runBtn.addEventListener('click', function() {
        console.log('▶️ Run button clicked');
        runStressTest();
      });

      resetBtn.addEventListener('click', function() {
        console.log('🔄 Reset button clicked');
        resetUI();
        promptTextarea.value = '';
      });

      copyReportBtn.addEventListener('click', function() {
        console.log('📋 Copy button clicked');
        copyReportToClipboard();
      });

      console.log('✅ All event listeners attached');
      console.log('✅ Agent Prompt Stress Tester ready');
    })();
  </script>
</body>
</html>
