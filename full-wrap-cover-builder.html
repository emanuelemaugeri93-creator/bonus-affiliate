<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.

:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.k-ico { width: 18px; height: 18px; flex: none; display: block; }

.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {

.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }

.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {

.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;

.k-range { width: 100%; accent-color: var(--k-accent); }

.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }

<style>
/* Direction: Sidebar + Canvas in a prepress proof-room language (graphite panels, process magenta and cyan

  --k-bg: #1b1e23;
  --k-panel: #23272e;
  --k-panel-2: #2b3038;
  --k-ink: #eceef1;
  --k-muted: #9aa3ae;
  --k-line: #39404a;
  --k-accent: #e6007e;
  --k-accent-ink: #ffffff;
  --k-accent-soft: #3a1f30;
  --k-stage: #121418;
  --k-font: "Archivo", system-ui, sans-serif;

}
.k-title { letter-spacing: .02em; }
.k-group-title { color: #39c6f4; font-family: "IBM Plex Mono", monospace; letter-spacing: .08em; }
.k-stats { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }

/* ---------- side panel parts ---------- */
.cw-up { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 9px; border: 1px dashed #4b5360; border-radius: 10px; background: var(--k-panel-2); }
.cw-up.is-over { border-color: var(--k-accent); background: var(--k-accent-soft); }
.cw-th { width: 64px; height: 64px; border-radius: 7px; background: #15171b center / cover no-repeat; border: 1px solid var(--k-line); display: grid; place-items: center; color: var(--k-muted); }
.cw-up b { display: block; font-size: 13px; }
.cw-up small { display: block; color: var(--k-muted); font-size: 11.5px; line-height: 1.35; margin: 2px 0 6px; }
.cw-up .k-chips { gap: 5px; }
.cw-dims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
.cw-dims div { background: var(--k-panel-2); border: 1px solid var(--k-line); border-radius: 8px; padding: 7px 8px; }
