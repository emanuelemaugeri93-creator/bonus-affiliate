<html lang="en">
<head>
<meta charset="utf-8">

<title>Mandala Coloring Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Josefin+Sans:wght@300;400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }
}
@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }
  .k-body[data-pane="preview"] .k-side { display: none; }
  .k-side { border-right: 0; }
  .k-top { padding: 8px 10px; gap: 6px; }
  .k-pname, .k-hide-m { display: none; }
  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }
  .k-mnav { display: grid; grid-template-columns: 1fr 1fr; background: var(--k-panel); border-top: 1px solid var(--k-line); }
  .k-mnav button {
    border: 0; background: none; padding: 11px 0 calc(11px + env(safe-area-inset-bottom)); font-weight: 800; font-size: 13px;
    color: var(--k-muted); display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px;
  }
  .k-mnav button.is-on { color: var(--k-ink); box-shadow: inset 0 3px 0 var(--k-accent); }
  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }
  .k-dl dd { margin-bottom: 8px; }
  .k-pager span { min-width: 0; flex: 1; }
}

/* ---------- Exact print: one sheet per page, nothing else ---------- */
@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }
  .k-offscreen { position: static; left: 0; }
  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }
}
</style>
<style>
/* Direction: Sidebar + Canvas in a calm organic look (warm linen, sage and terracotta, Josefin Sans +
   Quicksand, soft rounded cards), because the buyers make mindful coloring books for adults and the
   tool should feel as unhurried as the pages it makes. */
:root {
  --k-bg: #f5efe4;
  --k-panel: #fffcf6;
  --k-panel-2: #f1eadc;
  --k-ink: #2f3a2c;
  --k-muted: #7a7a68;
  --k-line: #e2d8c4;
  --k-accent: #b8643f;
  --k-accent-ink: #ffffff;
  --k-accent-soft: #f6e3d6;
  --k-stage: #e8e0cf;
  --k-radius: 16px;
  --k-font: "Quicksand", system-ui, sans-serif;
  --k-display: "Josefin Sans", "Quicksand", sans-serif;
}
.k-title { font-weight: 700; letter-spacing: .02em; }
.k-card, .k-btn { border-radius: 12px; }
.k-logo { border-radius: 50%; background: #7b9e87; color: #fff; }

/* ---------- side panel ---------- */
.md-hintbox { border: 1.5px dashed var(--k-line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--k-muted); background: var(--k-panel-2); line-height: 1.45; }
.md-hintbox b { color: var(--k-ink); }
.md-rings { display: grid; gap: 5px; margin-top: 8px; }
.md-ring { display: grid; grid-template-columns: 22px 56px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid var(--k-line); border-radius: 10px; background: var(--k-panel); cursor: pointer; font-size: 12px; font-weight: 700; text-align: left; }
.md-ring:hover { border-color: var(--k-accent); }
.md-ring span { color: var(--k-muted); font-size: 11px; }
.md-ring svg { width: 56px; height: 30px; display: block; }
.md-ring small { color: var(--k-muted); font-weight: 600; }
.md-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.md-mot { border: 1.5px solid var(--k-line); border-radius: 10px; background: #fff; cursor: pointer; padding: 4px 3px 4px; font-size: 10.5px; font-weight: 700; color: #555; text-align: center; line-height: 1.15; }
.md-mot svg { display: block; width: 100%; height: 40px; margin-bottom: 2px; }
.md-mot:hover, .md-mot.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); color: var(--k-ink); }
.md-copy { display: grid; gap: 10px; }
.md-copy textarea { min-height: 70px; font-size: 12.5px; }
.md-copy .k-label { margin-bottom: 4px; align-items: center; }
@media (max-width: 760px) { .md-pick { grid-template-columns: repeat(4, 1fr); } }

/* ---------- sheets: 1em = 1% of the page width ---------- */
.md { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #fff; color: #1d1d1b; font-family: "Josefin Sans", sans-serif; }
.md-art { position: absolute; display: block; }
.k-sheet .md-art[data-mi] { cursor: crosshair; }

  /* ==========================================================================

  function app(cfg) {

    }

      } else {
        var list = ui.grid ? shown : [shown[ui.page]];
        wrap.innerHTML = list.map(function (pg, i) {
          var n = ui.grid ? i : ui.page;
          return '<div class="k-slot" data-n="' + n + '" style="width:' + dims.W * sc + "px;height:" + dims.H * sc + 'px">' +
            (ui.grid ? '<div class="k-slot-label">' + (n + 1) + ". " + esc(pg.title || "Page") + "</div>" : "") +

<script>
(function () {
  "use strict";

  /* ==========================================================================
     Drawing in a 1000 x 1000 box. Every motif is drawn in "band units":
     u = 0..1 from the inner to the outer edge of its ring, v = -1..1 across
     its slice. A ring repeats its motif n times around the centre.
     ========================================================================== */
  var TAU = Math.PI * 2;

  function unitPen(g, th) {
    /* g: { cx, cy, r1, r2, w } ; th: angle of this slice (0 = up, clockwise) */

      var r = g.r1 + u * (g.r2 - g.r1), a = th + v * g.w;
      return [g.cx + r * Math.sin(a), g.cy - r * Math.cos(a)];
    }
    function f(u, v) { var q = xy(u, v); return n1(q[0]) + "," + n1(q[1]); }

    return {
      h: h, sw: sw, xy: xy,
      M: function (u, v) { return "M" + f(u, v); },
      L: function (u, v) { return "L" + f(u, v); },
      Q: function (a, b, u, v) { return "Q" + f(a, b) + " " + f(u, v); },
      C: function (a, b, c, d, u, v) { return "C" + f(a, b) + " " + f(c, d) + " " + f(u, v); },
      /* arc along the ring at the radius of u, to v; dir 1 = clockwise */

        P.M(0.3, 0) + P.L(0.5, -0.42) + P.M(0.3, 0) + P.L(0.5, 0.42) + P.M(0.56, 0) + P.L(0.72, -0.32) + P.M(0.56, 0) + P.L(0.72, 0.32);

        { label: "Undo my change on this ring", icon: "reset", run: function () { setOv(api, mi, ring, null); } },
        { label: "Surprise me", icon: "shuffle", run: function () { var pool = allowed(api.p).filter(function (x) { return x !== cur; }); setOv(api, mi, ring, pool[Math.floor(Math.random() * pool.length)]); } },
        { label: "Close", primary: true }
      ]
    });
    m.body.addEventListener("click", function (e) {
      var b = e.target.closest("[data-mot]");
      if (!b) return;
      setOv(api, mi, ring, b.dataset.mot);
      m.close();
    });
  }
  function setOv(api, mi, ring, mot) {
    var ov = JSON.parse(JSON.stringify(api.p.ov || {}));
    ov[mi] = ov[mi] || {};
    if (mot) ov[mi][ring] = mot; else delete ov[mi][ring];
    if (!Object.keys(ov[mi]).length) delete ov[mi];
    api.set("ov", ov);
    if (mot) api.toast("Ring changed to " + MOTIF[mot][1]);
  }
  function ringAt(pl, ux, uy) {
    var r = Math.sqrt((ux - 500) * (ux - 500) + (uy - 500) * (uy - 500));
    if (r <= pl.r0) return "c";
    for (var i = 0; i < pl.rings.length; i++) if (r <= pl.rings[i].r2) return i;
    return null;
  }
  function onRender(wrap, api) {
    var img = wrap.querySelector(".md-art[data-mi]");
    CUR = img ? +img.dataset.mi : -1;
    var side = document.querySelector('[data-field="ringlist"] > div');
    if (side) side.innerHTML = ringListHTML(api.p);
    if (!img) return;
    img.title = "Click a ring to change its motif";
    img.addEventListener("click", function (e) {
      var r = img.getBoundingClientRect(), pad = 4, k = (1000 + 2 * pad) / r.width;
      var ux = (e.clientX - r.left) * k - pad, uy = (e.clientY - r.top) * k - pad, pl = bookPlans(api.p, api.S.seed)[+img.dataset.mi], ring = ringAt(pl, ux, uy);
      if (ring !== null) ringPicker(api, +img.dataset.mi, ring);
    });
  }
  function ringListHTML(p) {
    if (!API || CUR < 0) return '<div class="md-hintbox">Open a mandala page to see and change its rings.</div>';
    var pl = bookPlans(p, API.S.seed)[CUR];
    if (!pl) return "";
    var ov = (p.ov || {})[CUR] || {};
    var rows = [["c", pl.center, pl.sym]].concat(pl.rings.map(function (r, i) { return [i, r.mot, r.n]; })).reverse();
    return '<div class="md-hintbox"><b>Mandala ' + (CUR + 1) + "</b>, symmetry " + pl.sym + ". Click a ring on the page, or a row below, to change its motif.</div>" +
      '<div class="md-rings">' + rows.map(function (r) {
        return '<button type="button" class="md-ring" data-ring="' + r[0] + '"><span>' + (r[0] === "c" ? "C" : r[0] + 1) + "</span>" + thumbOf(r[1]) + "<div>" + Kit.esc(MOTIF[r[1]][1]) + (ov[r[0]] ? " <small>(changed)</small>" : "") + "</div><small>x" + r[2] + "</small></button>";
      }).join("") + "</div>";
  }

  /* ==========================================================================
     Sell it
     ========================================================================== */
  function listing(p, seed) {
    var R = Kit.rng(seed + "sell" + p.sellN), lvl = LEVELS[p.level].l, n = p.count;
    var who = p.level === "kids" ? R.pick(["for Kids", "for Kids Ages 6-12", "for Children"]) : R.pick(["for Adults", "for Adults Relaxation", "for Stress Relief and Mindfulness"]);
    var title = (p.bookTitle || "Mandala Coloring Book") + " | " + n + " Unique Mandala Coloring Pages " + who + " | " + lvl + " Level | Printable PDF";
    var desc = R.pick(["Slow down, breathe and color.", "A calm hour with a pencil and a circle of patterns.", "Hand-balanced mandalas for quiet, mindful coloring."]) + "\n\n" +
      "WHAT YOU GET\n- " + n + " unique mandala designs, " + lvl.toLowerCase() + " level\n- One design per page" + ((p.parts || []).indexOf("backs") >= 0 ? " with blank backs so markers do not bleed through" : "") + "\n" +
      ((p.parts || []).indexOf("test") >= 0 ? "- A test-your-colors page\n" : "") + ((p.parts || []).indexOf("example") >= 0 ? "- A colored example for inspiration\n" : "") +
      (p.affirm ? "- A calming affirmation under every mandala\n" : "") + "- Crisp line art, " + Kit.sizes[p.pageSize].label + "\n\n" +
      R.pick(["Perfect for pencils, gel pens and fine markers.", "Works with colored pencils, markers and watercolor pencils.", "Print one page or the whole book, as often as you like."]) +
      "\n\nThis is a digital file. No physical item is shipped.";
    var tags = ["mandala coloring", "coloring pages", "adult coloring book", "printable coloring", "mandala pdf", "stress relief", "mindfulness gift", "coloring book pdf", p.level === "kids" ? "kids coloring" : "relaxing activity", "zen coloring", "instant download", "meditation art", "pattern coloring"];
    return { title: title.slice(0, 140), desc: desc, tags: tags.join(", ") };
  }
  function sellHTML(p, api) {
    var L = listing(p, api.S.seed);
    return '<div class="md-copy"><div><div class="k-label"><span>Listing title</span><button class="k-btn k-sm" data-cp="title">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="title">' + Kit.esc(L.title) + "</textarea></div>" +
      '<div><div class="k-label"><span>Description</span><button class="k-btn k-sm" data-cp="desc">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="desc" style="min-height:190px">' + Kit.esc(L.desc) + "</textarea></div>" +
      '<div><div class="k-label"><span>13 tags</span><button class="k-btn k-sm" data-cp="tags">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="tags">' + Kit.esc(L.tags) + "</textarea></div>" +
      '<button class="k-btn" data-reword>' + Kit.icon("shuffle") + "New wording</button></div>";
  }
  function sellWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cp],[data-reword]");
      if (!b) return;
      if (b.dataset.cp) { api.copy(box.querySelector('[data-t="' + b.dataset.cp + '"]').value); api.toast("Copied"); }
      else api.set("sellN", (api.p.sellN || 0) + 1);
    });
  }

  /* ==========================================================================
     The app
     ========================================================================== */
  Kit.app({
    slug: "mandala-coloring-studio",
    title: "Mandala Coloring Studio",
    tagline: "Endless unique mandalas and whole coloring books in one click",
    projectName: "My Mandala Coloring Book",
    logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 9.8C10 7 10.5 4.2 12 2.5c1.5 1.7 2 4.5 0 7.3ZM12 14.2c2 2.8 1.5 5.6 0 7.3-1.5-1.7-2-4.5 0-7.3ZM9.8 12C7 14 4.2 13.5 2.5 12 4.2 10.5 7 10 9.8 12ZM14.2 12c2.8-2 5.6-1.5 7.3 0-1.7 1.5-4.5 2-7.3 0Z"/></svg>',
    mainAction: { label: "New mandalas", icon: "shuffle" },
    init: function (api) {
      API = api;
      probeSvgImage(function () { CACHE.key = ""; api.render(); });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { api.render(); });
    },
    onShuffle: function (p) { p.ov = {}; },
    onRender: onRender,
    mockColors: function () { return ["#fbf6ec", "#c9b79a"]; },
    views: [
      { id: "mandala", label: "Mandalas", filter: function (pg) { return pg.kind === "mandala"; } },
      { id: "extra", label: "Book pages", filter: function (pg) { return pg.kind === "extra"; } }
    ],
    stats: function (ctx, pgs) {
      var list = bookPlans(ctx.p, ctx.seed);
      return list.length + " unique mandalas  ·  " + pgs.length + " pages  ·  " + LEVELS[ctx.p.level].l;
    },
    pages: pages,
    tabs: [
      { id: "mandala", label: "Mandala", groups: [
        { title: "Level", fields: [
          { id: "level", type: "cards", def: "medium", options: Object.keys(LEVELS).map(function (k) { return { v: k, l: LEVELS[k].l, d: LEVELS[k].d }; }) }
        ] },
        { title: "Pattern", fields: [
          { id: "sym", type: "select", label: "Symmetry (repeats around the circle)", def: "mix",
            options: [{ v: "mix", l: "Mixed, chosen for the level" }].concat([6, 8, 10, 12, 14, 16, 18, 20, 24].map(function (n) { return { v: String(n), l: n + "-fold" }; })) },
          { id: "extra", type: "range", label: "Rings: fewer or more", def: 0, min: -2, max: 3 },
          { id: "families", type: "chips", label: "Motif families", def: ["floral", "geometric", "shapes", "dots", "lines"], minSel: 1, options: FAMILIES.map(function (f) { return { v: f[0], l: f[1] }; }),
            hint: MOTIFS.length + " motifs in all. Turn families off for a softer or more geometric book." },
          { id: "weight", type: "seg", label: "Line weight", def: "auto", options: [{ v: "auto", l: "Auto" }, { v: "fine", l: "Fine" }, { v: "medium", l: "Medium" }, { v: "bold", l: "Bold" }, { v: "xbold", l: "Extra" }] },
          { id: "sep", type: "toggle", label: "Circle between rings", def: true },
          { id: "outer", type: "seg", label: "Outer edge", def: "double", options: [{ v: "single", l: "Single" }, { v: "double", l: "Double" }, { v: "rays", l: "Sun rays" }] }
        ] },
        { title: "Rings of this mandala", fields: [
          { type: "html", key: "ringlist", render: function (p) { return "<div>" + ringListHTML(p) + "</div>"; },
            wire: function (box, api) {
              box.addEventListener("click", function (e) {
                var b = e.target.closest("[data-ring]");
                if (b && CUR >= 0) ringPicker(api, CUR, b.dataset.ring === "c" ? "c" : +b.dataset.ring);
              });
            } },
          { type: "buttons", key: "ovreset", buttons: [{ label: "Undo all ring changes", icon: "reset", run: function (api) { api.set("ov", {}); api.toast("Ring changes removed"); } }] }
        ] }
      ] },
      { id: "book", label: "Book", groups: [
        { title: "Size of the book", fields: [
          { id: "count", type: "range", label: "Number of mandalas", def: 12, min: 1, max: 50, hint: "Every mandala is checked to be different from the others in the book." }
        ] },
        { title: "Book parts", fields: [
          { id: "parts", type: "chips", def: ["title", "owner", "test", "example"], options: [{ v: "title", l: "Title page" }, { v: "owner", l: "Belongs to" }, { v: "test", l: "Test your colors" }, { v: "example", l: "Colored example" }, { v: "backs", l: "Blank backs" }],
            hint: "Blank backs add an empty page after every mandala, for single-sided printing and markers." },
          { id: "backNote", type: "toggle", label: "Small note on blank backs", def: true, show: function (p) { return (p.parts || []).indexOf("backs") >= 0; } },
          { id: "palette", type: "seg", label: "Colors of the example", def: "sunset", show: function (p) { return (p.parts || []).indexOf("example") >= 0; },
            options: [{ v: "sunset", l: "Sunset" }, { v: "ocean", l: "Ocean" }, { v: "garden", l: "Garden" }, { v: "jewel", l: "Jewel" }, { v: "pastel", l: "Pastel" }] }
        ] },
        { title: "Title page", fields: [
          { id: "bookTitle", type: "text", label: "Book title", def: "Mindful Mandalas", max: 60 },
          { id: "subtitle", type: "text", label: "Subtitle", def: "", placeholder: "12 mandalas to color", max: 70 },
          { id: "author", type: "text", label: "Author or brand", def: "", placeholder: "Your name here", max: 60 },
          { id: "titleFont", type: "seg", label: "Title lettering", def: "elegant", options: [{ v: "elegant", l: "Elegant" }, { v: "calm", l: "Calm" }, { v: "playful", l: "Playful" }] }
        ] },
        { title: "On every mandala page", fields: [
          { id: "affirm", type: "toggle", label: "Affirmation under the mandala", def: true, hint: AFFIRM.length + " calming lines built in. Click one on the page to rewrite it." },
          { id: "pageTitle", type: "toggle", label: "Small title at the top", def: false },
          { id: "pageNums", type: "toggle", label: "Page numbers", def: false },
          { type: "buttons", key: "reset", buttons: [{ label: "Reset text edits", icon: "reset", run: function (api) { api.resetEdits(); } }] }
        ] }
      ] },
      { id: "page", label: "Page", groups: [
        { title: "Paper", fields: [
          { id: "pageSize", type: "select", label: "Page size", def: "letter", options: Kit.sizeOptions() },
          { id: "bleed", type: "toggle", label: "Add bleed (0.125 in) for KDP", def: false },
          { id: "margin", type: "range", label: "Margin", def: 8, min: 5, max: 14, step: 0.5, hint: "KDP needs at least 0.25 in on the outside; 8 on Letter is about 0.7 in." },
          { id: "frame", type: "toggle", label: "Rounded border around each page", def: false }
        ] }
      ] },
      { id: "sell", label: "Sell it", groups: [
        { title: "Listing text for KDP, Etsy or your shop", fields: [
          { id: "sellN", type: "html", def: 0, render: sellHTML, wire: sellWire, hint: "Use Export > Listing mockup image for the pictures." }
        ] }
      ] }
    ],
    exports: [
      { label: "This mandala as SVG", hint: "Vector line art of the mandala on screen", icon: "file", run: function (api) {
        var list = bookPlans(api.p, api.S.seed), i = CUR >= 0 ? CUR : 0;
        if (!list[i]) return api.toast("Build a mandala first.", "err");
        api.download(api.fileBase() + "-mandala-" + (i + 1) + ".svg", mandalaSVG(list[i], api.p, null, 4), "image/svg+xml");
        api.toast("Mandala " + (i + 1) + " saved as SVG");
      } },
      { label: "All mandalas as SVG (ZIP)", hint: "Every design as vector line art", icon: "layers", run: function (api) {
        var list = bookPlans(api.p, api.S.seed);
        api.progress("Packing " + list.length + " SVG files...", 0.4);
        api.loadLib("jszip").then(function () {
          var zip = new window.JSZip();
          list.forEach(function (pl, i) { zip.file("mandala-" + String(i + 1).padStart(2, "0") + ".svg", mandalaSVG(pl, api.p, null, 4)); });
          return zip.generateAsync({ type: "blob" });
        }).then(function (b) { api.progress(null); api.download(api.fileBase() + "-svg.zip", b); api.toast(list.length + " SVG files saved"); })
          .catch(function () { api.progress(null); api.toast("Export failed. Check your connection and try again.", "err"); });
      } },
      { label: "Colored preview PNG", hint: "This mandala colored in, 3000 px, for listings", icon: "image", run: function (api) {
        var list = bookPlans(api.p, api.S.seed), i = CUR >= 0 ? CUR : 0;
        if (!list[i]) return api.toast("Build a mandala first.", "err");
        var im = new Image(), px = 3000;
        im.onload = function () {
          var c = document.createElement("canvas"); c.width = c.height = px;
          var x = c.getContext("2d"); x.fillStyle = "#ffffff"; x.fillRect(0, 0, px, px); x.drawImage(im, 0, 0, px, px);
          c.toBlob(function (b) { api.download(api.fileBase() + "-colored-" + (i + 1) + ".png", b); api.toast("Colored preview saved"); }, "image/png");
        };
        im.src = svgUri(mandalaSVG(list[i], api.p, PALETTES[api.p.palette] || PALETTES.sunset, 4));
      } }
    ],
    guide: {
      intro: "Mandala Coloring Studio draws brand-new mandalas from a library of " + MOTIFS.length + " motifs, from kids' simple flowers to expert lace, and lays out a whole coloring book with a title page, a test page, a colored example and blank backs.",
      steps: [
        "Open Mandala and pick a level, from Kids (big shapes, bold lines) to Expert (fine detail).",
        "Open Book and set how many mandalas you want and which extra pages to include.",
        "Click any ring of a mandala on the page to give it another motif. Press New mandalas for a fresh set.",
        "Press Export and download the PDF, or the SVG files for vector work."

      controls: [
        ["Level", "Sets the number of rings, how many times motifs repeat and the line weight."],
        ["Symmetry", "How many times the pattern repeats around the circle. Mixed lets every mandala pick its own."],
        ["Rings: fewer or more", "Adds or removes rings on top of the level."],
        ["Motif families", "Floral, geometric, soft shapes, dots and lines. Every ring picks from the families you keep on."],

        "Turn off Lines and Dots for very soft floral books; keep only Geometric for a modern look.",
        "The PDF keeps the line art sharp because every mandala is vector art drawn at full print resolution."
      ],
      trouble: [
        ["A ring looks too busy", "Click it and pick a simpler motif such as Petal, Scallops or Dots, or choose a lower level."],
