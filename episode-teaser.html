function clampCount(){var v=parseInt($('inCount').value,10);if(isNaN(v))v=5;if(v<3)v=3;if(v>8)v=8;return v;}
function words(ctx){return String(ctx).toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/).filter(function(w){return w.length>1;});}
function findPhrase(ws,list,before,after){var i,j;for(i=0;i<ws.length;i++){var hit=false;var k;for(k=0;k<list.length;k++){if(ws[i]===list[k]||(list[k].indexOf(' ')>0&&ws.slice(i,i+3).join(' ').indexOf(list[k])===0)){hit=true;break;}}if(hit){var s=Math.max(0,i-before);var e=Math.min(ws.length,i+1+after);return ws.slice(s,e).join(' ');}}return '';}
function cleanDetail(d){var lead=['he','she','they','it','i','you','we','him','her','them','the','a','an','to','of','in','on','at','for','and','but','or','that','this'];var trail=['and','the','a','an','to','of','in','on','at','for','with','by','is','was','are','be','it','that','this','as'];var w=String(d).split(' ');while(w.length>2&&lead.indexOf(w[0])>=0)w.shift();while(w.length>2&&trail.indexOf(w[w.length-1])>=0)w.pop();return w.join(' ');}
function extractDetail(){var raw=$('inCtx').value.trim();var lane=$('inLane').value;if(!raw)return {detail:FALLBACK[lane][Math.floor(Math.random()*3)],ctx:''};var ws=words(raw);var d=findPhrase(ws,SECRETW,1,5);if(!d)d=findPhrase(ws,EMOW,2,3);if(!d)d=findPhrase(ws,RELW,3,2);if(!d){d=ws.slice(0,6).join(' ');}else{d=cleanDetail(d);if(!d)d=ws.slice(0,6).join(' ');}var short=raw.length>70?raw.slice(0,67)+'...':raw;return {detail:d,ctx:short};}
function fillT(s,ex){var app=$('inApp').value.trim()||'the app';var ep=$('inEp').value||'12';var lane=$('inLane').value;var det=ex.detail;if(!det)det=FALLBACK[lane][Math.floor(Math.random()*3)];return String(s).split('{DETAIL}').join(det).split('{CTX}').join(ex.ctx||det).split('{APP}').join(app).split('{EP}').join(String(ep));}
function bankKey(){return $('inLane').value+'|'+state.format;}
function generate(more){var lane=$('inLane').value;var bank=TEAS[lane][state.format];if(!bank||!bank.length){toast('No templates in this bank yet.');return;}var n=clampCount();var key=bankKey();if(!more||!state.seen[key])state.seen[key]={};var fresh=[];var i;for(i=0;i<bank.length;i++){if(!state.seen[key][i])fresh.push(i);}if(fresh.length<n){state.seen[key]={};fresh=[];for(i=0;i<bank.length;i++)fresh.push(i);}fresh=shuffle(fresh);var take=fresh.slice(0,n);for(i=0;i<take.length;i++)state.seen[key][take[i]]=true;var ex=extractDetail();state.items=[];for(i=0;i<take.length;i++){state.items.push({base:fillT(bank[take[i]],ex),tags:'',tagsOn:false,fmt:state.format,bi:take[i]});}state.batch++;renderAll();}
function fmtLabel(k){var i;for(i=0;i<FORMATS.length;i++)if(FORMATS[i].k===k)return FORMATS[i].t;return k;}
function renderAll(){renderGrid();renderInfo();}
function renderInfo(){var b=$('batchTools');if(!state.items.length){b.style.display='none';return;}b.style.display='flex';$('batchInfo').textContent=LANES[$('inLane').value]+' · '+fmtLabel(state.format)+' · Batch #'+state.batch+' · '+state.items.length+' teasers · 💡 '+FTIPS[state.format];}
function renderGrid(){var g=$('grid');g.innerHTML='';if(!state.items.length){g.innerHTML='<div class="empty">Describe the episode above, pick a format, and hit <b>🎲 Generate Teasers</b>.</div>';return;}var lane=$('inLane').value;var i;for(i=0;i<state.items.length;i++){(function(idx,it){var txt=disp(it);var d=document.createElement('div');d.className='card';var f=document.createElement('div');f.className='fmt';f.textContent=fmtLabel(it.fmt).toUpperCase();var t=document.createElement('div');t.className='txt';t.textContent=txt;d.appendChild(f);d.appendChild(t);if(it.fmt==='tiktok'&&VIS[lane]&&VIS[lane].length){var v=document.createElement('div');v.className='vis';v.textContent='🎬 Suggested visual: '+VIS[lane][idx%VIS[lane].length];d.appendChild(v);}var sc=virality(txt);var lim=FLIMITS[it.fmt]||500;var meta=document.createElement('div');meta.className='vis';var over=txt.length>lim;meta.textContent='⚡ Virality '+sc+'/100 · '+txt.length+'/'+lim+' chars'+(over?' ⚠ over limit':'');if(over)meta.style.color='#ff8d8d';var bar=document.createElement('div');bar.style.cssText='background:#0c1425;border-radius:6px;height:8px;margin-top:6px';var fl=document.createElement('div');fl.style.cssText='width:'+sc+'%;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--secondary),var(--accent))';bar.appendChild(fl);d.appendChild(meta);d.appendChild(bar);var row=document.createElement('div');row.className='row';var cp=document.createElement('button');cp.className='btn';cp.textContent='📋 Copy';cp.addEventListener('click',function(){copyText(disp(it),'📋 Teaser copied!');});var tg=document.createElement('button');tg.className='btn ghost';tg.textContent=it.tagsOn?'✓ Tagged':'＋ Tags';tg.addEventListener('click',function(){toggleTags(idx);});var rm=document.createElement('button');rm.className='btn ghost';rm.textContent='🔀 Remix';rm.addEventListener('click',function(){remixCard(idx);});row.appendChild(cp);row.appendChild(tg);row.appendChild(rm);d.appendChild(row);g.appendChild(d);})(i,state.items[i]);}}
function toggleTags(idx){var it=state.items[idx];if(!it)return;if(!it.tagsOn&&!it.tags){var pool=shuffle(HASHTAGS[$('inLane').value].slice());it.tags=pool.slice(0,3).join(' ');}it.tagsOn=!it.tagsOn;renderAll();}
function remixCard(idx){var lane=$('inLane').value;var bank=TEAS[lane][state.format];var key=bankKey();var shown={};var i;for(i=0;i<state.items.length;i++){if(state.items[i].bi!==undefined)shown[state.items[i].bi]=true;}var pool=[];for(i=0;i<bank.length;i++){if(!shown[i])pool.push(i);}if(!pool.length){toast('No fresh templates left — hit Generate More.');return;}var bi=pool[Math.floor(Math.random()*pool.length)];state.seen[key][bi]=true;var ex=extractDetail();state.items[idx]={base:fillT(bank[bi],ex),tags:'',tagsOn:false,fmt:state.format,bi:bi};renderAll();}
function copyText(t,msg){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}document.body.removeChild(ta);toast(ok?(msg||'Copied!'):'Copy failed — select and copy manually.');}
function lib(){var raw=null;try{raw=localStorage.getItem('etz_library');}catch(e){raw=null;}if(!raw)return [];try{return JSON.parse(raw)||[];}catch(e){return [];};}
function libSave(a){try{localStorage.setItem('etz_library',JSON.stringify(a));}catch(e){toast('Storage unavailable.');}}
function saveBatch(){if(!state.items.length)return;var label='Ep '+($('inEp').value||'?')+' — '+($('inCtx').value.trim().slice(0,50)||'untitled episode');var item={label:label,lane:LANES[$('inLane').value],fmt:fmtLabel(state.format),items:state.items.map(function(x){return disp(x);})};var a=lib();a.push(item);libSave(a);renderLib();toast('💾 Batch saved!');}
function renderLib(){var z=$('libZone');var a=lib();$('libBtns').style.display=a.length?'flex':'none';if(!a.length){z.innerHTML='<div class="empty">Nothing saved yet. Generate teasers and hit <b>💾 Save Batch</b> to build your season calendar.</div>';return;}z.innerHTML='';var i;for(i=0;i<a.length;i++){(function(idx,it){var d=document.createElement('div');d.className='libitem';var b=document.createElement('b');b.textContent=(idx+1)+'. '+it.label;var tg=document.createElement('div');tg.className='tags';tg.textContent=it.lane+' · '+it.fmt+' · '+it.items.length+' teasers';var ol=document.createElement('ol');var j;for(j=0;j<it.items.length;j++){var li=document.createElement('li');li.textContent=it.items[j];ol.appendChild(li);}var row=document.createElement('div');row.className='row';var cp=document.createElement('button');cp.className='mini';cp.textContent='📋 Copy batch';cp.addEventListener('click',function(){copyText(it.items.join('\n\n'),'📋 Batch copied!');});var del=document.createElement('button');del.className='mini danger';del.textContent='✕ Remove';del.addEventListener('click',function(){var x=lib();x.splice(idx,1);libSave(x);renderLib();});row.appendChild(cp);row.appendChild(del);d.appendChild(b);d.appendChild(tg);d.appendChild(ol);d.appendChild(row);z.appendChild(d);})(i,a[i]);}}
function copyLibrary(){var a=lib();if(!a.length)return;var out='TEASER CONTENT CALENDAR ('+a.length+' batches)\n\n';var i,j;for(i=0;i<a.length;i++){out+=(i+1)+'. '+a[i].label+' ['+a[i].lane+' · '+a[i].fmt+']\n';for(j=0;j<a[i].items.length;j++)out+='   - '+a[i].items[j]+'\n';out+='\n';}copyText(out,'📋 Full library copied!');}
function buildFormats(){var r=$('fmtRow');r.innerHTML='';var i;for(i=0;i<FORMATS.length;i++){(function(it){var b=document.createElement('button');b.className='fmtbtn'+(state.format===it.k?' on':'');b.textContent=it.t;b.addEventListener('click',function(){state.format=it.k;buildFormats();});r.appendChild(b);})(FORMATS[i]);}}
function init(){buildFormats();renderGrid();renderLib();$('btnGen').addEventListener('click',function(){generate(false);});$('btnMore').addEventListener('click',function(){generate(true);});$('btnSave').addEventListener('click',saveBatch);$('btnCopyAll').addEventListener('click',function(){if(state.items.length)copyText(state.items.map(function(x){return disp(x);}).join('\n\n'),'📋 Batch copied!');});$('btnCopyLib').addEventListener('click',copyLibrary);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
