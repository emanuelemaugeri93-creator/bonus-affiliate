<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>The KDP Story Alchemist | Transmute Ideas Into Storybook Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --lab-bg: #0d0b0e;
            --lab-surface: #161318;
            --lab-surface2: #1e1a21;
            --lab-surface3: #262129;
            --gold: #d4a84b;
            --gold-bright: #e8c96a;
            --gold-glow: rgba(212, 168, 75, 0.35);
            --gold-faint: rgba(212, 168, 75, 0.08);
            --amethyst: #9b6dff;
            --amethyst-glow: rgba(155, 109, 255, 0.3);
            --emerald: #5cdb8b;
            --emerald-glow: rgba(92, 219, 139, 0.25);
            --parchment: #e8e0d0;
            --parchment-dim: #c4b8a0;
            --text: #e0dcd5;
            --text-dim: #a09890;
            --text-muted: #6b6460;
            --danger: #d4786a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.7);
            --radius: 10px;
            --radius-lg: 18px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08060a;
            background-image: radial-gradient(ellipse at 25% 15%, rgba(212, 168, 75, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 70%, rgba(155, 109, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 50%, rgba(92, 219, 139, 0.02) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            padding: 16px 10px;
        }

        #root {
            width: 100%;
            max-width: 1340px;
            background: var(--lab-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 94vh;
            border: 1px solid rgba(212, 168, 75, 0.12);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--lab-surface);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-weight: 600;
            letter-spacing: -0.1px;
            color: var(--parchment);
        }

        /* Header */
        .app-header {
            background: linear-gradient(180deg, #120f16 0%, #1a151e 100%);
            padding: 26px 32px;
            border-bottom: 1px solid rgba(212, 168, 75, 0.18);
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 80% 20%, rgba(212, 168, 75, 0.06) 0%, transparent 65%),
                radial-gradient(ellipse 40% 40% at 15% 70%, rgba(155, 109, 255, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .header-left h1 {
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.4px;
        }
        .header-left h1 .alchemy-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.2) 0%, rgba(155, 109, 255, 0.15) 100%);
            border: 1px solid rgba(212, 168, 75, 0.3);
            font-size: 1.2rem;
        }
        .header-subtitle {
            color: var(--parchment-dim);
            font-size: 0.68rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-badges {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .alchemy-badge {
            text-align: center;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
        }
        .alchemy-badge .badge-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
        }
        .alchemy-badge .badge-lbl {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
        }

        /* App link buttons */
        .app-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            border: 1px solid rgba(155, 109, 255, 0.3);
            background: rgba(155, 109, 255, 0.08);
            color: var(--amethyst);
            transition: all var(--transition);
            white-space: nowrap;
            text-decoration: none;
        }
        .app-link-btn:hover {
            background: rgba(155, 109, 255, 0.18);
            border-color: var(--amethyst);
            box-shadow: 0 0 16px var(--amethyst-glow);
            color: #b894ff;
            transform: translateY(-1px);
        }
        .app-link-btn i {
            font-size: 0.75rem;
        }

        /* Niche selector */
        .niche-scroll {
            display: flex;
            background: var(--lab-surface);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            overflow-x: auto;
            padding: 7px 20px;
            gap: 5px;
        }
        .niche-pill {
            flex-shrink: 0;
            padding: 7px 15px;
            border-radius: 18px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.015);
            color: var(--text-dim);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .niche-pill:hover {
            border-color: var(--gold);
            color: var(--parchment);
            background: var(--gold-faint);
        }
        .niche-pill.active {
            background: linear-gradient(135deg, rgba(212, 168, 75, 0.2) 0%, rgba(155, 109, 255, 0.1) 100%);
            color: var(--gold-bright);
            border-color: var(--gold);
            box-shadow: 0 0 18px var(--gold-faint);
        }

        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            flex: 1;
            min-height: 0;
        }
        @media (max-width: 920px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Alchemist Panel */
        .alchemist-panel {
            background: var(--lab-surface);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .panel-box {
            background: var(--lab-surface2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            padding: 16px;
        }
        .panel-box h3 {
            font-size: 0.9rem;
            color: var(--gold);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .field-group {
            margin-bottom: 10px;
        }
        .field-label {
            display: block;
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        select,
        input,
        textarea {
            width: 100%;
            background: var(--lab-surface3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 9px 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            transition: all var(--transition);
            resize: vertical;
        }
        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 75, 0.08);
        }
        select option {
            background: var(--lab-surface2);
            color: var(--text);
        }
        textarea {
            min-height: 55px;
            font-size: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
            width: 100%;
            justify-content: center;
        }
        .btn-transmute {
            background: linear-gradient(135deg, #d4a84b 0%, #b8892e 100%);
            color: #0d0b0e;
            border-color: #d4a84b;
            font-size: 0.85rem;
            padding: 13px 22px;
            box-shadow: 0 4px 22px rgba(212, 168, 75, 0.3);
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .btn-transmute:hover {
            background: linear-gradient(135deg, #e8c96a 0%, #d4a84b 100%);
            box-shadow: 0 6px 30px rgba(212, 168, 75, 0.45);
            transform: translateY(-1px);
        }
        .btn-transmute:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(212, 168, 75, 0.25);
        }
        .btn-outline {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--parchment);
            background: var(--gold-faint);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.68rem;
            width: auto;
        }
        .btn-xs {
            padding: 3px 8px;
            font-size: 0.62rem;
            width: auto;
            border-radius: 4px;
        }

        /* Unique seed display */
        .seed-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--amethyst);
            background: rgba(155, 109, 255, 0.06);
            padding: 6px 10px;
            border-radius: 4px;
            word-break: break-all;
            text-align: center;
            margin-top: 6px;
        }

        /* Results */
        .results-panel {
            background: var(--lab-bg);
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .results-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .results-top h2 {
            font-size: 1.2rem;
            color: var(--parchment);
        }
        .results-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .scene-card {
            background: var(--lab-surface);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: all var(--transition);
        }
        .scene-card:hover {
            border-color: rgba(212, 168, 75, 0.15);
            background: var(--lab-surface2);
        }
        .scene-num {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 5px;
        }
        .scene-prompt {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.68rem;
            line-height: 1.7;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 5px;
            word-break: break-word;
            max-height: 100px;
            overflow-y: auto;
            transition: max-height 0.35s ease;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .scene-prompt.expanded {
            max-height: 700px;
        }
        .scene-actions {
            display: flex;
            gap: 5px;
            margin-top: 7px;
        }
        .scene-text {
            font-size: 0.74rem;
            color: var(--emerald);
            font-style: italic;
            margin-top: 5px;
            padding: 5px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
        .empty-state {
            text-align: center;
            padding: 70px 18px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.25;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 7px;
        }
        .empty-state p {
            font-size: 0.8rem;
            max-width: 380px;
            margin: 0 auto;
        }

        .toast {
            position: fixed;
            bottom: 26px;
            right: 26px;
            background: var(--lab-surface3);
            color: var(--parchment);
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 0.82rem;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid var(--gold);
        }
        @keyframes toastIn {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        .history-row {
            background: var(--lab-surface2);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            padding: 9px 13px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 0.72rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition);
        }
        .history-row:hover {
            border-color: var(--gold);
            background: var(--lab-surface3);
        }
        .history-row .h-title {
            font-weight: 600;
            color: var(--parchment);
        }
        .history-row .h-niche {
            font-size: 0.58rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

                                                fontWeight: 700,
                                                marginRight: 6
                                            }
                                        }, result.nicheIcon + ' ' + result.nicheName),
                                        ' Hero: ' + result.character + ' · Friend: ' + result.companion
                                    ),
                                    React.createElement('div', { className: 'seed-display', style: { marginTop: 4,
                                            fontSize: '0.58rem' } },
                                        '🔮 Unique Seed: ' + result.seed
                                    )
                                ),
                                React.createElement('div', { className: 'results-actions' },
                                    React.createElement('button', {
                                        className: 'btn btn-outline btn-sm',
                                        onClick: () => copyText(result.fullExportPrompt, 'Full prompt')
                                    }, React.createElement('i', { className: 'fas fa-copy' }), ' Copy Full'),
                                    React.createElement('button', {
                                        className: 'btn btn-outline btn-sm',
                                        onClick: downloadAll
                                    }, React.createElement('i', { className: 'fas fa-download' }), ' Download')
                                )
                            ),
                            result.prompts.map(p =>
                                React.createElement('div', { key: p.scene, className: 'scene-card' },
                                    React.createElement('div', { className: 'scene-num' },
                                        'Scene ' + p.scene + ' — ' + p.title),
                                    React.createElement('div', {
                                        className: 'scene-prompt' + (expandedScenes[p.scene] ? ' expanded' :
                                            ''),
                                        onClick: () => toggleExpand(p.scene),
                                        title: 'Click to expand/collapse'
                                    }, p.prompt),
                                    p.text && React.createElement('div', { className: 'scene-text' },
                                        '💬 ' + p.text),
                                    React.createElement('div', { className: 'scene-actions' },
                                        React.createElement('button', {
                                            className: 'btn btn-outline btn-xs',
                                            onClick: () => copyText(p.prompt, 'Scene ' + p.scene)
                                        }, React.createElement('i', { className: 'fas fa-copy' }),
                                            ' Copy'),
                                        React.createElement('button', {
                                            className: 'btn btn-outline btn-xs',
                                            onClick: () => toggleExpand(p.scene)
                                        }, React.createElement('i', {
                                            className: 'fas fa-' + (expandedScenes[p.scene] ?
                                                'compress' : 'expand')
                                        }), expandedScenes[p.scene] ? ' Collapse' : ' Expand')
                                    )
                                )
                            ),
                            React.createElement('div', {
                                className: 'scene-card',
                                style: { marginTop: 6, borderColor: 'rgba(212,168,75,0.15)' }
                            },
                                React.createElement('div', { className: 'scene-num', style: { color: 'var(--gold-bright)' } },
                                    '📦 Complete Export Prompt'),
                                React.createElement('div', {
                                    className: 'scene-prompt',
                                    style: { maxHeight: expandedScenes['full'] ? 800 : 80 },
                                    onClick: () => toggleExpand('full')
                                }, result.fullExportPrompt),
                                React.createElement('div', { className: 'scene-actions' },
                                    React.createElement('button', {
                                        className: 'btn btn-transmute btn-xs',
                                        onClick: () => copyText(result.fullExportPrompt,
                                            'Full prompt'),
                                        style: { width: 'auto' }
                                    }, React.createElement('i', { className: 'fas fa-copy' }),
                                        ' Copy Full Prompt')
                                )
                            )
                        ) :
                        React.createElement('div', { className: 'empty-state' },
                            React.createElement('div', { className: 'empty-icon' }, '⚗️'),
                            React.createElement('h3', null, 'The Alchemist\'s Laboratory Awaits'),
                            React.createElement('p', null,
                                'Select a Grimoire from the bar above. Customize your hero and magical object — or leave them blank and let the Alchemist discover them for you. Then strike ',
                                React.createElement('strong', { style: { color: 'var(--gold)' } }, 'Transmute Story Prompt'),
                                ' to create a completely unique 10-scene storybook prompt, guaranteed different every time.'
                            ),
                            React.createElement('p', { style: { marginTop: 14, fontSize: '0.72rem', color: 'var(--text-muted)' } },
                                'Each transmutation uses a unique seed — no two prompts are ever the same.',
                                React.createElement('br'),
                                'Try ',
                                React.createElement('strong', { style: { color: 'var(--amethyst)' } }, 'Surprise Transmutation'),
                                ' for a random Grimoire.'
                            )
                        )
                    )
                ),
                toast && React.createElement(Toast, { message: toast, onDone: () => setToast(null) })
            );
        };

        const rootEl = document.getElementById('root');
        const root = ReactDOM.createRoot(rootEl);
        root.render(React.createElement(App));
    </script>
</body>
</html>
