  function hashCode(str) {
    var hash = 0, i;
    for (i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
    return Math.abs(hash);
  }

  function seededRandom(seed, index) {
    var h = hashCode(seed + "-idx" + index);
    var x = Math.sin(h * 9301 + 49297) * 49297;
    return x - Math.floor(x);
  }

  function escapeHTML(s) {

  }

  function attachCardEvents() {
    document.querySelectorAll('.copy-btn').forEach(function(b) {
      b.addEventListener('click', function() {
        var p = this.getAttribute('data-prompt');
        if (!p) return;
        navigator.clipboard.writeText(p).then(function() {
          var self = this;
          self.innerHTML = '✓';
          setTimeout(function() { self.innerHTML = '📋 Copy'; }, 1500);
        }.bind(this));
      });
    });
    document.querySelectorAll('.star-btn').forEach(function(b) {
      var ft = b.getAttribute('data-fav');
      if (favorites.indexOf(ft) !== -1) { b.textContent = '★'; b.classList.add('saved'); }
      b.addEventListener('click', function() {
        var p = this.getAttribute('data-fav');
        if (!p) return;
        if (favorites.indexOf(p) === -1) {
          favorites.push(p);
          this.textContent = '★';
          this.classList.add('saved');
        } else {
          favorites = favorites.filter(function(f) { return f !== p; });
          this.textContent = '☆';
          this.classList.remove('saved');
        }
        renderFavorites();
        saveState();
      });
    });
  }

  }

  function clearAll() {
    if (confirm("Clear all prompts?")) centerPanel.innerHTML = '<div class="empty-state"><p>🏛️🏺📜⚱️🔱🗿🕌⛰️🏊</p><p>Cleared. Generate new prompts!</p></div>';
  }

  // EVENT LISTENERS
  generateBtn.addEventListener('click', function() { renderPrompts(false); saveState(); });
  document.getElementById('infiniteGenerateBtn').addEventListener('click', function() { renderPrompts(true); saveState(); });
  document.getElementById('surpriseMeBtn').addEventListener('click', surpriseMe);
  document.getElementById('exportTxtBtn').addEventListener('click', exportTxt);
  document.getElementById('printViewBtn').addEventListener('click', printView);
  document.getElementById('copyAllBtn').addEventListener('click', copyAll);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  seedInput.addEventListener('input', function() { seedValue = this.value; saveState(); });
  creativitySlider.addEventListener('input', function() { creativity = parseFloat(this.value); saveState(); });
  randomSeedBtn.addEventListener('click', function() {
    var w = ["history", "ancient", "empire", "dynasty", "pharaoh", "caesar", "temple", "pyramid", "oracle", "cuneiform", "hieroglyph", "citadel", "acropolis", "forum", "ziggurat", "obelisk", "papyrus", "sparta", "athens", "persepolis"];
    seedValue = w[Math.floor(Math.random() * w.length)] + '-' + w[Math.floor(Math.random() * w.length)] + '-' + Math.floor(Math.random() * 99999);
    seedInput.value = seedValue;
    saveState();
  });
  document.getElementById('toggleAllSections').addEventListener('click', function() {
    if (activeSections.length === Object.keys(sectionNames).length) activeSections = [];
    else activeSections = Object.keys(sectionNames);
    renderSectionSelector();
    saveState();
  });
  document.getElementById('randomSubjectBtn').addEventListener('click', function() {
    var k = Object.keys(subjects);
    currentSubject = k[Math.floor(Math.random() * k.length)];
    renderSubjectGrid();
    saveState();
    renderPrompts(true);
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); renderPrompts(true); saveState(); }
  });

  // INIT
  loadState();
  seedInput.value = seedValue;
  creativitySlider.value = creativity;
  renderSubjectGrid();
  renderStyleSelector();
  renderPaletteSelector();
  renderEraSelector();
  renderComplexitySelector();
  renderSectionSelector();
  renderPackSelector();
  renderFavorites();
  document.getElementById("packLabel").textContent = packSize;
  if (centerPanel && (centerPanel.querySelector('.empty-state') || centerPanel.children.length === 0)) renderPrompts(false);
})();
</script>
</body>
</html>
