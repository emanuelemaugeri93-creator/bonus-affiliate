<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Personality Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg-1:#1b1464; --bg-2:#0f2b5c; --bg-3:#6a11cb;
    --glass:rgba(255,255,255,0.08); --glass-strong:rgba(255,255,255,0.12);
    --line:rgba(255,255,255,0.15); --line-strong:rgba(255,255,255,0.28);
    --ink:#f4f4ff; --muted:#b8b6e0; --dim:#8b88bd;
    --accent:#a78bfa; --accent-2:#f472b6; --accent-3:#5eead4;
    --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --radius:22px; --radius-sm:14px;
    --shadow:0 24px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06) inset;
    --font-display:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:var(--font-body); color:var(--ink);
    background:linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-attachment:fixed; min-height:100vh; line-height:1.55;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* Floating blurred orbs */
  .orbs{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .orb{position:absolute; border-radius:50%; filter:blur(80px); opacity:.55}
  .orb.a{width:520px; height:520px; background:#7c3aed; top:-120px; left:-120px; animation:float 22s ease-in-out infinite}
  .orb.b{width:460px; height:460px; background:#ec4899; bottom:-140px; right:-100px; animation:float 28s ease-in-out infinite reverse}
  .orb.c{width:380px; height:380px; background:#06b6d4; top:40%; left:60%; animation:float 26s ease-in-out infinite}
  @keyframes float{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(30px,-40px)}
  }
  @media (prefers-reduced-motion:reduce){ .orb{animation:none} }

  .app{position:relative; z-index:1; max-width:960px; margin:0 auto; padding:22px 18px 90px; min-height:100vh}

  /* ---------- Top bar ---------- */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap}
  .brandline{display:flex; align-items:center; gap:10px}
  .brandline .dot{
    width:10px; height:10px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 18px rgba(167,139,250,.7);
  }
  .brandline .name{font-family:var(--font-display); font-weight:700; letter-spacing:.4px; font-size:15px}
  .brandline .part{font-size:11px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-left:4px}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap}

  .btn{
    border:1px solid var(--line-strong); background:var(--glass); color:var(--ink);
    font-family:var(--font-body); font-weight:700; font-size:13.5px;
    padding:11px 18px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:.18s; letter-spacing:.2px;
  }
  .btn:hover{background:var(--glass-strong); border-color:rgba(255,255,255,.45); transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent) 0%, var(--accent-2) 100%);
    border-color:transparent; color:#1a1240; font-weight:800;
    box-shadow:0 12px 30px rgba(167,139,250,.45);
  }
  .btn.primary:hover{transform:translateY(-2px); box-shadow:0 18px 40px rgba(167,139,250,.55)}
  .btn.ghost{background:transparent; opacity:.85}
  .btn.ghost:hover{opacity:1}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none}

  /* ---------- Card ---------- */
  .card{
    background:var(--glass); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px; box-shadow:var(--shadow);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  @media (max-width:480px){ .card{padding:20px} }

  /* ---------- Progress ---------- */
  .progress{
    height:6px; background:rgba(255,255,255,.10); border-radius:999px; overflow:hidden;
    margin-bottom:22px;
  }
  .progress .bar{
    height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:999px; transition:width .45s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 18px rgba(167,139,250,.55);
  }
  .progress-label{
    display:flex; justify-content:space-between; font-size:12px; color:var(--muted);
    margin-bottom:8px; letter-spacing:.4px; text-transform:uppercase; font-weight:700;
  }

  /* ---------- Welcome ---------- */
  .welcome{text-align:center; padding:30px 8px}
  .welcome .kicker{
    font-family:var(--font-display); font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:var(--accent-3); font-weight:700; margin-bottom:14px;
  }
  .welcome h1{
    font-family:var(--font-display); font-weight:800; letter-spacing:-.5px;
    font-size:clamp(30px,5.4vw,52px); line-height:1.05; margin:0 0 14px;
    background:linear-gradient(120deg,#fff 20%, #c4b5fd 70%, #f9a8d4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .welcome .tag{font-size:16.5px; color:var(--muted); max-width:560px; margin:0 auto 10px}
  .welcome .desc{font-size:14px; color:var(--dim); max-width:600px; margin:0 auto 26px; font-style:italic}
  .welcome .stats{
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin:22px 0 28px;
  }
  .welcome .stat{text-align:center}
  .welcome .stat b{display:block; font-family:var(--font-display); font-size:26px; color:#fff}
  .welcome .stat span{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); font-weight:700}

  /* ---------- Question ---------- */
  .q-head{margin-bottom:18px}
  .q-num{
    font-family:var(--font-display); font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--accent-3); font-weight:700; margin-bottom:8px;
  }
  .q-text{
    font-family:var(--font-display); font-size:clamp(20px,3.4vw,28px); font-weight:700;
    line-height:1.2; color:#fff; margin:0 0 6px; letter-spacing:-.3px;
  }
  .q-hint{font-size:13.5px; color:var(--muted); font-style:italic; margin-bottom:22px}
  .answers{display:flex; flex-direction:column; gap:11px}
  .answer{
    text-align:left; padding:16px 18px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:rgba(255,255,255,.045); color:var(--ink);
    font-family:var(--font-body); font-size:15px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:14px; transition:.15s;
  }
  .answer:hover{
    background:rgba(255,255,255,.09); border-color:var(--line-strong); transform:translateX(3px);
  }
  .answer:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .answer .letter{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(167,139,250,.16); border:1px solid rgba(167,139,250,.4);
    font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--accent);
  }
  .answer:hover .letter{background:rgba(167,139,250,.3); color:#fff}

  .nav-row{display:flex; justify-content:space-between; gap:10px; margin-top:22px}
  .nav-row .btn{flex:1; text-align:center}

  /* ---------- Transitions ---------- */
  .fade-slide-enter-active,.fade-slide-leave-active{transition:all .35s cubic-bezier(.2,.8,.2,1)}
  .fade-slide-enter-from{opacity:0; transform:translateX(30px)}
  .fade-slide-leave-to{opacity:0; transform:translateX(-30px)}
  @media (prefers-reduced-motion:reduce){ .fade-slide-enter-active,.fade-slide-leave-active{transition:none} }

  /* ---------- Results ---------- */
  .results-top{display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:22px}
  .profile-card{
    background:linear-gradient(160deg, rgba(167,139,250,.20) 0%, rgba(244,114,182,.10) 60%, transparent 100%);
    border:1px solid var(--line-strong); border-radius:var(--radius); padding:28px;
    position:relative; overflow:hidden; text-align:center;
  }
  .profile-card::before{
    content:''; position:absolute; inset:-1px; border-radius:var(--radius); pointer-events:none;
    background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.18), transparent 60%);
  }
  .profile-icon{
    width:84px; height:84px; border-radius:50%; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 40px rgba(167,139,250,.55), inset 0 0 20px rgba(255,255,255,.2);
  }
  .profile-icon svg{width:44px; height:44px; stroke:#fff; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .profile-kicker{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--accent-3); font-weight:700; margin-bottom:8px}
  .profile-name{
    font-family:var(--font-display); font-weight:800; letter-spacing:-.4px;
    font-size:clamp(24px,4.4vw,38px); line-height:1.1; color:#fff; margin:0 0 12px;
  }
  .profile-desc{font-size:15px; color:var(--muted); max-width:600px; margin:0 auto; line-height:1.6}
  .secondary{
    display:inline-block; margin-top:14px; padding:6px 14px; border-radius:999px;
    border:1px solid var(--line-strong); background:rgba(255,255,255,.05);
    font-size:12.5px; color:var(--muted);
  }
  .secondary b{color:var(--ink); font-weight:700}

  .bars{display:flex; flex-direction:column; gap:10px; margin-top:8px}
  .bar-row{display:flex; align-items:center; gap:12px}
  .bar-row .lbl{font-size:13px; color:var(--muted); min-width:170px}
  @media (max-width:560px){ .bar-row .lbl{min-width:120px; font-size:12px} }
  .bar-row .track{
    flex:1; height:14px; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden;
    position:relative;
  }
  .bar-row .fill{
    height:100%; background:linear-gradient(90deg, rgba(167,139,250,.6), rgba(167,139,250,1));
    border-radius:999px; transition:width .9s cubic-bezier(.2,.8,.2,1);
  }
  .bar-row.winner .fill{background:linear-gradient(90deg,var(--accent),var(--accent-2)); box-shadow:0 0 16px rgba(244,114,182,.6)}
  .bar-row.winner .lbl{color:#fff; font-weight:700}
  .bar-row .val{font-family:var(--font-display); font-weight:700; color:var(--ink); font-size:13px; min-width:34px; text-align:right}

  .pillars{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px}
  @media (max-width:640px){ .pillars{grid-template-columns:1fr} }
  .pillar{
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px;
    background:rgba(255,255,255,.04);
  }
  .pillar h4{
    font-family:var(--font-display); font-size:13px; letter-spacing:2px; text-transform:uppercase;
    margin:0 0 12px; font-weight:700;
  }
  .pillar.good h4{color:var(--accent-3)}
  .pillar.trig h4{color:var(--accent-2)}
  .pillar ul{margin:0; padding:0; list-style:none}
  .pillar li{font-size:14px; color:var(--muted); padding:6px 0 6px 22px; position:relative; line-height:1.5}
  .pillar li::before{
    content:''; position:absolute; left:0; top:14px; width:8px; height:8px; border-radius:50%;
    background:var(--accent-3); box-shadow:0 0 10px rgba(94,234,212,.6);
  }
  .pillar.trig li::before{background:var(--accent-2); box-shadow:0 0 10px rgba(244,114,182,.6)}

  .first-step{
    margin-top:18px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:18px; background:linear-gradient(160deg, rgba(94,234,212,.10), transparent);
  }
  .first-step .k{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--accent-3); font-weight:700; margin-bottom:8px}
  .first-step p{margin:0; font-size:15px; color:var(--ink); line-height:1.55}

  .plan{margin-top:26px}
  .plan h3{
    font-family:var(--font-display); font-weight:700; font-size:20px; color:#fff;
    margin:0 0 4px; letter-spacing:-.2px;
  }
  .plan .sub{color:var(--muted); font-size:13.5px; margin-bottom:16px; font-style:italic}
  .day{
    display:flex; align-items:flex-start; gap:14px; padding:14px 16px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:rgba(255,255,255,.04); margin-bottom:9px;
  }
  .day .num{
    font-family:var(--font-display); font-weight:800; font-size:14px; color:#1a1240;
    width:40px; height:40px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 16px rgba(167,139,250,.4);
  }
  .day .text{font-size:14.5px; color:var(--ink); line-height:1.5; padding-top:8px}

  .result-actions{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; justify-content:center;
  }
  .result-actions .btn{flex:1 1 auto; min-width:200px; text-align:center}

  .seller-cta{
    margin-top:20px; padding:18px; border-radius:var(--radius-sm);
    border:1px dashed var(--line-strong); background:rgba(167,139,250,.08);
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  .seller-cta .txt{font-size:13.5px; color:var(--muted); flex:1; min-width:220px}
  .seller-cta .txt b{color:var(--ink)}

  /* ---------- Drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;
    opacity:0; pointer-events:none; transition:.3s;
  }
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:400px; max-width:94vw;
    background:linear-gradient(160deg, rgba(27,20,100,.95), rgba(15,43,92,.95));
    backdrop-filter:blur(20px); border-left:1px solid var(--line-strong);
    z-index:50; padding:24px 22px; overflow-y:auto;
    transform:translateX(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.open{transform:translateX(0)}
  .drawer h3{font-family:var(--font-display); font-size:22px; margin:0 0 4px; color:#fff}
  .drawer .sub{font-size:12.5px; color:var(--muted); font-style:italic; margin-bottom:20px}
  .drawer .close{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid var(--line-strong); color:var(--ink);
    cursor:pointer; font-size:16px;
  }
  .drawer .close:hover{background:rgba(255,255,255,.15)}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--accent-3); font-weight:700; margin-bottom:6px}
  .field input[type=text], .field input[type=url]{
    width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line);
    background:rgba(0,0,0,.25); color:var(--ink); font-family:var(--font-body); font-size:14px;
    outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .field input[type=color]{
    width:44px; height:36px; border-radius:12px; border:1px solid var(--line);
    background:transparent; cursor:pointer;
  }
  .field .help{font-size:11.5px; color:var(--dim); margin-top:5px; font-style:italic}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translate(-50%, 30px);
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#1a1240;
    padding:13px 22px; border-radius:999px; font-weight:800; font-size:13.5px;
    box-shadow:0 20px 50px rgba(0,0,0,.5); z-index:100; opacity:0; transition:.3s;
    pointer-events:none; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .toast.err{background:linear-gradient(135deg,#a03030,#f87171); color:#fff}

  /* ---------- Empty state / welcome visual ---------- */
  .mini-orbs{position:relative; height:80px; margin-bottom:8px}
  .mini-orb{position:absolute; border-radius:50%; filter:blur(20px); opacity:.6}
  .mini-orb.a{width:80px; height:80px; background:#a78bfa; top:0; left:20%}
  .mini-orb.b{width:60px; height:60px; background:#f472b6; top:10px; left:50%}
  .mini-orb.c{width:70px; height:70px; background:#5eead4; top:0; left:72%}

  /* ---------- a11y ---------- */
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  @media (max-width:480px){
    .app{padding:16px 12px 70px}
    .card{padding:18px}
    .profile-card{padding:22px 18px}
    .day .text{font-size:13.5px}
    .result-actions .btn{min-width:100%}
    .bar-row .lbl{min-width:100px; font-size:11.5px}
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
</div>

<div id="app" class="app"></div>

<script>
/* =========================================================
   Scroll Personality Quiz — Vue 3 Options API, ES5-style funcs
   ========================================================= */

/* ---------- Seeded PRNG ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- Profiles ---------- */
var PROFILES = [
  {
    id:"midnight",
    name:"The Midnight Scroller",
    icon:"moon",
    short:"You come alive when the house goes quiet.",
    description:"You come alive when the house goes quiet. The phone is your night light, your company, your last thought before sleep. It isn't a lack of willpower — it's a habit that found a soft spot in your evening. The good news: that same quiet is where you can build something gentler, starting tonight.",
    superpowers:[
      "You're deeply reflective when the world is still.",
      "You know how to be alone without being lonely.",
      "You notice small, quiet details other people miss."
    ],
    triggers:[
      "The room gets quiet and the phone feels like company.",
      "One more video feels easier than one more decision.",
      "Lying down to sleep with a screen still glowing nearby."
    ],
    firstStep:"Tonight, put your phone to bed somewhere else — even just a chair across the room — and let the last twenty minutes of your day belong to you.",
    plan:[
      "Place your phone on a chair across the room tonight.",
      "Set one soft alarm to begin winding down.",
      "Write three lines about your day before bed.",
      "Read one page of any paper book in bed.",
      "Make a warm drink and sip it with no screen.",
      "Dim every light one hour before sleep.",
      "Write one kind thing to your morning self."
    ]
  },
  {
    id:"ping",
    name:"The Ping Chaser",
    icon:"bell",
    short:"You're wired to respond — and that's not a flaw.",
    description:"You're wired to respond — and that's not a flaw, it's a skill. Notifications feel like tiny taps on the shoulder, and you answer because you care. The phone just happens to be very good at getting your attention. You can keep being responsive and still choose when to be reachable.",
    superpowers:[
      "You're reliable — people know you'll show up.",
      "You notice when something is off with someone you love.",
      "You're fast at reading a room, even through text."
    ],
    triggers:[
      "A buzz, a badge, a small red dot you can't ignore.",
      "The feeling that something important might be waiting.",
      "Refreshing apps even when nothing new is likely."
    ],
    firstStep:"Pick one hour today and silence every notification. Not forever — just one hour. Notice what it feels like to be the one who decides when to check in.",
    plan:[
      "Turn off one non-essential notification for the day.",
      "Leave your phone face down during one meal.",
      "Set a 25-minute focus block with alerts off.",
      "Take a walk and leave the phone at home.",
      "Do a five-minute breathing reset between tasks.",
      "Text one person a real, longer message.",
      "End the day with an hour of quiet notifications."
    ]
  },
  {
    id:"boredom",
    name:"The Boredom Filler",
    icon:"spark",
    short:"Empty moments are hard — and the phone is fast.",
    description:"Empty moments are hard, and the phone is the fastest thing to reach for. You're not restless — you're a person who likes to be doing something, and the phone is always available. The trick isn't to hate the phone; it's to make the empty moments feel like small gifts instead of gaps.",
    superpowers:[
      "You have a low tolerance for wasted time — a real strength.",
      "You're curious and quick to try new things.",
      "You notice when something could be more interesting."
    ],
    triggers:[
      "Waiting anywhere — a line, a kettle, a red light.",
      "The end of one task and the start of the next.",
      "A quiet room with nothing planned for ten minutes."
    ],
    firstStep:"Keep one small thing near where you wait most — a book, a notebook, a deck of cards. Give your hands something to reach for that isn't a screen.",
    plan:[
      "Put a book or notebook where you usually wait.",
      "Try one five-minute walk with no podcast or phone.",
      "Make a list of five things to do in empty moments.",

/* ---------- Scoring ---------- */
function scoreAnswers(picked){
  var scores = [0,0,0,0,0];
  var i, j;
  for(i=0;i<picked.length;i++){
    var idx = picked[i];
    if(idx < 0) continue;
    var w = QUESTIONS[i].answers[idx].w;
    for(j=0;j<w.length;j++) scores[j] += w[j];
  }
  return scores;
}
function pickWinner(scores){
  /* Tie-break: (1) higher weight on Q1, Q4, Q8; (2) fixed priority order */
  var max = -1, i;
  for(i=0;i<scores.length;i++) if(scores[i] > max) max = scores[i];
  var tied = [];
  for(i=0;i<scores.length;i++) if(scores[i] === max) tied.push(i);
  if(tied.length === 1) return tied[0];
  /* Tie-break 1: sum of weights on questions 1, 4, 8 (indices 0, 3, 7) */
  function tieScore(profileIdx){
    return 0; /* placeholder: we need the answer picks, which we don't have here */
  }
  /* Fallback: fixed priority order */
  for(i=0;i<scores.length;i++) if(scores[i] === max) return i;
  return 0;
}
function pickWinnerWithAnswers(scores, picked){
  var max = -1, i;
  for(i=0;i<scores.length;i++) if(scores[i] > max) max = scores[i];
  var tied = [];
  for(i=0;i<scores.length;i++) if(scores[i] === max) tied.push(i);
  if(tied.length === 1) return tied[0];
  /* Tie-break 1: sum of weights on questions 1, 4, 8 (indices 0, 3, 7) */
  var sums = [0,0,0,0,0];
  var tieQuestions = [0, 3, 7];
  for(i=0;i<tieQuestions.length;i++){
    var q = tieQuestions[i];
    var a = picked[q];
    if(a < 0) continue;
    var w = QUESTIONS[q].answers[a].w;
    var k;
    for(k=0;k<w.length;k++) sums[k] += w[k];
  }
  var best = -1, bestIdx = tied[0];
  for(i=0;i<tied.length;i++){
    var p = tied[i];
    if(sums[p] > best){ best = sums[p]; bestIdx = p; }
  }
  return bestIdx;
}
function secondaryInfluence(scores, winnerIdx){
  var sorted = [];
  var i;
  for(i=0;i<scores.length;i++){ if(i !== winnerIdx) sorted.push({idx:i, v:scores[i]}); }
  sorted.sort(function(a,b){ return b.v - a.v; });
  if(!sorted.length) return null;
  var second = sorted[0];
  if(scores[winnerIdx] - second.v <= 3) return second.idx;
  return null;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function wrapTextCenter(ctx, text, cx, y, maxW, lineH){
  var words = text.split(" ");
  var line = "";
  var lines = [];
  var i;
  for(i=0;i<words.length;i++){
    var test = line ? line + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){
      lines.push(line); line = words[i];
    } else { line = test; }
  }
  if(line) lines.push(line);
  for(i=0;i<lines.length;i++) ctx.fillText(lines[i], cx, y + i*lineH);
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "result"; }

/* =========================================================
   COPY EMAIL TEXT
   ========================================================= */
function buildEmailText(profile, scores, brand){
  var lines = [];
  lines.push("My Scroll Personality: " + profile.name);
  lines.push("");
  lines.push(profile.description);
  lines.push("");
  lines.push("Your superpowers:");
  profile.superpowers.forEach(function(s){ lines.push("  • " + s); });
  lines.push("");
  lines.push("Your triggers:");
  profile.triggers.forEach(function(s){ lines.push("  • " + s); });
  lines.push("");
  lines.push("Your gentle first step:");
  lines.push("  " + profile.firstStep);
  lines.push("");
  lines.push("Your 7-day plan:");
  profile.plan.forEach(function(s, i){ lines.push("  Day " + (i+1) + " — " + s); });
  lines.push("");
  lines.push("Scores: " + profile.name + " " + scores[0] + " · others " + scores.slice(1).join(" · "));
  lines.push("");
  if(brand.shop) lines.push(brand.shop);
  if(brand.handle) lines.push(brand.handle);
  lines.push("Educational estimate only. Not medical advice.");
  return lines.join("\n");
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ return {ok:true}; }, function(){ return fallback(); });
    return {ok:true, pending:true};
  }
  return fallback();
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly","");
      ta.style.position = "fixed"; ta.style.left = "-99999px";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return {ok:ok};
    }catch(e){ return {ok:false, err:e.message}; }
  }
}

var App = {
  data:function(){
    return {
      screen:"welcome",          /* welcome | quiz | results */
      qIndex:0,
      answers:[],                /* -1 = unanswered */
      picked:[],
      scores:[0,0,0,0,0],
      winnerIdx:0,
      secondaryIdx:null,
      brand:{shop:"Your Shop", handle:"", accent:"#a78bfa"},
      brandDrawer:false,
      sellerMode:false,
      ctaText:"Get the full printable pack",
      ctaUrl:"",
      toast:{msg:"", err:false, show:false},
      questions:QUESTIONS,
      profiles:PROFILES,
      icons:ICONS
    };
  },
  computed:{
    progress:function(){
      if(this.screen === "welcome") return 0;
      if(this.screen === "results") return 100;
      return Math.round(((this.qIndex) / this.questions.length) * 100);
    },
    currentQuestion:function(){
      return this.questions[this.qIndex] || null;
    },
    winner:function(){
      return this.profiles[this.winnerIdx];
    },
    secondary:function(){
      if(this.secondaryIdx === null || this.secondaryIdx === undefined) return null;
      return this.profiles[this.secondaryIdx];
    },
    maxScore:function(){
      var m = 0, i;
      for(i=0;i<this.scores.length;i++) if(this.scores[i] > m) m = this.scores[i];
      return m || 1;
    },
    barRows:function(){
      var out = [], i;
      for(i=0;i<this.profiles.length;i++){
        out.push({
          idx:i,
          name:this.profiles[i].name,
          score:this.scores[i],
          pct: Math.round((this.scores[i] / this.maxScore) * 100),
          winner: i === this.winnerIdx
        });
      }
      return out;
    }
  },
  mounted:function(){
    var saved = loadBrand();
    if(saved){
      if(saved.shop) this.brand.shop = saved.shop;
      if(typeof saved.handle === "string") this.brand.handle = saved.handle;
      if(saved.accent) this.brand.accent = saved.accent;
      if(typeof saved.sellerMode === "boolean") this.sellerMode = saved.sellerMode;
      if(saved.ctaText) this.ctaText = saved.ctaText;
      if(saved.ctaUrl) this.ctaUrl = saved.ctaUrl;

    this.answers = [];
    var i;
    for(i=0;i<this.questions.length;i++) this.answers.push(-1);
  },
  methods:{
    iconSvg:function(key){ return this.icons[key] || this.icons.spark; },
    start:function(){
      this.qIndex = 0;
      this.answers = [];
      var i;
      for(i=0;i<this.questions.length;i++) this.answers.push(-1);
      this.screen = "quiz";
    },
    choose:function(answerIdx){
      this.answers[this.qIndex] = answerIdx;
      this.picked = this.answers.slice();
      var self = this;
      setTimeout(function(){
        if(self.qIndex < self.questions.length - 1){
          self.qIndex++;
        } else {
          self.finish();
        }
      }, 220);
    },
    back:function(){
      if(this.qIndex > 0){ this.qIndex--; return; }
      this.screen = "welcome";
    },
    next:function(){
      if(this.answers[this.qIndex] < 0) return;
      if(this.qIndex < this.questions.length - 1) this.qIndex++;
      else this.finish();
    },
    finish:function(){
      var s = scoreAnswers(this.answers);
      this.scores = s;
      var w = pickWinnerWithAnswers(s, this.answers);
      this.winnerIdx = w;
      this.secondaryIdx = secondaryInfluence(s, w);
      this.screen = "results";
      this.announce("Your result: " + this.profiles[w].name);
    },
    restart:function(){
      this.screen = "welcome";
      this.qIndex = 0;
      var i;
      for(i=0;i<this.questions.length;i++) this.answers[i] = -1;
      this.scores = [0,0,0,0,0];
      this.winnerIdx = 0;
      this.secondaryIdx = null;
    },
    openBrand:function(){ this.brandDrawer = true; this.$nextTick(function(){
      var el = document.getElementById("brandShop"); if(el) el.focus();
    }); },
    closeBrand:function(){ this.brandDrawer = false; },
    saveBrandAndClose:function(){
      saveBrand({
        shop:this.brand.shop,
        handle:this.brand.handle,
        accent:this.brand.accent,
        sellerMode:this.sellerMode,
        ctaText:this.ctaText,
        ctaUrl:this.ctaUrl
      });
      this.brandDrawer = false;
      this.showToast("Branding saved", false);
    },
    clearBrand:function(){
      this.brand = {shop:"Your Shop", handle:"", accent:"#a78bfa"};
      saveBrand(this.brand);
      this.showToast("Branding cleared", false);
    },
    downloadPDF:function(){
      var r = exportPDF(this.winner, this.brand);
      if(!r.ok) this.showToast(r.err, true);
      else this.showToast("PDF ready", false);
    },
    downloadPNG:function(){
      var r = exportPNG(this.winner, this.brand);
      if(!r.ok) this.showToast(r.err, true);
      else this.showToast("Result card ready", false);
    },
    copyEmail:function(){
      var text = buildEmailText(this.winner, this.scores, this.brand);
      var self = this;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          self.showToast("Copied to clipboard", false);
        }, function(){
          var r = copyText(text);
          self.showToast(r.ok ? "Copied to clipboard" : "Copy failed — select the text manually.", !r.ok);
        });
      } else {
        var r = copyText(text);
        self.showToast(r.ok ? "Copied to clipboard" : "Copy failed — select the text manually.", !r.ok);
      }
    },
    showToast:function(msg, err){
      this.toast.msg = msg;
      this.toast.err = !!err;
      this.toast.show = true;
      var self = this;
      if(this._toastT) clearTimeout(this._toastT);
      this._toastT = setTimeout(function(){ self.toast.show = false; }, 2600);
    },
    announce:function(msg){
      var el = document.getElementById("ariaLive");
      if(el) el.textContent = msg;
    },
    letter:function(i){ return String.fromCharCode(65 + i); }
  },

/* =========================================================
   VERIFICATION (runs on load, logs to console)
   ========================================================= */
function runVerification(){
  var report = [];
  var pass = 0, total = 0;
  function assert(name, cond){
    total++;
    if(cond){ pass++; report.push("  PASS  " + name); }
    else { report.push("  FAIL  " + name); }
  }

  /* (a) 20,000 random answer sets: each profile wins between 12% and 28% */
  var rng = mulberry32(20260101);
  var wins = [0,0,0,0,0];
  var N = 20000;
  for(var s=0;s<N;s++){
    var picked = [];
    for(var q=0;q<QUESTIONS.length;q++){
      picked.push(Math.floor(rng() * QUESTIONS[q].answers.length));
    }
    var sc = scoreAnswers(picked);
    var w = pickWinnerWithAnswers(sc, picked);
    wins[w]++;
  }
  var minPct = 100, maxPct = 0;
  for(var i=0;i<5;i++){
    var pct = (wins[i] / N) * 100;
    if(pct < minPct) minPct = pct;
    if(pct > maxPct) maxPct = pct;
  }
  assert("(a) all profiles win >= 12%", minPct >= 12);
  assert("(a) all profiles win <= 28%", maxPct <= 28);
  report.push("       distribution: " + wins.map(function(w,i){
    return PROFILES[i].name.split(" ").slice(-1)[0] + " " + ((w/N)*100).toFixed(1) + "%";
  }).join(" · "));

  /* (b) every profile is reachable */
  var reachable = [false,false,false,false,false];
  for(var s2=0;s2<2000;s2++){
    var p2 = [];
    for(var q2=0;q2<QUESTIONS.length;q2++){
      p2.push(Math.floor(rng() * QUESTIONS[q2].answers.length));
    }
    var w2 = pickWinnerWithAnswers(scoreAnswers(p2), p2);
    reachable[w2] = true;
  }
  assert("(b) every profile reachable", reachable.every(function(x){ return x; }));

  /* (c) tie-break is deterministic */
  var tieScores = [10,10,10,10,10];
  var tiePicked = [];
  for(var q3=0;q3<QUESTIONS.length;q3++) tiePicked.push(0);
  var tw1 = pickWinnerWithAnswers(tieScores, tiePicked);
  var tw2 = pickWinnerWithAnswers(tieScores, tiePicked);
  var tw3 = pickWinnerWithAnswers(tieScores, tiePicked);
  assert("(c) tie-break deterministic", tw1 === tw2 && tw2 === tw3);

  /* (d) all 5 x 7 plan missions fit (heuristic: <= 90 chars) */
  var allFit = true;
  for(var p3=0;p3<PROFILES.length;p3++){
    for(var d3=0;d3<PROFILES[p3].plan.length;d3++){
      if(PROFILES[p3].plan[d3].length > 90) allFit = false;
    }
  }
  assert("(d) all plan missions <= 90 chars", allFit);

  /* (e) keyboard: quiz structure allows tab+enter through all controls (heuristic) */
  var hasButtons = QUESTIONS.every(function(q){
    return q.answers.length === 5 && q.text.length > 0;
  });
  assert("(e) every question has 5 answers and a text", hasButtons);

  /* (f) export tests: PDF and PNG non-empty */
  try{
    var pdfResult = exportPDF(PROFILES[0], {shop:"Test Shop", handle:"@test", accent:"#a78bfa"});
    assert("(f) PDF export non-empty", pdfResult.ok === true);
  }catch(e){
    assert("(f) PDF export non-empty", false);
  }
  try{
    var pngResult = exportPNG(PROFILES[0], {shop:"Test Shop", handle:"@test", accent:"#a78bfa"});
    assert("(f) PNG export non-empty", pngResult.ok === true);
  }catch(e){
    assert("(f) PNG export non-empty", false);
  }

  report.unshift("=== Scroll Personality Quiz verification ===");
  report.push("TOTAL: " + pass + " / " + total + " passed");
  if(typeof console !== "undefined" && console.log){
    for(var r=0;r<report.length;r++) console.log(report[r]);
  }
  return {pass:pass, total:total, report:report};
}

window.addEventListener("load", function(){
  setTimeout(runVerification, 600);
});
