<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }

@media (max-width: 760px) {

  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }

  .k-top { padding: 8px 10px; gap: 6px; }

  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }

  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }

@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }

  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }

<style>
/* Direction: Sidebar + Canvas, blueprint / graph-paper look (pale blue, navy ink, safety orange,
   Space Grotesk + Space Mono), because the buyers are maths teachers who live on graph paper. */
:root {
  --k-bg: #edf2f8;
  --k-panel: #ffffff;
  --k-panel-2: #f2f6fb;
  --k-ink: #14213d;
  --k-muted: #5d6b84;
  --k-line: #d5dfec;
  --k-accent: #f0592a;
  --k-accent-ink: #ffffff;
  --k-accent-soft: #ffe8de;
  --k-stage: #dfe8f3;
  --k-radius: 4px;
  --k-font: "Space Grotesk", system-ui, sans-serif;
  --k-display: "Space Grotesk", system-ui, sans-serif;
}
.k-stage {
  background-color: #dfe8f3;
  background-image: linear-gradient(#cfdbea 1px, transparent 1px), linear-gradient(90deg, #cfdbea 1px, transparent 1px);
  background-size: 22px 22px;
}
.k-btn, .k-card, .k-input, .k-select, .k-textarea, .k-seg { border-radius: 4px; }
.k-group-title { color: var(--k-accent); font-family: "Space Mono", monospace; }

/* ---------- Side panel: library ---------- */
.mg-cats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.mg-gal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
.mg-th {
  position: relative; border: 2px solid var(--k-line); border-radius: 4px; padding: 0; background: #fff;
  cursor: pointer; aspect-ratio: 1 / 1; overflow: hidden;
}
.mg-th img { width: 100%; height: 100%; display: block; }
.mg-th:hover { border-color: var(--k-muted); }
.mg-th.is-in { border-color: var(--k-accent); background: var(--k-accent-soft); }
.mg-th b {
  position: absolute; right: 2px; top: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--k-accent);
  color: #fff; font-size: 10px; line-height: 16px; padding: 0 3px;
}
.mg-th em {
  position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(20, 33, 61, .8);
  color: #fff; display: grid; place-items: center;
}
.mg-th em .k-ico { width: 10px; height: 10px; }
.mg-drop {
  border: 2px dashed var(--k-line); border-radius: 6px; padding: 12px 10px; text-align: center;
  font-size: 12.5px; color: var(--k-muted); cursor: pointer; background: var(--k-panel-2); margin-bottom: 10px;
}
.mg-drop b { display: block; color: var(--k-ink); font-size: 13.5px; margin-bottom: 2px; }
.mg-drop.is-over { border-color: var(--k-accent); background: var(--k-accent-soft); }
.mg-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.mg-ok { font-size: 11.5px; color: var(--k-ok); display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.mg-ok .k-ico { width: 14px; height: 14px; }
.mg-copy { display: grid; gap: 10px; }
.mg-copy textarea { min-height: 70px; font-size: 12.5px; }

/* ---------- Sheets. 1em = 1% of the page width. ---------- */
.mg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; color: #14213d; font-family: "Lexend", sans-serif; }
.mg-head { position: absolute; left: 6em; right: 6em; top: 4em; }
.mg-h1 { font-size: calc(3.3em * var(--fz, 1)); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mg-name { position: absolute; right: 0; top: .4em; font-size: calc(1.45em * var(--fz, 1)); white-space: nowrap; }
.mg-name i { display: inline-block; width: 9em; border-bottom: .1em solid #333; margin: 0 .3em; }
.mg-ins { font-size: calc(1.45em * var(--fz, 1)); line-height: 1.4; color: #39465f; margin-top: .55em; }
.mg-bar { position: absolute; left: 6em; right: 6em; border-top: .3em solid var(--ac); }
.mg-pairs { position: absolute; display: flex; flex-wrap: wrap; align-content: flex-start; }
.mg-p { display: flex; align-items: center; box-sizing: border-box; white-space: nowrap; font-family: "Space Mono", monospace; }
.mg-p > span { display: flex; align-items: center; }
.mg-p i { flex: none; width: .78em; height: .78em; border: .09em solid #445; margin-right: .38em; border-radius: .12em; }
.mg-p u { text-decoration: none; color: #8590a5; font-size: .72em; width: 1.9em; text-align: right; margin-right: .5em; flex: none; }
.mg-sec { width: 100%; box-sizing: border-box; display: flex; align-items: flex-end; font-weight: 700; color: var(--ac); white-space: nowrap; overflow: hidden; }
.mg-grid { position: absolute; }
.mg-grid img { width: 100%; height: 100%; display: block; }
.mg-foot { position: absolute; left: 6%; right: 6%; bottom: 2.4%; display: flex; justify-content: space-between; font-size: calc(1.25em * var(--fz, 1)); color: #7a8599; }
.mg-tag { position: absolute; right: 6em; font-size: calc(1.2em * var(--fz, 1)); font-family: "Space Mono", monospace; color: #7a8599; }
.mg-keys { position: absolute; left: 6em; right: 6em; display: flex; flex-wrap: wrap; justify-content: space-between; }
.mg-k { box-sizing: border-box; }
.mg-k img { width: 100%; display: block; border: .12em solid #c9d3e0; }
.mg-k div { font-size: calc(1.5em * var(--fz, 1)); font-weight: 700; margin-top: .3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* cover */
.mg-cv { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--ac); color: #fff; }
.mg-cv-paper { position: absolute; background: #fff; box-shadow: 0 .6em 2.4em rgba(0, 0, 0, .25); }
.mg-cv-paper img { width: 100%; height: 100%; display: block; }
.mg-cv-k { position: absolute; left: 8%; right: 8%; text-align: center; font-family: "Space Mono", monospace; font-size: calc(1.6em * var(--fz, 1)); letter-spacing: .25em; text-transform: uppercase; }
.mg-cv-t { position: absolute; left: 7%; right: 7%; text-align: center; line-height: 1.02; }
.mg-cv-s { position: absolute; left: 8%; right: 8%; text-align: center; font-size: calc(2.1em * var(--fz, 1)); font-weight: 700; }
.mg-cv-chips { position: absolute; left: 6em; right: 6em; display: flex; justify-content: center; flex-wrap: wrap; }
.mg-cv-chips span { font-family: "Space Mono", monospace; font-size: calc(1.4em * var(--fz, 1)); border: .12em solid #fff; padding: .3em .9em; margin: .3em; border-radius: 2em; white-space: nowrap; }
.mg-cv-by { position: absolute; left: 8%; right: 8%; text-align: center; font-size: calc(1.6em * var(--fz, 1)); opacity: .9; }

/* how-to */
.mg-how { position: absolute; left: 6em; right: 6em; }
.mg-how ol { margin: 0; padding: 0; list-style: none; counter-reset: st; }
.mg-how li { counter-increment: st; display: flex; align-items: flex-start; font-size: calc(1.75em * var(--fz, 1)); line-height: 1.38; margin-bottom: .7em; }
.mg-how li::before {
  content: counter(st); flex: none; width: 1.7em; height: 1.7em; border-radius: .25em; background: var(--ac); color: #fff;
  font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: .8em; font-size: .9em;
}
.mg-ex { position: absolute; left: 6em; right: 6em; display: flex; align-items: flex-start; }
.mg-ex-l { flex: 1 1 auto; padding-right: 3em; }
.mg-ex-t { font-size: calc(1.3em * var(--fz, 1)); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ac); margin-bottom: .6em; }
.mg-ex-p { font-family: "Space Mono", monospace; font-size: calc(1.5em * var(--fz, 1)); line-height: 1.7; }
.mg-ex img { flex: none; display: block; border: .12em solid #c9d3e0; }

      im.onerror = function () { API.toast("Could not read that picture.", "err"); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function listing(p, seed) {
    var R = Kit.rng(seed + "sell" + p.sellN), info = pages.info || { good: [] }, n = info.good.length, V = VERS[p.version];
    var grade = p.version === "q1" ? "Grades 4-6" : p.version === "q4" ? "Grades 6-8" : "Grades 5-7";
    var title = (p.bookTitle || "Mystery Graph Pictures") + " | " + n + " Coordinate Plane Graphing Worksheets | " + V.l + (p.version === "half" ? " with Decimals" : "") + " | " + grade + " | Answer Keys";
    var desc = R.pick(["Students plot ordered pairs, join the dots and a hidden picture appears.", "A maths activity that feels like a game: plot the points and reveal the mystery picture.", "Practice coordinates with a reward at the end: every page hides a picture."]) + "\n\n" +
      "WHAT YOU GET\n- " + n + " mystery picture worksheets (" + V.l.toLowerCase() + ", " + V.d + ")\n- " + info.points + " ordered pairs in total, grouped into shapes\n- A blank coordinate grid on every page\n- Full colour answer keys\n- How to plot page with a solved example\n\n" +
      "SKILLS\n- Reading and plotting ordered pairs (x, y)\n" + (p.version === "q4" ? "- Negative coordinates in all four quadrants\n" : "") + (p.version === "half" ? "- Halves and decimals on the coordinate plane\n" : "") + "- Precision, following steps, checking work\n\n" +
      R.pick(["Great for early finishers, sub plans, centres and homework.", "Perfect for test prep review, holidays and the last days before a break.", "Low prep: print and go, answer keys at the back."]) + "\n\nThis is a digital PDF. No physical item is shipped.";
    var tags = ["coordinate graphing", "mystery picture", "ordered pairs", "coordinate plane", "graphing worksheets", "math activity", "plot the points", p.version === "q4" ? "four quadrants" : "first quadrant", "math centers", "early finishers", "sub plans", grade.toLowerCase(), "printable math"];
    return { title: title.slice(0, 140), desc: desc, tags: tags.join(", ") };
  }
  function sellHTML(p, api) {
    var L = listing(p, api.S.seed);
    return '<div class="mg-copy"><div><div class="k-label"><span>Listing title</span><button class="k-btn k-sm" data-cp="title">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="title">' + Kit.esc(L.title) + "</textarea></div>" +
      '<div><div class="k-label"><span>Description</span><button class="k-btn k-sm" data-cp="desc">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="desc" style="min-height:230px">' + Kit.esc(L.desc) + "</textarea></div>" +
      '<div><div class="k-label"><span>13 tags</span><button class="k-btn k-sm" data-cp="tags">' + Kit.icon("copy") + 'Copy</button></div><textarea class="k-textarea" readonly data-t="tags">' + Kit.esc(L.tags) + "</textarea></div>" +
      '<button class="k-btn" data-reword>' + Kit.icon("shuffle") + "New wording</button></div>";
  }
  function sellWire(box, api) {
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cp],[data-reword]");
      if (!b) return;
      if (b.dataset.cp) { api.copy(box.querySelector('[data-t="' + b.dataset.cp + '"]').value); api.toast("Copied"); }
      else api.set("sellN", (api.p.sellN || 0) + 1);
    });
  }

  /* ==========================================================================
     The app
     ========================================================================== */
  Kit.app({
    slug: "mystery-graph-picture-maker",
    title: "Mystery Graph Picture Maker",
    tagline: "Coordinate graphing worksheets that reveal a hidden picture, with answer keys",
    projectName: "My Mystery Graph Book",
    logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v17h17"/><path d="m7 16 4-7 3 4 5-8"/><circle cx="7" cy="16" r=".6"/><circle cx="11" cy="9" r=".6"/><circle cx="14" cy="13" r=".6"/><circle cx="19" cy="5" r=".6"/></svg>',
    init: function (api) { API = api; },
    usedAssets: function (p) { return (p.mine || []).map(function (m) { return m.id; }); },
    mockColors: function (p) { return ["#eef4fb", p.accent]; },
    mainAction: { label: "Random picture set", icon: "shuffle" },
    onShuffle: function (p, api) {
      var R = Kit.rng(api.S.seed + "set"), pool = LIB_ORDER.filter(function (id) { return p.cat === "all" || LIB[id].cat === p.cat; });
      var n = clamp((p.pics || []).length || 8, 4, Math.min(12, pool.length));
      p.pics = R.shuffle(pool).slice(0, n);
    },
    views: [
      { id: "ws", label: "Worksheets", filter: function (pg) { return pg.kind === "ws"; } },
      { id: "key", label: "Answer keys", filter: function (pg) { return pg.kind === "key"; } }
    ],
    stats: function (ctx, pgs) {
      var i = pages.info;
      if (pages.pending) return "Tracing your picture...";
      return i ? i.good.length + " pictures  ·  " + i.points + " points  ·  " + pgs.length + " pages" + (i.bad.length ? "  ·  " + i.bad.length + " left out" : "") : "";
    },
    onRender: function () {
      var i = pages.info;
      if (i && i.bad.length && i.bad.join() !== onRenderWarned) { onRenderWarned = i.bad.join(); API.toast("Left out (failed the check): " + i.bad.join(", "), "err"); }
    },
    empty: "<h3>Pick some pictures</h3><p>Open the Pictures tab and click the pictures you want in the book, or press Random picture set.</p>",
    pages: pages,
    tabs: [
      { id: "pics", label: "Pictures", groups: [
        { title: "Pictures in the book", fields: [
          { id: "pics", type: "html", def: ["l:heart", "l:cat", "l:rocket", "l:fish", "l:house", "l:owl"], render: libHTML, wire: libWire },
          { id: "cat", type: "html", def: "all", render: function () { return ""; }, show: function () { return false; } },
          { id: "mine", type: "html", def: [], render: function () { return ""; }, show: function () { return false; } }
        ] },
        { title: "Tracing my own pictures", show: function (p) { return (p.mine || []).length > 0; }, fields: [
          { id: "tracePts", type: "range", label: "Points per picture", def: 26, min: 10, max: 60, step: 2, hint: "Fewer points is easier to plot. More points follows the outline more closely." },
          { id: "traceThr", type: "range", label: "Detail", def: 22, min: 6, max: 60, hint: "Raise it when the background is busy, lower it when the subject is pale." },
          { id: "traceInvert", type: "toggle", label: "Light subject on a dark background", def: false }
        ] }
      ] },
      { id: "sheet", label: "Worksheet", groups: [
        { title: "Version", fields: [
          { id: "version", type: "cards", def: "q1", options: Object.keys(VERS).map(function (k) { return { v: k, l: VERS[k].l, d: VERS[k].d }; }) },
          { id: "halfStyle", type: "seg", label: "Write halves as", def: "decimal", show: function (p) { return p.version === "half"; }, options: [{ v: "decimal", l: "Decimals 2.5" }, { v: "fraction", l: "Fractions 2½" }] },
          { id: "shift", type: "toggle", label: "Move each picture a little (new set of pairs)", def: false, hint: "With this on, Random picture set also gives every picture new coordinates, so two classes never get the same pairs." }
        ] },
        { title: "Ordered pairs", fields: [
          { id: "pairStyle", type: "seg", label: "Each pair has", def: "box", options: [{ v: "box", l: "Tick box" }, { v: "num", l: "Number" }, { v: "none", l: "Nothing" }] },
          { id: "showName", type: "toggle", label: "Show the picture name on the worksheet", def: false, hint: "Off keeps it a mystery: the title says Mystery Picture 1, 2, 3..." },
          { id: "nameLine", type: "toggle", label: "Name line", def: true }
        ] },
        { title: "Grid", fields: [
          { id: "gridLook", type: "seg", label: "Grid colour", def: "blue", options: [{ v: "blue", l: "Blue" }, { v: "gray", l: "Gray" }, { v: "ink", l: "Ink saver" }] }
        ] }
      ] },
      { id: "page", label: "Page", groups: [
        { title: "Paper", fields: [
          { id: "pageSize", type: "select", label: "Page size", def: "letter", options: Kit.sizeOptions() },
          { id: "bleed", type: "toggle", label: "Add bleed (0.125 in) for KDP", def: false }
        ] },
        { title: "Look", fields: [
          { id: "accent", type: "swatches", label: "Accent colour", def: "#f0592a", options: ACCENTS.map(function (a) { return { v: a[0], l: a[1], c: a[0] }; }) },
          { id: "titleFont", type: "select", label: "Title font", def: "Space Grotesk", options: FONTS.map(function (f) { return { v: f[0], l: f[0] + " (" + f[1] + ")" }; }) },
          { id: "footer", type: "text", label: "Footer text", def: "", placeholder: "Your shop or class name" }
        ] },
        { title: "Book", fields: [
          { id: "bookTitle", type: "text", label: "Book title", def: "Mystery Graph Pictures", max: 50 },
          { id: "parts", type: "chips", def: ["cover", "howto", "answers"], options: [{ v: "cover", l: "Cover" }, { v: "howto", l: "How to plot" }, { v: "answers", l: "Answer keys" }] },
          { id: "keyLayout", type: "seg", label: "Answer keys", def: "many", options: [{ v: "many", l: "Several per page" }, { v: "one", l: "One per page" }] },
          { type: "buttons", key: "reset", buttons: [{ label: "Reset text edits", icon: "reset", run: function (api) { api.resetEdits(); } }] }
        ] }
      ] },
      { id: "sell", label: "Sell it", groups: [
        { title: "Listing text for TPT, Etsy or your shop", fields: [
          { id: "sellN", type: "html", def: 0, render: sellHTML, wire: sellWire, hint: "Written from your book. Use Export > Listing mockup image for the pictures." }
        ] }
      ] }
    ],
    exports: [
      { label: "Ordered pairs (CSV)", hint: "Every picture, shape and point", icon: "file", run: function (api) {
        var i = pages.info;
        if (!i || !i.good.length) return api.toast("Add a picture first.", "err");
        var rows = ["picture,name,shape,point,x,y"];
        i.good.forEach(function (g, n) { g.secs.forEach(function (s, si) { s.forEach(function (q, k) { rows.push([n + 1, '"' + g.pic.name + '"', si + 1, k + 1, q[0], q[1]].join(",")); }); }); });
        api.download(api.fileBase() + "-pairs.csv", rows.join("\n"), "text/csv");
        api.toast("Ordered pairs saved");
      } },
      { label: "Ordered pairs (text)", hint: "Ready to paste into slides or a document", icon: "copy", run: function (api) {
        var i = pages.info;
        if (!i || !i.good.length) return api.toast("Add a picture first.", "err");
        var t = i.good.map(function (g, n) {
          return "Mystery Picture " + (n + 1) + " (" + g.pic.name + ")\n" + g.secs.map(function (s, si) { return "Shape " + (si + 1) + ": " + s.map(function (q) { return pairText(q, api.p); }).join(" "); }).join("\n");
        }).join("\n\n");
        api.download(api.fileBase() + "-pairs.txt", t, "text/plain");
        api.toast("Text file saved");
      } }
    ],
    guide: {
      intro: "Mystery Graph Picture Maker builds coordinate graphing worksheets: students plot ordered pairs, join them and a hidden picture appears. Pick from the built-in library or turn your own picture into one, then download the whole book with answer keys.",
      steps: [
        "Open Pictures and click the pictures you want, or press Random picture set.",
        "Open Worksheet and pick the version: first quadrant, four quadrants or halves.",
        "Open Page to set the paper size, colours and the book parts.",
        "Press Export and download the PDF. Use the Worksheets and Answer keys chips to export them apart."
      ],
      controls: [
        ["Version", "First quadrant uses 0 to 20. Four quadrants uses -10 to 10. Halves uses 0 to 10 with steps of one half."],
        ["Write halves as", "2.5 or 2 and a half, for the halves version."],
        ["Move each picture", "Shifts every picture a few squares using the variation code, so you can make different versions of the same picture."],
        ["Each pair has", "A tick box to cross off, a number, or nothing."],
        ["Show the picture name", "Off keeps it a mystery. The answer key always shows the name."],
        ["Grid colour", "Blue, gray or a light ink saver grid."],
        ["My own picture", "The tool finds the outline of the main subject and turns it into points. Points per picture and Detail tune the result."],
        ["Random picture set", "Picks a new set of pictures from the category you are looking at."]
      ],
      exports: [["Ordered pairs (CSV)", "Every point of every picture, for a spreadsheet."], ["Ordered pairs (text)", "All pairs as plain text, ready for slides."]],
      tips: [
        "Pictures with up to 30 points fit one page with the grid. Longer ones get a pairs page and a grid page.",
        "Four quadrants with Move each picture on gives a fresh test version in one click.",
        "For your own pictures use a clear silhouette, clipart or a photo with a plain background.",
        "Every picture is checked before it appears: it closes, stays on the grid and has no crossing lines."
      ],
      trouble: [
        ["My picture traced badly", "Raise Detail if the background got in, lower it if the subject is pale, or switch on Light subject on a dark background."],
        ["A picture was left out", "It failed the check for this version. Try fewer points or switch Move each picture off."]
      ]
    }
  });
  var onRenderWarned = "";

  document.addEventListener("paste", function (e) {
    if (e.target.closest && e.target.closest("[data-edit],input,textarea")) return;
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFile(files[0]); }
  });
})();
</script>
