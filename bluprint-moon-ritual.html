      // ---------- ULTRA VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 19;
        var seed = lastSeed;

        var theme = currentTheme;
        var style = currentStyle;
        var pageRange = currentPageRange;
        var visual = currentVisual;
        var chaos = chaosLevel;

        var data = getThemeData(theme);
        var styleData = styleAdjustments[style];
        var title = getRandomTitle(data, seed);
        var subtitle = getRandomSubtitle(data, seed + 10);
        var stages = getRandomStages(data, seed + 20);
        var visualDesc = visualStyleBank[visual] || "celestial black and gold style";
        var exactPages = getExactPageCount(pageRange);
        var keywords = (data.keywords || []).join(', ');
        var activities = getRandomActivities(data, 24, seed + 30);
        var specificPages = getRandomStylePages(styleData, seed + 40);

        var extraTwists = "";
        if (chaos >= 3) {
          var twists = [
            "Include a 'design your own ritual candle label' creative page.",
            "Add a 'moon phase sketching' art page for visual reflection.",
            "Incorporate a 'letter to the universe' free-writing page.",
            "Add a 'personal ritual soundtrack' playlist design page.",
            "Include a 'seasonal tea blend recipe' page for ritual sipping.",
            "Add a 'create your own affirmation deck' cut-out page.",
            "Incorporate a 'ritual bath recipe' design page with herbs and intentions.",
            "Add a 'full moon circle' journaling page for community reflections.",
            "Include a 'sacred space vision board' collage page.",
            "Add a 'monthly oracle pull' tracking grid.",
            "Incorporate a 'ritual self-care menu' design page.",
            "Add a 'gratitude tree' drawing page.",
            "Include a 'moon diary' for tracking dreams and moods.",
            "Add a 'crystal grid of the month' design page.",
            "Incorporate a 'personal altar photograph and reflection' page."
          ];
          for (var t = 0; t < chaos - 1; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 500 + t) + "\n";
          }
        }

        var pagePlan = buildDynamicPagePlan(stages, exactPages, title, activities, specificPages, seed, chaos);

        var prompt = "CREATE A COMPLETE 9-SECTION MOON CYCLE & RITUAL LIVING WORKBOOK BLUEPRINT following the exact structure below. This is a UNIQUE, HIGH-CREATIVITY variation. Chaos level: " + chaos + "/5.\n\n" +
        "IMPORTANT FRAMING: All content must be secular/reflective in nature — personal intention-setting, mindfulness, journaling, self-reflection tied to natural cycles. Never present astrology, spellwork, or moon phases as having verified predictive or medical effect. Frame everything as a personal ritual/reflection practice. This workbook is a personal reflection and journaling tool, not a religious text, medical practice, or claim of supernatural effect.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for " + styleData.audience + " seeking a structured, intentional practice around \"" + theme + "\". Also suitable for wellness and yoga studio owners as a client resource, small ritual/candle/crystal shop owners as a gift-with-purchase item, and gift buyers for someone interested in moon cycles, ritual, or spiritual aesthetics. Can be used as: self-paced reflection workbook, studio or shop client resource, or commercially packaged product for Etsy, Gumroad, KDP. This workbook is a personal reflection and journaling tool. It makes no religious claims, no medical claims, no guarantees of manifestation or supernatural effect. All practices are framed as personal ritual and intentional living.\n\n" +
        "3. SHORT PRODUCT DESCRIPTION\n" +
        "This intentional, grounded printable workbook guides " + styleData.audience + " through a structured journey of \"" + theme + "\". " + styleData.toneNote + " Each page provides thoughtful frameworks and gentle guidance for personal reflection and ritual practice.\n" +
        "With " + exactPages + " beautifully designed pages, users move through a natural rhythm of reflection, intention, and personal growth. The undated format allows working at any pace, honoring each individual's unique journey and timing.\n\n" +
        "4. 7 SEO KEYWORDS\n" + keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Reflective Path)\n" +
        buildStageList(stages) + "\n" +
        extraTwists + "\n" +
        "6. CONTENT AND LAYOUT STYLE GUIDE\n" +
        "Tone: Warm, intentional, grounded. No medical, psychic, or guaranteed-manifestation claims. All practices framed as personal reflection and intentional living. " + styleData.toneNote + "\n" +
        "Visual direction: " + visualDesc + ". Incorporate celestial iconography: moon phases, single stars, simple line-art candle, leaf sprig.\n" +
        "Page structure: Clean layouts with clear instructional text. Include moon-phase tracking calendars, intention-setting and release writing pages, personal ritual design worksheets (framed as personal practice, not instructional occult text), gratitude and reflection logs, sacred-space/altar planning pages (described as a personal cozy corner, not religious iconography), simple mood/energy check-in scales. Complexity level: " + styleData.complexity + ". Generous margins for binding. Consistent footer format.\n" +
        "Consistency rules: Every page includes footer \"[" + title + "] - [page number]\". No dense text blocks. Ample white space for written responses. All ritual instructions must include safety notes where relevant (candles, burning practices).\n\n" +
        "7. WORKBOOK STRUCTURE OVERVIEW\n" +
        "Front Matter (pages 1-2): Welcome letter, how to use this workbook, a 'My Ritual Practice Intentions' starter page.\n" +
        buildModuleStructure(stages, exactPages) + "\n\n" +
        "8. COVER PROMPT\n" +
        "A vertical 8.5x11 full-color front cover. Visual style: " + visualDesc + ". Main illustration: celestial artwork with moon phases, stars, and gentle ritual motifs. Exact title text: \"" + title + "\" and subtitle \"" + subtitle + "\". Do NOT include barcodes, real photographs, or small dense text. Keep 0.25 inch safe print margin.\n\n" +
        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +
        pagePlan + "\n\n" +
        "10. PRODUCT VERSION SUGGESTIONS\n" +
        "Starter Version (16-20 pages): Core moon-cycle tracking and intention pages only, simplified layout.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (adds 12-18 pages): Includes a full 12-month lunar calendar insert, additional seasonal ritual pages for all four Wheel-of-the-Year points, a personal ritual-tool inventory tracker, and a printable altar/sacred-space planning insert.\n";

        return prompt;
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 7);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Closing Reflection & Next Steps (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, title, activities, specificPages, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome to Your Ritual Practice - Purpose: set a warm, intentional tone. Image Prompt: \"celestial-themed header with moon phase and star motifs, title '" + title + "', footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: My Ritual Practice Intentions - Purpose: personal reflection on practice goals. Image Prompt: \"reflection prompts: 'I'm drawn to ritual because...', 'What I hope to cultivate...', 'My intention for this practice...', footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Activity " + (p+1);
            var chaosNote = "";
            if (chaos >= 4) chaosNote = "Include a small celestial accent (moon phase, star, or candle icon). ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: reflective exercise for " + stage.toLowerCase() + ". Image Prompt: \"" + chaosNote + "clear instructional text, appropriate journaling/checklist/reflection layout, celestial-themed accents, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        if (specificPages && specificPages.length > 0 && pageNum <= totalPages - 2) {
          for (var e = 0; e < specificPages.length && pageNum <= totalPages - 2; e++) {
            plan += "Page " + pageNum + ": \"" + specificPages[e] + "\" - Purpose: " + getStyleLabel(currentStyle) + "-specific support. Image Prompt: \"tailored layout with celestial motifs, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
          }
        }

        while (pageNum <= totalPages - 2) {
          plan += "Page " + pageNum + ": Bonus Reflection: Ritual Living Notes - Purpose: journaling space. Image Prompt: \"open journal page with moon and star accents, footer '[" + title + " - " + pageNum + "]'\"\n";
          pageNum++;
        }

        plan += "Page " + pageNum + ": My Practice Summary & Key Insights - Purpose: consolidate learning. Image Prompt: \"structured reflection boxes, 'My most meaningful ritual moment...', 'What I've discovered about myself...', footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": Continuing Your Practice: Next Steps - Purpose: forward-looking close. Image Prompt: \"hopeful closing page with space for intentions and a personal commitment to ongoing practice, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

      function updateUI() {
        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;
        var wordCount = promptText.split(/\s+/).filter(function(w){return w.length>0;}).length;
        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var styleLabel = getStyleLabel(currentStyle);
        var tagsHtml = '<span class="tag">🌙 ' + currentTheme + '</span>' +
                       '<span class="tag">✨ ' + styleLabel + '</span>' +
                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('themeSelect').addEventListener('change', function(e) {
        currentTheme = e.target.value;
        updateUI();
      });

      var styleBtns = document.querySelectorAll('.style-btn');
      styleBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          styleBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentStyle = btn.getAttribute('data-style');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
</body>
</html>
