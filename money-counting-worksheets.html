/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.

:root {
  --k-bg: #f4f1ea;

* { box-sizing: border-box; }

<style>
/* Direction: Sidebar + Canvas in a mint-ledger language (pale banknote green, bottle-green ink, brass accent,
   Newsreader serif + Manrope), because money is about trust and a calm, engraved feel reads as "real money". */
:root {
  --k-bg: #edf3ec;

  --k-font: "Manrope", system-ui, sans-serif;
  --k-display: "Newsreader", Georgia, serif;
}
.k-btn.k-primary { box-shadow: inset 0 0 0 2px #c9a227; }
.k-card.is-on { border-color: #c9a227; box-shadow: 0 0 0 2px #c9a22755; }

.mn-unit b { font-family: "Newsreader", serif; font-size: 17px; }
.mn-unit small { color: #cfe3d6; font-size: 11.5px; line-height: 1.45; }
.mn-unit .k-btn { justify-content: center; background: #c9a227; color: #1d1b12; box-shadow: none; }
.mn-ok { font-size: 11.5px; padding: 7px 9px; border-radius: 8px; background: #e3f2e6; color: #1d5d2a; line-height: 1.4; }

.mn-copy .k-label { margin-bottom: 4px; align-items: center; }
.mn-cur { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mn-cur button { border: 1px solid var(--k-line); background: #fff; border-radius: 9px; padding: 6px 2px 5px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font: 700 11px var(--k-font); color: var(--k-muted); }

/* ---------- sheets: 1em = 1% of the page width ---------- */

.mn-ins > em > svg { width: 1.6em; height: 1.6em; }

.mn-key .mn-ft > code { color: #b3261e; }

.hs-ledger .mn-lines { position: absolute; left: 0; right: 0; top: 0; height: 3em; background: var(--ink); }

.hs-receipt .mn-rc { position: absolute; left: 4.5em; width: .5em; top: 0; bottom: 0; background: repeating-linear-gradient(180deg, var(--ac) 0, var(--ac) 1.2em, transparent 1.2em, transparent 2.4em); }
.hs-frame .mn-fr { position: absolute; left: 3em; right: 3em; top: 2.4em; bottom: 2.4em; border: .5em double var(--ink); border-radius: .8em; }
.hs-coins .mn-cc { position: absolute; border-radius: 50%; border: .5em solid var(--ac); opacity: .6; }

.mn-red { color: #b3261e; font-weight: 700; }

.mn-tag > span { display: block; font-family: "DM Mono", monospace; font-weight: 700; white-space: nowrap; }

  /* clip art: every coin and note of the currency in three inks, SVG + PNG */
  function clipArt(api) {
    var p = api.p, C = CUR[p.cur];
    api.progress("Drawing money clip art...", 0);
    api.loadLib("jszip").then(function () {
      var zip = new window.JSZip(), jobs = [];
      ["color", "grey", "outline"].forEach(function (st) {
        C.coins.forEach(function (c) { jobs.push({ name: st + "/coin-" + c.v, svg: coinSVG(p.cur, c, st), w: 800, h: 800 }); });
        C.notes.forEach(function (n) { jobs.push({ name: st + "/note-" + n.v / 100, svg: noteSVG(p.cur, n, st), w: Math.round(n.w * 8), h: Math.round(n.h * 8) }); });
      });
      var i = 0;
      function step() {
        if (i >= jobs.length) {
          return zip.generateAsync({ type: "blob" }).then(function (blob) { api.download(api.fileBase() + "-" + p.cur + "-money-clipart.zip", blob); api.progress(null); api.toast("Clip art saved: " + jobs.length + " pictures as SVG and PNG"); });
        }
        var j = jobs[i];
        zip.file(j.name + ".svg", j.svg);
        api.progress("Drawing " + j.name, i / jobs.length);
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () {
            var c = document.createElement("canvas");
            c.width = j.w;
            c.height = j.h;
            c.getContext("2d").drawImage(im, 0, 0, j.w, j.h);
            c.toBlob(function (b) { zip.file(j.name + ".png", b); i++; res(); }, "image/png");
          };
          im.onerror = function () { i++; res(); };
          im.src = url(j.svg);
        }).then(step);
      }
      return step();
    }).catch(function (e) { console.error(e); api.progress(null); api.toast("Clip art failed. Check your connection.", "err"); });
  }
