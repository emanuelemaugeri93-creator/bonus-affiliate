        return arr[Math.floor(seededRandom(seed) * arr.length)];

        return getRandomElement(data.subtitles, seed + 5);

      function getStagesForTimeline(data, timeline, seed) {
        var stagesForTimeline = data.stages[timeline];
        if (!stagesForTimeline || stagesForTimeline.length === 0) {
          stagesForTimeline = data.stages["open"] || data.stages["single"] || data.stages["firstyear"];
        }
        return stagesForTimeline;
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["reflect on this stage of the journey", "document a key moment", "plan for the next step"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "30-40") return 35;

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 7);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Closing Reflection & Looking Ahead (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, activities, title, event, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome Letter - Purpose: set a warm, inviting tone for the " + event + " journey. Image Prompt: \"gentle header illustration with " + (getEventData(event).iconography || "event motifs") + ", title '" + title + "', footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: Where You Are Now Check-In - Purpose: baseline reflection. Image Prompt: \"simple reflection prompts: 'Right now I feel...', 'My biggest hope is...', 'My biggest concern is...', footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Activity " + (p+1);
            var chaosNote = "";
            if (chaos >= 4) chaosNote = "Add a small surprise element (inspirational quote, hidden illustration, or gentle unexpected prompt). ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: engage with " + stage.toLowerCase() + ". Image Prompt: \"" + chaosNote + "clear layout with generous white space, instructional text: '" + activityTitle + "', event-appropriate decorative accents, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        plan += "Page " + pageNum + ": Looking Back: My Journey Reflection - Purpose: consolidate the experience. Image Prompt: \"reflection page with prompts: 'I've grown by...', 'I'm grateful for...', 'I'm taking forward...', footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": Looking Ahead: Hopes for What's Next - Purpose: forward-looking close. Image Prompt: \"hopeful closing page with space for intentions, a favorite quote, and a personal commitment, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('eventSelect').addEventListener('change', function(e) {
        currentEvent = e.target.value;
        updateUI();
      });

      document.getElementById('timelineSelect').addEventListener('change', function(e) {
        currentTimeline = e.target.value;
        updateUI();
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
</body>
</html>
