<style id="kit-css">
/* ==========================================================================
   Creator Space Lab - Studio Kit 2.0 (shared shell for every tool)
   Each tool sets its own look by overriding the --k-* variables on :root.
   All kit classes start with "k-" so they never collide with tool styles.
   ========================================================================== */
:root {
  --k-bg: #f4f1ea;
  --k-panel: #ffffff;
  --k-panel-2: #f7f5f0;
  --k-ink: #1d1b16;
  --k-muted: #6f6a5e;
  --k-line: #e3ded2;
  --k-accent: #e8a400;
  --k-accent-ink: #1d1b16;
  --k-accent-soft: #fff4d1;
  --k-danger: #c8372d;
  --k-ok: #1f8a4c;
  --k-stage: #e9e5da;
  --k-radius: 12px;
  --k-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k-display: var(--k-font);
  --k-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--k-font);
  color: var(--k-ink);
  background: var(--k-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.k-ico { width: 18px; height: 18px; flex: none; display: block; }

/* ---------- App frame ---------- */
.k-app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
.k-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--k-panel);
  border-bottom: 1px solid var(--k-line); min-width: 0;
}
.k-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-logo {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--k-accent); color: var(--k-accent-ink);
  display: grid; place-items: center;
}
.k-logo svg { width: 24px; height: 24px; }
.k-titles { min-width: 0; }
.k-title {
  font-family: var(--k-display); font-weight: 800; font-size: 16px;
  line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-tagline {
  font-size: 12px; color: var(--k-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.k-spacer { flex: 1; }
.k-pname {
  width: 190px; min-width: 90px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid transparent; background: var(--k-panel-2); font-weight: 600; font-size: 13px;
}
.k-pname:hover, .k-pname:focus { border-color: var(--k-line); outline: none; background: var(--k-panel); }
.k-saved { font-size: 11px; color: var(--k-muted); white-space: nowrap; }

/* ---------- Buttons ---------- */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-weight: 600; font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.k-btn:hover { border-color: var(--k-ink); }
.k-btn:active { transform: translateY(1px); }
.k-btn:disabled { opacity: .4; cursor: default; border-color: var(--k-line); }
.k-btn.k-icon { padding: 8px; }
.k-btn.k-primary {
  background: var(--k-accent); color: var(--k-accent-ink); border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.k-btn.k-primary:hover { filter: brightness(1.05); }
.k-btn.k-ghost { border-color: transparent; background: transparent; }
.k-btn.k-ghost:hover { background: var(--k-panel-2); }
.k-btn.k-danger { color: var(--k-danger); }
.k-btn.k-big { width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 11px; }
.k-btn.k-sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.k-group-btns { display: inline-flex; }
.k-group-btns .k-btn { border-radius: 0; margin-left: -1px; }
.k-group-btns .k-btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.k-group-btns .k-btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Body: side panel + stage ---------- */
.k-body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.k-side {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--k-panel); border-right: 1px solid var(--k-line);
}
.k-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.k-tab {
  padding: 9px 11px; border: 0; background: none; cursor: pointer; white-space: nowrap;
  font-weight: 700; font-size: 12.5px; color: var(--k-muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.k-tab.is-on { color: var(--k-ink); border-bottom-color: var(--k-accent); }
.k-scroll { overflow-y: auto; padding: 14px; min-height: 0; }
.k-foot { padding: 12px 14px; border-top: 1px solid var(--k-line); display: grid; gap: 8px; }
.k-foot-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.k-group { margin-bottom: 18px; }
.k-group-title {
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-muted); margin: 0 0 9px;
}
.k-field { margin-bottom: 12px; }
.k-field[hidden] { display: none; }
.k-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.k-label small { font-weight: 600; color: var(--k-muted); }
.k-hint { font-size: 11.5px; color: var(--k-muted); margin-top: 4px; line-height: 1.4; }
.k-input, .k-select, .k-textarea {
  width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--k-line);
  background: var(--k-panel); font-size: 13px;
}
.k-textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.k-input:focus, .k-select:focus, .k-textarea:focus {
  outline: 2px solid var(--k-accent); outline-offset: 1px; border-color: transparent;
}
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--k-panel-2); padding: 4px; border-radius: 10px; }
.k-seg button {
  border: 0; background: none; padding: 7px 6px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-size: 12px; color: var(--k-muted);
}
.k-seg button.is-on { background: var(--k-panel); color: var(--k-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-chip {
  border: 1px solid var(--k-line); background: var(--k-panel); border-radius: 999px;
  padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.k-chip.is-on { background: var(--k-ink); color: var(--k-panel); border-color: var(--k-ink); }
.k-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.k-card {
  position: relative; text-align: left; border: 1.5px solid var(--k-line); background: var(--k-panel);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 1.25;
}
.k-card small { display: block; font-weight: 500; color: var(--k-muted); margin-top: 2px; font-size: 11px; }
.k-card.is-on { border-color: var(--k-accent); background: var(--k-accent-soft); }
.k-card.is-on::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--k-accent);
}
.k-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.k-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; background: none;
  display: grid; gap: 3px; justify-items: center; font-size: 10px; font-weight: 700; color: var(--k-muted);
}
.k-swatch i { display: block; width: 100%; height: 30px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .12); }
.k-swatch.is-on i { outline: 2.5px solid var(--k-ink); outline-offset: 2px; }
.k-swatch.is-on { color: var(--k-ink); }
.k-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.k-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.k-toggle span {
  width: 38px; height: 22px; border-radius: 999px; background: var(--k-line); position: relative; flex: none; transition: background .15s;
}
.k-toggle span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.k-toggle input:checked + span { background: var(--k-accent); }
.k-toggle input:checked + span::after { transform: translateX(16px); }
.k-toggle input:focus-visible + span { outline: 2px solid var(--k-ink); outline-offset: 2px; }
.k-range { width: 100%; accent-color: var(--k-accent); }

/* ---------- Stage ---------- */
.k-stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--k-stage); }
.k-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; overflow-x: auto;
  background: color-mix(in srgb, var(--k-panel) 70%, transparent); border-bottom: 1px solid var(--k-line);
}
.k-bar .k-chips { flex-wrap: nowrap; }
.k-canvas { overflow: auto; min-height: 0; padding: 26px; position: relative; }
.k-pages { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.k-pages.is-work { display: block; }
.k-work { width: 100%; min-height: 100%; }
.k-pages.is-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 18px; }
.k-slot { position: relative; flex: none; }
.k-slot-label {
  position: absolute; left: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--k-muted); white-space: nowrap;
}
.k-pages.is-grid .k-slot { cursor: pointer; }
.k-pages.is-grid .k-slot:hover .k-sheet { box-shadow: 0 0 0 3px var(--k-accent), var(--k-shadow); }
.k-sheet {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; color: #111;
  box-shadow: var(--k-shadow); overflow: hidden;
}
.k-sheet [data-edit] { outline: none; border-radius: 3px; cursor: text; transition: box-shadow .12s, background .12s; }
.k-sheet [data-edit]:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-accent) 55%, transparent); }
.k-sheet [data-edit]:focus { box-shadow: 0 0 0 2px var(--k-accent); background: rgba(255, 255, 255, .7); }
.k-pager {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px;
  background: var(--k-panel); border-top: 1px solid var(--k-line); font-size: 12.5px; font-weight: 700;
}
.k-pager span { min-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-empty { max-width: 420px; margin: 8vh auto; text-align: center; color: var(--k-muted); }
.k-empty h3 { color: var(--k-ink); font-family: var(--k-display); margin: 12px 0 6px; }

/* ---------- Menus, modals, toasts ---------- */
.k-menu-wrap { position: relative; }
.k-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 250px;
  background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px;
  box-shadow: var(--k-shadow); padding: 6px; display: none;
}
.k-menu.is-open { display: block; animation: k-pop .14s ease-out; }
.k-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.k-menu button small { display: block; font-weight: 500; color: var(--k-muted); font-size: 11.5px; }
.k-menu button:hover { background: var(--k-panel-2); }
.k-menu hr { border: 0; border-top: 1px solid var(--k-line); margin: 5px 0; }

.k-veil {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 14, 12, .5);
  display: grid; place-items: center; padding: 16px; animation: k-fade .15s ease-out;
}
.k-modal {
  width: min(680px, 100%); max-height: min(86dvh, 820px); display: grid; grid-template-rows: auto 1fr auto;
  background: var(--k-panel); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); animation: k-pop .18s ease-out;
}
.k-modal.is-narrow { width: min(430px, 100%); }
.k-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.k-modal-head h2 { font-family: var(--k-display); font-size: 18px; margin: 0; flex: 1; }
.k-modal-body { padding: 4px 18px 16px; overflow-y: auto; font-size: 13.5px; line-height: 1.55; }
.k-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
.k-modal-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-muted); margin: 18px 0 8px; }
.k-steps { counter-reset: s; display: grid; gap: 9px; padding: 0; margin: 0; list-style: none; }
.k-steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.k-steps li::before {
  content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--k-accent); color: var(--k-accent-ink); font-weight: 800; font-size: 13px;
}
.k-dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin: 0; }
.k-dl dt { font-weight: 700; }
.k-dl dd { margin: 0; color: var(--k-muted); }
.k-kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--k-line); border-bottom-width: 2px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--k-panel-2);
}
.k-list { display: grid; gap: 8px; }
.k-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 11px;
}
.k-row b { display: block; font-size: 13.5px; }
.k-row small { color: var(--k-muted); font-size: 11.5px; }
.k-row > div:first-child { flex: 1; min-width: 0; }
.k-row b, .k-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.k-toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.k-toast {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--k-ink); color: var(--k-panel); box-shadow: var(--k-shadow); animation: k-pop .18s ease-out; max-width: 92vw;
}
.k-toast.is-ok .k-ico { color: #6fe39b; }
.k-toast.is-err { background: var(--k-danger); color: #fff; }
.k-progress { position: fixed; inset: 0; z-index: 150; background: rgba(15, 14, 12, .55); display: grid; place-items: center; }
.k-progress-box { width: min(360px, 88vw); background: var(--k-panel); border-radius: 16px; padding: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.k-progress-bar { height: 8px; border-radius: 999px; background: var(--k-line); overflow: hidden; margin-top: 12px; }
.k-progress-bar i { display: block; height: 100%; width: 0; background: var(--k-accent); transition: width .2s; }
.k-confetti { position: fixed; inset: 0; z-index: 210; pointer-events: none; }
.k-offscreen { position: fixed; left: -100000px; top: 0; }
.k-offscreen .k-sheet { position: relative; box-shadow: none; }
.k-mnav { display: none; }

@keyframes k-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1100px) {
  .k-body { grid-template-columns: 300px 1fr; }
  .k-tagline, .k-saved { display: none; }
}
@media (max-width: 760px) {
  .k-app { grid-template-rows: auto 1fr auto; }
  .k-body { grid-template-columns: 1fr; }
  .k-body[data-pane="design"] .k-stage { display: none; }
  .k-body[data-pane="preview"] .k-side { display: none; }
  .k-side { border-right: 0; }
  .k-top { padding: 8px 10px; gap: 6px; }
  .k-pname, .k-hide-m { display: none; }
  .k-title { font-size: 14px; }
  .k-logo { width: 32px; height: 32px; }
  .k-canvas { padding: 22px 12px 16px; }
  .k-mnav { display: grid; grid-template-columns: 1fr 1fr; background: var(--k-panel); border-top: 1px solid var(--k-line); }
  .k-mnav button {

  .k-mnav button.is-on { color: var(--k-ink); box-shadow: inset 0 3px 0 var(--k-accent); }
  .k-btn { min-height: 38px; }
  .k-menu { position: fixed; left: 10px; right: 10px; top: 56px; min-width: 0; }
  .k-dl { grid-template-columns: 1fr; gap: 2px 0; }

/* ---------- Exact print: one sheet per page, nothing else ---------- */
@media print {
  body { overflow: visible; background: #fff; }
  .k-app, .k-veil, .k-toasts, .k-progress { display: none !important; }

  .k-offscreen .k-sheet { page-break-after: always; break-after: page; }

<style>
/* Direction: Sidebar + Canvas in a railway-station brutalist language (signal yellow, ink black, hard
   shadows, Archivo + JetBrains Mono), because clocks belong to stations and teachers want bold, exact tools. */
:root {
  --k-bg: #f2eee1;
  --k-panel: #fffdf5;
  --k-panel-2: #f3ecd6;
  --k-ink: #111111;
  --k-muted: #5d584a;
  --k-line: #d6cfb7;
  --k-accent: #ffcc00;
  --k-accent-ink: #111111;
  --k-accent-soft: #fff2b0;
  --k-stage: #ddd6c0;
  --k-radius: 3px;
  --k-font: "Archivo", system-ui, sans-serif;
  --k-display: "Archivo Black", "Archivo", sans-serif;
}
.k-btn.k-primary { border: 2px solid #111; box-shadow: 3px 3px 0 #111; }
.k-btn.k-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #111; }
.k-btn, .k-input, .k-select, .k-textarea, .k-card, .k-seg { border-radius: 3px; }
.k-card.is-on { box-shadow: 3px 3px 0 #111; border-color: #111; }

/* ---------- side panel extras ---------- */
.ct-unit { border: 2px solid #111; background: #111; color: #fff; padding: 12px; border-radius: 3px; display: grid; gap: 8px; }
.ct-unit b { font-family: "Archivo Black", sans-serif; font-size: 15px; letter-spacing: .02em; }
.ct-unit small { color: #d9d3bd; font-size: 11.5px; line-height: 1.4; }
.ct-unit .k-btn { justify-content: center; }
.ct-ok { font-size: 11.5px; padding: 7px 9px; border-radius: 3px; background: #e6f4e6; color: #1d5d2a; line-height: 1.4; border-left: 4px solid #1d8a3a; }
.ct-ok.is-bad { background: #fde5e1; color: #9b1c16; border-left-color: #c8372d; }
.ct-copy { display: grid; gap: 10px; }
.ct-copy textarea { min-height: 70px; font-size: 12.5px; }
.ct-copy .k-label { margin-bottom: 4px; align-items: center; }
.ct-faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ct-face { border: 1px solid var(--k-line); background: #fff; padding: 4px; cursor: pointer; border-radius: 3px; display: grid; gap: 2px; justify-items: center; font-size: 10px; color: var(--k-muted); }
.ct-face img { width: 100%; aspect-ratio: 1; display: block; }
.ct-face.is-on { border: 2px solid #111; box-shadow: 2px 2px 0 #111; color: #111; font-weight: 700; }

/* ---------- sheets: 1em = 1% of the page width ---------- */
.ct { position: absolute; left: 0; top: 0; right: 0; bottom: 0; color: #1a1a1a; font-family: var(--bf); }
.ct-b { position: absolute; }
.ct-meta { position: absolute; left: 7em; right: 7em; display: flex; gap: 2.4em; align-items: flex-end; }
.ct-meta > div { flex: 1; display: flex; align-items: flex-end; gap: .6em; min-width: 0; }
.ct-meta > div.is-s { flex: 0 0 22%; }
.ct-meta > div > span { font-size: 1.45em; white-space: nowrap; color: #444; }
