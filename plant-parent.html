      function getThemeData(theme) {
        return themeBank[theme] || themeBank["Building Your First Urban Jungle from Scratch"];
      }

      function getRandomElement(arr, seed) {
        return arr[Math.floor(seededRandom(seed) * arr.length)];
      }

      function getRandomTitle(data, seed) {
        return getRandomElement(data.titles, seed);
      }

      function getRandomSubtitle(data, seed) {
        return getRandomElement(data.subtitles, seed + 1);
      }

      function getRandomStages(data, seed) {
        if (data.stages && Array.isArray(data.stages[0])) {
          return getRandomElement(data.stages, seed + 2);
        }
        return data.stages[0];
      }

      function getRandomActivities(data, count, seed) {
        var acts = data.activities || ["observe your plants carefully", "document a new leaf or growth", "plan your next plant purchase"];
        var shuffled = [];
        for (var i = 0; i < acts.length; i++) shuffled.push(acts[i]);
        for (var j = shuffled.length - 1; j > 0; j--) {
          var k = Math.floor(seededRandom(seed + j) * (j + 1));
          var temp = shuffled[j];
          shuffled[j] = shuffled[k];
          shuffled[k] = temp;
        }
        return shuffled.slice(0, count);
      }

      function getExactPageCount(rangeStr) {
        if (rangeStr === "20-24") return 22;
        if (rangeStr === "24-30") return 27;
        if (rangeStr === "30-42") return 36;
        return 48;
      }

      function getLevelLabel(level) {
        if (level === "beginner") return "Total Beginner";
        if (level === "growing") return "Growing Collection";
        return "Serious Collector";
      }

      function getRandomLevelPages(levelData, seed) {
        var sets = levelData.specificPagesSets;
        if (sets && sets.length > 0) {
          return getRandomElement(sets, seed + 3);
        }
        return levelData.specificPages || [];
      }

      // ---------- ULTRA VARIATION ASSEMBLY ----------
      function assemblePrompt() {
        variationCount++;
        document.getElementById('variationCounter').textContent = '🌀 Variations generated: ' + variationCount;
        lastSeed = Date.now() + variationCount * 17;
        var seed = lastSeed;

        var theme = currentTheme;
        var level = currentLevel;
        var pageRange = currentPageRange;
        var visual = currentVisual;
        var chaos = chaosLevel;

        var data = getThemeData(theme);
        var levelData = levelAdjustments[level];
        var title = getRandomTitle(data, seed);
        var subtitle = getRandomSubtitle(data, seed + 10);
        var stages = getRandomStages(data, seed + 20);
        var visualDesc = visualStyleBank[visual] || "warm botanical illustrated style";
        var exactPages = getExactPageCount(pageRange);
        var keywords = (data.keywords || []).join(', ');
        var activities = getRandomActivities(data, 22, seed + 30);
        var specificPages = getRandomLevelPages(levelData, seed + 40);

        var extraTwists = "";
        if (chaos >= 3) {
          var twists = [
            "Include a 'plant gratitude journal' page to reflect on what each plant teaches you.",
            "Add a 'design your dream greenhouse' sketch page.",
            "Incorporate a 'plant-inspired recipe' page using herbs or edible plants.",
            "Add a 'leaf rubbing art' page for creative documentation.",
            "Include a 'plant name brainstorming' page for naming your plants.",
            "Add a 'seasonal plant photo shoot' checklist page.",
            "Incorporate a 'plant care playlist' design page for mindful watering days.",
            "Add a 'letter to my future plant collection' journaling page.",
            "Include a 'plant swap wishlist' page for community trading.",
            "Add a 'watering day self-care ritual' page combining plant care with personal wellness.",
            "Incorporate a 'plant time capsule' page to document your collection at this moment.",
            "Add a 'my plant care mistakes and what I learned' reflection page."
          ];
          for (var t = 0; t < chaos - 1; t++) {
            extraTwists += "✨ CHAOS TWIST: " + getRandomElement(twists, seed + 500 + t) + "\n";
          }
        }

        var pagePlan = buildDynamicPagePlan(stages, exactPages, title, activities, specificPages, seed, chaos);

        var prompt = "CREATE A COMPLETE 9-SECTION PLANT PARENT & URBAN JUNGLE WORKBOOK BLUEPRINT following the exact structure below. This is a UNIQUE, HIGH-CREATIVITY variation. Chaos level: " + chaos + "/5.\n\n" +
        "1. PRODUCT TITLE AND SUBTITLE\n" +
        "Title: \"" + title + "\"\n" +
        "Subtitle: \"" + subtitle + "\"\n\n" +
        "2. RECOMMENDED AUDIENCE AND USE CASE\n" +
        "Ideal for " + levelData.audience + " seeking practical, organized support for \"" + theme + "\". Also suitable for plant shop owners as a client resource or gift-with-purchase, plant-focused content creators wanting a branded companion product, and gift buyers for plant lovers. Can be used as: self-paced plant-care workbook, plant shop client resource, or commercially packaged product for Etsy, Gumroad, KDP. This workbook supports observation, routine-building, and personal organization. It makes no professional horticultural claims, no pest-control guarantees, and no plant-survival promises. Observation pages are designed as personal notes to research or discuss with a plant professional.\n\n" +
        "3. SHORT PRODUCT DESCRIPTION\n" +
        "This warm, encouraging printable workbook guides " + levelData.audience + " through a structured journey of \"" + theme + "\". " + levelData.toneNote + " Each page provides clear frameworks and gentle guidance to support a thriving plant-parent journey.\n" +
        "With " + exactPages + " beautifully designed pages, users move from uncertainty to confident, joyful plant care. The undated format allows working at any pace, making it a lasting resource for every stage of the plant-parent experience.\n\n" +
        "4. 7 SEO KEYWORDS\n" + keywords + "\n\n" +
        "5. WORKBOOK CONCEPT OVERVIEW (Growth Path)\n" +
        buildStageList(stages) + "\n" +
        extraTwists + "\n" +
        "6. CONTENT AND LAYOUT STYLE GUIDE\n" +
        "Tone: Warm, encouraging, non-judgmental. No guaranteed plant-survival claims, no professional horticultural or pest-control diagnosis. Observation pages framed as 'notes to research or discuss with a plant professional.' " + levelData.toneNote + "\n" +
        "Visual direction: " + visualDesc + ". Incorporate botanical iconography: leaf, watering can, sun gauge, small pot, trailing vine.\n" +
        "Page structure: Clean layouts with clear instructional text. Include light-mapping worksheets, watering schedule trackers, plant profile pages, propagation logs, symptom-observation pages, plant shopping wishlist and budget trackers. Complexity level: " + levelData.complexity + ". Generous margins for binding. Consistent footer format.\n" +
        "Consistency rules: Every page includes footer \"[" + title + "] - [page number]\". No dense text blocks. Ample white space for written responses.\n\n" +
        "7. WORKBOOK STRUCTURE OVERVIEW\n" +
        "Front Matter (pages 1-2): Welcome letter, how to use this workbook, a 'My Plant Story' reflection page.\n" +
        buildModuleStructure(stages, exactPages) + "\n\n" +
        "8. COVER PROMPT\n" +
        "A vertical 8.5x11 full-color front cover. Visual style: " + visualDesc + ". Main illustration: lush botanical artwork with leaves, vines, and potted plants. Exact title text: \"" + title + "\" and subtitle \"" + subtitle + "\". Do NOT include barcodes, real photographs, or small dense text. Keep 0.25 inch safe print margin.\n\n" +
        "9. PAGE-BY-PAGE WORKBOOK PLAN (" + exactPages + " pages total)\n" +
        pagePlan + "\n\n" +
        "10. PRODUCT VERSION SUGGESTIONS\n" +
        "Starter Version (16-20 pages): Core light assessment and watering routine tools only, simplified layout.\n" +
        "Standard Version (" + exactPages + " pages): The full blueprint as described above.\n" +
        "Expanded Version (adds 12-18 pages): Includes duplicate plant-profile pages for a growing collection, a seasonal repotting calendar insert, additional propagation tracking pages, and a printable 'new plant parent' gift tag/card insert.\n";

        return prompt;
      }

      function buildStageList(stages) {
        var result = "";
        for (var i = 0; i < stages.length; i++) {
          result += "Stage " + (i+1) + ": \"" + stages[i] + "\"\n";
        }
        return result;
      }

      function buildModuleStructure(stages, totalPages) {
        var modules = Math.min(stages.length, 7);
        var frontPages = 2;
        var remaining = totalPages - frontPages - 2;
        var pagesPerModule = Math.floor(remaining / modules);
        var result = "";
        var currentPage = frontPages + 1;
        for (var i = 0; i < modules; i++) {
          var endPage = (i === modules-1) ? totalPages-2 : currentPage + pagesPerModule -1;
          result += "Module " + (i+1) + ": \"" + stages[i] + "\" (pages " + currentPage + "-" + endPage + ")\n";
          currentPage = endPage + 1;
        }
        result += "Final Reflection & Next Steps (pages " + (totalPages-1) + "-" + totalPages + ")";
        return result;
      }

      function buildDynamicPagePlan(stages, totalPages, title, activities, specificPages, seed, chaos) {
        var plan = "";
        var pageNum = 1;
        plan += "Page 1: Welcome Letter - Purpose: set a warm, encouraging tone. Image Prompt: \"warm botanical header with leaf and vine motifs, title '" + title + "', footer '[" + title + " - 1]'\"\n";
        plan += "Page 2: My Plant Story - Purpose: personal reflection on plant journey. Image Prompt: \"reflection prompts: 'My first plant was...', 'What I love about plants...', 'My plant goals are...', footer '[" + title + " - 2]'\"\n";
        pageNum = 3;

        var pagesLeft = totalPages - 4;
        var stagePages = Math.floor(pagesLeft / stages.length);
        var extra = pagesLeft % stages.length;
        var actIdx = 0;

        for (var s = 0; s < stages.length; s++) {
          var stage = stages[s];
          var pagesForThisStage = stagePages + (s < extra ? 1 : 0);
          for (var p = 0; p < pagesForThisStage; p++) {
            var activityTitle = (activities && actIdx < activities.length) ? activities[actIdx] : stage + " Activity " + (p+1);
            var chaosNote = "";
            if (chaos >= 4) chaosNote = "Include a small botanical accent (leaf, watering can, or sun icon). ";

            plan += "Page " + pageNum + ": \"" + activityTitle + "\" - Purpose: practical exercise for " + stage.toLowerCase() + ". Image Prompt: \"" + chaosNote + "clear instructional text, appropriate table/checklist/log layout, botanical-themed accents, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
            actIdx++;
          }
        }

        if (specificPages && specificPages.length > 0 && pageNum <= totalPages - 2) {
          for (var e = 0; e < specificPages.length && pageNum <= totalPages - 2; e++) {
            plan += "Page " + pageNum + ": \"" + specificPages[e] + "\" - Purpose: " + getLevelLabel(currentLevel) + "-specific support. Image Prompt: \"tailored layout with botanical motifs, footer '[" + title + " - " + pageNum + "]'\"\n";
            pageNum++;
          }
        }

        while (pageNum <= totalPages - 2) {
          plan += "Page " + pageNum + ": Bonus Reflection: Plant Parent Notes - Purpose: journaling space. Image Prompt: \"open journal page with leaf accents, footer '[" + title + " - " + pageNum + "]'\"\n";
          pageNum++;
        }

        plan += "Page " + pageNum + ": My Growth Summary & Key Takeaways - Purpose: consolidate learning. Image Prompt: \"structured reflection boxes, 'My proudest plant moment...', 'My next plant goal...', footer '[" + title + " - " + pageNum + "]'\"\n";
        plan += "Page " + (pageNum+1) + ": Looking Ahead: My Plant Dreams - Purpose: forward-looking close. Image Prompt: \"hopeful closing page with space for a wishlist plant sketch and future goals, footer '[" + title + " - " + (pageNum+1) + "]'\"";
        return plan;
      }

      function updateUI() {
        var promptText = assemblePrompt();
        document.getElementById('promptDisplay').textContent = promptText;
        var charCount = promptText.length;
        var wordCount = promptText.split(/\s+/).filter(function(w){return w.length>0;}).length;
        document.getElementById('charCount').textContent = charCount + " chars · " + wordCount + " words";

        var levelLabel = getLevelLabel(currentLevel);
        var tagsHtml = '<span class="tag">🪴 ' + currentTheme + '</span>' +
                       '<span class="tag">🌱 ' + levelLabel + '</span>' +
                       '<span class="tag">📄 ' + currentPageRange + ' pages</span>' +
                       '<span class="tag">🎨 ' + currentVisual + '</span>' +
                       '<span class="tag">🌀 Chaos: ' + chaosLevel + '/5</span>';
        document.getElementById('settingsTags').innerHTML = tagsHtml;
      }

      document.getElementById('themeSelect').addEventListener('change', function(e) {
        currentTheme = e.target.value;
        updateUI();
      });

      var levelBtns = document.querySelectorAll('.level-btn');
      levelBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          levelBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentLevel = btn.getAttribute('data-level');
          updateUI();
        });
      });

      document.getElementById('pageCountSelect').addEventListener('change', function(e) {
        currentPageRange = e.target.value;
        updateUI();
      });

      document.getElementById('visualStyleSelect').addEventListener('change', function(e) {
        currentVisual = e.target.value;
        updateUI();
      });

      document.getElementById('chaosSlider').addEventListener('input', function(e) {
        chaosLevel = parseInt(e.target.value);
        document.getElementById('chaosDisplay').textContent = chaosLevel;
        updateUI();
      });

      document.getElementById('generateBtn').addEventListener('click', function() {
        updateUI();
      });

      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function() {
        var text = document.getElementById('promptDisplay').textContent;
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.innerHTML = '✓ Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.innerHTML = '📋 Copy Full Blueprint Prompt';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });

      updateUI();
    })();
  </script>
