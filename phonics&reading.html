<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Phonics & Reading Practice Page Builder ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #2D1B69;
      --bg-secondary: #1a0f3c;
      --gold: #FFD700;
      --coral: #FF6B6B;
      --mint: #4ECDC4;
      --lavender: #C77DFF;
      --sunset: #FF8C42;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #2D1B69 0%, #1a0f3c 30%, #0d1f3c 70%, #1a0f3c 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255,215,0,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(78,205,196,0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(199,125,255,0.05) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(255,107,107,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1450px;
      width: 100%;
      background: rgba(26,15,60,0.9);
      backdrop-filter: blur(25px);
      border-radius: 3rem;
      overflow: hidden;
      box-shadow: 
        0 30px 70px rgba(0,0,0,0.6),
        0 0 0 2px rgba(255,215,0,0.15),
        inset 0 2px 0 rgba(255,255,255,0.08);
      gap: 0;
      position: relative;
      z-index: 1;
      min-height: 90vh;
    }

    /* ============ LEFT PANEL ============ */
    .control-panel {
      width: 430px;
      min-width: 430px;
      background: linear-gradient(180deg, #1a0f3c 0%, #150b30 100%);
      color: #f0e6ff;
      padding: 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 92vh;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid rgba(255,215,0,0.2);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,215,0,0.4) transparent;
      position: relative;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #FFD700, #FFA500);
      border-radius: 10px;
    }

    .panel-header {
      text-align: center;
      margin-bottom: 0.3rem;
      flex-shrink: 0;
      position: relative;
    }

    .panel-header .logo-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 0.2rem;
      filter: drop-shadow(0 6px 12px rgba(255,215,0,0.5));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .panel-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFD700, #FF8C42, #FF6B6B, #C77DFF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 0.2rem;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .panel-header .subtitle {
      font-size: 0.8rem;
      color: #b8a0d0;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .section-label {
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b8a0d0;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255,215,0,0.3), transparent);
      border-radius: 1px;
    }

    /* Grade Cards */
    .grade-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .grade-card {
      background: linear-gradient(135deg, #2a1850, #1e1040);
      padding: 0.8rem 0.5rem;
      border-radius: 1.2rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
      color: #c0b0e0;
      position: relative;
      overflow: hidden;
    }
    .grade-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .grade-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,215,0,0.5);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      color: #fff;
    }
    .grade-card:hover::before { opacity: 1; }
    .grade-card.active {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #1a0f3c;
      border-color: #FFD700;
      transform: scale(1.06);
      box-shadow: 0 12px 30px rgba(255,215,0,0.5), 0 0 40px rgba(255,215,0,0.3);
      font-weight: 800;
      z-index: 2;
    }
    .grade-card .grade-icon {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
    }

    /* Theme Grid */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .theme-card {
      background: linear-gradient(135deg, #2a1850, #1e1040);
      border-radius: 1rem;
      padding: 0.6rem 0.2rem;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      color: #c0b0e0;
      position: relative;
      overflow: hidden;
    }
    .theme-card:hover {
      transform: translateY(-3px);
      border-color: rgba(78,205,196,0.5);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      color: #fff;
    }
    .theme-card .theme-emoji {
      font-size: 1.8rem;
      transition: transform 0.3s;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    }
    .theme-card:hover .theme-emoji {
      transform: scale(1.2) rotate(-8deg);
    }
    .theme-card.active {
      border-color: #4ECDC4;
      background: linear-gradient(135deg, #1e3050, #152540);
      transform: scale(1.08);
      box-shadow: 0 12px 28px rgba(78,205,196,0.4), 0 0 30px rgba(78,205,196,0.2);
      color: #fff;
      z-index: 2;
    }
    .theme-card.active .theme-emoji {
      animation: bounce 0.5s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    /* Form elements */
    select, input[type="text"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(30,20,60,0.8);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: #f0e6ff;
      font-size: 0.85rem;
      appearance: none;
      cursor: pointer;
      transition: all 0.3s;
    }
    select:hover, input[type="text"]:hover {
      border-color: rgba(255,215,0,0.5);
      background: rgba(30,20,60,1);
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 0 4px rgba(255,215,0,0.2);
      background: rgba(30,20,60,1);
    }

    .select-wrapper {
      position: relative;
      flex-shrink: 0;
    }
    .select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #FFD700;
      pointer-events: none;
      font-size: 0.8rem;
    }

    /* Activity checks */
    .activity-checks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .activity-checks label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      color: #d0c0f0;
      padding: 0.3rem;
      border-radius: 0.5rem;
      transition: all 0.2s;
    }
    .activity-checks label:hover {
      background: rgba(255,215,0,0.1);
      color: #fff;
    }
    .activity-checks input[type="checkbox"] {
      accent-color: #FFD700;
      width: 16px;
      height: 16px;
    }

    /* Radio group */
    .radio-group {
      display: flex;
      gap: 0.4rem;
      background: rgba(30,20,60,0.6);
      padding: 0.35rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .radio-group label {
      flex: 1;
      text-align: center;
      padding: 0.45rem 0.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      color: #b0a0d0;
      transition: all 0.3s;
    }
    .radio-group label:has(input:checked) {
      background: linear-gradient(135deg, #FFD700, #FF8C42);
      color: #1a0f3c;
      box-shadow: 0 6px 18px rgba(255,215,0,0.4);
    }
    .radio-group input[type="radio"] {
      display: none;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      flex-shrink: 0;
    }
    .toggle-label {
      font-weight: 600;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(30,20,60,0.8);
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .toggle-switch.active {
      background: linear-gradient(135deg, #4ECDC4, #3db8b0);
      border-color: #4ECDC4;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 1px;
      left: 2px;
      transition: all 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .toggle-switch.active::after {
      left: 22px;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.4rem;
      flex-shrink: 0;
      padding-bottom: 0.5rem;
    }
    .btn-generate {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border: none;
      color: #1a0f3c;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 0.95rem;
      border-radius: 2rem;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(255,215,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .btn-generate:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255,215,0,0.6), 0 6px 12px rgba(0,0,0,0.4);
      background: linear-gradient(135deg, #ffe44d, #FFB347);
    }
    .btn-generate::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-generate:hover::after { opacity: 1; }

    .btn-regenerate {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      color: #f0e6ff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.7rem;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    .btn-regenerate:hover {
      background: rgba(255,215,0,0.1);
      border-color: rgba(255,215,0,0.5);
      color: #FFD700;
    }

    .btn-print {
      background: linear-gradient(135deg, #4ECDC4, #3db8b0);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.8rem;
      border-radius: 1.8rem;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 22px rgba(78,205,196,0.4);
      transition: all 0.3s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-print:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(78,205,196,0.5);
      background: linear-gradient(135deg, #5fdad3, #3db8b0);
    }

    /* ============ RIGHT PANEL ============ */
    .preview-panel {
      flex: 1;
      background: linear-gradient(135deg, #f8f6f2 0%, #efe9e0 50%, #f5f2ec 100%);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      max-height: 92vh;
    }

    .worksheet {
      width: 210mm;
      background: linear-gradient(180deg, #FFFEF9 0%, #FFFBF5 50%, #FFFEF9 100%);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.3),
        0 0 0 1px rgba(0,0,0,0.05),
        0 0 0 10px rgba(255,255,255,0.6),
        0 0 0 12px rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 2rem 2.2rem;
      font-family: 'Nunito', sans-serif;
      color: #2c3e50;
      position: relative;
      background-image: 
        linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .ws-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,107,107,0.06));
      border-radius: 1.8rem;
      border: 2px solid rgba(255,215,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .ws-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #FFD700, #FF6B6B, #4ECDC4, #C77DFF, #FFD700);
    }
    .header-emoji {
      font-size: 3rem;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.25));
    }
    .title-theme {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2c3e50, #34495e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .student-badge {
      background: white;
      padding: 0.5rem 1.4rem;
      border-radius: 2rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px dashed #ddd;
      font-size: 0.85rem;
    }

    .word-bank-box {
      background: linear-gradient(135deg, #FFF9E6, #FFF3CD);
      border: 2px solid #FFD700;
      border-radius: 1.2rem;
      padding: 0.9rem 1.3rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255,215,0,0.2);
      font-family: 'Comic Neue', cursive;
      font-size: 1rem;
    }

    .activity-card {
      border: 2px solid #e8e0d0;
      border-radius: 1.2rem;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s;
      break-inside: avoid;
    }
    .activity-card:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .activity-card h3 {
      font-family: 'Fredoka One', cursive;
      margin-bottom: 0.8rem;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .word-options {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .word-option {
      padding: 0.5rem 1.3rem;
      border-radius: 2rem;
      border: 2.5px solid #ddd;
      font-weight: 700;
      background: #fafaf8;
      cursor: default;
      font-size: 1rem;
    }

    .sort-columns {
      display: flex;
      gap: 2rem;
    }
    .sort-col {
      flex: 1;
      border: 2.5px dashed #ddd;
      border-radius: 1rem;
      padding: 0.8rem;
      min-height: 100px;
      background: #fdfdfb;
    }
    .sort-col strong {
      display: block;
      margin-bottom: 0.5rem;
      color: #666;
    }

    .match-row {
      display: flex;
      gap: 4rem;
      align-items: center;
      justify-content: center;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
    }
    .grid-cell {
      border: 1.5px solid #e0d5c0;
      padding: 0.5rem;
      text-align: center;
      font-weight: 700;
      background: #fefefb;
      border-radius: 4px;
    }

    .answer-key {
      margin-top: 2rem;
      border-top: 4px dashed #e0d5c0;
      padding-top: 1.5rem;
      background: #fafaf7;
      border-radius: 0 0 1.2rem 1.2rem;
      padding: 1.5rem;
      break-before: page;
    }

    /* STAMPA */
    @media print {
      @page {
        size: A4;
        margin: 0.75in;
      }
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      body::before { display: none !important; }
      .app-container {
        display: block !important;
        background: white !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        max-width: none !important;
        width: 100% !important;
      }
      .control-panel { display: none !important; }
      .preview-panel {
        display: block !important;
        padding: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        background: white !important;
      }
      .worksheet {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        background: white !important;
        background-image: none !important;
      }
      .activity-card {
        box-shadow: none !important;
        border: 1.5px solid #ddd !important;
        break-inside: avoid;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- LEFT PANEL -->
  <div class="control-panel">
    <div class="panel-header">
      <span class="logo-icon">📖✨</span>
      <h2>Phonics & Reading<br>Practice Builder</h2>
      <div class="subtitle">✦ Premium Worksheet Studio ✦</div>
    </div>

    <div>
      <div class="section-label">🎒 GRADE BAND</div>
      <div class="grade-cards" id="gradeGroup">
        <div class="grade-card active" data-grade="prek">
          <span class="grade-icon">🌱</span> PreK / K
        </div>
        <div class="grade-card" data-grade="1">
          <span class="grade-icon">🌿</span> Grade 1
        </div>
        <div class="grade-card" data-grade="2">
          <span class="grade-icon">🌳</span> Grade 2
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">🔤 PHONICS FOCUS</div>
      <div class="select-wrapper">
        <select id="phonicsFocus"></select>
      </div>
    </div>

    <div>
      <div class="section-label">🎨 THEME</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div>
      <div class="section-label">✅ ACTIVITIES (pick 3-5)</div>
      <div class="activity-checks" id="activityChecks"></div>
    </div>

    <div>
      <div class="section-label">📝 ACTIVITIES ON PAGE</div>
      <div class="radio-group" id="activityCountGroup">
        <label><input type="radio" name="actCount" value="3" checked> 3</label>
        <label><input type="radio" name="actCount" value="4"> 4</label>
        <label><input type="radio" name="actCount" value="5"> 5</label>
      </div>

  function rand(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }

    const w = words[rand(0, words.length-1)];

    return `<div class="activity-card"><h3>🔵 Circle the Correct Word</h3>

      <div class="word-options">${[w, ...distractors].map(x => `<span class="word-option">${x}</span>`).join('')}</div></div>`;
  }

      <p style="color:#888; font-size:0.85rem;">(Hint: ${w})</p></div>`;
  }
  function genWordSort(words) {

      <p style="margin-bottom:0.8rem;">Sort these words into the correct groups:</p>
      <div class="sort-columns">
        <div class="sort-col"><strong>🏆 Group A</strong><br>${left.join('<br>')}</div>

  }

    const w = words[rand(0, words.length-1)];
    return `<div class="activity-card"><h3>📝 Read and Write</h3>
      <p style="font-size:1.3rem;">Read: <strong style="font-size:1.5rem; background:#FFF9E6; padding:0.3rem 0.8rem; border-radius:0.5rem;">${w}</strong></p>
      <p style="margin-top:1rem;">Write it 3 times:</p>
      <p>1. ________________ &nbsp; 2. ________________ &nbsp; 3. ________________</p></div>`;
  }
  function genBuildWord(words) {
    const w = words[rand(0, words.length-1)];
    const letters = shuffle(w.split(''));
    return `<div class="activity-card"><h3>🧱 Build the Word</h3>
      <p style="margin-bottom:0.5rem;">Scrambled letters:</p>
      <p style="font-size:1.3rem;">${letters.map(l => `<span style="border:2px solid #ddd; padding:0.4rem 0.7rem; margin:0.15rem; border-radius:0.5rem; background:#fafafa;">${l}</span>`).join(' ')}</p>
      <p style="margin-top:1rem;">Write the word in order:</p>
      <p style="font-size:1.3rem;">${w.split('').map(() => '___').join(' ')}</p></div>`;
  }
  function genFindColor(words) {
    const gridSize = 6;
    let grid = [];
    for(let i=0;i<gridSize;i++) {
      grid[i] = [];
      for(let j=0;j<gridSize;j++) grid[i][j] = String.fromCharCode(97+rand(0,25));
    }
    const targetWords = words.slice(0,5);
    return `<div class="activity-card"><h3>🔍 Find and Color</h3>
      <p style="margin-bottom:0.5rem;">Find these words in the grid:</p>
      <div class="word-grid">${grid.map(row => row.map(c => `<div class="grid-cell">${c}</div>`).join('')).join('')}</div>
      <p style="margin-top:0.8rem;"><strong>Words to find:</strong> ${targetWords.join(', ')}</p></div>`;
  }
  function genSentence(words) {
    const w = words[rand(0, words.length-1)];
    const dist = words.filter(x => x!==w).slice(0,2);
    return `<div class="activity-card"><h3>📖 Sentence Completion</h3>
      <p style="font-size:1.1rem;">The <strong>( <span style="color:#E63946;">${w}</span> / ${dist[0]||'???'} / ${dist[1]||'???'} )</strong> is very nice.</p>
      <p style="color:#888;">Circle the correct word to complete the sentence.</p></div>`;
  }
  function genRhymeTime(words) {
    const w = words[rand(0, words.length-1)];
    const rhymes = words.filter(x => x!==w && x.slice(-2)===w.slice(-2)).slice(0,2);
    return `<div class="activity-card"><h3>🎵 Rhyme Time</h3>
      <p style="font-size:1.2rem;">Which words rhyme with <strong>"${w}"</strong>?</p>
      <div class="word-options">${[w, ...(rhymes.length?rhymes:words.slice(0,2))].map(x => `<span class="word-option">${x}</span>`).join('')}</div>
      <p style="color:#888; font-size:0.8rem; margin-top:0.5rem;">Circle all the words that rhyme!</p></div>`;
  }
  function genUnscramble(words) {
    const w = words[rand(0, words.length-1)];
    const scrambled = shuffle(w.split('')).join('');
    return `<div class="activity-card"><h3>🧩 Unscramble It</h3>
      <p style="font-size:1.5rem; font-weight:800; color:#C77DFF;">${scrambled}</p>
      <p>Unscramble the letters to make a word: <span style="border-bottom:2px solid #ddd; width:100px; display:inline-block;"></span></p></div>`;
  }

  const activityGens = {
    circle: genCircleWord, fill: genFillBlank, sort: genWordSort,
    match: genMatch, readwrite: genReadWrite, build: genBuildWord,
    find: genFindColor, sentence: genSentence, rhyme: genRhymeTime,
    unscramble: genUnscramble
  };

  function renderWorksheet() {
    const words = getWords(selectedFocus);
    const actsToShow = selectedActivities.slice(0, Math.min(activityCount, selectedActivities.length));
    const showName = document.getElementById('toggleName').classList.contains('active');
    const showBank = document.getElementById('toggleBank').classList.contains('active');
    const showKey = document.getElementById('toggleKey').classList.contains('active');
    const showFacts = document.getElementById('toggleFacts').classList.contains('active');
    const theme = currentTheme;
    const studentName = studentNameInput.value || '_______________';

    let html = '';
    html += `<div class="ws-header">
      <span class="header-emoji">${theme.emoji}</span>
      <span class="title-theme" style="color:${theme.color};">${pageTitleInput.value || 'Phonics Practice Page'}</span>
      ${showName ? `<div class="student-badge">✏️ ${studentName}</div>` : ''}
    </div>`;

    if (showBank) {
      html += `<div class="word-bank-box" style="border-color:${theme.accent}; background:${theme.bg};">
        📋 <strong>Word Bank:</strong> ${shuffle(words).slice(0,12).join(' • ')}
      </div>`;
    }

    if (showFacts) {
      const facts = [
        '🌟 Fun Fact: The letter "e" is the most common letter in English!',
        '🐝 Fun Fact: A bee can see colors we cannot see!',
        '📚 Fun Fact: Reading just 20 minutes a day helps you learn over 1 million words a year!',
        '🎵 Fun Fact: Words that rhyme help us remember spelling patterns!',
        '🧠 Fun Fact: Your brain can recognize a word in just 200 milliseconds!'
      ];
      html += `<div style="background:${theme.bg}; border-left:5px solid ${theme.accent}; padding:0.7rem 1rem; border-radius:0.8rem; margin-bottom:1.2rem; font-style:italic;">
        ${facts[rand(0, facts.length-1)]}
      </div>`;
    }

    if (actsToShow.length === 0) {
      html += `<p style="text-align:center; color:#999; padding:2rem;">👆 Select at least one activity from the left panel to generate your worksheet!</p>`;
    } else {
      actsToShow.forEach(actId => {
        if (activityGens[actId]) {
          html += activityGens[actId](words);
        }
      });
    }

    if (showKey && actsToShow.length > 0) {
      html += `<div class="answer-key">
        <h3 style="font-family:'Fredoka One', cursive;">🔑 Answer Key</h3>
        <p><strong>Focus:</strong> ${phonicsSelect.options[phonicsSelect.selectedIndex]?.text || selectedFocus}</p>
        <p><strong>Sample words:</strong> ${words.slice(0,10).join(', ')}</p>
        <p style="color:#888; font-size:0.85rem;">Answers will vary based on the generated activities.</p>
      </div>`;
    }

    worksheetContainer.innerHTML = html;
  }

  generateBtn.addEventListener('click', renderWorksheet);
  regenerateBtn.addEventListener('click', () => {
    renderWorksheet();
  });
  printBtn.addEventListener('click', () => {
    renderWorksheet();
    setTimeout(() => window.print(), 350);
  });

  // Toggles
  ['toggleName','toggleBank','toggleKey','toggleFacts'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(){this.classList.toggle('active');});
  });

  // Initialize
  updatePhonicsDropdown();
  renderThemeGrid();
  renderActivityChecks();
  renderWorksheet();
})();
</script>
</body>
</html>
