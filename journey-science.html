    .btn.danger{background:#4a1a10;border-color:#7a2a18;}
    .btn.tiny{padding:0.12rem 0.35rem;font-size:0.5rem;border-radius:1.5rem;}

    .sidebar::-webkit-scrollbar-thumb{background:#c49a40;border-radius:6px;}
    .section-title{font-size:0.55rem;text-transform:uppercase;letter-spacing:2.5px;color:#c49a40;margin-bottom:0.15rem;font-weight:700;display:flex;align-items:center;gap:0.2rem;}

    .subject-card:hover{background:#3d2a15;}
    .subject-card .card-emoji{font-size:0.9rem;}
    .style-selector,.palette-selector,.section-selector,.complexity-selector{display:flex;flex-wrap:wrap;gap:0.18rem;}

    .generate-btn{background:linear-gradient(135deg,#c49a40,#8a5a20);border:none;padding:0.7rem;border-radius:2.5rem;font-weight:800;font-size:0.8rem;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;color:#0d0a06;box-shadow:0 10px 22px rgba(180,130,60,0.5);transition:0.25s;width:100%;display:flex;align-items:center;justify-content:center;gap:0.3rem;border:1px solid #d4a850;flex-shrink:0;}

function saveState(){try{var s={subject:currentSubject,style:currentStyle,palette:currentPalette,pack:packSize,creativity:creativity,seed:seedValue,favs:favorites,sections:activeSections,complexity:complexity,counter:generationCounter,uniqueSeed:uniqueSeedCounter};localStorage.setItem("jof_final_v1",JSON.stringify(s));}catch(e){}}
function loadState(){try{var raw=localStorage.getItem("jof_final_v1");if(raw){var s=JSON.parse(raw);if(s.subject&&subjects[s.subject])currentSubject=s.subject;if(s.style&&styles.indexOf(s.style)!==-1)currentStyle=s.style;if(s.palette&&palettes.indexOf(s.palette)!==-1)currentPalette=s.palette;if(typeof s.pack==='number'&&[1,5,10,15,20,25,30,40,50].indexOf(s.pack)!==-1)packSize=s.pack;if(typeof s.creativity==='number')creativity=s.creativity;if(typeof s.seed==='string')seedValue=s.seed;if(Array.isArray(s.favs))favorites=s.favs;if(Array.isArray(s.sections)&&s.sections.length>0)activeSections=s.sections;if(typeof s.complexity==='string'&&complexities.indexOf(s.complexity)!==-1)complexity=s.complexity;if(typeof s.counter==='number')generationCounter=s.counter;if(typeof s.uniqueSeed==='number')uniqueSeedCounter=s.uniqueSeed;}}catch(e){}}
function generateUniqueSeed(){uniqueSeedCounter++;return (seedValue||"harvest")+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).substring(2,10)+"-"+uniqueSeedCounter.toString(36);}

function renderSubjectGrid(){
  var groups={};Object.keys(subjects).forEach(function(k){var g=subjects[k].group;if(!groups[g])groups[g]=[];groups[g].push(k);});
  var html="";var total=0;
  for(var g in groups){if(groups.hasOwnProperty(g)&&groups[g].length>0){html+='<div style="width:100%;font-size:0.5rem;color:#c49a40;margin-top:0.25rem;letter-spacing:1.5px;">'+g+'</div>';
    groups[g].forEach(function(k){var s=subjects[k];var act=(currentSubject===k)?' active':'';html+='<div class="subject-card'+act+'" data-subject="'+k+'"><span class="card-emoji">'+s.emoji+'</span>'+s.name+'</div>';total++;});}}
  subjectGrid.innerHTML=html;document.getElementById("subjectCount").textContent=total;
  document.querySelectorAll('.subject-card').forEach(function(c){c.addEventListener('click',function(){var subj=this.getAttribute('data-subject');if(subj&&subjects[subj]){currentSubject=subj;renderSubjectGrid();saveState();}});});
}

function renderPackSelector(){packSelector.innerHTML="";[1,5,10,15,20,25,30,40,50].forEach(function(n){var act=(n===packSize)?' active':'';var d=document.createElement('div');d.className='pack-btn'+act;d.textContent=n;d.addEventListener('click',function(){packSize=n;renderPackSelector();document.getElementById("packLabel").textContent=n;saveState();});packSelector.appendChild(d);});}
function hashCode(str){var hash=0,i;for(i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i);hash|=0;}return Math.abs(hash);}
function seededRandom(seed,index){var h=hashCode(seed+"-idx"+index);var x=Math.sin(h*9301+49297)*49297;return x-Math.floor(x);}
function buildPrompt(subjectKey,variantIndex,uniqueSeed){
  var s=subjects[subjectKey];if(!s)return"";var seed=uniqueSeed+"-v"+variantIndex;var r=[];for(var ri=0;ri<30;ri++)r.push(seededRandom(seed,ri));
  var styleAdj={"Vintage Botanical Editorial":["hand-colored copperplate engraving","19th-century botanical atlas","Victorian-era wall chart"],"Modern Infographic":["sleek data-driven layout","contemporary editorial design","bold geometric infographic"],"Scientific Textbook":["rigorous peer-reviewed plate","academic reference diagram","detailed scientific illustration"],"Rustic Handcrafted":["warm watercolor farm-to-table","linocut print kitchen art","hand-lettered artisan poster"],"Art Deco Agriculture":["1920s exhibition poster","geometric gold-foil design","streamlined vintage glamour"],"Minimalist Field Guide":["Scandinavian clean design","Swiss typography plate","ample negative space"],"Dark Academia":["moody library reference plate","gothic botanical manuscript","candlelit study illustration"],"Pop Art Food":["vibrant Warhol-inspired grid","comic-book Ben-Day dots","retro 1960s advertising"],"Japanese Woodblock":["ukiyo-e inspired woodcut","Hokusai-style wave borders","indigo and vermilion print"],"Medieval Manuscript":["illuminated manuscript page","gold leaf on vellum","monastic scriptorium style"]};
  var palAdj={"Warm Earthy":["terracotta, ochre, umber, olive, cream","sienna, amber, forest green, warm ivory"],"Pastel Light":["butter yellow, mint, peach, lavender, vanilla","blush pink, pale sage, soft apricot, cream"],"High Contrast":["charcoal black, crisp white, vermilion, gold","ink black, gallery white, crimson, electric blue"],"Vintage Sepia":["aged parchment, faded umber, antique brass, olive","sepia wash, coffee stain, amber, muted sage"],"Cool Botanical":["sage, eucalyptus, slate blue, silver, white","mint, teal, pale jade, frost, alabaster"],"Midnight Gold":["navy, indigo, 24k gold, cream, deep violet","cosmic black, copper, stellar white, midnight blue"],"Neon Harvest":["electric lime, hot magenta, cyber yellow, deep purple","fluorescent orange, acid green, ultraviolet, white"],"Monochrome Ink":["pure black, soft grey, bright white, charcoal","jet, pearl, graphite, alabaster"],"Ocean Depths":["deep teal, seafoam, coral, sandy beige, navy","kelp green, abalone, driftwood grey, deep blue"],"Sunset Terracotta":["burnt orange, dusty rose, golden hour, clay, cream","adobe pink, canyon red, desert sand, warm peach"]};
  var chosenStyle=(styleAdj[currentStyle]||styleAdj["Vintage Botanical Editorial"])[Math.floor(r[0]*3)];
  var chosenPal=(palAdj[currentPalette]||palAdj["Warm Earthy"])[Math.floor(r[1]*2)];
  var adj=["magnificent","breathtaking","meticulously detailed","scientifically rigorous","visually stunning","awe-inspiring","comprehensive","scholarly","masterful","monumental","exquisite","authoritative","illuminating","definitive","elegant","immersive","encyclopedic","captivating"];
  var adj1=adj[Math.floor(r[2]*adj.length)],adj2=adj[Math.floor(r[3]*adj.length)];
  var cm=1;switch(complexity){case"concise":cm=0.5;break;case"detailed":cm=1.5;break;case"comprehensive":cm=2;break;case"encyclopedic":cm=3;break;}
  var fl=["Delicate leader lines connect every part.","Decorative botanical border frames composition.","Hand-drawn field-journal authenticity.","Subtle graph-paper background.","Ornate compass rose motif.","Fine isometric perspective lines.","Art deco geometric framing.","Visual scale ladder to familiar objects.","Illustrated marginalia of tools.","Sensory profile wheel.","Microscopic detail insets.","'Tasting Notes' panel.","Historic timeline markers."];
  var flourish="";var nf=Math.floor((creativity*3+cm)*1.5);var uf={};for(var fi=0;fi<Math.min(nf,5);fi++){var fidx=Math.floor(r[5+fi]*fl.length);if(!uf[fidx]){flourish+=fl[fidx]+" ";uf[fidx]=true;}}
  var p="Design a portrait 24×36 inch 300 DPI "+adj1+" "+adj2+" educational food science poster titled 'THE JOURNEY OF "+s.name.toUpperCase()+"' in the style of "+chosenStyle+". Color palette: "+chosenPal+". WOW tagline: '"+s.wowTagline+"'. ";
  if(activeSections.indexOf("diagram")!==-1)p+="Botanical diagram: "+s.plantDiagramParts.join("; ")+". ";
  if(activeSections.indexOf("process")!==-1)p+="Process flow '"+s.processTitle+"': "+s.processSteps.map(function(st,i){return (i+1)+". "+st;}).join(" · ")+". ";
  if(activeSections.indexOf("subProcess")!==-1)p+="Sub-process panel: "+s.subProcessPanel+". ";
  if(activeSections.indexOf("map")!==-1)p+="World map: "+s.growingRegions+" — top: "+s.topProducers+". ";
  if(activeSections.indexOf("stats")!==-1)p+="WOW Stat Boxes: "+s.statFacts.join("; ")+". ";
  if(activeSections.indexOf("transform")!==-1)p+="Transformation strip: "+s.transformationStages.join(" → ")+". ";
  if(activeSections.indexOf("botanical")!==-1)p+="Herbarium label: "+s.botanicalLabel+". ";
  if(activeSections.indexOf("footer")!==-1)p+="Footer: '"+s.footerTagline+"'. ";
  if(flourish)p+="Design elements: "+flourish;
  p+="Typography: classic serif display, clean sans-serif data, italic Latin names. Print-ready 300 DPI, museum-quality.";
  return p;
}
function renderPrompts(infiniteMode){
  generationCounter++;var html="";var ub=generateUniqueSeed();
  for(var i=0;i<packSize;i++){var us=ub+"-c"+i+"-g"+generationCounter;var pt=buildPrompt(currentSubject,i,us);var s=subjects[currentSubject];var wc=pt.trim().split(/\s+/).length;
    html+='<div class="prompt-card"><div class="card-header"><span class="subject-badge">'+s.emoji+' '+s.name+' #'+(i+1)+'</span><div><button class="copy-btn" data-prompt="'+escapeHTML(pt)+'">📋 Copy</button><button class="star-btn" data-fav="'+escapeHTML(pt)+'">☆</button></div></div><div class="prompt-text">'+escapeHTML(pt)+'</div><div class="checklist">✓ '+activeSections.length+' sections · '+wc+' words</div></div>';}
  if(infiniteMode&&packSize>1)centerPanel.innerHTML=html+centerPanel.innerHTML;else centerPanel.innerHTML=html;
  attachCardEvents();centerPanel.scrollTop=0;saveState();
}
function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function attachCardEvents(){
  document.querySelectorAll('.copy-btn').forEach(function(b){b.addEventListener('click',function(){var p=this.getAttribute('data-prompt');if(!p)return;navigator.clipboard.writeText(p).then(function(){var s=this;s.innerHTML='✓';setTimeout(function(){s.innerHTML='📋 Copy';},1500);}.bind(this));});});
  document.querySelectorAll('.star-btn').forEach(function(b){var ft=b.getAttribute('data-fav');if(favorites.indexOf(ft)!==-1){b.textContent='★';b.classList.add('saved');}b.addEventListener('click',function(){var p=this.getAttribute('data-fav');if(!p)return;if(favorites.indexOf(p)===-1){favorites.push(p);this.textContent='★';this.classList.add('saved');}else{favorites=favorites.filter(function(f){return f!==p;});this.textContent='☆';this.classList.remove('saved');}renderFavorites();saveState();});});
}
function renderFavorites(){
  if(favCount)favCount.textContent=favorites.length;if(favorites.length===0){favoritesList.innerHTML='<span style="color:#7a5a3a;font-size:0.6rem;">Click ☆ to save</span>';return;}
  var h="";favorites.forEach(function(f,i){var s=f.substring(0,35)+'…';h+='<div class="fav-item" data-fav-idx="'+i+'"><span>'+s+'</span><button class="btn tiny" data-remove="'+i+'">✕</button></div>';});
  favoritesList.innerHTML=h;
  document.querySelectorAll('.fav-item[data-fav-idx]').forEach(function(i){i.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')return;var idx=parseInt(this.getAttribute('data-fav-idx'),10);if(favorites[idx])navigator.clipboard.writeText(favorites[idx]).then(function(){alert("Copied!");});});});
  document.querySelectorAll('[data-remove]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();favorites.splice(parseInt(this.getAttribute('data-remove'),10),1);renderFavorites();saveState();});});
}
function surpriseMe(){var k=Object.keys(subjects);currentSubject=k[Math.floor(Math.random()*k.length)];currentStyle=styles[Math.floor(Math.random()*styles.length)];currentPalette=palettes[Math.floor(Math.random()*palettes.length)];complexity=complexities[Math.floor(Math.random()*complexities.length)];creativity=Math.round((0.3+Math.random()*1.5)*10)/10;seedValue="surprise-"+Math.random().toString(36).substring(2,10);seedInput.value=seedValue;creativitySlider.value=creativity;renderSubjectGrid();renderStyleSelector();renderPaletteSelector();renderComplexitySelector();saveState();renderPrompts(true);}
function exportTxt(){var c=document.querySelectorAll('.prompt-text');if(!c.length){alert("No prompts.");return;}var s=subjects[currentSubject];var t="JOURNEY OF... PROMPTS\n"+new Date().toLocaleString()+"\n"+s.name+" | "+currentStyle+"\n\n";c.forEach(function(c,i){t+="PROMPT "+(i+1)+":\n"+c.textContent+"\n\n---\n\n";});var b=new Blob([t],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='journey-of-'+currentSubject+'-prompts.txt';a.click();}
function printView(){var w=window.open('','_blank','width=1050,height=800');var pc='<!DOCTYPE html><html><head><title>Journey Of...</title><style>body{background:#1a1108;color:#ddd;font-family:sans-serif;padding:1.5rem;}.prompt-card{background:#1a1108;border:1px solid #3d3020;border-radius:1.5rem;padding:1rem;margin:1rem 0;}h1{color:#c49a40;}@media print{body{background:#fff;color:#000;}}</style></head><body><h1>Journey Of... Prompts</h1>';document.querySelectorAll('.prompt-card').forEach(function(c){pc+='<div class="prompt-card">'+c.innerHTML+'</div>';});pc+='</body></html>';w.document.write(pc);w.document.close();setTimeout(function(){w.print();},500);}
function copyAll(){var c=document.querySelectorAll('.prompt-text');if(!c.length){alert("No prompts.");return;}var a="";c.forEach(function(c,i){a+="PROMPT "+(i+1)+":\n"+c.textContent+"\n\n";});navigator.clipboard.writeText(a).then(function(){alert(c.length+" prompts copied!");});}
function clearAll(){if(confirm("Clear all?"))centerPanel.innerHTML='<div class="empty-state"><p>🌿📜</p><p>Cleared.</p></div>';}

// EVENT LISTENERS
document.getElementById('generateBtn').addEventListener('click',function(){renderPrompts(false);});
document.getElementById('infiniteGenerateBtn').addEventListener('click',function(){renderPrompts(true);});
document.getElementById('surpriseMeBtn').addEventListener('click',surpriseMe);
document.getElementById('exportTxtBtn').addEventListener('click',exportTxt);
document.getElementById('printViewBtn').addEventListener('click',printView);
document.getElementById('copyAllBtn').addEventListener('click',copyAll);
document.getElementById('clearBtn').addEventListener('click',clearAll);
seedInput.addEventListener('input',function(){seedValue=this.value;saveState();});
creativitySlider.addEventListener('input',function(){creativity=parseFloat(this.value);saveState();});
randomSeedBtn.addEventListener('click',function(){var w=["harvest","field","grove","orchard","vineyard","garden","farm","forest","soil","bloom","pollen","nectar","seed","grain","fruit","spice","fungus","culture","brew","craft"];seedValue=w[Math.floor(Math.random()*w.length)]+'-'+w[Math.floor(Math.random()*w.length)]+'-'+Math.floor(Math.random()*99999);seedInput.value=seedValue;saveState();});
document.getElementById('toggleAllSections').addEventListener('click',function(){if(activeSections.length===Object.keys(sectionNames).length)activeSections=[];else activeSections=Object.keys(sectionNames);renderSectionSelector();saveState();});
document.getElementById('randomSubjectBtn').addEventListener('click',function(){var k=Object.keys(subjects);currentSubject=k[Math.floor(Math.random()*k.length)];renderSubjectGrid();saveState();renderPrompts(true);});

// INIT
loadState();seedInput.value=seedValue;creativitySlider.value=creativity;
renderSubjectGrid();renderStyleSelector();renderPaletteSelector();renderComplexitySelector();renderSectionSelector();renderPackSelector();renderFavorites();
document.getElementById("packLabel").textContent=packSize;document.getElementById("seedDisplay").textContent=seedValue.substring(0,12)+(seedValue.length>12?'…':'');
if(centerPanel&&(centerPanel.querySelector('.empty-state')||centerPanel.children.length===0))renderPrompts(false);
})();
</script>
