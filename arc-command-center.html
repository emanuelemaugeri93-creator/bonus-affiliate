<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Series Arc Command Center | Void Gold · Publishing Empire</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --void: #07060a;
      --abyss: #0d0b12;
      --surface: #141118;
      --surface2: #1a161f;
      --surface3: #221d26;
      --gold: #d4af37;
      --gold-bright: #e6c84d;
      --gold-pale: #f3e3c3;
      --gold-dim: #8b7840;
      --gold-faint: rgba(212, 175, 55, 0.06);
      --gold-glass: rgba(212, 175, 55, 0.12);
      --gold-border: rgba(212, 175, 55, 0.22);
      --text: #e4ddd0;
      --text-dim: #9b9488;
      --text-muted: #6b6560;
      --danger: #c97e5a;
      --danger-bg: rgba(201, 126, 90, 0.1);
      --info: #6ba5c7;
      --info-bg: rgba(107, 165, 199, 0.1);
      --success: #7dcea0;
      --success-bg: rgba(125, 206, 160, 0.1);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 22px;
      --radius-xl: 32px;
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--void);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--abyss); }
    ::-webkit-scrollbar-thumb { background: var(--gold-glass); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-border); }

    h1, h2, h3, h4, .serif {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition);
      white-space: nowrap;
      background: transparent;
      color: var(--text-dim);
      position: relative;
      overflow: hidden;
    }
    .btn:hover { color: var(--text); }
    .btn-gold {
      background: var(--gold);
      color: #0a0805;
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
    }
    .btn-gold:hover {
      background: var(--gold-bright);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      transform: translateY(-1px);
    }
    .btn-outline {
      border-color: var(--gold-border);
      color: var(--gold-pale);
      background: var(--gold-faint);
    }
    .btn-outline:hover {
      border-color: var(--gold);
      background: var(--gold-glass);
      color: var(--gold-bright);
    }
    .btn-ghost { border-color: transparent; }
    .btn-ghost:hover { background: var(--surface3); }
    .btn-danger {
      color: var(--danger);
      border-color: rgba(201, 126, 90, 0.2);
    }
    .btn-danger:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #e89070;
    }
    .btn-sm { padding: 6px 14px; font-size: 0.72rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .badge-planning { background: rgba(142, 68, 173, 0.15); color: #c39bd3; border: 1px solid rgba(142, 68, 173, 0.3); }
    .badge-drafting { background: rgba(41, 128, 185, 0.15); color: #7fb3d3; border: 1px solid rgba(41, 128, 185, 0.3); }
    .badge-complete { background: rgba(39, 174, 96, 0.15); color: #7dcea0; border: 1px solid rgba(39, 174, 96, 0.3); }
    .badge-published { background: rgba(212, 175, 55, 0.18); color: var(--gold-bright); border: 1px solid rgba(212, 175, 55, 0.35); }
    .badge-clue { background: var(--info-bg); color: var(--info); border: 1px solid rgba(107, 165, 199, 0.25); }
    .badge-red-herring { background: var(--danger-bg); color: #e09090; border: 1px solid rgba(201, 126, 90, 0.25); }
    .badge-callback { background: var(--success-bg); color: var(--success); border: 1px solid rgba(125, 206, 160, 0.25); }
    .badge-theme { background: rgba(212, 175, 55, 0.12); color: var(--gold-pale); border: 1px solid rgba(212, 175, 55, 0.25); }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius);
      transition: all var(--transition);
    }
    .card-hover:hover {
      border-color: var(--gold-border);
      background: var(--surface2);
      transform: translateY(-3px);
      box-shadow: var(--shadow-card), 0 0 30px rgba(212, 175, 55, 0.05);
    }

    input, textarea, select {
      background: var(--abyss);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 11px 15px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
      transition: all var(--transition);
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }
    textarea { min-height: 80px; }
    select option { background: var(--surface2); color: var(--text); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3, 2, 5, 0.9);
      backdrop-filter: blur(8px); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      padding: 36px;
      width: 100%;
      max-width: 700px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg), 0 0 60px rgba(212, 175, 55, 0.05);
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-sm { max-width: 480px; }

    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--surface3); border: 1px solid var(--gold-border);
      color: var(--gold-pale); padding: 14px 24px;
      border-radius: var(--radius); font-size: 0.88rem;
      z-index: 9999; box-shadow: var(--shadow-lg);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
      display: flex; align-items: center; gap: 10px;
    }
    @keyframes toastIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }

    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-glass), transparent);
      margin: 24px 0;
    }
    .section-title {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.8px;
      color: var(--gold-dim); margin-bottom: 8px;
    }

    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
      .modal { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Constants & Helpers ───────────────────────────────────────────────────
    const STORAGE_KEY = 'sacc_void_gold_v5';
    const MAX_BOOKS = 10;

    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 9);

    const defaultSeries = {
      title: 'The Thornwick Mysteries',
      subtitle: 'A Lady Ashford Investigation',
      genre: 'Historical Cozy Mystery',
      penName: 'Victoria Ashworth',
      tagline: 'Murder has never been so civilised.',
      worldBible: '',
      seriesArc: ''
    };

    const createBook = (num) => ({
      id: generateId(),
      num,
      title: '',
      subtitle: '',
      status: 'planning',
      era: '',
      setting: '',
      pov: '',
      wordCount: '',
      act1: '',
      act2: '',
      act3: '',
      keyReveals: '',
      notes: '',
      timelinePosition: num
    });

    const createCharacter = () => ({
      id: generateId(),
      name: '',
      role: 'supporting',
      description: '',
      arc: '',
      motivation: '',
      secret: '',
      appearsIn: []
    });

    const createThread = () => ({
      id: generateId(),
      title: '',
      type: 'clue',
      description: '',
      plantedIn: '',
      revealedIn: '',
      payoff: '',
      status: 'active'
    });

    // ─── Local Storage ────────────────────────────────────────────────────────
    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            series: { ...defaultSeries, ...parsed.series },
            books: parsed.books || [],
            characters: parsed.characters || [],
            threads: parsed.threads || []
          };
        }
      } catch (e) {}
      return {
        series: { ...defaultSeries },
        books: [
          { ...createBook(1), title: 'The Clockwork Fox', status: 'published', era: 'Victorian, 1887', setting: 'Thornwick Manor', pov: 'Lady Ashford', act1: 'A mysterious automaton is discovered in the library.', act2: 'Suspects emerge from the household staff.', act3: 'The fox reveals a hidden message.' },
          { ...createBook(2), title: 'Shadows of Thornwood', status: 'drafting', era: 'Victorian, 1888', setting: 'Abandoned Observatory', pov: 'Lady Ashford', act1: 'A map leads to the old observatory.', act2: 'A rival detective appears.', act3: 'The first cipher is cracked.' }
        ],
        characters: [
          { ...createCharacter(), name: 'Lady Eleanor Ashford', role: 'protagonist', description: 'Widowed amateur sleuth with a sharp mind.', arc: 'Grows from recluse to confident detective.' },
          { ...createCharacter(), name: 'Inspector Graves', role: 'supporting', description: 'Skeptical police inspector.', arc: 'Learns to trust Lady Ashford.' }
        ],
        threads: [
          { ...createThread(), title: 'The Golden Feather Key', type: 'clue', description: 'A key found in the automaton.' }
        ]
      };
    };

    // ─── Toast Component ──────────────────────────────────────────────────────
    const Toast = ({ message, onDone }) => {
      useEffect(() => {
        const t = setTimeout(onDone, 2600);
        return () => clearTimeout(t);
      }, []);
      return (
        <div className="toast">
          <i className="fas fa-check-circle" style={{ color: 'var(--gold)' }}></i>
          {message}
        </div>
      );
    };

    // ─── Animated Counter ─────────────────────────────────────────────────────
    const AnimatedNumber = ({ value, suffix = '' }) => {
      const [display, setDisplay] = useState(0);
      useEffect(() => {
        if (value === 0) { setDisplay(0); return; }
        let start = 0;
        const duration = 600;
        const step = Math.max(1, Math.floor(value / (duration / 16)));
        const timer = setInterval(() => {
          start += step;
          if (start >= value) { setDisplay(value); clearInterval(timer); }
          else setDisplay(start);
        }, 16);
        return () => clearInterval(timer);
      }, [value]);
      return <span>{display}{suffix}</span>;
    };

    // ─── Header ───────────────────────────────────────────────────────────────
    const Header = ({ series, books, characters, threads, onEditSeries, onExport }) => {
      const published = books.filter(b => b.status === 'published').length;
      const totalBooks = books.length;
      const pct = totalBooks ? Math.round((published / totalBooks) * 100) : 0;

      return (
        <header style={{
          background: 'linear-gradient(165deg, #100e15 0%, #0a080d 40%, #06050a 100%)',
          borderBottom: '1px solid var(--gold-glass)',
          padding: '32px 40px 24px',
          position: 'relative',
          overflow: 'hidden'
        }}>
          <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 70% 90% at 85% 10%, rgba(212,175,55,0.06) 0%, transparent 60%)', pointerEvents: 'none' }} />
          <div style={{ position: 'relative', zIndex: 1 }}>
            <div className="flex-between" style={{ alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: '0.6rem', letterSpacing: '3px', color: 'var(--gold-dim)', textTransform: 'uppercase', marginBottom: '10px', fontWeight: 700 }}>
                  ◆&nbsp;&nbsp;Series Arc Command Center&nbsp;&nbsp;◆
                </div>
                <h1 style={{ fontSize: 'clamp(2rem, 5vw, 2.8rem)', fontWeight: 600, color: 'var(--gold-pale)', lineHeight: 1.1, cursor: 'pointer' }} onClick={onEditSeries}>
                  {series.title}
                </h1>
                {series.subtitle && <p style={{ fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: '1.1rem', color: 'var(--text-dim)', marginTop: 6 }}>"{series.subtitle}"</p>}
                <div style={{ display: 'flex', gap: 12, marginTop: 12, flexWrap: 'wrap', alignItems: 'center' }}>
                  {series.genre && <span className="badge badge-published">{series.genre}</span>}
                  {series.penName && <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>by {series.penName}</span>}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button className="btn btn-outline" onClick={onEditSeries}><i className="fas fa-pen-fancy"></i> Edit Series</button>
                <button className="btn btn-gold" onClick={onExport}><i className="fas fa-download"></i> Export Bible</button>
              </div>
            </div>

            <div style={{ display: 'flex', gap: 16, marginTop: 28, flexWrap: 'wrap' }}>
              {[
                { label: 'Books', value: totalBooks, suffix: `/10`, icon: 'fa-book' },
                { label: 'Characters', value: characters.length, icon: 'fa-users' },
                { label: 'Threads', value: threads.length, icon: 'fa-magnifying-glass' },
                { label: 'Published', value: published, icon: 'fa-star' }
              ].map(stat => (
                <div key={stat.label} style={{
                  background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.05)',
                  borderRadius: 'var(--radius)', padding: '14px 22px', minWidth: 90
                }}>
                  <div style={{ fontSize: '2rem', fontWeight: 700, color: 'var(--gold)', lineHeight: 1, fontFamily: 'Cormorant Garamond, serif' }}>
                    <i className={`fas ${stat.icon}`} style={{ fontSize: '0.9rem', marginRight: 6, opacity: 0.6 }}></i>
                    <AnimatedNumber value={stat.value} suffix={stat.suffix || ''} />
                  </div>
                  <div style={{ fontSize: '0.6rem', letterSpacing: '1.5px', textTransform: 'uppercase', color: 'var(--text-muted)', marginTop: 6 }}>{stat.label}</div>
                </div>
              ))}
              {totalBooks > 0 && (
                <div style={{
                  background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.05)',
                  borderRadius: 'var(--radius)', padding: '14px 22px', minWidth: 140
                }}>
                  <div style={{ fontSize: '0.6rem', letterSpacing: '1.5px', textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 10 }}>Series Progress</div>
                  <div style={{ background: 'rgba(255,255,255,0.06)', borderRadius: 4, height: 6, overflow: 'hidden' }}>
                    <div style={{ background: 'linear-gradient(90deg, #d4af37, #e6c84d)', height: '100%', width: `${pct}%`, borderRadius: 4, transition: 'width 1s ease' }} />
                  </div>
                  <div style={{ fontSize: '0.8rem', color: 'var(--gold)', marginTop: 8, fontWeight: 600 }}>{pct}% Complete</div>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    };

    // ─── Navigation ───────────────────────────────────────────────────────────
    const Nav = ({ active, onChange }) => {
      const tabs = [
        { id: 'books', icon: 'fa-book-open', label: 'Books' },
        { id: 'characters', icon: 'fa-user-group', label: 'Characters' },
        { id: 'threads', icon: 'fa-puzzle-piece', label: 'Threads & Clues' },
        { id: 'timeline', icon: 'fa-timeline', label: 'Timeline' },
        { id: 'world', icon: 'fa-globe', label: 'World Bible' }
      ];
      return (
        <nav style={{ display: 'flex', background: 'var(--abyss)', borderBottom: '1px solid rgba(255,255,255,0.04)', padding: '0 40px', overflowX: 'auto' }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => onChange(t.id)}
              style={{
                background: 'none', border: 'none', cursor: 'pointer',
                fontFamily: 'Inter, sans-serif', fontSize: '0.78rem', fontWeight: 600,
                letterSpacing: '0.5px', color: active === t.id ? 'var(--gold-bright)' : 'var(--text-muted)',
                padding: '16px 20px', marginBottom: -1,
                borderBottom: active === t.id ? '2px solid var(--gold)' : '2px solid transparent',
                transition: 'all 0.2s', display: 'flex', gap: 8, alignItems: 'center', whiteSpace: 'nowrap'
              }}>
              <i className={`fas ${t.icon}`}></i> {t.label}
            </button>
          ))}
        </nav>
      );
    };

    // ─── Book Card (with quick delete) ─────────────────────────────────────────
    const BookCard = ({ book, onClick, onDelete }) => {
      const statusClass = `badge-${book.status}`;
      const isEmpty = !book.title && !book.act1;
      
      const handleDelete = (e) => {
        e.stopPropagation();
        if (confirm(`Remove Book ${book.num} "${book.title || 'Untitled'}"? This cannot be undone.`)) {
          onDelete(book.id);
        }
      };
      
      return (
        <div onClick={onClick} className="card card-hover" style={{
          padding: '22px 24px', cursor: 'pointer', position: 'relative',
          minHeight: 200, display: 'flex', flexDirection: 'column', gap: 10,
          borderLeft: book.status === 'published' ? '3px solid var(--gold)' : '1px solid rgba(255,255,255,0.04)'
        }}>
          <button 
            onClick={handleDelete}
            title="Remove this book"
            style={{
              position: 'absolute', top: 12, right: 12,
              background: 'rgba(201,126,90,0.1)', border: '1px solid rgba(201,126,90,0.2)',
              color: 'var(--danger)', width: 32, height: 32, borderRadius: '50%',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', fontSize: '0.8rem', opacity: 0.6,
              transition: 'all 0.2s', zIndex: 2
            }}
            onMouseEnter={e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.background = 'rgba(201,126,90,0.25)'; }}
            onMouseLeave={e => { e.currentTarget.style.opacity = '0.6'; e.currentTarget.style.background = 'rgba(201,126,90,0.1)'; }}
          >
            <i className="fas fa-trash-alt"></i>
          </button>
          
          <div style={{ position: 'absolute', top: 14, right: 50, fontFamily: 'Cormorant Garamond, serif', fontSize: '3rem', fontWeight: 700, color: 'rgba(212,175,55,0.06)', lineHeight: 1, pointerEvents: 'none' }}>{book.num}</div>
          <div style={{ fontSize: '0.6rem', letterSpacing: '2px', color: 'var(--gold-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Book {book.num}</div>
          {isEmpty ? (
            <div style={{ color: 'var(--text-muted)', fontStyle: 'italic', fontSize: '0.9rem', flex: 1, display: 'flex', alignItems: 'center' }}>
              <i className="fas fa-plus-circle" style={{ marginRight: 8 }}></i> Click to outline
            </div>
          ) : (
            <>
              <h3 style={{ fontSize: '1.3rem', fontWeight: 600, color: 'var(--text)', lineHeight: 1.2, paddingRight: 40 }}>{book.title || 'Untitled'}</h3>
              {book.subtitle && <div style={{ fontSize: '0.78rem', color: 'var(--text-dim)', fontStyle: 'italic', marginTop: -6 }}>{book.subtitle}</div>}
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                <span className={`badge ${statusClass}`}>{book.status}</span>
                {book.era && <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>📍 {book.era}</span>}
              </div>
              {book.act1 && <p style={{ fontSize: '0.8rem', color: 'var(--text-dim)', lineHeight: 1.5, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' }}>{book.act1}</p>}
              {book.pov && <div style={{ fontSize: '0.7rem', color: 'var(--gold-dim)', marginTop: 'auto' }}>POV: {book.pov}</div>}
            </>
          )}
        </div>
      );
    };

    // ─── Books Tab ────────────────────────────────────────────────────────────
    const BooksTab = ({ books, onEdit, onAdd, onDelete }) => (
      <div style={{ padding: '32px 40px' }}>
        {books.length === 0 && (
          <div style={{ textAlign: 'center', padding: '80px 0', color: 'var(--text-muted)' }}>
            <i className="fas fa-book" style={{ fontSize: '3rem', marginBottom: 16, opacity: 0.3 }}></i>
            <p style={{ fontSize: '1.3rem', fontFamily: 'Cormorant Garamond, serif' }}>Your saga awaits its first chapter.</p>
          </div>
        )}
        <div className="grid-auto">
          {books.map(book => <BookCard key={book.id} book={book} onClick={() => onEdit(book)} onDelete={onDelete} />)}
          {books.length < MAX_BOOKS && (
            <div onClick={onAdd} className="card card-hover" style={{
              border: '2px dashed rgba(212,175,55,0.15)', minHeight: 200,
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              justifyContent: 'center', gap: 10, cursor: 'pointer', color: 'var(--gold-dim)'
            }}>

            <div className="flex-between" style={{ marginBottom: 24 }}>
              <h2 style={{ fontSize: '1.8rem', color: 'var(--gold-pale)' }}>Series Details</h2>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.5rem', cursor: 'pointer' }}>×</button>
            </div>
            <div><label className="section-title">Series Title</label><input value={data.title} onChange={e => update('title', e.target.value)} /></div>
            <div><label className="section-title">Subtitle</label><input value={data.subtitle || ''} onChange={e => update('subtitle', e.target.value)} /></div>
            <div className="grid-2">
              <div><label className="section-title">Genre</label><input value={data.genre || ''} onChange={e => update('genre', e.target.value)} /></div>
              <div><label className="section-title">Pen Name</label><input value={data.penName || ''} onChange={e => update('penName', e.target.value)} /></div>
            </div>
            <div><label className="section-title">Tagline</label><input value={data.tagline || ''} onChange={e => update('tagline', e.target.value)} /></div>
            <div className="flex-between" style={{ marginTop: 20 }}>
              <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
              <button className="btn btn-gold" onClick={() => onSave(data)}>Save Series</button>
            </div>
          </div>
        </div>
      );
    };

    // ─── Export ───────────────────────────────────────────────────────────────
    const buildExportHTML = (series, books, characters, threads) => {
      const booksHTML = books.map(b => `
        <div class="book">
          <div class="book-num">Book ${b.num}</div>
          <h2>${b.title || 'Untitled'}</h2>
          ${b.subtitle ? `<div class="subtitle">${b.subtitle}</div>` : ''}
          <div class="meta">
            <span class="status status-${b.status}">${b.status}</span>
            ${b.era ? `<span>📍 ${b.era}</span>` : ''}
            ${b.setting ? `<span>🏠 ${b.setting}</span>` : ''}
            ${b.pov ? `<span>👤 POV: ${b.pov}</span>` : ''}
            ${b.wordCount ? `<span>📝 ${b.wordCount} words</span>` : ''}
          </div>
          ${(b.act1 || b.act2 || b.act3) ? `
            <div class="acts">
              ${b.act1 ? `<div class="act"><strong>Act I — Setup</strong><p>${b.act1}</p></div>` : ''}
              ${b.act2 ? `<div class="act"><strong>Act II — Confrontation</strong><p>${b.act2}</p></div>` : ''}
              ${b.act3 ? `<div class="act"><strong>Act III — Resolution</strong><p>${b.act3}</p></div>` : ''}
            </div>` : ''}
          ${b.keyReveals ? `<div class="reveals"><strong>🔑 Key Reveals:</strong> ${b.keyReveals}</div>` : ''}
          ${b.notes ? `<div class="notes">📝 ${b.notes}</div>` : ''}
        </div>
      `).join('');

      const charsHTML = characters.length ? `
        <section><h2 class="section-heading">Recurring Cast</h2>
        ${characters.map(c => {
          const ib = books.filter(b => c.appearsIn.includes(b.id));
          return `<div class="char">
            <div class="char-name">${c.name || 'Unnamed'} <span class="role role-${c.role}">${c.role}</span></div>
            ${c.description ? `<p>${c.description}</p>` : ''}
            ${c.arc ? `<div class="char-arc"><strong>Arc:</strong> ${c.arc}</div>` : ''}
            ${c.motivation ? `<div><strong>Motivation:</strong> ${c.motivation}</div>` : ''}
            ${c.secret ? `<div><strong>Secret:</strong> ${c.secret}</div>` : ''}
            ${ib.length ? `<div class="appears">Appears in: ${ib.map(b => b.title || `Book ${b.num}`).join(', ')}</div>` : ''}
          </div>`;
        }).join('')}</section>
      ` : '';

      const threadsHTML = threads.length ? `
        <section><h2 class="section-heading">Threads & Clues</h2>
        ${threads.map(t => {
          const pl = books.find(b => b.id === t.plantedIn);
          const rv = books.find(b => b.id === t.revealedIn);
          return `<div class="thread">
            <div class="thread-title">${t.title || 'Unnamed'} <span class="thread-type thread-type-${t.type}">${t.type.replace('-', ' ')}</span></div>
            ${t.description ? `<p>${t.description}</p>` : ''}
            <div class="thread-meta">
              ${pl ? `<span class="planted">🌱 Planted: ${pl.title || `Book ${pl.num}`}</span>` : ''}
              ${rv ? `<span class="revealed">💡 Revealed: ${rv.title || `Book ${rv.num}`}</span>` : ''}
            </div>
            ${t.payoff ? `<div><strong>Payoff:</strong> ${t.payoff}</div>` : ''}
          </div>`;
        }).join('')}</section>
      ` : '';

      return `<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>${series.title} — Series Bible</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; max-width: 860px; margin: 0 auto; padding: 60px 40px; color: #1a1a1a; background: #fafaf8; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; }
  .cover { text-align: center; padding: 64px 0; border-bottom: 2px solid #d4af37; margin-bottom: 56px; }
  .cover h1 { font-size: 3rem; font-weight: 600; }
  .tagline { font-size: 1.2rem; color: #666; font-style: italic; }
  .section-heading { font-size: 2rem; border-bottom: 1px solid #e0d5c0; padding-bottom: 10px; margin: 48px 0 20px; }
  .book { border: 1px solid #e0d5c0; border-left: 4px solid #d4af37; border-radius: 8px; padding: 24px; margin-bottom: 20px; background: #fff; }
  .book-num { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: #d4af37; font-weight: 700; }
  .book h2 { font-size: 1.5rem; margin: 4px 0; }
  .subtitle { font-size: 0.9rem; color: #888; font-style: italic; }
  .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: #888; margin: 10px 0; }
  .status { padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
  .status-planning { background: #f0e6f7; color: #8e44ad; } .status-drafting { background: #e8f4fd; color: #2980b9; }
  .status-complete { background: #eafaf1; color: #27ae60; } .status-published { background: #fdf6e3; color: #b7860a; }
  .acts { background: #fafaf8; border-radius: 6px; padding: 14px; margin-top: 10px; }
  .act { margin-bottom: 10px; } .act strong { color: #d4af37; font-size: 0.8rem; text-transform: uppercase; }
  .char, .thread { padding: 14px; border: 1px solid #e0d5c0; border-radius: 8px; margin-bottom: 10px; background: #fff; }
  .char-name { font-size: 1.1rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; }
  .role { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .role-protagonist { background: #fdf6e3; color: #b7860a; } .role-supporting { background: #e8f4fd; color: #2980b9; }
  .role-antagonist { background: #fdedec; color: #c0392b; } .role-minor { background: #f0f0f0; color: #666; }
  .thread-title { font-size: 1rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; }
  .thread-type { font-size: 0.6rem; padding: 2px 7px; border-radius: 10px; }
  .thread-type-clue { background: #e8f4fd; color: #2980b9; } .thread-type-red-herring { background: #fdedec; color: #c0392b; }
  .thread-type-callback { background: #eafaf1; color: #27ae60; } .thread-type-theme { background: #fdf6e3; color: #b7860a; }
  .thread-meta { display: flex; gap: 14px; margin-top: 6px; font-size: 0.8rem; }
  .planted { color: #2980b9; } .revealed { color: #27ae60; }
  .footer { text-align: center; margin-top: 56px; padding-top: 20px; border-top: 1px solid #e0d5c0; color: #ccc; font-size: 0.7rem; letter-spacing: 1px; }
  @media print { body { padding: 20px; } .book, .char, .thread { break-inside: avoid; } }
</style></head>
<body>
<div class="cover"><h1>${series.title}</h1>${series.subtitle ? `<div class="tagline">"${series.subtitle}"</div>` : ''}<p style="color:#999;margin-top:12px;">${[series.genre, series.penName, `${books.length} Books`].filter(Boolean).join(' · ')}</p></div>
${series.seriesArc ? `<section><h2 class="section-heading">Series Arc</h2><p style="line-height:1.7;">${series.seriesArc}</p></section>` : ''}
${series.worldBible ? `<section><h2 class="section-heading">World Bible</h2><div style="line-height:1.7;white-space:pre-wrap;">${series.worldBible}</div></section>` : ''}
<section><h2 class="section-heading">Books</h2>${booksHTML || '<p>No books yet.</p>'}</section>
${charsHTML}${threadsHTML}
<div class="footer">Generated by Series Arc Command Center · Void Gold</div>
</body></html>`;
    };

    // ─── Main App ─────────────────────────────────────────────────────────────
    const App = () => {
      const [state, setState] = useState(() => loadState());
      const [tab, setTab] = useState('books');
      const [modal, setModal] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      const showToast = (msg) => setToast(msg);
      const closeModal = () => setModal(null);

      // Series
      const updateSeries = (data) => {
        setState(prev => ({ ...prev, series: data }));
        closeModal();
        showToast('Series updated ✦');
      };

      // Books
      const addBook = () => {
        if (state.books.length >= MAX_BOOKS) { showToast('Maximum 10 books reached'); return; }
        const newBook = createBook(state.books.length + 1);
        setState(prev => ({ ...prev, books: [...prev.books, newBook] }));
        setModal({ type: 'book', data: newBook });
      };
      const saveBook = (data) => {
        setState(prev => ({ ...prev, books: prev.books.map(b => b.id === data.id ? data : b) }));
        closeModal();
        showToast('Book saved ✦');
      };
      const deleteBook = (id) => {
        setState(prev => ({
          ...prev,
          books: prev.books.filter(b => b.id !== id).map((b, i) => ({ ...b, num: i + 1 }))
        }));
        closeModal();
        showToast('Book removed');
      };

      // Characters
      const addCharacter = () => {
        const newChar = createCharacter();
        setState(prev => ({ ...prev, characters: [...prev.characters, newChar] }));
        setModal({ type: 'character', data: newChar });
      };
      const saveCharacter = (data) => {
        setState(prev => ({ ...prev, characters: prev.characters.map(c => c.id === data.id ? data : c) }));
        closeModal();
        showToast('Character saved ✦');
      };
      const deleteCharacter = (id) => {
        setState(prev => ({ ...prev, characters: prev.characters.filter(c => c.id !== id) }));
        closeModal();
        showToast('Character removed');
      };

      // Threads
      const addThread = () => {
        const newThread = createThread();
        setState(prev => ({ ...prev, threads: [...prev.threads, newThread] }));
        setModal({ type: 'thread', data: newThread });
      };
      const saveThread = (data) => {
        setState(prev => ({ ...prev, threads: prev.threads.map(t => t.id === data.id ? data : t) }));
        closeModal();
        showToast('Thread saved ✦');
      };
      const deleteThread = (id) => {
        setState(prev => ({ ...prev, threads: prev.threads.filter(t => t.id !== id) }));
        closeModal();
        showToast('Thread removed');
      };

      // Export
      const handleExport = () => {
        const html = buildExportHTML(state.series, state.books, state.characters, state.threads);
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.series.title.replace(/\s+/g, '-').toLowerCase()}-series-bible.html`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Series Bible exported! 📄');
      };

      return (
        <div style={{ minHeight: '100vh', background: 'var(--void)', display: 'flex', flexDirection: 'column' }}>
          <Header
            series={state.series}
            books={state.books}
            characters={state.characters}
            threads={state.threads}
            onEditSeries={() => setModal({ type: 'series', data: state.series })}
            onExport={handleExport}
          />
          <Nav active={tab} onChange={setTab} />
          <main style={{ flex: 1 }}>
            {tab === 'books' && <BooksTab books={state.books} onEdit={b => setModal({ type: 'book', data: b })} onAdd={addBook} onDelete={deleteBook} />}
            {tab === 'characters' && <CharactersTab characters={state.characters} books={state.books} onAdd={addCharacter} onEdit={c => setModal({ type: 'character', data: c })} onDelete={deleteCharacter} />}
            {tab === 'threads' && <ThreadsTab threads={state.threads} books={state.books} onAdd={addThread} onEdit={t => setModal({ type: 'thread', data: t })} onDelete={deleteThread} />}
            {tab === 'timeline' && <TimelineTab books={state.books} characters={state.characters} threads={state.threads} />}
            {tab === 'world' && <WorldBibleTab series={state.series} onUpdateSeries={updateSeries} />}
          </main>

          {/* Modals */}
          {modal?.type === 'series' && <SeriesModal series={modal.data} onSave={updateSeries} onClose={closeModal} />}
          {modal?.type === 'book' && <BookModal book={modal.data} characters={state.characters} onSave={saveBook} onDelete={deleteBook} onClose={closeModal} />}
          {modal?.type === 'character' && <CharacterModal character={modal.data} books={state.books} onSave={saveCharacter} onDelete={deleteCharacter} onClose={closeModal} />}
          {modal?.type === 'thread' && <ThreadModal thread={modal.data} books={state.books} onSave={saveThread} onDelete={deleteThread} onClose={closeModal} />}

          {/* Toast */}
          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
